<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hammer Fall</title>
<style>
/* Hammer Fall: one canvas filling the screen (drawn sharp at the device's pixel ratio).
   Outside the ZigaPlay, touch screens get a D-pad and A / B buttons over the bottom corners. */
:root{color-scheme:dark;--edge:#05060c}
html,body{height:100%;margin:0;background:#06070f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
html.touch:not(.zp) #pad{display:block}
.pb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,22,40,.55);color:#fff;font:800 16px/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:none;padding:0}
.pb.on{background:rgba(120,140,255,.6)}
#dp{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dp i{position:absolute;width:50px;height:50px;border-radius:10px;background:rgba(20,22,40,.55);border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
#dp i.on{background:rgba(120,140,255,.6)}
#bA{right:max(16px,env(safe-area-inset-right,0px));bottom:62px}#bB{right:max(84px,calc(env(safe-area-inset-right,0px) + 68px));bottom:20px}
#bS{right:max(16px,env(safe-area-inset-right,0px));top:12px;width:44px;height:44px;font-size:13px}
</style>
<canvas id="cv"></canvas>
<div id="pad"><div id="dp"><i data-d="up" style="left:50px;top:0"></i><i data-d="left" style="left:0;top:50px"></i><i data-d="right" style="left:100px;top:50px"></i><i data-d="down" style="left:50px;top:100px"></i></div>
<button class="pb" id="bA">A</button><button class="pb" id="bB">B</button><button class="pb" id="bS">II</button></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,pick=a=>a[Math.floor(rnd()*a.length)],TAU=Math.PI*2;
const store={get(k,d){try{const v=localStorage.getItem('strike-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('strike-'+k,JSON.stringify(v))}catch(e){}}};
/* the view: the screen in CSS pixels, drawn at up to 2x; UI sizes follow U = height / 270 */
let SW=480,SH=270,DPR=1,U=1,PORT=false;
function resize(){DPR=Math.min(2,devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);PORT=SH>SW*1.1;U=PORT?Math.min(SW/300,SH/400):Math.min(SH/270,SW/420)}
addEventListener('resize',resize);resize();
const font=(px,w=800)=>`${w} ${Math.round(px*U)}px system-ui,-apple-system,"Segoe UI",sans-serif`;
function text(s,x,y,px,col,al='left',w=800,out=null){ctx.font=font(px,w);ctx.textAlign=al;ctx.textBaseline='top';if(out){ctx.lineWidth=Math.max(2,px*U*.22);ctx.strokeStyle=out;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const shade=(c,t)=>{const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};

/* ================= sound ================= */
let AC=null,master=null,mbus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.5;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);mbus=AC.createGain();mbus.gain.value=.22;mbus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.1,type='square',v=.2,t0=0,dest=null}){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.1,v=.2,f=1200,q=1,t0=0}){const a=AC;if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  swing(){noise({d:.07,f:2200,q:1.2,v:.1})},slash(){noise({d:.09,f:4200,q:2,v:.12});tone({f:2400,f2:1400,d:.06,type:'sine',v:.03})},
  jump(){noise({d:.05,f:700,v:.06});tone({f:240,f2:420,d:.07,type:'triangle',v:.06})},djump(){noise({d:.08,f:1400,q:.8,v:.08});tone({f:380,f2:680,d:.09,type:'triangle',v:.06})},land(){noise({d:.06,f:300,v:.12})},
  hit(p=0){noise({d:.06+p*.05,f:700-p*180,q:.7,v:.3+p*.08});tone({f:140-p*25,f2:50,d:.1+p*.06,type:'sine',v:.35});if(p>1)noise({d:.25,f:2400,q:.5,v:.08,t0:.02})},
  clang(){tone({f:1900,f2:1700,d:.18,type:'triangle',v:.06});tone({f:2830,d:.14,type:'sine',v:.04})},
  shield(){tone({f:900,f2:700,d:.06,type:'triangle',v:.1});noise({d:.05,f:3000,v:.05})},
  parry(){tone({f:1200,f2:1800,d:.12,type:'triangle',v:.14});tone({f:1800,d:.1,type:'sine',v:.08,t0:.04})},brk(){noise({d:.4,f:600,v:.3});tone({f:500,f2:80,d:.4,type:'sawtooth',v:.12})},
  special(){noise({d:.12,f:1800,q:1.5,v:.07});tone({f:400,f2:800,d:.12,type:'sawtooth',v:.04})},
  shot(){noise({d:.05,f:2600,q:.6,v:.22});tone({f:180,f2:60,d:.07,v:.12})},shotgun(){noise({d:.14,f:1600,q:.5,v:.32});tone({f:120,f2:40,d:.14,v:.2})},
  snipe(){noise({d:.08,f:3200,q:.5,v:.28});tone({f:220,f2:50,d:.2,v:.16});noise({d:.4,f:1200,q:.4,v:.05,t0:.05})},
  zap(){tone({f:1400,f2:300,d:.1,type:'sawtooth',v:.07});tone({f:2100,f2:600,d:.08,type:'square',v:.03})},
  orb(){tone({f:300,f2:600,d:.25,type:'sine',v:.1});tone({f:450,f2:900,d:.25,type:'triangle',v:.05})},beam(){tone({f:200,f2:900,d:.35,type:'sawtooth',v:.08});noise({d:.35,f:5000,q:.6,v:.06})},
  rocket(){noise({d:.3,f:500,q:.4,v:.18});tone({f:90,f2:260,d:.25,type:'sawtooth',v:.06})},throw(){noise({d:.08,f:1200,q:1,v:.08})},jet(){noise({d:.2,f:900,q:.4,v:.12})},
  boom(){noise({d:.5,f:240,q:.5,v:.4});tone({f:90,f2:30,d:.45,v:.32});noise({d:.25,f:2000,q:.5,v:.06})},
  ko(){noise({d:.7,f:400,q:.4,v:.35});tone({f:600,f2:50,d:.7,type:'sawtooth',v:.1});tone({f:60,f2:30,d:.6,v:.3})},beep(){tone({f:660,d:.12,v:.12})},go(){tone({f:990,d:.25,v:.14});tone({f:1320,d:.25,type:'triangle',v:.1,t0:.05})},
  move(){tone({f:700,d:.03,v:.05})},pick(){tone({f:660,d:.05,v:.08});tone({f:990,d:.07,v:.08,t0:.05})},back(){tone({f:400,f2:300,d:.07,v:.07})},
  game(){[523,659,784,1047].forEach((f,i)=>tone({f,d:.2,type:'triangle',v:.12,t0:i*.09}))}};
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.5;if(MUS.bus)MUS.bus.gain.value=m?0:MUS.vol}
/* a buzz on big hits: vibrate where it exists; on iPhone a hidden switch gives a haptic tick */
const HAP={on:store.get('vib',true),lab:null,last:0};
function haptic(ms){if(!HAP.on)return;const now=performance.now();if(now-HAP.last<45)return;HAP.last=now;let w=window;try{if(ZP)w=window.parent}catch(e){}
  try{if(typeof w.navigator.vibrate==='function'){w.navigator.vibrate(ms);return}}catch(e){}
  try{if(!HAP.lab||!HAP.lab.isConnected){const d=w.document,id='zp-haptic';let lab=d.getElementById(id+'-l');if(!lab){const inp=d.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id=id;lab=d.createElement('label');lab.id=id+'-l';lab.htmlFor=id;
    for(const e of[inp,lab]){e.setAttribute('aria-hidden','true');e.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none'}d.body.append(inp,lab)}HAP.lab=lab}HAP.lab.click()}catch(e){}}

/* ================= saving: every second, on this device and (on the ZigaPlay) to your account =================
   The Claude app can clear this device's storage when it closes; the account copy is what comes back then. */
const SAVE=Object.assign({at:0,set:{stocks:3,level:4,time:0},rec:{},picks:[0,1,0],match:null},store.get('save',{}));
const acct=()=>{try{return ZP&&ZP.cloud||null}catch(e){return null}};
let saveHook=null;
function saveNow(flush){if(saveHook)saveHook();SAVE.at=Date.now();store.set('save',SAVE);const c=acct();if(c)try{c.save('strike',JSON.stringify(SAVE),{at:SAVE.at},'progress');if(flush)c.flush('strike')}catch(e){}}
async function loadAccount(apply){const c=acct();if(!c)return;try{const r=await c.load('strike','progress');if(!r||!r.ok||!r.json)return;const d=JSON.parse(r.json);if((d.at||0)>(SAVE.at||0)){Object.assign(SAVE,d);store.set('save',SAVE);apply&&apply()}}catch(e){}}

/* ================= the soundtrack =================
   A small synth band: kick, snare, hats and claps, a filtered bass, warm pads, a plucked arpeggio and a lead with
   vibrato and echo. Each song is a key, a tempo, a chord progression and drum and bass patterns; its melody is a
   short motif written over the chords (the same every time, from the song's seed), so the tunes stay catchy.
   The title has a slow theme; every stage has its own battle track. */
const SONGS={
  title:{bpm:92,root:57,prog:[0,5,2,6],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0...0...0.5.0...',arp:'A',lead:.6,seed:3,soft:1},
  roof:{bpm:140,root:52,prog:[0,5,6,4],k:'x.....x...x.....',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',bass:'0.0.1.0.0.0.1.05',arp:'B',lead:1,seed:11},
  bridge:{bpm:128,root:50,prog:[0,5,2,6],k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',bass:'0..0..0.0..0..1.',arp:'AB',lead:1,seed:7},
  clock:{bpm:146,root:48,prog:[0,5,2,6],k:'x.....x.x.....x.',s:'....x.......x..x',h:'xxx.xxx.xxx.xxx.',bass:'0.0.0.0.5.5.1.1.',arp:'AB',lead:1,seed:23},
  foundry:{bpm:152,root:45,prog:[0,6,5,6],k:'x.x...x.x.x...x.',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',bass:'00.000.000.0.11.',arp:'B',lead:1,seed:31},
  temple:{bpm:112,root:55,prog:[0,3,5,4],k:'x.......x..x....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...0.5.0...1...',arp:'AB',lead:.9,seed:41},
  peak:{bpm:124,root:53,prog:[0,5,3,4],k:'x...x...x...x...',s:'....x.......x...',h:'x.xxx.xxx.xxx.xx',bass:'0.0.0.0.1.1.5.5.',arp:'AB',lead:1,seed:17},
  subway:{bpm:140,root:49,prog:[0,2,5,4],k:'x..x..x...x.....',s:'....x.......x.x.',h:'x.x.x.xxx.x.x.xx',bass:'0.01.0.10.01.0.1',arp:'B',lead:1,seed:29},
  docks:{bpm:134,root:54,prog:[0,5,2,4],k:'x...x...x...x...',s:'....x.......x...',h:'.x.x.x.x.x.x.x.x',bass:'0.10.10.0.10.150',arp:'B',lead:1,seed:5}};
const MINOR=[0,2,3,5,7,8,10],mf=n=>440*Math.pow(2,(n-69)/12);
const MUS={on:false,song:null,step:0,next:0,timer:0,bus:null,vol:.34,dly:null,S:null,mel:null};
function seededR(n){let s=n*1103+12345;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648}}
const deg=(S,d,oct=0)=>{const k=((d%7)+7)%7,o=Math.floor(d/7);return S.root+MINOR[k]+12*(o+oct)};
const chordOf=(S,bar)=>{const d=S.prog[bar%S.prog.length];return[deg(S,d),deg(S,d+2),deg(S,d+4)]};
/* the melody: a two-bar motif (rhythm + shape) laid over each pair of chords, with a different answer in the B section */
function makeMelody(S){const r=seededR(S.seed),R=['x..x..x.x.......','x...x.x...x.x...','..x.x..xx...x...','x.x...x...x.x.x.','x..x..x...x.....','x.....x.x.x.x...'];
  const phrase=()=>{const rh=[R[Math.floor(r()*R.length)],R[Math.floor(r()*R.length)]],shape=[];let p=Math.floor(r()*3);for(let i=0;i<16;i++){p=clamp(p+[-1,0,1,1,2,-2][Math.floor(r()*6)],-1,6);shape.push(p)}return{rh,shape}};
  return{A:phrase(),B:phrase()}}
function musBus(){const a=AC;if(MUS.bus)return;MUS.bus=a.createGain();MUS.bus.gain.value=muted?0:MUS.vol;MUS.bus.connect(master);
  const d=a.createDelay(1),fb=a.createGain(),lp=a.createBiquadFilter();d.delayTime.value=.33;fb.gain.value=.32;lp.type='lowpass';lp.frequency.value=2400;d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(MUS.bus);MUS.dly=d}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0005,t+a+dec)}
function osc(type,f,t,dur,dest,det=0){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=det;o.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
const I={
  kick(t,v=1){const g=AC.createGain();g.connect(MUS.bus);env(g,t,.002,.9*v,.28);const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);o.connect(g);o.start(t);o.stop(t+.35)},
  noiseHit(t,f,q,v,dec,type='bandpass'){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;bp.type=type;bp.frequency.value=f;bp.Q.value=q;env(g,t,.001,v,dec);s.connect(bp);bp.connect(g);g.connect(MUS.bus);s.start(t);s.stop(t+dec+.05)},
  snare(t,v=1){I.noiseHit(t,1900,.7,.32*v,.17);const g=AC.createGain();g.connect(MUS.bus);env(g,t,.001,.18*v,.09);osc('triangle',190,t,.12,g)},
  hat(t,open,v=1){I.noiseHit(t,8000,1,(open?.07:.05)*v,open?.2:.035,'highpass')},
  bass(t,n,dur,v=1){const f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.Q.value=6;f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(220,t+dur*.9);
    f.connect(g);g.connect(MUS.bus);env(g,t,.005,.26*v,dur);osc('sawtooth',mf(n),t,dur,f);osc('square',mf(n-12),t,dur,f,4)},
  pad(t,notes,dur,v=1){const f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=1100;f.connect(g);g.connect(MUS.bus);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045*v,t+.25);g.gain.setValueAtTime(.045*v,t+dur-.15);g.gain.linearRampToValueAtTime(0,t+dur+.2);
    for(const n of notes){osc('sawtooth',mf(n+12),t,dur+.2,f,-7);osc('sawtooth',mf(n+12),t,dur+.2,f,7)}},
  arp(t,n,v=1){const g=AC.createGain();g.connect(MUS.bus);g.connect(MUS.dly);env(g,t,.003,.06*v,.16);osc('square',mf(n),t,.2,g)},
  lead(t,n,dur,v=1){const f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=3200;f.connect(g);g.connect(MUS.bus);g.connect(MUS.dly);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075*v,t+.02);g.gain.setValueAtTime(.06*v,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0005,t+dur+.12);
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.5;lg.gain.value=9;lfo.connect(lg);
    for(const[ty,dt]of[['sawtooth',-5],['square',6]]){const o=osc(ty,mf(n),t,dur+.15,f,dt);lg.connect(o.detune)}lfo.start(t+.08);lfo.stop(t+dur+.2)}};
/* one sixteenth note of the current song */
function musStep(t,st){const S=MUS.S,bar=Math.floor(st/16),i=st%16,sec=bar<2?'intro':(Math.floor((bar-2)/8)%2?'B':'A'),inB=sec==='B',last=(bar-2)%8===7;
  const ch=chordOf(S,bar),soft=S.soft;
  /* drums */
  if(S.k[i]==='x')I.kick(t,soft?.7:1);
  if(sec!=='intro'||bar===1){if(last&&i>=12&&!soft)I.snare(t,.5+(i-12)*.15);else if(S.s[i]==='x')I.snare(t,soft?.5:1)}
  if(S.h[i]==='x'||(inB&&!soft&&i%2===1))I.hat(t,inB&&i%8===6,soft?.6:1);
  /* bass */
  const b=S.bass[i];if(b&&b!=='.'){const n=ch[0]-12+(b==='1'?12:b==='5'?7:0);let len=1;while(i+len<16&&S.bass[i+len]==='.'&&len<4)len++;I.bass(t,n,len*MUS.spb*.95,soft?.7:1)}
  /* pads on each bar */
  if(i===0)I.pad(t,ch,MUS.spb*16,sec==='intro'?.6:1);
  /* arpeggio */
  if(S.arp.includes(sec==='intro'?'A':sec)&&(soft?i%2===0:true)){const seq=[ch[0],ch[1],ch[2],ch[0]+12,ch[2],ch[1]];I.arp(t,seq[(st>>(soft?1:0))%seq.length]+12,soft?.8:1)}
  /* lead melody */
  if(sec!=='intro'&&MUS.mel){const ph=MUS.mel[sec],half=bar%2,rh=ph.rh[half];if(rh[i]==='x'){let len=1;while(i+len<16&&rh[i+len]==='.'&&len<6)len++;
      const k=ph.shape[(half*8+Math.floor(i/2))%16],d=S.prog[bar%S.prog.length]+[0,2,4,7,9,11,14,16][clamp(k,0,7)]-(k<0?2:0);
      I.lead(t,deg(S,d,1),len*MUS.spb*.9,S.lead)}}}
function musTick(){const a=AC;if(!a||!MUS.on||!MUS.S)return;while(MUS.next<a.currentTime+.15){musStep(MUS.next,MUS.step);MUS.step++;MUS.next+=MUS.spb}}

/* ================= buttons and controls =================
   The pad has a D-pad, A, B, START and SELECT. Four actions can be put on any of A, B, UP, DOWN or SELECT:
   ATTACK, SPECIAL (B alone blocks; B with a direction is a special), JUMP and BLOCK. The D-pad always gives
   the direction too, so with the defaults UP jumps and DOWN blocks. */
const ACTS=[['attack','ATTACK'],['special','SPECIAL / BLOCK'],['jump','JUMP'],['block','BLOCK']];
const CTRL_DEF={attack:'a',special:'b',jump:'up',block:'down'};
let CTRL=Object.assign({},CTRL_DEF,store.get('ctrl',{}));
function saveCtrl(){store.set('ctrl',CTRL);SAVE.ctrl=CTRL}
const BTN_NAMES={a:'A',b:'B',up:'UP',down:'DOWN',select:'SELECT'};
const RAW={held:{},tap:{}};
function rawInput(btn,down){unlock();if(down){if(!RAW.held[btn])RAW.tap[btn]=true;RAW.held[btn]=true}else RAW.held[btn]=false}
function clearTaps(){RAW.tap={}}
/* what the player's pad means to a fighter this frame */
function makePad(){return{x:0,up:false,down:false,pressed:{},held:{},t:0}}
const HUMAN=makePad();
function readPad(P){P.t++;P.x=(RAW.held.right?1:0)-(RAW.held.left?1:0);P.up=!!RAW.held.up;P.down=!!RAW.held.down;
  for(const[a]of ACTS){const b=CTRL[a];P.pressed[a]=!!(b&&RAW.tap[b]);P.held[a]=!!(b&&RAW.held[b])}}
/* assigning a button to an action swaps it with whatever had it */
function assign(act,btn){const old=CTRL[act];const other=ACTS.map(x=>x[0]).find(a=>a!==act&&CTRL[a]===btn);CTRL[act]=btn;if(other)CTRL[other]=old;saveCtrl()}

const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  z:'a',Z:'a',j:'a',J:'a',x:'b',X:'b',k:'b',K:'b',Enter:'start',Escape:'start',Shift:'select',' ':'up'};
addEventListener('keydown',e=>{const b=KEYS[e.key];if(!b)return;e.preventDefault();if(!e.repeat)rawInput(b,true)});
addEventListener('keyup',e=>{const b=KEYS[e.key];if(b)rawInput(b,false)});

/* touch pad (only outside the ZigaPlay) */
(()=>{const dp=document.getElementById('dp');const set=(e)=>{const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);
    const want={left:d>18&&x<-Math.abs(y)*.6,right:d>18&&x>Math.abs(y)*.6,up:d>18&&y<-Math.abs(x)*.6,down:d>18&&y>Math.abs(x)*.6};
    for(const k in want){if(want[k]!==!!RAW.held[k])rawInput(k,want[k]);dp.querySelector(`[data-d=${k}]`).classList.toggle('on',want[k])}};
  const end=()=>{for(const k of['left','right','up','down']){if(RAW.held[k])rawInput(k,false);dp.querySelector(`[data-d=${k}]`).classList.remove('on')}};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);set(e)});dp.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')set(e)});
  dp.addEventListener('pointerup',end);dp.addEventListener('pointercancel',end);
  for(const[id,b]of[['bA','a'],['bB','b'],['bS','start']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');rawInput(b,true)});
    const up=()=>{el.classList.remove('on');rawInput(b,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}})();

function glow(x,y,r,col,core='#ffffff'){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,core);g.addColorStop(.3,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}

    case'shell':glow(p.x,p.y,p.r*2,'#ffb050');streak(p,8,p.r,'#ffd890','#fff');break;
    case'laser':streak(p,12,2.2,c,'#ffffff');break;
    case'energy':case'blast':glow(p.x,p.y,p.r*(p.kind==='blast'?2.4:2),c);if(t%2===0)burst(p.x,p.y,c,1,.5);break;
    case'pellet':case'flame':{const fl=p.kind==='flame';glow(p.x,p.y,p.r*(fl?3.2:1.6),fl?'#ff7a2a':'#e8e0c8',fl?'#fff0a0':'#ffffff');if(fl&&t%2===0)smoke(p.x,p.y,'#6a5a5a',1);break}

    case'rocket':{ctx.translate(p.x,p.y);ctx.scale(sgn(p.vx)||1,1);ctx.fillStyle='#8a8f98';ctx.fillRect(-6,-1.8,10,3.6);ctx.fillStyle='#d8323f';ctx.beginPath();ctx.moveTo(4,-1.8);ctx.lineTo(7.5,0);ctx.lineTo(4,1.8);ctx.fill();
      ctx.fillStyle='#4a4f58';ctx.fillRect(-7,-3,2.4,6);glow(-8,0,4+Math.sin(t)*1.2,'#ffa040','#fff6c0');break}
    case'grenade':case'sticky':{blob(p.x,p.y,p.r*.75,p.kind==='sticky'?'#5a5a66':'#3a5a2a');ctx.fillStyle='#c8c8c8';ctx.fillRect(p.x-.6,p.y-p.r*.75-1.6,1.4,1.6);
      if(p.life<22&&t%4<2)glow(p.x,p.y,p.r*1.6,'#ff3a3a','#ffb0b0');else if(t%10<5)blob(p.x+1,p.y-1,.8,p.kind==='sticky'?'#ff3a3a':'#ffd84a',false);break}
    case'wave':{ctx.translate(p.x,p.y);ctx.scale(sgn(p.vx)||1,1);ctx.globalAlpha=.85;const g=ctx.createLinearGradient(-8,0,6,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,c);ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(-6,-p.r*1.4);ctx.quadraticCurveTo(8,0,-6,p.r*1.4);ctx.quadraticCurveTo(2,0,-6,-p.r*1.4);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=.8;ctx.stroke();break}
    default:glow(p.x,p.y,p.r*1.8,c)}
  ctx.restore()}
function drawSpecialFx(f){const m=f.mv;if(!m)return;const s=f.c.sz,c=f.c.fx;
  if(f.st==='sp'){const t=m.t;ctx.lineCap='round';
    if(m.sp==='beam'){if(t<14){glow(f.x+f.face*16*s,f.y-27*s,3+t*.45,c)}
      else if(t<22){const x0=f.x+f.face*14*s,x1=f.x+f.face*178*s,y=f.y-27*s,w=(22-t)*1.3+3;ctx.globalAlpha=.9;ctx.strokeStyle=c;ctx.lineWidth=w*2;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=w*.7;ctx.stroke();ctx.globalAlpha=1;glow(x0,y,w*2.4,c)}}

    if(m.sp==='flameup'&&t>=5&&t<22){const g=ctx.createLinearGradient(0,f.y+30,0,f.y-40);g.addColorStop(0,'rgba(255,80,0,0)');g.addColorStop(.5,c);g.addColorStop(1,'rgba(255,240,180,.8)');ctx.fillStyle=g;ctx.globalAlpha=.75;ctx.beginPath();ctx.ellipse(f.x,f.y-6,9+Math.sin(t)*2,30,0,0,TAU);ctx.fill();ctx.globalAlpha=1}
    if(f.counter){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.4;ctx.globalAlpha=.6+.4*Math.sin(t);ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU+t*.1;ctx.lineTo(f.x+Math.cos(a)*22*s,f.y-20*s+Math.sin(a)*22*s)}ctx.closePath();ctx.stroke();ctx.globalAlpha=1}
    if(f.armor){ctx.strokeStyle=c;ctx.globalAlpha=.5;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(f.x,f.y-20*s,22*s,0,TAU);ctx.stroke();ctx.globalAlpha=1}
    if(m.sp==='palm'&&t>=9&&t<14)glow(f.x+f.face*20*s,f.y-24*s,14,c)}}
function drawStatus(f){const s=f.c.sz;
  if(f.st==='shield'){const r=(10+13*f.sh/50)*s,g=ctx.createRadialGradient(f.x,f.y-19*s,r*.3,f.x,f.y-19*s,r);g.addColorStop(0,'rgba(255,255,255,.05)');g.addColorStop(1,f.c.fx);
    ctx.globalAlpha=.45;ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y-19*s,r,0,TAU);ctx.fill();ctx.globalAlpha=.85;ctx.strokeStyle=f.c.fx;ctx.lineWidth=1.1;ctx.stroke();ctx.globalAlpha=1}
  if(f.st==='dizzy'){for(let i=0;i<3;i++){const a=FRAME*.12+i/3*TAU;star(f.x+Math.cos(a)*8,f.y-46*s+Math.sin(a)*2.4,2.6,'#ffd84a')}}
  if(f.st==='spawn'){ctx.fillStyle=f.c.fx;ctx.globalAlpha=.7;ctx.beginPath();ctx.ellipse(f.x,f.y+2,16,3.4,0,0,TAU);ctx.fill();ctx.globalAlpha=1}
  if(f.st!=='ko'&&!f.hide){const y=f.y-(f.st==='ledge'?20:50)*s-4;ctx.fillStyle=f.cpu?'#7aa0ff':'#ff4a5a';ctx.beginPath();ctx.moveTo(f.x-3.4,y-5);ctx.lineTo(f.x+3.4,y-5);ctx.lineTo(f.x,y);ctx.closePath();ctx.fill()}}
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function drawFx(){for(const e of FX){const k=e.life/e.max;
  if(e.k==='p'){ctx.globalAlpha=k;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r*k+.4,0,TAU);ctx.fill()}
  else if(e.k==='smoke'){ctx.globalAlpha=k*.45;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.fill()}
  else if(e.k==='flash'){ctx.globalAlpha=k;glow(e.x,e.y,e.r*(1.3-k*.3),e.col)}
  else if(e.k==='dust'){ctx.globalAlpha=k*.5;ctx.fillStyle='#c8c8d8';ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1.5-k*.5),0,TAU);ctx.fill()}
  else if(e.k==='ring'){ctx.globalAlpha=k;ctx.strokeStyle=e.col;ctx.lineWidth=2*k+.4;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1.15-k*.6),0,TAU);ctx.stroke()}
  else if(e.k==='spark'){ctx.globalAlpha=Math.min(1,k*1.5);ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);const r=e.r*(1.3-k*.5);ctx.fillStyle='#fff';ctx.beginPath();
    for(let i=0;i<16;i++){const a=i/16*TAU,rr=i%2?r*.18:r*(i%4?.55:1);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.strokeStyle=e.col;ctx.lineWidth=1.2;ctx.stroke();ctx.restore()}
  else if(e.k==='ko'){ctx.globalAlpha=k;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.ang);const L=400*(1.2-k);ctx.fillStyle=e.col;ctx.beginPath();ctx.moveTo(0,-30*k);ctx.lineTo(L,0);ctx.lineTo(0,30*k);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-12*k);ctx.lineTo(L*.8,0);ctx.lineTo(0,12*k);ctx.closePath();ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
/* fighters off the screen get a bubble at the edge */
function drawOffscreen(f){if(f.st==='ko')return;const S=camS(),sx=(f.x-CAM.x)*S+SW/2,sy=(f.y-20-CAM.y)*S+SH/2,m=22*U;
  if(sx>-4&&sx<SW+4&&sy>-4&&sy<SH+4)return;const bx=clamp(sx,m,SW-m),by=clamp(sy,m,SH-m);ctx.fillStyle='rgba(10,10,24,.85)';ctx.strokeStyle=f.cpu?'#7aa0ff':'#ff4a5a';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bx,by,15*U,0,TAU);ctx.fill();ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(bx,by,14*U,0,TAU);ctx.clip();drawBust(f.c,bx,by+2*U,1.5*U,1);ctx.restore()}

/* ================= the computer player =================
   Levels 1-9: higher levels react sooner, block more, chain combos and recover better. Level 0 is the training dummy.
   Long-range fighters keep their distance and shoot; sword fighters fight at blade's length; brawlers rush in. */
const PROJ_KINDS={rocket:1,grenade:1,beam:1,shotgun:1,orb:1,snipe:1,burst:1,sticky:1,wave:1};
function aiTick(f){const P=f.pad,A=f.ai,L=f.lvl;P.pressed={};P.held.jump=true;P.held.attack=P.held.special=false;
  if(!L){P.x=0;P.up=P.down=false;P.held.block=false;return}
  const o=FT.find(g=>g!==f),M=STAGE.main;if(!o)return;
  const skill=L/9,press=(a,x=0,up=false,down=false)=>{P.pressed[a]=true;P.x=x;P.up=up;P.down=down;A.cool=Math.max(3,Math.round(24-L*2.2+rnd()*8))};
  const dx=o.x-f.x,adx=Math.abs(dx),dy=o.y-f.y,sx=sgn(dx)||f.face,g=f.c.grp;
  if(A.cool>0)A.cool--;if(A.projT>0)A.projT--;
  if(A.wait==null)A.wait=Math.round(24+rnd()*30);if(A.wait>0){A.wait--;P.x=0;P.up=P.down=false;return}
  P.held.block=false;
  if(f.st==='ko'||f.st==='held'||f.st==='hit'||f.st==='stun'||f.st==='dizzy'){P.x=0;P.up=P.down=false;return}
  if(f.st==='spawn'){if(rnd()<.03)P.x=sx;return}
  if(f.st==='ledge'){P.x=0;P.up=P.down=false;if(f.t>8+Math.round((9-L)*4)&&rnd()<.25){const r=rnd();if(r<.4)press('jump');else if(r<.7)P.x=-f.lx.side;else press('attack')}return}
  /* keep a combo going: when an attack just landed, follow up quickly */
  if(f.st==='atk'&&f.mv&&f.mv.hitAny&&rnd()<.25+skill*.6){const m=f.mv.k;
    if(m==='up'||m==='uair'){press('jump',sx);A.chase=12;return}
    if(o.st==='hit'&&adx<46){if(dy<-20)press('attack',0,true);else if(f.gr&&rnd()<.5)press('attack',sx);else press('attack');A.cool=3;return}}
  if(A.chase>0){A.chase--;P.x=sx;if(!f.gr&&adx<34&&dy<-6){press('attack',0,true);A.chase=0}return}
  /* getting back to the stage */
  const off=f.x<M.x1-2||f.x>M.x2+2;
  if(off&&!f.gr){const ex=f.x<0?M.x1:M.x2,tx=sgn(ex-f.x)||1;P.x=tx;P.up=P.down=false;
    if(f.st==='help'||f.st==='sp')return;
    const far=Math.abs(ex-f.x);
    if(f.jumps>0&&f.vy>-1&&(f.y>-30||far>90)){press('jump',tx);return}
    if(f.jumps===0&&f.vy>0&&far>100&&!f.sideUsed&&f.y<10&&SIDE_ONCE[f.c.side.kind]&&f.c.side.kind!=='grab'&&rnd()<.5){press('special',tx);return}
    if(f.jumps===0&&f.vy>0&&(f.y>-10||far>40)&&!f.upUsed){press('special',far>40?tx:0,true);return}
    return}
  const nearEdge=f.gr&&((f.x<M.x1+24&&P.x<0)||(f.x>M.x2-24&&P.x>0));
  /* blocking */
  if(A.shT>0){A.shT--;P.held.block=true;P.x=0;P.up=P.down=false;
    if(o.st!=='atk'&&o.st!=='sp'&&adx<30&&rnd()<skill*.5){A.shT=0;P.held.block=true;press('attack')}return}
  if(f.gr&&(o.st==='atk'||o.st==='sp')&&adx<(g==='L'?40:55)&&Math.abs(dy)<40&&A.cool<=0&&rnd()<skill*.16){A.shT=8+Math.round(rnd()*10);P.held.block=true;return}
  /* falling through platforms toward the foe */
  if(f.gr&&f.gr.soft&&dy>24&&adx<80){A.drop=(A.drop||0)+1;P.down=A.drop%6<3;P.x=0;return}A.drop=0;
  /* how far each group likes to be */
  const want=g==='L'?110:g==='M'?30:18,reach=g==='L'?160:g==='M'?40:26;
  if(A.cool>0){let x=adx>want+20?sx:adx<want-20&&g==='L'?-sx:0;if(nearEdge)x=0;P.x=x;P.up=false;P.down=!f.gr&&f.vy>0&&dy>20;return}
  if(rnd()>.35+skill*.65){P.x=adx>want?sx:0;return}
  if(f.gr){
    if(g==='L'){
      if(adx<34){const r=rnd();if(r<.3)press('jump',-sx);else if(r<.6){f.face=sx;press('attack',-f.face)}else press('attack',0,false,true);return}
      f.face=sx;
      if(Math.abs(dy)<34&&adx<220){const r=rnd();
        if(!(A.projT>0)&&r<.18+skill*.1){A.projT=Math.round(70+rnd()*80-L*4);press('special',sx);return}
        if(r<.55)press('attack');else if(r<.75)press('attack',sx);else P.x=adx<want?-sx:sx;return}
      if(dy<-40&&adx<60){press('attack',0,true);return}
      P.x=adx>want?sx:-sx;if(nearEdge)P.x=0;if(rnd()<.03)press('jump',sx);return}
    if(adx>reach+4){
      if(PROJ_KINDS[f.c.side.kind]&&!(A.projT>0)&&adx>60&&adx<200&&Math.abs(dy)<40&&rnd()<.03+skill*.05){f.face=sx;A.projT=Math.round(80+rnd()*80-L*4);press('special',sx);return}
      if(dy<-50&&adx<60&&rnd()<.4){press('jump',sx);return}
      P.x=sx;P.up=P.down=false;if(nearEdge)P.x=0;
      if(adx<90&&rnd()<.04)press('jump',sx);return}
    if(dy<-34){f.face=sx;press('attack',0,true);return}
    if(dy<-14&&!o.gr){press('jump',sx);return}
    const r=rnd(),behind=sx!==f.face;
    if(o.st==='shield'&&r<.5){P.held.block=true;press('attack');return}
    if(behind&&r<.5){press('attack',sx);return}
    f.face=sx;
    if(r<.28)press('attack');else if(r<.48)press('attack',sx);else if(r<.6)press('attack',0,false,true);else if(r<.72)press('attack',0,true);
    else if(r<.82&&!nearEdge&&Math.abs(f.x)<(M.x2-M.x1)*.35&&!(A.projT>0&&PROJ_KINDS[f.c.side.kind])){A.projT=60;press('special',sx)}else if(r<.9)press('jump',sx);else press('attack');
    return}
  /* in the air */
  P.x=adx>8?(g==='L'&&adx<want?-sx:sx):0;P.down=f.vy>0&&dy>30&&adx<40;
  if(g==='L'&&Math.abs(dy)<26&&adx<200&&f.face===sx&&rnd()<.3){press('attack',sx);return}
  if(g==='L'&&adx<60&&dy>30&&rnd()<.3){press('attack',0,false,true);return}
  if(adx<reach+8&&Math.abs(dy)<48){
    if(dy<-18)press('attack',0,true);else if(dy>18)press('attack',0,false,true);else if(rnd()<.8)press('attack',sx);else press('attack');
    return}
  if(f.jumps>0&&dy<-30&&f.vy>-2&&rnd()<.3)press('jump',sx)}

/* ================= screens: title, controls, settings, records, select, pause, results ================= */
let SCR='title',MSEL=0,SEL={mode:'fight',phase:0,cur:[0,1],stage:0},MSG=null;

  FT=[newFighter(o.chars[0],0,false,0),newFighter(o.chars[1],1,true,lvl)];placeFighter(FT[0],-55);placeFighter(FT[1],55);
  FT.forEach((f,i)=>{f.stocks=o.stocks?o.stocks[i]:S.stocks;f.pct=o.pct?o.pct[i]:0});
  MATCH={train:!!o.train,chars:o.chars.slice(),stage:o.stage,lvl,flash:0,count:o.resume?70:100,tleft:o.tleft!=null?o.tleft:(S.time&&!o.train?S.time*3600:0),ending:0,endT:0,res:null};
  SAVE.picks=[o.chars[0],o.chars[1],o.stage];for(const k in RAW.held)RAW.held[k]=false;camTick(true);go('fight');saveNow()}
function resumeMatch(){const m=SAVE.match;if(!m)return;SEL.cur=[m.chars[0],m.chars[1]];startMatch({chars:m.chars,stage:m.stage,train:m.train,lvl:m.lvl,stocks:m.stocks,pct:m.pct,tleft:m.tleft,resume:1})}
function finishMatch(){const a=FT[0],b=FT[1];const win=a.stocks!==b.stocks?(a.stocks>b.stocks?0:1):(a.pct<=b.pct?0:1);
  const r=SAVE.rec[a.c.i]||(SAVE.rec[a.c.i]={w:0,l:0});if(win===0)r.w++;else r.l++;const T=SAVE.tot||(SAVE.tot={w:0,l:0,ko:0});if(win===0)T.w++;else T.l++;T.ko+=a.kos;
  MATCH.res={win,chars:MATCH.chars,stage:MATCH.stage,stats:[[a.kos,a.falls,Math.round(a.dmg)+'%'],[b.kos,b.falls,Math.round(b.dmg)+'%']]};
  SAVE.match=null;SFX.game();saveNow(true);go('results')}
function fightStep(){if(TAP('start')&&!MATCH.ending){SFX.back();go('pause');return}
  readPad(HUMAN);
  if(MATCH.count>0){MATCH.count--;if(MATCH.count===30)SFX.go();if(MATCH.count>30){fxTick();camTick();return}}
  if(MATCH.ending){MATCH.endT++;if(MATCH.endT===1)SFX.beep();if(MATCH.endT>110){finishMatch();return}if(MATCH.endT%2){fxTick();camTick();return}}
  for(const f of FT)if(f.cpu)aiTick(f);
  for(const f of FT)tick(f);
  resolveHits();
  for(const p of PROJ)if(!p.dead)projTick(p);PROJ=PROJ.filter(p=>!p.dead);
  fxTick();if(SHAKE>0)SHAKE=Math.max(0,SHAKE-.6);if(MATCH.flash>0)MATCH.flash--;
  for(const f of FT)if(f.comboT>0&&--f.comboT===0)f.combo=0;
  camTick();
  if(MATCH.tleft>0&&!MATCH.ending){MATCH.tleft--;if(MATCH.tleft===0)MATCH.ending=1}}
const pctCol=p=>{const t=Math.min(1,p/160);return t<.5?`rgb(255,255,${Math.round(255-t*2*200)})`:`rgb(255,${Math.round(255-(t-.5)*2*200)},${Math.round(55-(t-.5)*2*40)})`};
function hud(){ctx.setTransform(DPR,0,0,DPR,0,0);
  FT.forEach((f,i)=>{const w=Math.min(118*U,SW*(PORT?.47:.4)),cx=SW*(i?(PORT?.75:.7):(PORT?.25:.3)),x=cx-w/2,y=SH-38*U;panel(x,y,w,33*U,'rgba(8,8,22,.72)',i?'#7aa0ff':'#ff4a5a');
    ctx.save();ctx.beginPath();ctx.arc(x+16*U,y+16.5*U,12*U,0,TAU);ctx.fillStyle=shade(f.c.body,-.5);ctx.fill();ctx.clip();drawBust(f.c,x+16*U,y+18*U,1.25*U);ctx.restore();
    text(f.c.name,x+32*U,y+4*U,8,i?'#7aa0ff':'#ff4a5a','left',900);
    if(MATCH.train&&i===1)text('DUMMY',x+32*U,y+19*U,7,'#a8a8c8','left',800);
    else if(f.stocks>5)text('● x'+f.stocks,x+32*U,y+19*U,8,f.c.acc,'left',900);else for(let k=0;k<f.stocks;k++){ctx.fillStyle=f.c.acc;ctx.beginPath();ctx.arc(x+36*U+k*8*U,y+24*U,2.8*U,0,TAU);ctx.fill()}
    const sh=f.hl>0&&f.st==='hit'?(rnd()-.5)*4*U:0;
    if(f.st==='ko')text('--',x+w-7*U,y+7*U,17,'#888','right',900);else{text(Math.floor(f.pct)+'%',x+w-7*U+sh,y+6*U+sh,18,pctCol(f.pct),'right',900,'#000')}});
  if(MATCH.tleft>0){const s=Math.ceil(MATCH.tleft/60);text(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),SW/2,8*U,14,s<=10?'#ff5a5a':'#fff','center',900,'#000')}
  const P=FT[0];if(P.combo>=2&&P.comboT>0){const a=Math.min(1,P.comboT/30);ctx.globalAlpha=a;text(P.combo+' HIT COMBO',14*U,10*U,13,'#ffd84a','left',900,'#000');if(MATCH.train)text(Math.round(P.comboD)+'% DAMAGE',14*U,28*U,9,'#fff','left',800,'#000');ctx.globalAlpha=1}
  if(MATCH.count>0){const ready=MATCH.count>30;const k=ready?1:MATCH.count/30;ctx.globalAlpha=k;text(ready?'READY':'GO!',SW/2,SH*.32,ready?30:44,ready?'#fff':'#ffd84a','center',900,'#1a0820');ctx.globalAlpha=1}
  if(MATCH.ending){text(MATCH.tleft===0&&!FT.some(f=>f.stocks<=0)?'TIME!':'GAME!',SW/2,SH*.3,46,'#ffffff','center',900,'#ff2a6a')}
  if(MATCH.flash>0){ctx.fillStyle=`rgba(255,255,255,${MATCH.flash/8*.3})`;ctx.fillRect(0,0,SW,SH)}}
function fightDraw(){drawSky(STAGE.id);worldXf();drawStage();for(const p of PROJ)drawProj(p);
  const order=[...FT].sort((a,b)=>a.cpu===b.cpu?0:a.cpu?-1:1);for(const f of order){drawSpecialFx(f);drawTrail(f)}for(const f of order){drawFighter(f);drawStatus(f)}drawFx();
  ctx.setTransform(DPR,0,0,DPR,0,0);for(const f of FT)drawOffscreen(f);hud()}
/* ---------- the loop ---------- */
const SCREENS={title:[titleTick,titleDraw],controls:[controlsTick,controlsDraw],settings:[settingsTick,settingsDraw],records:[recordsTick,recordsDraw],select:[selectTick,selectDraw],
  stage:[stageTick,stageDraw],fight:[fightStep,()=>fightDraw()],pause:[pauseTick,pauseDraw],moves:[movesTick,movesDraw],results:[resultsTick,resultsDraw]};
function step(){FRAME++;SCREENS[SCR][0]();if(MSG&&--MSG.t<=0)MSG=null;
  /* the right song for the screen: the stage's track in a match, the title theme everywhere else */
  if(AC&&AC.state==='running'){const want=['fight','pause','moves'].includes(SCR)||(SCR==='controls'&&BACKTO)?STAGE.id:'title';if(!MUS.on||MUS.song!==want)music(true,want)}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';SCREENS[SCR][1]();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(MSG)text(MSG.s,SW/2,SH-34*U,11,'#ffd84a','center',900,'#000')}
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){requestAnimationFrame(loop);acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=STEP&&n<4){acc-=STEP;n++;step();clearTaps()}if(n>=4)acc=0;draw()}
/* ---------- saving ---------- */
saveHook=()=>{if(FT.length&&['fight','pause','moves'].includes(SCR)||(SCR==='controls'&&BACKTO)){if(!MATCH.ending&&!MATCH.res)SAVE.match={chars:MATCH.chars,stage:MATCH.stage,train:MATCH.train,lvl:MATCH.lvl,stocks:FT.map(f=>f.stocks),pct:FT.map(f=>Math.round(f.pct)),tleft:MATCH.tleft}}
  SAVE.ctrl=CTRL;SAVE.mute=muted;SAVE.vib=HAP.on};
function applySave(){if(SAVE.ctrl){CTRL=Object.assign({},CTRL_DEF,SAVE.ctrl);store.set('ctrl',CTRL)}if(SAVE.mute!=null&&SAVE.mute!==muted)setMute(SAVE.mute);if(SAVE.vib!=null){HAP.on=SAVE.vib;store.set('vib',HAP.on)}
  if(SAVE.picks){SEL.cur=[SAVE.picks[0]|0,SAVE.picks[1]|0];SEL.stage=SAVE.picks[2]|0}}
applySave();loadAccount(applySave);
setInterval(()=>saveNow(),1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SCR==='fight'&&!MATCH.ending)go('pause');saveNow(true)}});
addEventListener('pagehide',()=>saveNow(true));
window.ZPCart={title:'Hammer Fall',input(b,d){rawInput(b,d)},home(){if(SCR==='fight'&&!MATCH.ending)go('pause');saveNow(true);return true}};
requestAnimationFrame(loop);
/* a test hook, only when the address asks for it */
if(/sntest/.test(location.href))window.SNT={get FT(){return FT},get MATCH(){return MATCH},get SCR(){return SCR},get SAVE(){return SAVE},get CTRL(){return CTRL},startMatch,ROSTER,STAGES,
  cpu(i,l){FT[i].cpu=true;FT[i].lvl=l;FT[i].pad=makePad()},run(n){for(let i=0;i<n;i++){step();clearTaps()}},calcKB,draw,CAM,
  scene(){drawSky(STAGE.id);worldXf();drawStage();for(const f of FT){drawSpecialFx(f);drawTrail(f);drawFighter(f)}drawFx()},spark,ringFx};

})();
