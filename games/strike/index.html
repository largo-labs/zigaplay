<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Strike at Night</title>
<style>
/* Strike at Night: one canvas filling the screen (drawn sharp at the device's pixel ratio).
   Outside the ZigaPlay, touch screens get a D-pad and A / B buttons over the bottom corners. */
:root{color-scheme:dark;--edge:#05060c}
html,body{height:100%;margin:0;background:#06070f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
html.touch:not(.zp) #pad{display:block}
.pb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,22,40,.55);color:#fff;font:800 16px/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:none;padding:0}
.pb.on{background:rgba(120,140,255,.6)}
#dp{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dp i{position:absolute;width:50px;height:50px;border-radius:10px;background:rgba(20,22,40,.55);border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
#dp i.on{background:rgba(120,140,255,.6)}
#bA{right:max(16px,env(safe-area-inset-right,0px));bottom:62px}#bB{right:max(84px,calc(env(safe-area-inset-right,0px) + 68px));bottom:20px}
#bS{right:max(16px,env(safe-area-inset-right,0px));top:12px;width:44px;height:44px;font-size:13px}
</style>
<canvas id="cv"></canvas>
<div id="pad"><div id="dp"><i data-d="up" style="left:50px;top:0"></i><i data-d="left" style="left:0;top:50px"></i><i data-d="right" style="left:100px;top:50px"></i><i data-d="down" style="left:50px;top:100px"></i></div>
<button class="pb" id="bA">A</button><button class="pb" id="bB">B</button><button class="pb" id="bS">II</button></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,pick=a=>a[Math.floor(rnd()*a.length)],TAU=Math.PI*2;
const store={get(k,d){try{const v=localStorage.getItem('strike-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('strike-'+k,JSON.stringify(v))}catch(e){}}};
/* the view: the screen in CSS pixels, drawn at up to 2x; UI sizes follow U = height / 270 */
let SW=480,SH=270,DPR=1,U=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);U=Math.min(SH/270,SW/420)}
addEventListener('resize',resize);resize();
const font=(px,w=800)=>`${w} ${Math.round(px*U)}px system-ui,-apple-system,"Segoe UI",sans-serif`;
function text(s,x,y,px,col,al='left',w=800,out=null){ctx.font=font(px,w);ctx.textAlign=al;ctx.textBaseline='top';if(out){ctx.lineWidth=Math.max(2,px*U*.22);ctx.strokeStyle=out;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const shade=(c,t)=>{const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};

/* ================= sound ================= */
let AC=null,master=null,mbus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.5;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);mbus=AC.createGain();mbus.gain.value=.22;mbus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.1,type='square',v=.2,t0=0,dest=null}){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.1,v=.2,f=1200,q=1,t0=0}){const a=AC;if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  swing(){noise({d:.06,f:2600,q:1.4,v:.12})},jump(){tone({f:300,f2:520,d:.08,type:'triangle',v:.1})},djump(){tone({f:420,f2:760,d:.1,type:'triangle',v:.1})},land(){noise({d:.05,f:400,v:.1})},
  hit(p=0){noise({d:.07+p*.04,f:900-p*200,q:.8,v:.25+p*.08});tone({f:200-p*40,f2:70,d:.09+p*.05,v:.22})},shield(){tone({f:900,f2:700,d:.06,type:'triangle',v:.12})},
  parry(){tone({f:1200,f2:1800,d:.12,type:'triangle',v:.16});tone({f:1800,d:.1,type:'sine',v:.08,t0:.04})},brk(){noise({d:.4,f:600,v:.3});tone({f:500,f2:80,d:.4,type:'sawtooth',v:.15})},
  special(){tone({f:500,f2:900,d:.12,type:'sawtooth',v:.08})},shot(){tone({f:900,f2:300,d:.12,type:'square',v:.08})},boom(){noise({d:.35,f:300,q:.6,v:.35});tone({f:120,f2:40,d:.3,v:.25})},
  ko(){noise({d:.6,f:500,q:.5,v:.35});tone({f:900,f2:60,d:.6,type:'sawtooth',v:.15})},beep(){tone({f:660,d:.12,v:.12})},go(){tone({f:990,d:.25,v:.14});tone({f:1320,d:.25,type:'triangle',v:.1,t0:.05})},
  move(){tone({f:700,d:.03,v:.05})},pick(){tone({f:660,d:.05,v:.08});tone({f:990,d:.07,v:.08,t0:.05})},back(){tone({f:400,f2:300,d:.07,v:.07})},
  game(){[523,659,784,1047].forEach((f,i)=>tone({f,d:.2,type:'triangle',v:.12,t0:i*.09}))}};
/* a driving night tune: a minor bass line, chords and a lead, with a beat */
const MUS={on:false,step:0,next:0,timer:0};const mf=n=>440*Math.pow(2,(n-69)/12);
const LEAD=[69,0,72,74,76,0,74,72,69,0,67,69,72,0,0,0,69,0,72,74,76,79,76,74,72,0,74,72,69,0,0,0],BASSL=[45,45,57,45,43,43,55,43,41,41,53,41,40,40,52,44];
function musicTick(){const a=AC;if(!a||!MUS.on)return;const spb=.13;while(MUS.next<a.currentTime+.2){const s=MUS.step,t=MUS.next-a.currentTime;
  if(!muted){const n=LEAD[s%32];if(n)tone({f:mf(n),d:.16,type:'square',v:.05,t0:t,dest:mbus});const b=BASSL[(s>>1)%16];if(s%2===0)tone({f:mf(b-12),d:.2,type:'triangle',v:.2,t0:t,dest:mbus});
    if(s%4===0)tone({f:120,f2:45,d:.12,type:'sine',v:.3,t0:t,dest:mbus});if(s%4===2)noise({d:.05,f:5000,v:.04,t0:t});if(s%8===4)noise({d:.1,f:1800,q:.7,v:.08,t0:t})}
  MUS.step++;MUS.next+=spb}}
function music(on){MUS.on=on;if(on&&AC){MUS.next=Math.max(MUS.next,AC.currentTime+.05);if(!MUS.timer)MUS.timer=setInterval(musicTick,50)}}
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.5}
/* a buzz on big hits: vibrate where it exists; on iPhone a hidden switch gives a haptic tick */
const HAP={on:store.get('vib',true),lab:null,last:0};
function haptic(ms){if(!HAP.on)return;const now=performance.now();if(now-HAP.last<45)return;HAP.last=now;let w=window;try{if(ZP)w=window.parent}catch(e){}
  try{if(typeof w.navigator.vibrate==='function'){w.navigator.vibrate(ms);return}}catch(e){}
  try{if(!HAP.lab||!HAP.lab.isConnected){const d=w.document,id='zp-haptic';let lab=d.getElementById(id+'-l');if(!lab){const inp=d.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id=id;lab=d.createElement('label');lab.id=id+'-l';lab.htmlFor=id;
    for(const e of[inp,lab]){e.setAttribute('aria-hidden','true');e.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none'}d.body.append(inp,lab)}HAP.lab=lab}HAP.lab.click()}catch(e){}}

/* ================= saving: every second, on this device and (on the ZigaPlay) to your account =================
   The Claude app can clear this device's storage when it closes; the account copy is what comes back then. */
const SAVE=Object.assign({at:0,set:{stocks:3,level:4,time:0},rec:{},picks:[0,1,0],match:null},store.get('save',{}));
const acct=()=>{try{return ZP&&ZP.cloud||null}catch(e){return null}};
let saveHook=null;
function saveNow(flush){if(saveHook)saveHook();SAVE.at=Date.now();store.set('save',SAVE);const c=acct();if(c)try{c.save('strike',JSON.stringify(SAVE),{at:SAVE.at},'progress');if(flush)c.flush('strike')}catch(e){}}
async function loadAccount(apply){const c=acct();if(!c)return;try{const r=await c.load('strike','progress');if(!r||!r.ok||!r.json)return;const d=JSON.parse(r.json);if((d.at||0)>(SAVE.at||0)){Object.assign(SAVE,d);store.set('save',SAVE);apply&&apply()}}catch(e){}}

   The pad has a D-pad, A, B, START and SELECT. Four actions can be put on any of A, B, UP, DOWN or SELECT:
   ATTACK, SPECIAL (B alone blocks; B with a direction is a special), JUMP and BLOCK. The D-pad always gives
   the direction too, so with the defaults UP jumps and DOWN blocks. */
const ACTS=[['attack','ATTACK'],['special','SPECIAL / BLOCK'],['jump','JUMP'],['block','BLOCK']];
const CTRL_DEF={attack:'a',special:'b',jump:'up',block:'down'};
let CTRL=Object.assign({},CTRL_DEF,store.get('ctrl',{}));
function saveCtrl(){store.set('ctrl',CTRL);SAVE.ctrl=CTRL}
const BTN_NAMES={a:'A',b:'B',up:'UP',down:'DOWN',select:'SELECT'};
const RAW={held:{},tap:{}};
function rawInput(btn,down){unlock();if(down){if(!RAW.held[btn])RAW.tap[btn]=true;RAW.held[btn]=true}else RAW.held[btn]=false}
function clearTaps(){RAW.tap={}}
/* what the player's pad means to a fighter this frame */
function makePad(){return{x:0,up:false,down:false,pressed:{},held:{},t:0}}
const HUMAN=makePad();
function readPad(P){P.t++;P.x=(RAW.held.right?1:0)-(RAW.held.left?1:0);P.up=!!RAW.held.up;P.down=!!RAW.held.down;
  for(const[a]of ACTS){const b=CTRL[a];P.pressed[a]=!!(b&&RAW.tap[b]);P.held[a]=!!(b&&RAW.held[b])}}
/* assigning a button to an action swaps it with whatever had it */
function assign(act,btn){const old=CTRL[act];const other=ACTS.map(x=>x[0]).find(a=>a!==act&&CTRL[a]===btn);CTRL[act]=btn;if(other)CTRL[other]=old;saveCtrl()}
/* keyboard: arrows or WASD, Z/J attack, X/K special, Enter start, Shift select */
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  z:'a',Z:'a',j:'a',J:'a',x:'b',X:'b',k:'b',K:'b',Enter:'start',Escape:'start',Shift:'select',' ':'up'};
addEventListener('keydown',e=>{const b=KEYS[e.key];if(!b)return;e.preventDefault();if(!e.repeat)rawInput(b,true)});
addEventListener('keyup',e=>{const b=KEYS[e.key];if(b)rawInput(b,false)});
addEventListener('blur',()=>{for(const k in RAW.held)RAW.held[k]=false});
/* touch pad (only outside the ZigaPlay) */
(()=>{const dp=document.getElementById('dp');const set=(e)=>{const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);
    const want={left:d>18&&x<-Math.abs(y)*.6,right:d>18&&x>Math.abs(y)*.6,up:d>18&&y<-Math.abs(x)*.6,down:d>18&&y>Math.abs(x)*.6};
    for(const k in want){if(want[k]!==!!RAW.held[k])rawInput(k,want[k]);dp.querySelector(`[data-d=${k}]`).classList.toggle('on',want[k])}};
  const end=()=>{for(const k of['left','right','up','down']){if(RAW.held[k])rawInput(k,false);dp.querySelector(`[data-d=${k}]`).classList.remove('on')}};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);set(e)});dp.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')set(e)});
  dp.addEventListener('pointerup',end);dp.addEventListener('pointercancel',end);
  for(const[id,b]of[['bA','a'],['bB','b'],['bS','start']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');rawInput(b,true)});
    const up=()=>{el.classList.remove('on');rawInput(b,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}})();
/* menus: a repeat when a direction is held */
const REP={};function menuDir(){for(const d of['up','down','left','right']){if(RAW.tap[d]){REP[d]=performance.now()+300;return d}
    if(RAW.held[d]&&REP[d]&&performance.now()>REP[d]){REP[d]=performance.now()+90;return d}}return null}

  if(f.gr){if(f.st==='shield')k='grab';else if(P.down)k='down';else if(P.up||f.st==='squat')k='up';
    else if(P.x){f.face=P.x;k=Math.abs(f.vx)>f.c.run*.72&&f.st==='stand'?'dash':'side'}else k='jab1'}
  else k=P.up?'uair':P.down?'dair':P.x===f.face?'fair':P.x===-f.face?'bair':'nair';
  doMove(f,k);return true}
function doMove(f,k){f.st='atk';f.t=0;f.mv={k,d:NM[k],t:0,uid:++UID,hits:new Set(),hitAny:false};if(f.gr&&!NM[k].slide)f.vx*=.35}
const SIDE_ONCE={dash:1,charge:1,drill:1,roll:1,grab:1};
function startSp(f,dir){const s=f.c[dir];if(!f.gr&&dir==='up'&&f.upUsed)return false;if(!f.gr&&dir==='side'&&f.sideUsed&&SIDE_ONCE[s.kind])return false;
  f.st='sp';f.t=0;f.mv={sp:s.kind,dir,t:0,uid:++UID,hits:new Set(),hitAny:false};f.ff=0;if(dir==='up')f.upUsed=1;SFX.special();return true}
function toShield(f){if(f.st!=='shield'){f.st='shield';f.t=0;f.shT=0}f.vx*=.3}
function airDodge(f){if(f.dodged)return false;f.dodged=1;setSt(f,'dodge');const P=f.pad,x=P.x,y=P.up?-1:P.down?1:0;
  if(x||y){const l=Math.hypot(x,y);f.vx=x/l*6;f.vy=y/l*6;f.dd=1}else{f.vy*=.3;f.dd=0}f.ff=0;return true}
function doubleJump(f){f.jumps--;f.vy=-f.c.jump*.95;f.vx=f.pad.x*f.c.air;f.ff=0;setSt(f,'air');SFX.djump();ringFx(f.x,f.y,'#ffffff',10,.5);return true}
/* try what the buttons ask for; true when something started */
function act(f,ground){const P=f.pad;
  if(f.buf.special){f.buf.special=0;if(P.up)return startSp(f,'up');if(P.down)return startSp(f,'down');if(P.x){f.face=P.x;return startSp(f,'side')}
    if(f.gr){toShield(f);return true}return airDodge(f)}
  if(f.buf.attack){f.buf.attack=0;return startAtk(f)}
  if(f.buf.jump){if(f.gr){f.buf.jump=0;setSt(f,'squat');return true}if(f.jumps>0){f.buf.jump=0;return doubleJump(f)}}
  return false}
/* ---------- one frame of one fighter ---------- */
function tick(f){f.boxes.length=0;const P=f.pad,c=f.c;
  for(const a of['attack','special','jump']){if(P.pressed[a])f.buf[a]=7;else if(f.buf[a])f.buf[a]--}
  const dTap=P.down&&!f.prevDown,xTap=P.x&&P.x!==f.prevX;f.prevDown=P.down;f.prevX=P.x;
  if(dTap){if(FRAME-f.downT<16&&f.gr&&f.gr.soft&&['stand','shield'].includes(f.st)){f.gr=null;f.y+=3;f.drop=12;setSt(f,'air');f.buf.special=0}f.downT=FRAME}
  if(f.flash>0)f.flash--;
  if(f.hl>0){f.hl--;return}
  if(f.inv>0)f.inv--;if(f.ledgeCD>0)f.ledgeCD--;if(f.drop>0)f.drop--;f.t++;f.anim+=.25;
  if(!f.gr)f.airT++;if(f.st!=='shield')f.sh=Math.min(50,f.sh+.12);
  f.counter=false;f.reflect=false;f.armor=0;
  switch(f.st){
  case'stand':{if(act(f))break;if(P.held.block){toShield(f);break}
    const tx=P.x*c.run;f.vx+=clamp(tx-f.vx,-(P.x?1:.7),P.x?1:.7);if(P.x)f.face=P.x;break}
  case'squat':{f.vx*=.9;if(P.up&&f.buf.special){f.buf.special=0;startSp(f,'up');break}if(P.up&&f.buf.attack){f.buf.attack=0;doMove(f,'up');break}
    if(f.t>=3){const full=P.held.jump;f.vy=-c.jump*(full?1:.66);f.vx=clamp(f.vx+P.x*.6,-c.air*1.15,c.air*1.15);f.gr=null;f.y-=1;setSt(f,'air');f.buf.jump=0;SFX.jump();dust(f.x,f.y)}break}
  case'air':{if(act(f))break;const tx=P.x*c.air;if(P.x)f.vx+=clamp(tx-f.vx,-.38,.38);else f.vx*=.97;if(dTap&&f.vy>-2.5&&!f.ff){f.ff=1;f.vy=Math.max(f.vy,4)}break}
  case'land':{f.vx*=.8;if(f.t>=f.landN){setSt(f,f.gr?'stand':'air');act(f)}break}
  case'shield':{f.shT++;f.sh-=.16;f.vx*=.8;if(f.sh<=0){breakShield(f);break}
    if(!(P.held.block||P.held.special)){setSt(f,'land');f.landN=4;break}
    if(f.buf.attack){f.buf.attack=0;doMove(f,'grab');break}
    if(f.buf.special&&(P.up||P.down||P.x)){act(f);break}f.buf.special=0;
    if(f.buf.jump){f.buf.jump=0;setSt(f,'squat');break}
    if(xTap){setSt(f,'roll');f.rd=P.x;break}break}
  case'roll':{f.inv=f.t>=3&&f.t<15?2:f.inv;f.vx=f.t<16?f.rd*4.4:f.vx*.6;if(f.t>=22){f.face=-f.rd;setSt(f,'stand')}break}
  case'dodge':{f.inv=f.t>=3&&f.t<19?2:f.inv;if(f.dd){f.vx*=.9;f.vy*=.9}if(f.t>=26)setSt(f,'air');break}
  case'atk':{const m=f.mv,d=m.d;m.t++;const T=m.t;
    if(T>d.s&&T<=d.s+d.a){if(T===d.s+1){SFX.swing();if(d.slide)f.vx=f.face*Math.max(Math.abs(f.vx),c.run*1.1)}
      const W=WEAP[c.weapon]||WEAP.none,ext=d.wpn?W.reach:0,big=d.wpn?W.big:1;
      d.b.forEach((b,i)=>hit(f,m,'n'+i,b[0]+sgn(b[0])*ext,b[1],b[2]*big,b[3],b[4],b[5]*(d.wpn&&W.kg||1),b[6],d.radial?{radial:1}:d.grab?{grab:1}:null))}
    if(f.gr){f.vx*=d.slide?.94:.82}else{const tx=P.x*c.air;if(P.x)f.vx+=clamp(tx-f.vx,-.2,.2);if(dTap&&f.vy>-2.5)f.ff=1}
    if(d.chain&&T>=d.s+d.a&&f.buf.attack&&!P.x&&!P.down&&!P.up){f.buf.attack=0;doMove(f,d.chain);break}
    if(m.hitAny&&T>d.s+d.a&&act(f))break;
    if(T>=d.s+d.a+d.r){setSt(f,f.gr?'stand':'air')}break}
  case'sp':{const m=f.mv;const done=SP[m.sp](f,m);m.t++;if(f.gr&&!m.keep)f.vx*=.86;
    if(done){f.hide=0;if(m.help&&!f.gr){setSt(f,'help')}else setSt(f,f.gr?'stand':'air')}break}
  case'help':{const tx=P.x*c.air*.65;if(P.x)f.vx+=clamp(tx-f.vx,-.2,.2);break}
  case'hit':{if(--f.hs<=0){setSt(f,f.gr?'stand':'air');f.tumble=0}break}
  case'down':{f.vx*=.8;f.inv=2;if(f.t>=22){setSt(f,'stand');f.inv=8}break}
  case'stun':{f.vx*=.8;if(f.t>=f.stunN)setSt(f,f.gr?'stand':'air');break}
  case'dizzy':{f.vx*=.85;if(f.t>=140){setSt(f,'stand');f.sh=30}break}
  case'holding':{const v=f.held;if(!v||v.st!=='held'){f.held=null;setSt(f,'stand');break}v.x=f.x+f.face*15;v.y=f.y;
    if(f.t>=10){const k=P.x===-f.face?'b':P.up?'u':'f',T=THROW[k];v.st='hit';v.holder=null;f.held=null;hitNow(f,v,{d:T[0],kb:T[1],kg:T[2],ang:T[3]},f.face);setSt(f,'land');f.landN=14}break}
  case'held':{if(!f.holder||!['holding','sp'].includes(f.holder.st)){f.holder=null;setSt(f,'air')}break}
  case'ledge':{const L=f.lx;f.vx=f.vy=0;f.x=L.x+L.side*7;f.y=L.y+24;
    const toward=P.x===-L.side;
    if(f.buf.jump||(P.up&&f.t>6)){f.buf.jump=0;climb(f,L);f.gr=null;f.y=L.y-2;f.vy=-c.jump;setSt(f,'air');SFX.jump()}
    else if(f.buf.attack){f.buf.attack=0;climb(f,L);doMove(f,'jab3');f.inv=8}
    else if(toward&&f.t>6){climb(f,L);setSt(f,'land');f.landN=6;f.inv=10}
    else if(P.x===L.side||P.down||f.t>150){f.st='air';f.t=0;f.vy=1;f.ledgeCD=30}
    else if(f.buf.special){f.st='air';f.ledgeCD=20;act(f)}break}
  case'spawn':{f.vx=f.vy=0;f.inv=Math.max(f.inv,2);if(f.t>150||P.x||P.down||f.buf.jump||f.buf.attack||f.buf.special){setSt(f,'air');f.inv=90}break}
  case'ko':{if(f.t>=70&&(f.stocks>0||MATCH.train))respawn(f);break}}
  physics(f)}
function climb(f,L){f.x=L.x-L.side*10;f.y=L.y;f.gr=PLATS[0];f.vx=0;f.vy=0}
function grabLedge(f,L){f.st='ledge';f.t=0;f.lx=L;f.mv=null;f.hide=0;f.x=L.x+L.side*7;f.y=L.y+24;f.vx=f.vy=f.lvx=f.lvy=0;f.face=-L.side;f.jumps=1;f.upUsed=f.sideUsed=f.dodged=0;f.ff=0;f.inv=Math.max(f.inv,30);f.airT=0}
function ledgeNear(x,y,r){const M=STAGE.main;for(const s of[-1,1]){const ex=s<0?M.x1:M.x2;if(Math.hypot(x-ex,y-M.y)<r)return{x:ex,y:M.y,side:s}}return null}
function breakShield(f){setSt(f,'dizzy');f.sh=0;f.vy=-7;f.gr=null;f.mv=null;SFX.brk();shake(6);burst(f.x,f.y-16,'#9ad8ff',14,4)}
function respawn(f){f.x=0;f.y=-150;f.vx=f.vy=f.lvx=f.lvy=0;f.pct=0;f.gr=null;f.st='spawn';f.t=0;f.inv=150;f.jumps=1;f.upUsed=f.sideUsed=f.dodged=0;f.mv=null;f.sh=50;f.hide=0;f.face=1}
function land(f,p){f.gr=p;f.y=p.y;f.vy=0;f.lvy=0;f.jumps=1;f.ff=0;f.upUsed=f.sideUsed=f.dodged=0;const air=f.airT;f.airT=0;
  switch(f.st){case'air':setSt(f,'land');f.landN=2;if(air>8){SFX.land();dust(f.x,f.y)}break;
    case'atk':if(f.mv.d.air){const n=f.mv.d.land;setSt(f,'land');f.landN=f.mv.hitAny?Math.ceil(n/2):n;SFX.land()}break;
    case'help':setSt(f,'land');f.landN=12;SFX.land();dust(f.x,f.y);break;
    case'dodge':setSt(f,'land');f.landN=6;break;
    case'hit':if(f.lvy>4.5){f.gr=null;f.y=p.y-1;f.lvy=-f.lvy*.5;f.vy=0;dust(f.x,f.y);SFX.land()}else if(f.hs>6){setSt(f,'down');f.lvx*=.4;f.lvy=0;dust(f.x,f.y)}else{setSt(f,'stand')}break;
    case'dizzy':break;case'spawn':break}}
const GROUND_HOLD={atk:1,shield:1,land:1,roll:1,squat:1,stun:1,dizzy:1,down:1,holding:1};
function physics(f){if(f.st==='held'||f.st==='ko'||f.st==='ledge'||f.st==='spawn')return;const c=f.c;
  if(!f.gr&&!(f.st==='hit'&&f.hs>0&&(f.lvx||f.lvy))){const g=f.st==='sp'&&f.mv&&f.mv.nograv?0:c.grav;f.vy+=g;const mf=f.ff&&f.st!=='hit'?11:7.6;if(f.vy>mf)f.vy=Math.max(mf,f.vy-1)}
  if(f.lvx||f.lvy){const L=Math.hypot(f.lvx,f.lvy),n=Math.max(0,L-.12)/L;f.lvx*=n;f.lvy*=n;if(Math.abs(f.lvx)<.01&&Math.abs(f.lvy)<.01)f.lvx=f.lvy=0}
  const px=f.x,py=f.y;f.x+=f.vx+f.lvx;f.y+=f.vy+f.lvy;
  if(f.gr){const p=f.gr;if(f.x<p.x1||f.x>p.x2){if(GROUND_HOLD[f.st]){f.x=clamp(f.x,p.x1,p.x2);f.vx=0;f.lvx=0}else{f.gr=null;if(f.st==='stand')setSt(f,'air');f.airT=0}}
    if(f.gr){f.y=p.y;if(f.st==='hit'&&f.lvy<-.5){f.gr=null}}}
  if(!f.gr&&f.vy+f.lvy>=0){for(const p of PLATS){if(p.soft&&(f.drop>0||(f.pad.down&&f.st!=='hit'&&f.st!=='help'&&f.ff)))continue;
      if(py<=p.y+.5&&f.y>=p.y&&f.x>=p.x1-1&&f.x<=p.x2+1){land(f,p);break}}}
  /* the main stage is solid at its sides and bottom */
  const M=STAGE.main,top=M.y,bot=M.y+64;
  if(!f.gr&&f.y>top+1&&f.y-H(f)<bot&&f.x>M.x1-8&&f.x<M.x2+8){
    if(px<=M.x1-8){f.x=M.x1-8;if(f.st==='hit'&&Math.abs(f.lvx)>3){f.lvx*=-.5;dust(f.x,f.y-10)}else{f.vx=Math.min(0,f.vx);f.lvx=Math.min(0,f.lvx)}}
    else if(px>=M.x2+8){f.x=M.x2+8;if(f.st==='hit'&&Math.abs(f.lvx)>3){f.lvx*=-.5;dust(f.x,f.y-10)}else{f.vx=Math.max(0,f.vx);f.lvx=Math.max(0,f.lvx)}}
    else if(py-H(f)>=bot-2){f.y=bot+H(f);f.vy=Math.max(0,f.vy);f.lvy=Math.max(0,f.lvy)}
    else{f.y=top;land(f,PLATS[0])}}

    for(const s of[-1,1]){const ex=s<0?M.x1:M.x2,d=(f.x-ex)*s;if(d>=-3&&d<=22&&(f.airT>18||f.face===-s)&&!FT.some(o=>o!==f&&o.st==='ledge'&&o.lx&&o.lx.side===s)){grabLedge(f,{x:ex,y:top,side:s});break}}}
  /* off the screen */
  if(f.x<BLAST.l||f.x>BLAST.r||f.y>BLAST.b||f.y<BLAST.t)koFighter(f)}

/* ================= hitting, knockback, projectiles, effects ================= */
/* register a hitbox for this frame. x is forward from the fighter (or a world spot with o.abs) */
function hit(f,m,id,x,y,r,d,kb,kg,ang,o){const s=f.c.sz,b={id,m,d,kb,kg,ang,r:r*(o&&o.abs?1:s)};if(o)Object.assign(b,o);
  if(o&&o.abs){b.x=x;b.y=y}else{b.x=f.x+f.face*x*s;b.y=f.y+y*s}f.boxes.push(b)}
function hurt(v){const s=v.c.sz;return{x1:v.x-9*s,x2:v.x+9*s,y1:v.y-31*s,y2:v.y}}
function touches(cx,cy,r,v){const h=hurt(v),nx=clamp(cx,h.x1,h.x2),ny=clamp(cy,h.y1,h.y2);return(cx-nx)**2+(cy-ny)**2<=r*r}
function resolveHits(){for(const a of FT){if(!a.boxes.length||a.hl>0)continue;const m=a.mv;if(!m)continue;
  for(const v of FT){if(v===a||v.st==='ko'||v.st==='spawn'||(v.st==='held'&&v.holder!==a))continue;
    const done=new Set();for(const b of a.boxes){const key=v.id+':'+b.id;if(m.hits.has(key)||done.has(b.id))continue;if(v.inv>0)continue;
      if(!touches(b.x,b.y,b.r,v))continue;done.add(b.id);m.hits.add(key);applyHit(a,v,b,a.face)}}}}
function calcKB(v,b,d){if(!b.kg)return b.kb;return(b.kb+v.pct*(.12+d*.012)*b.kg/100*1.9)*(200/(100+v.c.w))}

  if(b.grab){if(v.st==='ledge')return;v.st='held';v.t=0;v.holder=a;v.mv=null;v.vx=v.vy=v.lvx=v.lvy=0;a.held=v;a.st='holding';a.t=0;a.mv=null;SFX.hit(0);return}
  if(v.counter&&!b.proj&&v.mv){v.mv.fired=v.mv.t;v.mv.cd=Math.round(Math.max(10,b.d*1.3));v.inv=26;v.face=sgn(a.x-v.x)||v.face;v.counter=false;a.hl=16;v.flash=10;

    if(v.shT<5){SFX.parry();v.flash=8;ringFx(v.x,v.y-16,'#ffffff',22);if(!b.proj&&a.st!=='ko'){a.st='stun';a.t=0;a.stunN=22;a.mv=null;a.boxes.length=0}v.inv=6;return}
    v.sh-=b.d*1.4+2;v.vx=dir*(.8+b.d*.12);const hl=Math.round(2+b.d*.25);v.hl=hl;if(!b.proj){a.hl=hl;if(a.gr)a.vx=-dir*(.6+b.d*.06)}SFX.shield();

  if(b.drain){a.pct=Math.max(0,a.pct-b.drain);ringFx(a.x,a.y-16,'#7affa0',16)}

  else{v.lvx=Math.cos(r)*L*dir;v.lvy=-Math.sin(r)*L;

function hitNow(a,v,b,dir){b.x=v.x;b.y=v.y-16;applyHit(a,v,b,dir)}
/* ---------- projectiles ---------- */
function proj(f,o){const p=Object.assign({o:f,t:0,hits:new Set(),col:f.c.fx,ang:o.ang||45,kb:o.kb||0,kg:o.kg||0},o),k=pwr(f),sp=.88+f.c.spd*.05;

    if(m.sp==='flame'&&t>=5&&t<22){const g=ctx.createLinearGradient(0,f.y+30,0,f.y-30);g.addColorStop(0,'rgba(255,80,0,0)');g.addColorStop(.5,c);g.addColorStop(1,'rgba(255,240,180,.8)');ctx.fillStyle=g;ctx.globalAlpha=.75;ctx.beginPath();ctx.ellipse(f.x,f.y,9+Math.sin(t)*2,26,0,0,TAU);ctx.fill();ctx.globalAlpha=1}
    if(f.counter||f.reflect){ctx.strokeStyle=f.reflect?c:'#ffffff';ctx.lineWidth=2;ctx.globalAlpha=.6+.4*Math.sin(t);ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU+t*.1;ctx.lineTo(f.x+Math.cos(a)*20*s,f.y-16*s+Math.sin(a)*20*s)}ctx.closePath();ctx.stroke();ctx.globalAlpha=1}
    if(f.armor){ctx.strokeStyle=c;ctx.globalAlpha=.5;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y-16*s,19*s,0,TAU);ctx.stroke();ctx.globalAlpha=1}
    if(m.sp==='drain'&&t>=8&&t<14){ctx.strokeStyle='#7affa0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x+f.face*14*s,f.y-16*s,10+(t-8)*2,0,TAU);ctx.stroke()}}}
function drawStatus(f){const s=f.c.sz;
  if(f.st==='shield'){const r=(9+12*f.sh/50)*s;ctx.fillStyle=f.c.fx;ctx.globalAlpha=.32;ctx.beginPath();ctx.arc(f.x,f.y-15*s,r,0,TAU);ctx.fill();ctx.globalAlpha=.8;ctx.strokeStyle=f.c.fx;ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1}
  if(f.st==='dizzy'){for(let i=0;i<3;i++){const a=FRAME*.12+i/3*TAU;star(f.x+Math.cos(a)*10,f.y-38*s+Math.sin(a)*3,3,'#ffd84a')}}
  if(f.st==='stun'&&f.stunN>30){ctx.strokeStyle='#d8c8a0';ctx.lineWidth=1.4;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(f.x,f.y-6-i*8,12,3,0,0,TAU);ctx.stroke()}}
  if(f.st==='spawn'){ctx.fillStyle=f.c.fx;ctx.globalAlpha=.7;ctx.beginPath();ctx.ellipse(f.x,f.y+2,16,3.4,0,0,TAU);ctx.fill();ctx.globalAlpha=1}

  if(f.st!=='ko'&&!f.hide){const y=f.y-(f.st==='ledge'?20:44)*s-4;ctx.fillStyle=f.cpu?'#7aa0ff':'#ff4a5a';ctx.beginPath();ctx.moveTo(f.x-4,y-6);ctx.lineTo(f.x+4,y-6);ctx.lineTo(f.x,y);ctx.closePath();ctx.fill()}}
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function drawFx(){for(const e of FX){const k=e.life/e.max;
  if(e.k==='p'){ctx.globalAlpha=k;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r*k+.4,0,TAU);ctx.fill()}
  else if(e.k==='dust'){ctx.globalAlpha=k*.5;ctx.fillStyle='#c8c8d8';ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1.5-k*.5),0,TAU);ctx.fill()}
  else if(e.k==='ring'){ctx.globalAlpha=k;ctx.strokeStyle=e.col;ctx.lineWidth=2.2*k+.5;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1.15-k*.6),0,TAU);ctx.stroke()}
  else if(e.k==='spark'){ctx.globalAlpha=Math.min(1,k*1.5);ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);const r=e.r*(1.3-k*.5);ctx.fillStyle='#fff';ctx.beginPath();
    for(let i=0;i<16;i++){const a=i/16*TAU,rr=i%2?r*.25:r*(i%4?.6:1);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.strokeStyle=e.col;ctx.lineWidth=1.6;ctx.stroke();ctx.restore()}
  else if(e.k==='ko'){ctx.globalAlpha=k;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.ang);const L=400*(1.2-k);ctx.fillStyle=e.col;ctx.beginPath();ctx.moveTo(0,-30*k);ctx.lineTo(L,0);ctx.lineTo(0,30*k);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-12*k);ctx.lineTo(L*.8,0);ctx.lineTo(0,12*k);ctx.closePath();ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
/* fighters off the screen get a bubble at the edge */
function drawOffscreen(f){if(f.st==='ko')return;const S=camS(),sx=(f.x-CAM.x)*S+SW/2,sy=(f.y-16-CAM.y)*S+SH/2,m=22*U;
  if(sx>-4&&sx<SW+4&&sy>-4&&sy<SH+4)return;const bx=clamp(sx,m,SW-m),by=clamp(sy,m,SH-m);ctx.fillStyle='rgba(10,10,24,.8)';ctx.strokeStyle=f.cpu?'#7aa0ff':'#ff4a5a';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bx,by,15*U,0,TAU);ctx.fill();ctx.stroke();drawHead(f.c,bx,by+2*U,1.2*U,1)}

/* ================= the computer player =================
   Levels 1-9: higher levels react sooner, block more, combo and recover better. Level 0 is the training dummy. */
const PROJ_KINDS={fireball:1,boomerang:1,triple:1,beam:1,arc:1,whip:1};
function aiTick(f){const P=f.pad,A=f.ai,L=f.lvl;P.pressed={};P.held.jump=true;P.held.attack=P.held.special=false;
  if(!L){P.x=0;P.up=P.down=false;P.held.block=false;return}
  const o=FT.find(g=>g!==f),M=STAGE.main;if(!o)return;
  const press=(a,x=0,up=false,down=false)=>{P.pressed[a]=true;P.x=x;P.up=up;P.down=down;A.cool=Math.max(3,Math.round(26-L*2.4+rnd()*8))};
  const dx=o.x-f.x,adx=Math.abs(dx),dy=(o.y)-(f.y),sx=sgn(dx)||f.face,skill=L/9;
  if(A.cool>0)A.cool--;if(A.projT>0)A.projT--;
  if(A.wait==null)A.wait=Math.round(24+rnd()*30);if(A.wait>0){A.wait--;P.x=0;P.up=P.down=false;return}
  P.held.block=false;
  if(f.st==='ko'||f.st==='held'||f.st==='hit'||f.st==='stun'||f.st==='dizzy'){P.x=0;P.up=P.down=false;return}
  if(f.st==='spawn'){if(rnd()<.03)P.x=sx;return}
  if(f.st==='ledge'){P.x=0;P.up=P.down=false;if(f.t>8+Math.round((9-L)*4)&&rnd()<.25){const r=rnd();if(r<.4)press('jump');else if(r<.7)P.x=-f.lx.side;else press('attack')}return}
  /* getting back to the stage */
  const off=f.x<M.x1-2||f.x>M.x2+2;
  if(off&&!f.gr){const ex=f.x<0?M.x1:M.x2,tx=sgn(ex-f.x)||1;P.x=tx;P.up=P.down=false;
    if(f.st==='help'||f.st==='sp')return;
    const far=Math.abs(ex-f.x);
    if(f.jumps>0&&f.vy>-1&&(f.y>-30||far>90)){press('jump',tx);return}
    if(f.jumps===0&&f.vy>0&&far>100&&!f.sideUsed&&f.y<10&&{dash:1,charge:1,drill:1,roll:1}[f.c.side.kind]&&rnd()<.5){press('special',tx);return}
    if(f.jumps===0&&f.vy>0&&(f.y>-10||far>40)&&!f.upUsed){press('special',far>40?tx:0,true);return}
    return}
  /* stay on the stage */
  const nearEdge=f.gr&&((f.x<M.x1+24&&P.x<0)||(f.x>M.x2-24&&P.x>0));
  /* blocking */
  if(A.shT>0){A.shT--;P.held.block=true;P.x=0;P.up=P.down=false;
    if(o.st!=='atk'&&o.st!=='sp'&&adx<30&&rnd()<skill*.5){A.shT=0;P.held.block=true;press('attack');}return}
  if(f.gr&&(o.st==='atk'||o.st==='sp')&&adx<50&&Math.abs(dy)<40&&A.cool<=0&&rnd()<skill*.18){A.shT=8+Math.round(rnd()*10);P.held.block=true;return}
  /* falling through platforms toward the foe */
  if(f.gr&&f.gr.soft&&dy>24&&adx<80){A.drop=(A.drop||0)+1;P.down=A.drop%6<3;P.x=0;return}A.drop=0;
  if(A.cool>0){/* keep moving while waiting */if(adx>30)P.x=sx;else P.x=rnd()<.2?-sx:0;if(nearEdge)P.x=0;P.up=false;P.down=!f.gr&&f.vy>0&&dy>20;return}
  if(rnd()>.35+skill*.65){P.x=adx>30?sx:0;return}
  const reach=26+(WEAP[f.c.weapon]||WEAP.none).reach;
  if(f.gr){
    if(adx>reach+4){
      if(PROJ_KINDS[f.c.side.kind]&&!(A.projT>0)&&adx>70&&adx<200&&Math.abs(dy)<40&&rnd()<.03+skill*.05){f.face=sx;A.projT=Math.round(80+rnd()*80-L*4);press('special',sx);return}
      if(dy<-50&&adx<60&&rnd()<.4){press('jump',sx);return}
      P.x=sx;P.up=P.down=false;if(nearEdge)P.x=0;
      if(adx<90&&rnd()<.04)press('jump',sx);return}
    f.face=sx;
    if(dy<-34){press('attack',0,true);return}
    if(dy<-14&&!o.gr){press('jump',sx);return}
    const r=rnd();
    if(o.st==='shield'&&r<.5){P.held.block=true;press('attack');return}
    if(r<.22)press('attack');else if(r<.44)press('attack',sx);else if(r<.56)press('attack',0,false,true);
    else if(r<.68&&!(A.projT>0&&PROJ_KINDS[f.c.side.kind])){A.projT=60;press('special',sx)}else if(r<.78)press('special',0,false,true);else if(r<.88)press('jump',sx);else press('attack',0,true);
    return}
  /* in the air */
  P.x=adx>8?sx:0;P.down=f.vy>0&&dy>30&&adx<40;
  if(adx<reach+6&&Math.abs(dy)<44){
    if(dy<-18)press('attack',0,true);else if(dy>18)press('attack',0,false,true);else if(rnd()<.8)press('attack',sx);else press('attack');
    return}
  if(f.jumps>0&&dy<-30&&f.vy>-2&&rnd()<.3)press('jump',sx)}

function selectTick(){const d=menuDir(),p=SEL.phase;let c=SEL.cur[p];
  if(p<2){if(d==='left'){c=c%10?c-1:c+9;SFX.move()}if(d==='right'){c=c%10<9?c+1:c-9;SFX.move()}if(d==='up'){c=(c+40)%50;SFX.move()}if(d==='down'){c=(c+10)%50;SFX.move()}SEL.cur[p]=c;
    if(TAP('select')){SEL.cur[p]=Math.floor(rnd()*50);SFX.pick()}
    if(TAP('a')||TAP('start')){SFX.pick();if(p===0)SEL.phase=1;else{SEL.phase=2;go('stage',SEL.stage)}}
    if(TAP('b')){SFX.back();if(p===1)SEL.phase=0;else go('title',SEL.mode==='train'?2:1)}}}
function selectDraw(){drawSky('roof');ctx.setTransform(DPR,0,0,DPR,0,0);const{cell,gx,gy}=selGeom(),p=Math.min(1,SEL.phase);
  text(SEL.mode==='train'?'TRAINING · PICK YOUR FIGHTER':p===0?'PICK YOUR FIGHTER':'PICK THE CPU FIGHTER',gx,10*U,14,'#fff','left',900,'#000');
  for(let i=0;i<50;i++){const c=ROSTER[i],x=gx+(i%10)*cell,y=gy+Math.floor(i/10)*cell;rrect(x+1,y+1,cell-2,cell-2,4*U);ctx.fillStyle=shade(c.body,-.55);ctx.fill();
    ctx.save();ctx.beginPath();rrect(x+1,y+1,cell-2,cell-2,4*U);ctx.clip();drawHead(c,x+cell/2,y+cell*.58,cell/24);ctx.restore();
    for(const q of[0,1]){if(SEL.cur[q]===i&&(q<=SEL.phase)){ctx.lineWidth=q===p?3:2;ctx.strokeStyle=q===0?'#ff4a5a':'#7aa0ff';rrect(x+1,y+1,cell-2,cell-2,4*U);ctx.stroke();
      text(q===0?'P1':'CPU',x+3*U,y+2*U,7,q===0?'#ff4a5a':'#7aa0ff','left',900,'#000')}}}
  /* who is under the cursor */
  const c=ROSTER[SEL.cur[p]],px=gx+cell*10+10*U,pw=SW-px-8*U;panel(px,gy,pw,SH-gy-30*U);
  drawDummy(dummy(c,1),px+pw*.24,gy+86*U,2.1*U);text(c.name,px+pw*.48,gy+8*U,17,'#fff','left',900,'#000');text(c.title,px+pw*.48,gy+30*U,9,c.acc,'left',800);
  const bars=[['SPEED',c.spd],['POWER',c.pow],['WEIGHT',{l:1,m:3,h:5}[c.build]]];bars.forEach(([n,v],i)=>{const y=gy+44*U+i*12*U;text(n,px+pw*.48,y,7.5,'#a8a8c8','left',800);
    for(let k=0;k<5;k++){ctx.fillStyle=k<v?c.acc:'rgba(255,255,255,.12)';ctx.fillRect(px+pw*.48+42*U+k*9*U,y+1*U,7*U,6*U)}});
  const sp=[['B+▲',c.up],['B+◀▶',c.side],['B+▼',c.down]];sp.forEach(([k,m],i)=>{const y=gy+96*U+i*24*U;text(k,px+10*U,y,8.5,'#ffd84a','left',900);text(m.name,px+44*U,y,9.5,'#fff','left',900);text(SPDESC[m.kind],px+44*U,y+11*U,7.5,'#b8b8d8','left',700)});
  if(p===1){const a=ROSTER[SEL.cur[0]];text('YOU: '+a.name,px+10*U,SH-48*U,9,'#ff4a5a','left',900)}
  hint('D-pad move · A pick · SELECT random · B back')}
/* ---------- stage select ---------- */
function stageTick(){const d=menuDir();if(d==='left'||d==='up'){MSEL=(MSEL+3)%4;SFX.move()}if(d==='right'||d==='down'){MSEL=(MSEL+1)%4;SFX.move()}
  if(TAP('a')||TAP('start')){SEL.stage=MSEL;SFX.go();startMatch({chars:[SEL.cur[0],SEL.cur[1]],stage:MSEL,train:SEL.mode==='train'})}
  if(TAP('b')){SFX.back();SEL.phase=1;go('select')}}
function stageDraw(){drawSky(STAGES[MSEL].id);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,SW,SH);
  text('PICK A STAGE',SW/2,14*U,18,'#fff','center',900,'#000');const w=Math.min(96*U,(SW-50*U)/4);
  STAGES.forEach((s,i)=>{const x=SW/2+(i-1.5)*(w+8*U)-w/2,y=SH/2-30*U,on=i===MSEL;panel(x,y,w,64*U,on?'rgba(255,79,168,.25)':'rgba(8,8,22,.8)',on?'#ff4fa8':'rgba(255,255,255,.2)');
    const M=s.main,k=w/460;ctx.fillStyle='#c8c8e8';ctx.fillRect(x+w/2+M.x1*k,y+44*U,(M.x2-M.x1)*k,3*U);for(const p of s.plats)ctx.fillRect(x+w/2+p.x1*k,y+44*U+p.y*k*.9,(p.x2-p.x1)*k,2*U);
    text(s.name,x+w/2,y+70*U,9,on?'#fff':'#a8a8c8','center',900)});
  hint('◀▶ choose · A fight! · B back')}
/* ---------- pause and move list ---------- */
function pauseItems(){return['RESUME','MOVE LIST','CONTROLS',MATCH.train?'END TRAINING':'QUIT MATCH']}
function pauseTick(){const it=pauseItems(),d=menuDir();if(d==='up'){MSEL=(MSEL+it.length-1)%it.length;SFX.move()}if(d==='down'){MSEL=(MSEL+1)%it.length;SFX.move()}
  if(TAP('start')||TAP('b')){SFX.back();go('fight');return}
  if(TAP('a')){const s=it[MSEL];if(s==='RESUME'){SFX.back();go('fight')}else if(s==='MOVE LIST'){SFX.pick();go('moves')}else if(s==='CONTROLS'){SFX.pick();BACKTO='pause';go('controls')}
    else{SFX.back();SAVE.match=null;saveNow();music(false);rollTitle();go('title')}}}
function pauseDraw(){fightDraw();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(4,4,14,.6)';ctx.fillRect(0,0,SW,SH);text('PAUSED',SW/2,30*U,24,'#fff','center',900,'#000');
  menuList(pauseItems(),SW/2,76*U,14,22*U,MSEL);hint('▲▼ choose · A select · START resume')}
function movesTick(){if(TAP('b')||TAP('a')||TAP('start')){SFX.back();go('pause',1)}}
function movesDraw(){fightDraw();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(4,4,14,.85)';ctx.fillRect(0,0,SW,SH);const c=FT[0].c,A=BTN_NAMES[CTRL.attack],B=BTN_NAMES[CTRL.special];
  text(c.name+' · MOVES',SW/2,10*U,16,'#fff','center',900,'#000');
  const L=[[A,'jab, jab, kick'],['◀▶ + '+A,'strong hit (dash attack while running)'],['▲ + '+A,'up attack'],['▼ + '+A,'low sweep'],['air '+A,'spin kick · ◀▶ front/back · ▲ up · ▼ spike'],
    [B+' + ▲',c.up.name+' · '+SPDESC[c.up.kind]],[B+' + ◀▶',c.side.name+' · '+SPDESC[c.side.kind]],[B+' + ▼',c.down.name+' · '+SPDESC[c.down.kind]],[B+' / '+BTN_NAMES[CTRL.block],'block (tap just before a hit to parry) · + '+A+' grab · + ◀▶ roll']];
  L.forEach(([k,v],i)=>{const y=38*U+i*19*U;text(k,SW/2-60*U,y,10,'#ffd84a','right',900);text(v,SW/2-50*U,y,10,'#e8e8ff','left',700)});hint('B back')}
/* ---------- results ---------- */
function resultsTick(){const d=menuDir();if(d==='up'||d==='down'){MSEL=(MSEL+1)%3;SFX.move()}
  if(TAP('a')||TAP('start')){SFX.pick();const R=MATCH.res;if(MSEL===0)startMatch({chars:R.chars,stage:R.stage,train:false});else if(MSEL===1){SEL.mode='fight';SEL.phase=0;go('select')}else{rollTitle();go('title')}}}
function resultsDraw(){const R=MATCH.res;drawSky(STAGES[R.stage].id);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,SW,SH);
  const win=ROSTER[R.chars[R.win]],lose=ROSTER[R.chars[1-R.win]];text(R.win===0?'YOU WIN!':'CPU WINS',SW/2,10*U,26,R.win===0?'#ffd84a':'#7aa0ff','center',900,'#000');
  text(win.name+' · '+win.title,SW/2,44*U,11,win.acc,'center',800);
  drawDummy(dummy(win,1,'stand'),SW*.22,SH*.78,2.8*U);const dl=dummy(lose,-1,'down');drawDummy(dl,SW*.82,SH*.78,1.8*U);
  panel(SW/2-95*U,62*U,190*U,72*U);panel(SW/2-80*U,136*U,160*U,62*U);const S=R.stats;['','KOs','FALLS','DAMAGE'].forEach((h,i)=>{if(!i)return;const y=66*U+i*16*U;text(h,SW/2,y,9,'#a8a8c8','center',800);text(String(S[0][i-1]),SW/2-50*U,y,11,'#ff4a5a','center',900);text(String(S[1][i-1]),SW/2+50*U,y,11,'#7aa0ff','center',900)});
  text('YOU',SW/2-50*U,66*U,9,'#ff4a5a','center',900);text('CPU',SW/2+50*U,66*U,9,'#7aa0ff','center',900);
  menuList(['REMATCH','NEW FIGHTERS','TITLE'],SW/2,140*U,12,19*U,MSEL);hint('▲▼ choose · A select')}

/* ================= the match, the loop, saving ================= */
let MATCH={train:false,flash:0,count:0,tleft:0,ending:0,endT:0,res:null};
function startMatch(o){const S=SAVE.set;setStage(o.stage);PROJ=[];FX=[];SHAKE=0;const lvl=o.train?0:(o.lvl||S.level);
  FT=[newFighter(o.chars[0],0,false,0),newFighter(o.chars[1],1,true,lvl)];placeFighter(FT[0],-70);placeFighter(FT[1],70);
  FT.forEach((f,i)=>{f.stocks=o.stocks?o.stocks[i]:S.stocks;f.pct=o.pct?o.pct[i]:0});
  MATCH={train:!!o.train,chars:o.chars.slice(),stage:o.stage,lvl,flash:0,count:o.resume?70:100,tleft:o.tleft!=null?o.tleft:(S.time&&!o.train?S.time*3600:0),ending:0,endT:0,res:null};
  SAVE.picks=[o.chars[0],o.chars[1],o.stage];for(const k in RAW.held)RAW.held[k]=false;camTick(true);go('fight');music(true);saveNow()}
function resumeMatch(){const m=SAVE.match;if(!m)return;SEL.cur=[m.chars[0],m.chars[1]];startMatch({chars:m.chars,stage:m.stage,train:m.train,lvl:m.lvl,stocks:m.stocks,pct:m.pct,tleft:m.tleft,resume:1})}
function finishMatch(){const a=FT[0],b=FT[1];const win=a.stocks!==b.stocks?(a.stocks>b.stocks?0:1):(a.pct<=b.pct?0:1);
  const r=SAVE.rec[a.c.i]||(SAVE.rec[a.c.i]={w:0,l:0});if(win===0)r.w++;else r.l++;const T=SAVE.tot||(SAVE.tot={w:0,l:0,ko:0});if(win===0)T.w++;else T.l++;T.ko+=a.kos;
  MATCH.res={win,chars:MATCH.chars,stage:MATCH.stage,stats:[[a.kos,a.falls,Math.round(a.dmg)+'%'],[b.kos,b.falls,Math.round(b.dmg)+'%']]};
  SAVE.match=null;music(false);SFX.game();saveNow(true);go('results')}
function fightStep(){if(TAP('start')&&!MATCH.ending){SFX.back();go('pause');return}
  readPad(HUMAN);
  if(MATCH.count>0){MATCH.count--;if(MATCH.count===30)SFX.go();if(MATCH.count>30){fxTick();camTick();return}}
  if(MATCH.ending){MATCH.endT++;if(MATCH.endT===1)SFX.beep();if(MATCH.endT>110){finishMatch();return}if(MATCH.endT%2){fxTick();camTick();return}}
  for(const f of FT)if(f.cpu)aiTick(f);
  for(const f of FT)tick(f);
  resolveHits();
  for(const p of PROJ)if(!p.dead)projTick(p);PROJ=PROJ.filter(p=>!p.dead);
  fxTick();if(SHAKE>0)SHAKE=Math.max(0,SHAKE-.6);if(MATCH.flash>0)MATCH.flash--;
  for(const f of FT)if(f.comboT>0&&--f.comboT===0)f.combo=0;
  camTick();
  if(MATCH.tleft>0&&!MATCH.ending){MATCH.tleft--;if(MATCH.tleft===0)MATCH.ending=1}}
const pctCol=p=>{const t=Math.min(1,p/160);return t<.5?`rgb(255,255,${Math.round(255-t*2*200)})`:`rgb(255,${Math.round(255-(t-.5)*2*200)},${Math.round(55-(t-.5)*2*40)})`};
function hud(){ctx.setTransform(DPR,0,0,DPR,0,0);
  FT.forEach((f,i)=>{const w=Math.min(118*U,SW*.4),cx=SW*(i?.7:.3),x=cx-w/2,y=SH-38*U;panel(x,y,w,33*U,'rgba(8,8,22,.72)',i?'#7aa0ff':'#ff4a5a');
    ctx.save();ctx.beginPath();ctx.arc(x+16*U,y+16.5*U,12*U,0,TAU);ctx.fillStyle=shade(f.c.body,-.5);ctx.fill();ctx.clip();drawHead(f.c,x+16*U,y+19*U,1.05*U);ctx.restore();
    text(f.c.name,x+32*U,y+4*U,8,i?'#7aa0ff':'#ff4a5a','left',900);
    if(MATCH.train&&i===1)text('DUMMY',x+32*U,y+19*U,7,'#a8a8c8','left',800);
    else if(f.stocks>5)text('● x'+f.stocks,x+32*U,y+19*U,8,f.c.acc,'left',900);else for(let k=0;k<f.stocks;k++){ctx.fillStyle=f.c.acc;ctx.beginPath();ctx.arc(x+36*U+k*8*U,y+24*U,2.8*U,0,TAU);ctx.fill()}
    const sh=f.hl>0&&f.st==='hit'?(rnd()-.5)*4*U:0;
    if(f.st==='ko')text('--',x+w-7*U,y+7*U,17,'#888','right',900);else{text(Math.floor(f.pct)+'%',x+w-7*U+sh,y+6*U+sh,18,pctCol(f.pct),'right',900,'#000')}});
  if(MATCH.tleft>0){const s=Math.ceil(MATCH.tleft/60);text(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),SW/2,8*U,14,s<=10?'#ff5a5a':'#fff','center',900,'#000')}
  const P=FT[0];if(P.combo>=2&&P.comboT>0){const a=Math.min(1,P.comboT/30);ctx.globalAlpha=a;text(P.combo+' HIT COMBO',14*U,10*U,13,'#ffd84a','left',900,'#000');if(MATCH.train)text(Math.round(P.comboD)+'% DAMAGE',14*U,28*U,9,'#fff','left',800,'#000');ctx.globalAlpha=1}
  if(MATCH.count>0){const ready=MATCH.count>30;const k=ready?1:MATCH.count/30;ctx.globalAlpha=k;text(ready?'READY':'GO!',SW/2,SH*.32,ready?30:44,ready?'#fff':'#ffd84a','center',900,'#1a0820');ctx.globalAlpha=1}
  if(MATCH.ending){text(MATCH.tleft===0&&!FT.some(f=>f.stocks<=0)?'TIME!':'GAME!',SW/2,SH*.3,46,'#ffffff','center',900,'#ff2a6a')}
  if(MATCH.flash>0){ctx.fillStyle=`rgba(255,255,255,${MATCH.flash/8*.3})`;ctx.fillRect(0,0,SW,SH)}}
function fightDraw(){drawSky(STAGE.id);worldXf();drawStage();for(const p of PROJ)drawProj(p);
  const order=[...FT].sort((a,b)=>a.cpu===b.cpu?0:a.cpu?-1:1);for(const f of order){drawSpecialFx(f);drawTrail(f)}for(const f of order){drawFighter(f);drawStatus(f)}drawFx();
  ctx.setTransform(DPR,0,0,DPR,0,0);for(const f of FT)drawOffscreen(f);hud()}
/* ---------- the loop ---------- */
const SCREENS={title:[titleTick,titleDraw],controls:[controlsTick,controlsDraw],settings:[settingsTick,settingsDraw],records:[recordsTick,recordsDraw],select:[selectTick,selectDraw],
  stage:[stageTick,stageDraw],fight:[fightStep,()=>fightDraw()],pause:[pauseTick,pauseDraw],moves:[movesTick,movesDraw],results:[resultsTick,resultsDraw]};
function step(){FRAME++;SCREENS[SCR][0]();if(MSG&&--MSG.t<=0)MSG=null}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';SCREENS[SCR][1]();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(MSG)text(MSG.s,SW/2,SH-34*U,11,'#ffd84a','center',900,'#000')}
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){requestAnimationFrame(loop);acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=STEP&&n<4){acc-=STEP;n++;step();clearTaps()}if(n>=4)acc=0;draw()}
/* ---------- saving ---------- */
saveHook=()=>{if(FT.length&&['fight','pause','moves'].includes(SCR)||(SCR==='controls'&&BACKTO)){if(!MATCH.ending&&!MATCH.res)SAVE.match={chars:MATCH.chars,stage:MATCH.stage,train:MATCH.train,lvl:MATCH.lvl,stocks:FT.map(f=>f.stocks),pct:FT.map(f=>Math.round(f.pct)),tleft:MATCH.tleft}}
  SAVE.ctrl=CTRL;SAVE.mute=muted;SAVE.vib=HAP.on};
function applySave(){if(SAVE.ctrl){CTRL=Object.assign({},CTRL_DEF,SAVE.ctrl);store.set('ctrl',CTRL)}if(SAVE.mute!=null&&SAVE.mute!==muted)setMute(SAVE.mute);if(SAVE.vib!=null){HAP.on=SAVE.vib;store.set('vib',HAP.on)}
  if(SAVE.picks){SEL.cur=[SAVE.picks[0]|0,SAVE.picks[1]|0];SEL.stage=SAVE.picks[2]|0}}
applySave();loadAccount(applySave);
setInterval(()=>saveNow(),1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SCR==='fight'&&!MATCH.ending)go('pause');saveNow(true)}});
addEventListener('pagehide',()=>saveNow(true));
window.ZPCart={title:'Strike at Night',input(b,d){rawInput(b,d)},home(){if(SCR==='fight'&&!MATCH.ending)go('pause');saveNow(true);return true}};
requestAnimationFrame(loop);
/* a test hook, only when the address asks for it */
if(/sntest/.test(location.href))window.SNT={get FT(){return FT},get MATCH(){return MATCH},get SCR(){return SCR},get SAVE(){return SAVE},get CTRL(){return CTRL},startMatch,ROSTER,STAGES,
  cpu(i,l){FT[i].cpu=true;FT[i].lvl=l;FT[i].pad=makePad()},run(n){for(let i=0;i<n;i++){step();clearTaps()}},calcKB,draw,CAM,
  scene(){drawSky(STAGE.id);worldXf();drawStage();for(const f of FT){drawSpecialFx(f);drawTrail(f);drawFighter(f)}drawFx()},spark,ringFx};

})();
</script>
