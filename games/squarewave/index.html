<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squarewave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>
:root{color-scheme:dark;--ui:'Pixelify Sans',ui-monospace,Menlo,monospace;--num:'VT323',ui-monospace,Menlo,monospace;--s:2}
*,::before,::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg,#0b0a16);color:var(--ink,#f4f1ff);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
#app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;flex:none;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--s)*7px);line-height:1}
#hud[hidden]{display:none}
#hud>*{position:absolute;white-space:nowrap}
#hud .n{font-family:var(--num);font-size:calc(var(--s)*10px);letter-spacing:.02em}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*4px);padding:calc(var(--s)*5px);text-align:center;background:var(--veil,rgba(8,6,24,.8));font-size:calc(var(--s)*7px);line-height:1.25;overflow:hidden}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:calc(var(--s)*17px);line-height:1;letter-spacing:.04em;font-weight:700}
#ov h2{margin:0;font-size:calc(var(--s)*11px);line-height:1.1;letter-spacing:.06em;font-weight:700}
#ov p{margin:0;max-width:calc(var(--s)*150px);opacity:.86}
#ov .foot{font-size:calc(var(--s)*5.5px);opacity:.7;letter-spacing:.04em}
#ov .big{font-family:var(--num);font-size:calc(var(--s)*20px);line-height:.9}
.menu{display:flex;flex-direction:column;gap:calc(var(--s)*2px);width:min(92%,calc(var(--s)*112px))}
.menu button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;display:flex;justify-content:space-between;align-items:center;gap:calc(var(--s)*4px);
  padding:calc(var(--s)*2.5px) calc(var(--s)*4px);border:calc(var(--s)*1px) solid var(--line,#3a3566);border-radius:calc(var(--s)*2px);background:var(--panel,#1d1a3a);letter-spacing:.06em;text-align:left}
.menu button:focus{outline:none}
.menu button em{font-style:normal;opacity:.9}
.menu button.adj em::before{content:'◀ ';opacity:.5}.menu button.adj em::after{content:' ▶';opacity:.5}
.menu button.hot{background:var(--hot,#ffd166);color:var(--hotink,#1a1230);border-color:#fff}
body{--bg:#0b1020;--panel:#182448;--line:#3a4c86;--hot:#7df9d2;--hotink:#06231c;--veil:rgba(8,12,30,.82)}
#hud{color:#fff;text-shadow:0 calc(var(--s)*1px) 0 rgba(8,10,28,.7)}
#hPct{right:calc(var(--s)*5px);top:calc(var(--s)*2px);font-family:var(--num);font-size:calc(var(--s)*9px)}
#hMode{left:calc(var(--s)*5px);top:calc(var(--s)*3px);font-size:calc(var(--s)*5.5px);letter-spacing:.1em;color:#6aee8a}
#hTry{left:0;right:0;top:20%;text-align:center;font-size:calc(var(--s)*11px);font-weight:700;letter-spacing:.1em;opacity:0}
#hTry.go{animation:try 1.5s ease-out}
@keyframes try{0%{opacity:0;transform:translateX(calc(var(--s)*14px))}14%{opacity:1;transform:none}68%{opacity:1}100%{opacity:0;transform:translateX(calc(var(--s)*-10px))}}
#ov.title{background:rgba(8,12,30,.5)}
#ov.title p{text-shadow:0 calc(var(--s)*1px) 0 #0a0c20;opacity:1}
.logo{display:flex;flex-direction:column;line-height:.92;letter-spacing:.08em;text-shadow:0 calc(var(--s)*2px) 0 #1c5a86,0 calc(var(--s)*3px) 0 #0a0c20}
.logo b:first-child{color:#ffd23f}.logo b:last-child{color:#7df9d2}
.keys{line-height:1.5}.keys b{color:#7df9d2;font-weight:700}
/* the card for one level: its name, how hard, how far you have got, the notes found */
.lcard{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*2.5px);width:min(92%,calc(var(--s)*130px));padding:calc(var(--s)*5px) calc(var(--s)*6px);border-radius:calc(var(--s)*4px);
  border:calc(var(--s)*1.5px) solid var(--c,#7df9d2);background:linear-gradient(180deg,rgba(8,12,30,.9),var(--b,#1c5a86));box-shadow:0 calc(var(--s)*3px) 0 rgba(8,10,28,.6)}
.lcard small{font-size:calc(var(--s)*5.5px);letter-spacing:.1em;opacity:.8}
.lcard b{font-size:calc(var(--s)*13px);line-height:1;letter-spacing:.06em;color:var(--c)}
.lcard em{font-style:normal;font-size:calc(var(--s)*6px);letter-spacing:.14em;padding:calc(var(--s)*.5px) calc(var(--s)*5px);border-radius:calc(var(--s)*5px);background:var(--c);color:#0a0c20;font-weight:700}
.lbar{width:100%;height:calc(var(--s)*5px);border-radius:calc(var(--s)*3px);background:rgba(8,10,28,.7);overflow:hidden;border:calc(var(--s)*1px) solid rgba(255,255,255,.25)}
.lbar i{display:block;height:100%;background:var(--c)}
.lcard span{font-size:calc(var(--s)*6.5px);letter-spacing:.06em}
</style></head><body>
<div id="app"><div id="stage"><canvas id="cv"></canvas>
<div id="hud" hidden><div id="hMode"></div><div id="hPct">0%</div><div id="hTry"></div></div>
<div id="ov" hidden></div></div></div>

<script>
(()=>{
'use strict';
/* ---------- shared kit: console hookup, buttons, sound, saves, menus ---------- */
/* ZigaPlay: inside the console, window.parent.ZIGAPLAY is the console's API (same origin). */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random,ri=n=>Math.floor(rnd()*n),pick=a=>a[ri(a.length)];
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
/* how big one game pixel is on screen: the largest size, in whole device pixels, at which a view of at least minW x minH still fits */
function pickScale(W,H,minW,minH){const dpr=Math.max(1,window.devicePixelRatio||1),k=Math.max(1,Math.floor(Math.min(W/minW,H/minH)*dpr+1e-6));return k/dpr}
/* the console's second screen (below the hinge): rows of numbers and one small canvas; missing when the game runs on its own */
const PANEL=ZP&&ZP.panel&&typeof ZP.panel.rows==='function'?ZP.panel:null;

/* ---------- sound: a few oscillators for effects and a step sequencer for the tune ---------- */
const SND=(()=>{const AC=window.AudioContext||window.webkitAudioContext;let ctx=null,master=null,musicG=null,mode=2,song=null,sStep=0,sNext=0,timer=0,nbuf=null,paused=false;
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const freq=n=>{const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;const s=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12*(+m[3]+1);return 440*Math.pow(2,(s-69)/12)};
  function unlock(){if(!AC)return;try{if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=mode?0.55:0;master.connect(ctx.destination);
      musicG=ctx.createGain();musicG.gain.value=.5;musicG.connect(master);
      nbuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
    if(ctx.state!=='running'&&!paused)ctx.resume().catch(()=>{})}catch(e){}}
  function tone(f,d,o={}){if(!ctx||!mode||ctx.state!=='running')return;const t=Math.max(ctx.currentTime,o.t||0)+(o.at||0),os=ctx.createOscillator(),g=ctx.createGain(),v=o.vol||.1;
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);os.connect(g);g.connect(o.dest||master);os.start(t);os.stop(t+d+.03)}
  function noise(d,o={}){if(!ctx||!mode||ctx.state!=='running')return;const t=Math.max(ctx.currentTime,o.t||0)+(o.at||0),s=ctx.createBufferSource(),g=ctx.createGain(),v=o.vol||.1;s.buffer=nbuf;
    let n=s;if(o.hp||o.lp){const f=ctx.createBiquadFilter();f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.hp||o.lp;s.connect(f);n=f}
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);n.connect(g);g.connect(o.dest||master);s.start(t,o.off||0);s.stop(t+d+.03)}
  /* plays a buffer of samples made in code (a synthesised voice); data may be a function so nothing is built while sound is off */
  function pcm(data,sr,o={}){if(!ctx||ctx.state!=='running')return;const d=typeof data==='function'?data():data;if(!d||!d.length)return;const b=ctx.createBuffer(1,d.length,sr);b.getChannelData(0).set(d);const s=ctx.createBufferSource();s.buffer=b;if(o.rate)s.playbackRate.value=o.rate;const g=ctx.createGain();g.gain.value=o.vol==null?.3:o.vol;s.connect(g);g.connect(o.dest||master);const t0=ctx.currentTime+(o.at||0);s.start(t0);
    /* a handle so a voice can be cut off cleanly (a quick fade, no click) */
    let live=true;s.onended=()=>{live=false};return{get live(){return live},stop(){if(!live)return;live=false;try{const n=ctx.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(0,n+.02);s.stop(n+.03)}catch(e){}}}}
  /* a held bed of filtered noise (rain, wind) that a scene turns up and down; returns null until sound is unlocked */
  let lbuf=null;
  function bed(o={}){if(!ctx||ctx.state!=='running')return null;if(!lbuf){lbuf=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate);const d=lbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=lbuf;s.loop=true;f.type=o.type||'lowpass';f.frequency.value=o.f||800;if(o.q)f.Q.value=o.q;g.gain.value=0;s.connect(f);f.connect(g);g.connect(o.dest||master);s.start(ctx.currentTime,rnd()*2.5);let dead=false;
    return{set(v,fr,k){if(dead)return;const n=ctx.currentTime;g.gain.setTargetAtTime(Math.max(0,v),n,k||.15);if(fr)f.frequency.setTargetAtTime(fr,n,k||.15)},stop(){if(dead)return;dead=true;const n=ctx.currentTime;g.gain.setTargetAtTime(0,n,.25);s.stop(n+1.6)}}}
  /* a channel: 'E5 . G5 - k h' -> one token per sixteenth; '.' rests, '-' holds the note before it; k h s are drums */
  function seq(type,vol,str){const tk=str.trim().split(/\s+/),ev=[];let last=null;tk.forEach((x,i)=>{if(x==='.'){last=null}else if(x==='-'){if(last)last.n++}else{last={f:type==='drum'?x:freq(x),n:1};ev[i]=last}});return{type,vol,ev,len:tk.length}}
  function tick(){if(!ctx||!song||mode<2||ctx.state!=='running')return;const spb=60/song.bpm/4;if(sNext<ctx.currentTime)sNext=ctx.currentTime+.06;
    while(sNext<ctx.currentTime+.3){for(const ch of song.ch){const e=ch.ev[sStep%ch.len];if(!e)continue;
        if(ch.type==='drum'){if(e.f==='k')tone(140,.11,{type:'sine',to:45,vol:ch.vol*1.6,t:sNext,dest:musicG});else if(e.f==='s')noise(.09,{vol:ch.vol,hp:1800,t:sNext,dest:musicG});else noise(.03,{vol:ch.vol*.6,hp:6000,t:sNext,dest:musicG})}
        else tone(e.f,Math.max(.06,e.n*spb*.95),{type:ch.type,vol:ch.vol,t:sNext,dest:musicG})}
      sStep++;sNext+=spb}}
  return{unlock,tone,noise,bed,pcm,seq,
    play(sg){if(song===sg)return;song=sg;sStep=0;sNext=0;if(!timer)timer=setInterval(tick,60)},
    stop(){song=null},
    get mode(){return mode},set mode(v){mode=v;if(master)master.gain.value=v?0.55:0},
    pause(p){paused=p;if(!ctx||ctx.state==='closed')return;try{(p?ctx.suspend():ctx.resume()).catch(()=>{})}catch(e){}},
    get ctx(){return ctx},get out(){return master},
    ui:{tick(){tone(1320,.035,{vol:.05})},ok(){tone(880,.06,{vol:.07});tone(1320,.1,{vol:.07,at:.06})},back(){tone(520,.07,{vol:.06,type:'triangle'});tone(390,.1,{vol:.06,type:'triangle',at:.06})}}}})();
const SOUND_NAMES=['OFF','EFFECTS','ALL'];

/* ---------- saved progress: this phone's storage, plus the player's account through the console ---------- */
function makeSave(id,fresh){const KEY=id+'-save';let SV=fresh(),cloud=false,t=0;
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')SV=Object.assign(fresh(),s)}catch(e){}
  const ZC=ZP&&ZP.cloud&&typeof ZP.cloud.save==='function'?ZP.cloud:null,push=()=>{try{ZC.save(id,JSON.stringify(SV),{})}catch(e){}};
  return{get v(){return SV},
    save(){SV.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}if(cloud){clearTimeout(t);t=setTimeout(push,1500)}},
    async init(onLoad){if(!ZC)return;for(let a=0;a<6;a++){let r=null;try{r=await ZC.load(id)}catch(e){}
        if(r&&r.ok){cloud=true;let cs=null;try{cs=r.json?JSON.parse(r.json):null}catch(e){}
          if(cs&&typeof cs==='object'&&(+cs.savedAt||0)>(+SV.savedAt||0)){const snd=SV.sound;SV=Object.assign(fresh(),cs);SV.sound=snd;try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}if(onLoad)onLoad()}
          else if(SV.savedAt)push();return}
        await sleep(9000)}},
    async flush(){if(!cloud)return;clearTimeout(t);push();try{await ZC.flush(id)}catch(e){}}}}

/* ---------- buttons: the console's own, or the keyboard when the game has focus ---------- */
const held={};let onBtn=()=>{},stickX=0,stickY=0;
function btnSet(b,d){d=!!d;if(!!held[b]===d)return;held[b]=d;if(d)SND.unlock();try{onBtn(b,d)}catch(e){console.error(e)}}
const KEYMAP=(()=>{const src=(ZP&&ZP.keys)||{up:['ArrowUp','w'],down:['ArrowDown','s'],left:['ArrowLeft','a'],right:['ArrowRight','d'],a:['z',' '],b:['x','Escape'],c:['c'],d:['v'],start:['Enter'],select:['Shift']},m={};
  for(const b in src)for(const k of src[b]){if(!k)continue;m[k]=b;if(k.length===1)m[k.toUpperCase()]=b}return m})();
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const b=KEYMAP[e.key];if(!b)return;e.preventDefault();if(!e.repeat)btnSet(b,true)});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)btnSet(b,false)});
addEventListener('blur',()=>{for(const b in held)if(held[b])btnSet(b,false)});
document.addEventListener('contextmenu',e=>e.preventDefault());
function hookConsole(id,title,save,extra){window.ZPCart=Object.assign({title,input(b,d){btnSet(b,d)},stick(x,y){stickX=x;stickY=y},async home(){try{await save.flush()}catch(e){}return true},snapshot:()=>null},extra||{});
  if(ZP){document.documentElement.classList.add('zp');try{if(ZP.takeRestore)ZP.takeRestore(id)}catch(e){}try{if(ZP.cartReady)ZP.cartReady(window.ZPCart)}catch(e){}}}

/* ---------- menus: a list of buttons over the game; the D-pad moves, A picks, B goes back ---------- */
const ov=$('#ov');let M=null;
function menu(o){M={items:o.items||[],i:o.i||0,back:o.back||null};ov.hidden=false;ov.className=o.cls||'';
  ov.innerHTML=(o.html||'')+'<div class="menu"></div>'+(o.foot?`<p class="foot">${o.foot}</p>`:'');const box=$('.menu',ov);
  M.items.forEach((it,n)=>{const b=el('button','',`<span>${it.t}</span>${it.v!=null?'<em></em>':''}`);b.tabIndex=-1;if(it.adj)b.classList.add('adj');
    b.addEventListener('click',()=>{SND.unlock();if(!M)return;M.i=n;menuMark();menuAct(it,1)});box.append(b)});menuMark()}
function menuMark(){if(!M)return;$$('.menu button',ov).forEach((b,n)=>{b.classList.toggle('hot',n===M.i);const it=M.items[n],em=$('em',b);if(em)em.textContent=typeof it.v==='function'?it.v():it.v})}
function menuAct(it,dir){if(it.adj){it.adj(dir);SND.ui.tick();menuMark()}else if(it.fn){SND.ui.ok();it.fn()}}
function menuInput(b){if(!M)return false;const n=M.items.length;if(!n){if(b==='b'&&M.back)M.back();return true}
  if(b==='up'){M.i=(M.i+n-1)%n;SND.ui.tick();menuMark()}else if(b==='down'){M.i=(M.i+1)%n;SND.ui.tick();menuMark()}
  else if(b==='left'||b==='right'){const it=M.items[M.i];if(it.adj){it.adj(b==='left'?-1:1);SND.ui.tick();menuMark()}}
  else if(b==='a'||b==='start')menuAct(M.items[M.i],1);else if(b==='b'){if(M.back){SND.ui.back();M.back()}}return true}
function closeMenu(){M=null;ov.hidden=true;ov.innerHTML=''}

/* =====================================================================================================
   SQUAREWAVE: a small square runs by itself along a line of music. There is one button: press to jump.
   Touch anything sharp and the run starts again from the beginning, so a level is learnt by heart, a beat
   at a time. Gates along the way turn the square into a glider, flip which way is down, or speed it up.

   The run is worked out in fixed steps of 1/120 s by sim(), which knows nothing about drawing or sound:
   the same level and the same presses always give the same run. One beat of the tune is four squares of
   ground, and one jump lasts one beat.
   ===================================================================================================== */
const S=makeSave('squarewave',()=>({v:1,sound:2,best:[0,0,0],notes:[0,0,0],tries:[0,0,0],done:[0,0,0],savedAt:0}));
SND.mode=S.v.sound;
const cv=$('#cv'),g=cv.getContext('2d'),stage=$('#stage'),hud=$('#hud');
const T=16,ROWS=12,FY=ROWS*T,PS=14,H=1/120,BPM=142.5;
const VX=152,GR=1600,JV=336,PADV=440,VMAX=430,FLY_A=900,FLY_V=165,TAU=Math.PI*2;

/* ---------- the three levels: name, colours, and how hard ---------- */
const PAL=[
  {name:'FIRST PULSE',diff:'EASY',bg:['#0f2748','#1c5a86'],wave:'#2f7fb0',gnd:'#0a1a30',gline:'#7df9d2',blk:'#f3efdc',hi:'#ffffff',lo:'#b9b29a',haz:'#ff6b5e',hz2:'#ffd0c8',acc:'#7df9d2',me:'#ffd23f',me2:'#a8780a'},
  {name:'SAW TEETH',diff:'MEDIUM',bg:['#2b1240','#6a2460'],wave:'#9a3f8c',gnd:'#1a0a28',gline:'#ffd166',blk:'#ffd98a',hi:'#fff4d0',lo:'#c79a3e',haz:'#ff4f7b',hz2:'#ffc2d2',acc:'#3ee6b0',me:'#6ad8ff',me2:'#1c6c96'},
  {name:'OVERDRIVE',diff:'HARD',bg:['#140a0c','#5a1420'],wave:'#8a2a30',gnd:'#0c0608',gline:'#ff7a1a',blk:'#e9edf2',hi:'#ffffff',lo:'#9aa3b0',haz:'#ff5a1a',hz2:'#ffd9b0',acc:'#ffd60a',me:'#b0f04a',me2:'#4a7a12'}];
const GATE={u:'#b98cff',d:'#b98cff',f:'#ff9a3c',c:'#6aee8a','>':'#ff5a5a','<':'#5ab8ff'};

/* ---------- the pieces a level is built from ----------
   Each piece is drawn from its top row down to the ground row, and stands on the ground.
   # block   ^ spike   v spike hanging down   x buzzer   p pad (throws the square up)   q pad on a ceiling
   o ring (press again inside it for a jump in mid-air)   * note to collect
   gates, which work all the way up their column:  u down becomes up   d down again   f glider   c square again   > faster   < usual speed */
const SEG={
  s1:['....^...'],
  s2:['...^^...'],
  s3:['..^^^...'],
  ss:['...^...^....'],
  sd:['...^^...^^......'],
  bk:['....##..'],
  st:['........####....','....########....'],
  st3:['............####....','........########....','....############....'],
  pl:['....###^###^###^###.....'],
  pl2:['....###^###^###^###^###^###.....'],
  hi:['......#####.....','......#####.....','..p...#####.....'],
  hi2:['.............^..........','......#####..####.......','......#####..####.......','..p...#####..####.......'],
  rg:['.....o..........','................','...^^^^^^.......'],
  rg2:['.........o..........','.....o..............','....................','...^^^^^^^^^^.......'],
  bz:['....x.......','............'],
  bzs:['......x.........','..^.........^...'],
  bzz:['....x...x...x...','................'],
  nt:['....*...','........','........'],
  nsp:['....*....^......','................','................'],
  nrg:['......*.........','................','....o...........','................','...^^...........'],
  nbz:['..........*.....','......x.........','..^.........^...'],
  gv:['################################','..........v.........vv..........','................................','................................','................................','................................','u.....^^^^^^^^^^^^^^^^^^^^..d...'],
  gv2:['########################################','........v.....vv......v.................','........................................','........................................','..................x.....................','........................................','u....^^^^^^^^^^^^^^^^^^^^^^^^^^^....d...'],

  if(s.notes!==n0){SFX.note();burst(s.x+7,s.y+7,8,['#ffd23f','#fff6c0'],100)}
  if(s.on&&!on0&&s.mode===0)for(let i=0;i<3;i++)parts.push({x:s.x+2+rnd()*10,y:s.gd>0?s.y+PS:s.y,vx:-30-rnd()*40,vy:-s.gd*rnd()*30,l:.2+rnd()*.15,c:p.gline,z:2});
  if(s.mode===0){if(s.on)rot=Math.round(rot/(Math.PI/2))*(Math.PI/2);else rot+=s.gd*Math.PI/.42*H}else rot=Math.atan2(s.vy,VX)*.8;
  trailT+=H;if(trailT>.028){trailT=0;trail.push({x:s.x+7,y:s.y+7,l:.26})}
  /* practice: a checkpoint is dropped every second or so, whenever the square is somewhere calm with nothing sharp just ahead */
  if(prac&&res===0){cpT+=H;if(cpT>1.1&&(s.mode===1?Math.abs(s.vy)<70:s.on)&&calm()){cps.push(Object.assign({},s));cpT=0}}
  if(res===1)die();else if(res===2)win()}
function step(dt){TT+=dt;if(shake>0)shake-=dt;if(flash>0)flash-=dt;
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=420*dt}
  for(let i=trail.length-1;i>=0;i--){trail[i].l-=dt;if(trail[i].l<=0)trail.splice(i,1)}
  if(state==='play'){acc+=dt;while(acc>=H&&state==='play'){acc-=H;stepPlay()}}
  else if(state==='dead'){deadT-=dt;if(deadT<=0){if(prac){if(lifeT<.5&&cps.length)cps.pop()}else tries++;begin(false)}}
  else if(state==='won'){winT-=dt;s.x+=VX*dt*.5;if(rnd()<dt*14)burst(s.x-40+rnd()*120,FY-40-rnd()*110,6,[PAL[li].acc,PAL[li].me,'#ffffff'],110);if(winT<=0)doneMenu()}
  else if(state==='title'||state==='levels'){demoX+=dt*44;if(demoX>(L.W-20)*T)demoX=0}}

/* ---------- words and numbers ---------- */
const noteStr=(mask,n)=>{let t='';for(let i=0;i<n;i++)t+=mask>>i&1?'♪':'·';return t};
let pcv=null,hudT=0;
function hudText(){const q=state==='title'||state==='levels'?0:pct();$('#hPct').textContent=q+'%';
  if(!PANEL)return;PANEL.rows([['LEVEL',(li+1)+' OF '+PAL.length],[prac?'CHECKPOINTS':'ATTEMPT',prac?cps.length:tries],['NOW',q+'%'],['BEST',S.v.best[li]+'%'],['NOTES',noteStr(s.notes|S.v.notes[li],L.notes)]]);
  if(!pcv)pcv=PANEL.canvas(92,24,PAL[li].name);if(!pcv)return;const x=pcv.getContext('2d');x.drawImage(L.mini,0,0);
  x.fillStyle='rgba(255,255,255,.55)';x.fillRect(Math.round(S.v.best[li]/100*90),0,1,24);x.fillStyle=PAL[li].me;x.fillRect(Math.round(q/100*90)-1,0,3,24);x.fillStyle='#1a1230';x.fillRect(Math.round(q/100*90),2,1,20)}

/* ---------- drawing ---------- */
function draw(){const p=PAL[li],demo=state==='title'||state==='levels',sx=shake>0?Math.round((rnd()-.5)*5):0,sy=shake>0?Math.round((rnd()-.5)*4):0,camX=Math.round(demo?demoX:s.x-VW*.24)+sx,oy=FLOOR-FY+sy;
  const bt=(demo?TT:s.t)*BPM/60,pulse=Math.max(0,1-(bt%1)*2.6);
  g.drawImage(bgc,0,0);
  /* far away: a square wave, a dotted sine and a row of level meters, all moving slower than the ground */
  g.fillStyle='rgba(255,255,255,.045)';for(let x=-(((camX*.15)%32)+32)%32;x<VW;x+=32)g.fillRect(Math.round(x),0,1,FLOOR);
  g.fillStyle=p.wave;const amp=15+Math.round(pulse*3),wy=FLOOR-118,ox=-((camX*.3)%128+128)%128;
  g.globalAlpha=.3;for(let x=-(((camX*.12)%192)+192)%192-192,hy=FLOOR-178;x<VW;x+=192){g.fillRect(x,hy+10,50,2);g.fillRect(x+48,hy-10,2,22);g.fillRect(x+48,hy-10,98,2);g.fillRect(x+144,hy-10,2,22);g.fillRect(x+144,hy+10,50,2)}
  g.globalAlpha=.55;for(let x=ox-128;x<VW;x+=128){g.fillRect(x,wy-amp,66,2);g.fillRect(x+64,wy-amp,2,amp*2);g.fillRect(x+64,wy+amp-2,66,2);g.fillRect(x+128,wy-amp,2,amp*2)}
  g.globalAlpha=.6;for(let x=0;x<VW;x+=4)g.fillRect(x,Math.round(FLOOR-62+Math.sin((x+camX*.5)/38)*10),2,2);
  g.globalAlpha=.5;const mo=((camX*.7)%10+10)%10,m0=Math.floor(camX*.7/10);for(let i=-1;i*10<VW+10;i++){const h=((((m0+i)*2654435761)>>>0)%5+1)*4*(.55+.9*pulse);g.fillRect(i*10-mo,FLOOR-Math.round(h),6,Math.round(h))}
  g.globalAlpha=1;
  /* the ground: a bright line, with a long tick on every beat */
  g.fillStyle=p.gnd;g.fillRect(0,FLOOR+sy,VW,VH-FLOOR);g.fillStyle=p.gline;g.fillRect(0,FLOOR+sy,VW,2);
  const cA=Math.floor(camX/T)-1,cB=Math.floor((camX+VW)/T)+1;g.globalAlpha=.5;for(let c=cA;c<=cB;c++){const x=c*T-camX;if(c%4===0)g.fillRect(x,FLOOR+sy+4,2,7);else g.fillRect(x,FLOOR+sy+4,1,3)}
  for(let k=0;k<3;k++){const gy=FLOOR+sy+16+k*(10+k*3);if(gy>VH-2)break;const sp=1.25+k*.5,per=48+k*24,o=-(((camX*sp)%per)+per)%per;g.globalAlpha=.22-k*.05;for(let x=o;x<VW;x+=per)g.fillRect(Math.round(x),gy,per*.45|0,2)}
  g.globalAlpha=1;
  /* gates first, so that blocks and the square pass in front of the beam */
  for(const G of L.gates){const x=Math.round(G.x-camX);if(x<-12||x>VW+12)continue;g.fillStyle=GATE[G.k];const top=oy+3*T;g.globalAlpha=.22;g.fillRect(x-5,top,10,FY-3*T);g.globalAlpha=1;
    for(let y=top+((TT*40)%8|0)-8;y<oy+FY;y+=8)if(y>=top)g.fillRect(x-1,y,2,4);
    const iy=oy+FY-6*T;g.fillStyle='#10142c';g.fillRect(x-7,iy-1,14,13);g.fillStyle=GATE[G.k];g.fillRect(x-7,iy-1,14,1);g.fillRect(x-7,iy+11,14,1);g.fillRect(x-7,iy-1,1,13);g.fillRect(x+6,iy-1,1,13);
    const gl=GLYPH[G.k];for(let r=0;r<5;r++)for(let c=0;c<7;c++)if(gl[r][c]==='#')g.fillRect(x-3+c-(c>3?0:0)-.5|0,iy+3+r,1,1)}
  /* the end of the level */
  {const x=Math.round(L.endX+PS-camX);if(x<VW+8){for(let y=oy+3*T,k=0;y<oy+FY;y+=4,k++){g.fillStyle=k&1?'#ffffff':'#10142c';g.fillRect(x,y,4,4);g.fillStyle=k&1?'#10142c':'#ffffff';g.fillRect(x+4,y,4,4)}}}
  for(let c=Math.max(0,cA);c<=Math.min(L.W-1,cB);c++){const x=c*T-camX;for(let r=0;r<ROWS;r++){if(L.solidM[r*L.W+c])g.drawImage(SP.blk,x,oy+r*T)}
    const list=L.objs[c];if(list)for(const o of list){const y=oy+o.y,k=o.k;
      if(k==='^')g.drawImage(SP.up,x,y);else if(k==='v')g.drawImage(SP.dn,x,y);else if(k==='x')g.drawImage(SP.buz[(TT*10|0)&1],x,y);
      else if(k==='p')g.drawImage(SP.pad,x+1,y+11-(pulse>.6?1:0));else if(k==='q')g.drawImage(SP.padq,x+1,y+(pulse>.6?1:0));
      else if(k==='o'){if(usedRings[o.id]&&!demo){g.globalAlpha=.3;g.drawImage(SP.ring,x-1,y-1);g.globalAlpha=1}else{const z=pulse>.5?20:18;g.drawImage(SP.ring,x+8-z/2,y+8-z/2,z,z)}}
      else if(k==='*'){if(demo||!(s.notes>>o.n&1))g.drawImage(SP.note,x+2,y+2+Math.round(Math.sin(TT*4+o.c)*1.5))}}}
  if(!demo){
    for(const t of trail){g.globalAlpha=t.l*2.4;g.fillStyle=p.me;const z=Math.max(2,Math.round(t.l*22));g.fillRect(Math.round(t.x-camX-z/2),Math.round(oy+t.y-z/2),z,z)}g.globalAlpha=1;
    if(state!=='dead'){const X=Math.round(s.x-camX)+7,Y=Math.round(oy+s.y)+7;g.save();g.translate(X,Y);
      if(s.mode===1){g.rotate(rot);if(s.gd<0)g.scale(1,-1);g.drawImage(SP.kite,-14,-3);g.drawImage(SP.me,-6,-9,11,11)}else{g.rotate(rot);g.drawImage(SP.me,-7,-7)}g.restore()}
    /* checkpoints in practice */
    if(prac)for(const c of cps){const x=Math.round(c.x-camX)+7,y=Math.round(oy+c.y)+7;if(x<-8||x>VW+8)continue;g.fillStyle='#6aee8a';g.fillRect(x-1,y-4,2,8);g.fillRect(x-3,y-2,6,4);g.fillRect(x-4,y-1,8,2)}}
  for(const q of parts){g.fillStyle=q.c;g.globalAlpha=Math.min(1,q.l*3);g.fillRect(Math.round(q.x-camX),Math.round(oy+q.y),q.z,q.z)}g.globalAlpha=1;
  if(flash>0){g.fillStyle='rgba(255,255,255,'+(flash*3).toFixed(2)+')';g.fillRect(0,0,VW,VH)}
  if(!demo&&state!=='art'){const bw=Math.round(VW*.56),bx=Math.round((VW-bw)/2),q=clamp((s.x-L.startX)/(L.endX-L.startX),0,1);g.fillStyle='rgba(8,10,28,.55)';g.fillRect(bx-1,4,bw+2,6);g.fillStyle=p.acc;g.fillRect(bx,5,Math.round(bw*q),4);
    g.fillStyle='#ffffff';g.fillRect(bx+Math.round(bw*S.v.best[li]/100)-1,4,1,6)}}

/* ---------- menus ---------- */
const soundItem=()=>({t:'SOUND',v:()=>SOUND_NAMES[S.v.sound],adj:d=>{S.v.sound=(S.v.sound+d+3)%3;SND.mode=S.v.sound;S.save()}});
function title(){state='title';SND.stop();hud.hidden=true;if(PANEL){PANEL.clear();pcv=null}setLevel(pickL);parts=[];
  menu({cls:'title',html:'<h1 class="logo"><b>SQUARE</b><b>WAVE</b></h1><p>Your square runs by itself. Press to jump, in time with the tune.</p>',
    items:[{t:'PLAY',fn:levels},soundItem(),{t:'HOW TO PLAY',fn:how}],foot:'A  ·  ▲  ·  OR TAP THE SCREEN TO JUMP'})}
function card(){const p=PAL[pickL],b=S.v.best[pickL],Lp=level(pickL),e=$('#lcard',ov);if(!e)return;e.style.setProperty('--c',p.acc);e.style.setProperty('--b',p.bg[1]);
  e.innerHTML=`<small>◀ &nbsp;LEVEL ${pickL+1} / ${PAL.length}&nbsp; ▶</small><b>${p.name}</b><em>${p.diff}</em><div class="lbar"><i style="width:${b}%"></i></div><span>${S.v.done[pickL]?'COMPLETE':'BEST '+b+'%'} &nbsp;·&nbsp; ${noteStr(S.v.notes[pickL],Lp.notes)}</span>`}
function levels(){state='levels';hud.hidden=true;demoX=0;setLevel(pickL);
  menu({cls:'title',html:'<div class="lcard" id="lcard"></div>',items:[{t:'START',fn:()=>start(pickL,pickP)},{t:'MODE',v:()=>pickP?'PRACTICE':'NORMAL',adj:()=>{pickP=!pickP}},{t:'BACK',fn:title}],back:title,
    foot:'PRACTICE DROPS CHECKPOINTS AS YOU GO'});card()}
function pickLevel(d){pickL=(pickL+d+PAL.length)%PAL.length;demoX=0;setLevel(pickL);card();SND.ui.tick()}
function how(){menu({html:'<h2>HOW TO PLAY</h2><p class="keys">The square never stops. <b>A</b>, <b>▲</b> or a tap on the screen makes it jump; hold on to keep jumping.<br><b>Rings</b>: press again inside one to jump in mid-air.<br><b>Pads</b> throw you up by themselves.<br><b>Gates</b> change the rules: a glider (hold to climb, let go to sink), down becomes up, or more speed.</p><p>One touch of anything sharp and the run starts again. <b>START</b> pauses.</p>',
  items:[{t:'BACK',fn:title}],back:title})}
function pause(){if(state!=='play')return;state='pause';SND.pause(true);
  menu({html:'<h2>PAUSED</h2><p>'+PAL[li].name+' · '+pct()+'%</p>',items:[{t:'RESUME',fn:resume},{t:'START AGAIN',fn:()=>{SND.pause(false);cps=[];tries++;begin(true)&&0;closeMenu()}},{t:prac?'NORMAL MODE':'PRACTICE MODE',fn:()=>{SND.pause(false);start(li,!prac)}},soundItem(),{t:'LEVELS',fn:()=>{SND.pause(false);SND.stop();levels()}}],back:resume})}
function resume(){closeMenu();state='play';acc=0;SND.pause(false)}
function doneMenu(){state='done';const all=S.v.done.every(v=>v);
  menu({html:`<h2>${prac?'PRACTICE RUN DONE':'LEVEL COMPLETE!'}</h2><div class="big">${PAL[li].name}</div><p>${prac?'Now try it in one go.':'ATTEMPT '+tries+' &nbsp;·&nbsp; '+s.jumps+' JUMPS'} &nbsp;·&nbsp; NOTES ${noteStr(s.notes,L.notes)}</p>${!prac&&all?'<p>All three levels cleared!</p>':''}`,
    items:[...(prac?[{t:'PLAY IT FOR REAL',fn:()=>start(li,false)}]:li<PAL.length-1?[{t:'NEXT LEVEL',fn:()=>{pickL=li+1;start(li+1,false)}}]:[]),{t:'AGAIN',fn:()=>start(li,prac)},{t:'LEVELS',fn:()=>{pickL=li;levels()}}],back:()=>{pickL=li;levels()}})}

/* ---------- buttons, and a finger on the screen ---------- */
onBtn=(b,d)=>{if(M){if(d){if(state==='levels'&&(b==='left'||b==='right')&&!M.items[M.i].adj){pickLevel(b==='left'?-1:1);return}menuInput(b)}return}
  if(!d)return;
  if(state==='play'){if(b==='start')pause();else if(b==='a'||b==='up'||b==='c'||b==='d')latch=true;else if(prac&&b==='select'&&cps.length){cps.pop();SND.ui.back();hudText()}}};
stage.addEventListener('pointerdown',e=>{if(M||state!=='play')return;touch=true;latch=true;SND.unlock();e.preventDefault()});
for(const ev of['pointerup','pointercancel','pointerleave'])stage.addEventListener(ev,()=>{touch=false});

let last=performance.now();
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;step(dt);draw();hudT-=dt;if(hudT<=0&&(state==='play')){hudT=.1;hudText()}requestAnimationFrame(frame)}
addEventListener('resize',()=>{resize();draw()});
addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
hookConsole('squarewave','Squarewave',S);
resize();title();requestAnimationFrame(frame);S.init(()=>{SND.mode=S.v.sound;if(state==='title')title();else if(state==='levels')card()});
window.__sq={PAL,SEG,LEVELS,level,fresh,sim,sprites,start,step,draw,title,levels,btnSet,get state(){return state},get s(){return s},get L(){return L},get tries(){return tries},get cps(){return cps},set HPAD(v){HPAD=v},H,T,FY,PS,
  setS(o){Object.assign(s,o)},S,art(i,x){setLevel(i);state='art';hud.hidden=true;s=fresh(L);Object.assign(s,x||{});closeMenu()}};

})();
</script>
</body></html>
