<title>Party Rex</title>
<style>
/* Party Rex: one canvas, 320x180 pixels, scaled up with crisp edges. Outside the ZigaPlay, a DASH button sits under it on touch screens. */
:root{color-scheme:dark;--bg:#2a1838;--pad:#3a2450;--edge:#140a1e}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 3px var(--edge),0 10px 30px rgba(0,0,0,.45);border-radius:4px}
html.zp #cv{box-shadow:none;border-radius:0}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-bottom,0px));gap:12px;touch-action:none}
html.touch:not(.zp) #pad{display:flex}
.pb{width:74px;height:74px;border-radius:50%;border:3px solid var(--edge);background:var(--pad);color:#fff3c4;font:700 22px/1 system-ui,sans-serif;box-shadow:0 4px 0 var(--edge);touch-action:none;display:grid;place-items:center;padding:0}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.pb small{display:block;font-size:11px;opacity:.8;margin-top:2px}
.grp{display:flex;gap:12px;align-items:center}
#bD{width:140px;border-radius:37px;background:#ffd84a;color:#2a1838}
#bP{width:44px;height:44px;font-size:14px;position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:12px;display:none}
html.touch:not(.zp) #bP{display:grid}
</style>

<button class="pb" id="bP" aria-label="Pause">II</button>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');

/* ================= a pixel font (5x7), so the words stay crisp everywhere ================= */

 E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',
 I:'01110 00100 00100 00100 00100 00100 01110',J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',

 ':':'00000 01100 01100 00000 01100 01100 00000','-':'00000 00000 00000 11111 00000 00000 00000','+':'00000 00100 00100 11111 00100 00100 00000','*':'00000 10001 01010 00100 01010 10001 00000',
 "'":'00100 00100 01000 00000 00000 00000 00000','/':'00001 00010 00010 00100 01000 01000 10000','(':'00010 00100 01000 01000 01000 00100 00010',')':'01000 00100 00010 00010 00010 00100 01000',
 '<':'00010 00100 01000 10000 01000 00100 00010','>':'01000 00100 00010 00001 00010 00100 01000','·':'00000 00000 00000 00100 00000 00000 00000','#':'01010 11111 01010 01010 11111 01010 00000',
 '♥':'00000 01010 11111 11111 01110 00100 00000','▲':'00000 00100 01110 11111 00000 00000 00000','▼':'00000 00000 11111 01110 00100 00000 00000','◀':'00010 00110 01110 11110 01110 00110 00010','▶':'01000 01100 01110 01111 01110 01100 01000'};
const FONT={};for(const k in FD)FONT[k]=FD[k].replace(/ /g,'');
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function txt(s,x,y,col,sc=1,al='l',sh=null){s=String(s).toUpperCase();let X=al==='c'?Math.round(x-tw(s,sc)/2):al==='r'?x-tw(s,sc):x;
  if(sh){txt(s,X+sc,y+sc,sh,sc,'l')}ctx.fillStyle=col;
  for(const ch of s){const g=FONT[ch];if(g)for(let i=0;i<35;i++)if(g[i]==='1')ctx.fillRect(X+(i%5)*sc,y+Math.floor(i/5)*sc,sc,sc);X+=6*sc}}

/* ================= pixel sprites, drawn in code ================= */
class Buf{constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
  get(x,y){return x<0||y<0||x>=this.w||y>=this.h?null:this.d[y*this.w+x]}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1)this.px(x,y,c)}}
  poly(pts,c){let y0=1e9,y1=-1e9,x0=1e9,x1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}if(ins)this.px(x,y,c)}}
  swap(a,b,y0=0,y1=1e9){for(let y=Math.max(0,y0);y<=Math.min(this.h-1,y1);y++)for(let x=0;x<this.w;x++)if(this.d[y*this.w+x]===a)this.d[y*this.w+x]=b}
  outline(c=K){const o=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(o[y*this.w+x])continue;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<this.w&&Y<this.h&&o[Y*this.w+X]&&o[Y*this.w+X]!==c){this.d[y*this.w+x]=c;break}}}return this}
  canvas(flip=false){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const g=c.getContext('2d'),im=g.createImageData(this.w,this.h);

/* Rex: a little green T-rex in a party hat. 26x27, feet on the bottom row, facing right */
function dinoBuf(pose,ph){const b=new Buf(26,27),G='#56c25e',D='#2f8f45',L='#d4f59a',Y='#ffd84a',PK='#ff5fa8',R='#c8403a';
  const up=pose==='jump'||pose==='bounce'||pose==='dance'||pose==='dive',happy=pose!=='idle'&&pose!=='run'&&pose!=='sad'&&pose!=='climb';
  b.poly(up?[[1,14],[8,16],[9,21],[3,18]]:[[0,19],[8,16],[9,22],[2,21]],G);
  /* legs */
  if(pose==='jump'||pose==='bounce'||pose==='dive'){b.rect(8,22,3,2,D);b.rect(12,22,3,2,G);b.rect(8,24,4,1,D);b.rect(12,24,4,1,G)}
  else if(pose==='run'||pose==='dance'){if(ph%2){b.rect(5,23,3,2,D);b.rect(4,25,4,1,D);b.rect(13,23,3,3,G);b.rect(14,26,3,1,G)}else{b.rect(9,23,3,3,D);b.rect(9,26,4,1,D);b.rect(11,23,3,2,G);b.rect(11,25,4,1,G)}}
  else if(pose==='climb'){b.rect(8,21,3,3,D);b.rect(13,23,3,3,G);b.rect(13,26,3,1,G)}
  else{b.rect(7,23,3,3,D);b.rect(7,26,4,1,D);b.rect(12,23,3,3,G);b.rect(12,26,4,1,G)}
  b.ell(11,19,6.5,5,G);b.ell(13,21,3.6,2.6,L);b.px(7,15,D);b.px(9,14,D);b.px(11,14,D);
  b.ell(16.5,12,5.5,4.6,G);b.rect(18,11,6,4,G);b.px(23,11,D);
  if(happy||pose==='bounce'){b.rect(19,14,5,2,R);b.px(20,14,WH);b.px(22,14,WH)}else if(pose==='sad'){b.rect(19,15,4,1,D);b.px(23,14,D)}else{b.rect(19,14,5,1,D);b.px(20,14,WH)}
  if(pose==='sad'){b.rect(17,10,3,1,K)}else{b.rect(17,9,3,3,WH);b.rect(18,10,2,2,K);b.px(18,10,WH)}
  b.px(16,13,'#ff9aa8');b.px(17,13,'#ff9aa8');
  if(pose==='bounce'||pose==='dance'||pose==='climb'){b.px(16,18,G);b.px(17,17,G);b.px(18,16,G)}else{b.rect(15,20,3,1,G);b.px(18,21,G)}
  b.poly([[13,9],[20,8],[16.5,1.5]],PK);b.swap(PK,Y,4,4);b.swap(PK,Y,7,7);b.ell(16.5,1.6,1.6,1.4,Y);
  return b.outline()}
/* the goblin kids: party hats, face paint, pointy ears and a big grin. 18x20, feet on the bottom row, facing right */
const KTYPES={kid:{face:'#7ad86a',sp:1,climb:1,hp:1},sprint:{face:'#ffa04a',sp:1.55,climb:1.35,hp:1},hop:{face:'#6ab8ff',sp:.95,climb:1,hp:1,hop:1},big:{face:'#c08aff',sp:.72,climb:.75,hp:2,big:1}};
const SHIRTS=['#ff6b6b','#4aa6e4','#ffd84a','#66c659','#b48aff','#ff9a3a','#ff7ac0','#3fc1c9'],HATS=['#ffd84a','#ff5fa8','#6ad0ff','#a8ff6a','#ff8a3a'];
function kidBuf(type,shirt,hat,pose,f){const b=new Buf(18,20),F=KTYPES[type].face,S=shirt,P='#3b4a78',SH='#2a2030';
  const crouch=pose==='dizzy'?3:0;
  b.poly([[5,6+crouch],[11,6+crouch],[8,.5+crouch]],hat);b.swap(hat,lt(hat),3+crouch,3+crouch);b.ell(8,1+crouch,1.3,1.1,WH);
  b.poly([[4.6,8+crouch],[.8,5.5+crouch],[4.6,10.5+crouch]],F);b.poly([[11.4,8+crouch],[15.2,5.5+crouch],[11.4,10.5+crouch]],F);
  b.ell(8,9+crouch,4.2,3.8,F);
  const ey=8+crouch;
  if(pose==='dizzy'){for(const ex of[6,9]){b.px(ex,ey,K);b.px(ex+1,ey+1,K);b.px(ex+1,ey,K);b.px(ex,ey+1,K)}b.rect(7,ey+3,2,1,K)}
  else if(pose==='flee'){b.rect(6,ey,2,1,K);b.rect(9,ey,2,1,K);b.rect(6,ey+2,5,2,K);b.px(8,ey+2,'#ff6b6b');b.px(12,ey+1,'#8fd8ff');b.px(12,ey+2,'#8fd8ff')}
  else{b.rect(6,ey,2,1,WH);b.px(7,ey,K);b.rect(9,ey,2,1,WH);b.px(10,ey,K);b.px(6,ey-1,K);b.px(10,ey-1,K);b.rect(6,ey+3,5,1,K);b.px(7,ey+3,WH);b.px(9,ey+3,WH)}
  if(pose==='dizzy'){b.rect(5,14,6,3,S);b.rect(10,17,6,2,P);b.rect(15,17,1,2,SH);b.rect(3,16,2,2,F)}
  else if(pose==='climb'){b.rect(5,13,6,4,S);b.rect(10,9+f,2,5,S);b.rect(10,8+f,2,1,F);b.rect(5,17,2,2,P);b.rect(9,16-f,2,2,P);b.px(5,19,SH);b.px(10,18-f,SH)}
  else if(pose==='flee'||pose==='cheer'||pose==='hop'){b.rect(5,13,6,4,S);b.rect(3,9+(f%2),2,4,S);b.rect(11,9+((f+1)%2),2,4,S);b.rect(3,8+(f%2),2,1,F);b.rect(11,8+((f+1)%2),2,1,F);
    if(pose==='hop'){b.rect(5,17,2,2,P);b.rect(9,17,2,2,P)}else if(f%2){b.rect(4,17,2,2,P);b.rect(10,17,2,3,P);b.px(4,19,SH);b.px(10,19,SH)}else{b.rect(5,17,2,3,P);b.rect(9,17,2,3,P);b.px(5,19,SH);b.px(9,19,SH)}}
  else{/* run and grab: hunched, arms reaching out */b.rect(5,13,6,4,S);
    if(f%2){b.rect(10,14,3,2,S);b.rect(13,14,2,2,F);b.rect(4,17,2,2,P);b.px(3,19,SH);b.px(4,19,SH);b.rect(10,17,2,3,P);b.px(11,19,SH)}
    else{b.rect(10,13,4,2,S);b.rect(14,13,2,2,F);b.rect(5,17,2,3,P);b.px(5,19,SH);b.rect(9,17,2,3,P);b.px(9,19,SH)}}
  return b.outline()}
const SPR=new Map();
function spr(key,make){let s=SPR.get(key);if(!s){const b=make();s=[b.canvas(false),b.canvas(true)];SPR.set(key,s)}return s}
const dinoSpr=(pose,ph,face)=>spr('d'+pose+ph,()=>dinoBuf(pose,ph))[face<0?1:0];
const kidSpr=(k,pose,f)=>spr('k'+k.type+k.shirt+k.hat+pose+f,()=>kidBuf(k.type,k.shirt,k.hat,pose,f))[k.face<0?1:0];

/* ================= sound: little synths, no files ================= */
let AC=null,master=null,musicBus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.3;musicBus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.12,type='square',v=.2,t0=0,dest=null}){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.15,v=.2,f=1000,q=1,t0=0}){const a=AC;if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  jump(){tone({f:300,f2:640,d:.15,v:.16})},
  dive(){noise({d:.22,f:1600,q:.7,v:.2});tone({f:700,f2:160,d:.2,type:'sawtooth',v:.07})},
  bonk(n=1){tone({f:200,f2:90,d:.09,v:.26});tone({f:520+n*60,f2:1100+n*120,d:.2,type:'triangle',v:.22,t0:.05});noise({d:.08,f:3000,v:.12})},
  hit(){tone({f:160,f2:110,d:.12,v:.24});noise({d:.1,f:600,v:.2})},
  boing(){tone({f:260,f2:520,d:.12,type:'triangle',v:.18})},
  land(){noise({d:.09,f:260,q:.8,v:.3})},
  climb(){tone({f:420,d:.04,v:.07});tone({f:520,d:.04,v:.07,t0:.08})},
  nope(){tone({f:150,f2:120,d:.09,v:.14})},
  giggle(){for(let i=0;i<3;i++)tone({f:950+i*110+rnd()*90,f2:760,d:.06,v:.06,t0:i*.085})},
  warn(){tone({f:880,d:.06,v:.08});tone({f:1180,d:.07,v:.08,t0:.1})},
  pop(){noise({d:.07,f:2600,q:1.5,v:.3});tone({f:900,f2:1400,d:.08,type:'triangle',v:.1})},
  clear(){[523,659,784,1047,784,1047].forEach((f,i)=>tone({f,d:.16,type:'square',v:.13,t0:i*.1}));tone({f:262,d:.6,type:'triangle',v:.18,t0:.3})},
  over(){[392,370,349,311].forEach((f,i)=>tone({f,f2:f*.97,d:i===3?.7:.22,type:'sawtooth',v:.12,t0:i*.26}))},
  start(){[392,523,659,784].forEach((f,i)=>tone({f,d:.1,v:.12,t0:i*.07}))},
};
/* a bouncy party tune: melody, bass and a tiny drum, looped */
const MEL=[76,79,84,79,81,77,74,77,79,76,72,76,74,67,71,74,76,79,84,88,86,83,79,83,84,81,77,81,79,0,72,0],BASS=[48,48,53,53,48,48,43,43,48,48,53,53,55,55,48,0];

    let hit=null;if(P.st!=='dive')for(const t of G.tables)if(old<=t.y&&P.y>=t.y&&P.x>=t.x-2&&P.x<=t.x+t.w+2&&(!hit||t.y<hit.y))hit=t;

/* hit boxes: a dash reaches a little wider than Rex, so a close call counts */
const rexBox=()=>P.st==='dive'?{l:P.x-9,r:P.x+9,t:P.y-18,b:P.y+2}:{l:P.x-6,r:P.x+6,t:P.y-16,b:P.y-2};
function kidBox(k){const w=k.big?7:5,h=k.big?19:13;return{l:k.x-w,r:k.x+w,t:k.y-h,b:k.y}}
const kidLive=k=>k.st==='run'||k.st==='hop'||k.st==='fall';
function hitKids(){const pb=rexBox();
  for(const k of G.kids){if(!kidLive(k))continue;const kb=kidBox(k);if(pb.r<kb.l||pb.l>kb.r||pb.b<kb.t||pb.t>kb.b)continue;
    if(P.st==='dive'){bonk(k);return true}
    if(P.safe>0)continue;
    if(P.vy>.5&&P.y-kb.t<8){/* landed on a head without dashing: a little boing, but no speed */
      P.y=kb.t;P.vy=-4.6;P.safe=.15;k.squish=.2;G.boings++;SFX.boing();if(G.boings<=3||G.boings%6===0)popup(REXX,P.y-36,'DASH TO BONK!','#ffd84a',1);return true}
    bump(k);return true}
  return false}
function bonk(k){P.combo++;const gain=(k.big?14:Math.min(12,6+P.combo))*gainMul();P.spd=Math.min(MAXSPD,P.spd+gain);
  const pts=100*Math.min(P.combo,10)*(k.big?2:1);G.pts+=pts;G.bonks++;G.bestCombo=Math.max(G.bestCombo,P.combo);
  SFX.bonk(P.combo);popup(k.x,k.y-(k.big?36:28),P.combo>1?`+${pts} *${P.combo}`:`+${pts}`,P.combo>1?'#ffd84a':'#ffffff');confetti(k.x,k.y-10,k.big?26:16);
  k.st='bonked';k.vx=-.6-rnd()*1.4;k.vy=-3.2;k.table=null;
  P.st='air';P.y=Math.min(P.y,kidBox(k).t);P.vy=k.big?-8.2:-7.2;P.safe=.3;P.hurt=false;G.shake=3}
/* running into a kid any other way: ouch */
function bump(k){P.combo=0;const before=P.spd;loseSpeed(LOSS.bump);P.vy=Math.min(P.vy,-4.2);P.st='air';P.safe=.7;P.hurt=true;G.shake=4;G.bumps++;SFX.hit();k.flash=.4;
  if(P.spd<before)popup(REXX,P.y-34,'OUCH!','#ff9a9a',1);if(P.spd<=0)outOfSpeed()}
function outOfSpeed(){P.st='tired';P.spd=0;G.state='caught';G.t=2.4;G.banner=null;SFX.over();music(false);G.shake=6;
  let i=0;const slot=()=>(i%2?1:-1)*(16+10*(i>>1));
  for(const k of G.kids)if(kidLive(k)&&k.x>cam-10&&k.x<cam+W+10){k.st='cheer';k.off=slot();i++}
  for(;i<3;i++){/* a few more kids run in to celebrate */const k=spawnKid(planKid());k.st='cheer';k.off=slot();if(k.off<0)k.x=cam-14}}
/* ---------- the goblin kids: they run at Rex from the right ---------- */
function planKid(){const type=pick(G.D.types),T=KTYPES[type];return{type,sp:G.D.sp*T.sp*(.9+rnd()*.2)}}
function spawnKid(pl){const x=cam+W+14;let tab=null;if(rnd()<G.D.table)for(const t of G.tables)if(x>=t.x+6&&x<=t.x+t.w-4){tab=t;break}
  const T=KTYPES[pl.type],k={type:pl.type,shirt:pick(SHIRTS),hat:pick(HATS),x,y:tab?tab.y:FLOOR,vx:0,vy:0,face:-1,st:'run',table:tab,sp:pl.sp,
    big:!!T.big,hopper:!!T.hop,hopAt:36+rnd()*44,hopped:false,anim:rnd()*9,flash:0,squish:0,spin:0};
  G.kids.push(k);if(rnd()<.3)SFX.giggle();return k}
/* kids are sent so they reach Rex a fair beat apart: never further apart than one good bounce can carry him */
function schedule(){if(!G.plan)G.plan=planKid();const T=(W+14-REXX)/(rexVx()+G.plan.sp);
  if(G.clock>=G.nextArr-T){const arrive=Math.max(G.nextArr,G.clock+T),D=G.D;spawnKid(G.plan);G.plan=null;G.nextArr=arrive+(rnd()<D.pair?8+rnd()*4:D.lo+rnd()*(D.hi-D.lo))}}
function kidFall(k){k.vy=Math.min(k.vy+GRAV,6);const old=k.y;k.y+=k.vy;
  if(k.vy>0){let hit=null;for(const t of G.tables)if(old<=t.y&&k.y>=t.y&&k.x>=t.x&&k.x<=t.x+t.w&&(!hit||t.y<hit.y))hit=t;
    if(hit){k.y=hit.y;k.vy=0;k.table=hit;return true}if(k.y>=FLOOR){k.y=FLOOR;k.vy=0;k.table=null;return true}}return false}
function updKid(k){k.anim+=1/60;if(k.flash>0)k.flash-=1/60;if(k.squish>0)k.squish-=1/60;
  switch(k.st){
  case'run':k.x-=k.sp;k.anim+=k.sp/14;
    if(k.table&&k.x<k.table.x+1){k.table=null;k.st='fall';k.vy=0}
    else if(k.hopper&&!k.hopped&&k.x-P.x<k.hopAt&&k.x>P.x+8){k.hopped=true;k.st='hop';k.vy=-4.4;k.table=null}
    break;
  case'fall':case'hop':k.x-=k.sp;if(kidFall(k))k.st='run';break;
  case'bonked':k.x+=k.vx;k.y+=k.vy;k.vy+=.28;k.spin+=.35;if(k.y>H+40)k.gone=1;break;
  case'cheer':{const tx=P.x+k.off;if(Math.abs(tx-k.x)>1.2){k.face=Math.sign(tx-k.x);k.x+=k.face*1.4}else k.face=P.x>k.x?1:-1;if(k.y<FLOOR){k.vy=Math.min(k.vy+GRAV,6);k.y=Math.min(FLOOR,k.y+k.vy)}k.table=null;break}}
  if(k.x<cam-40)k.gone=1}
/* ---------- bonus balloons, particles and pop-ups ---------- */
function dust(x,y,n){for(let i=0;i<n;i++)G.parts.push({x:x+(rnd()-.5)*10,y:y-1,vx:(rnd()-.5)*1.4,vy:-rnd()*.8,life:.35+rnd()*.2,c:'#ffffff',s:2,g:.02})}
function confetti(x,y,n){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,v=1+rnd()*2.2;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,life:.8+rnd()*.6,c:pick(BUNT),s:rnd()<.3?2:1,g:.06,spin:1})}}
/* a pop-up stays where it happened, or (scr) stays on the screen next to Rex */
function popup(x,y,s,c,scr=0){G.pops.push({x,y,s,c,life:1,scr})}
function updFx(){for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;if(p.spin)p.vx*=.98;p.life-=1/60}G.parts=G.parts.filter(p=>p.life>0&&p.x>cam-40);
  for(const p of G.pops){p.y-=.4;p.life-=1/60}G.pops=G.pops.filter(p=>p.life>0);
  if(G.state==='play'){G.balT-=1/60;if(G.balT<=0){G.balT=5+rnd()*5;const n=1+Math.floor(rnd()*3),x=cam+W+12,y=40+rnd()*40;for(let i=0;i<n;i++)G.balloons.push({x:x+i*14,y:y+(i%2)*9,c:pick(BUNT),ph:rnd()*6})}}
  const pb=rexBox();for(const b of G.balloons){b.ph+=.04;b.y+=Math.sin(b.ph)*.15;
    if(!b.pop&&G.state==='play'&&b.x+5>pb.l&&b.x-5<pb.r&&b.y+6>pb.t&&b.y-7<pb.b){b.pop=1;G.pts+=50;SFX.pop();confetti(b.x,b.y,12);popup(b.x,b.y-14,'+50','#ffffff')}}
  G.balloons=G.balloons.filter(b=>!b.pop&&b.x>cam-20);if(G.shake>0)G.shake-=.4}
/* ---------- the flow of a run ---------- */
function checkLevel(){const L=Math.floor(P.x/RL)+1;if(L<=G.level)return;G.level=L;G.D=diff(L);const bonus=250*(L-1);G.pts+=bonus;
  G.banner={a:`LEVEL ${L} · ${themeOf(L-1).name}`,b:`BONUS +${bonus}`,t:2.6};SFX.clear();confetti(P.x+60,46,26)}
function update(){G.titleT+=1/60;mus.spb=.23-P.spd*.0007;
  if(G.state==='title'){updTitle();updFx();return}
  if(G.state==='pause')return;
  if(G.state==='play'){G.clock++;if(G.grace>0)G.grace--;
    for(const k of G.kids)updKid(k);

    G.kids=G.kids.filter(k=>!k.gone);updFx();G.score=G.pts+Math.max(0,Math.floor((P.x-G.x0)/16));return}
  if(G.state==='caught'){G.t-=1/60;for(const k of G.kids)updKid(k);updRex();cam=P.x-REXX;G.kids=G.kids.filter(k=>!k.gone);updFx();

  if(G.state==='over'){if(G.overT>0)G.overT-=1/60;for(const k of G.kids)if(k.st==='cheer')k.anim+=1/60;updFx()}}
/* ---------- the title screen: the house drifts by while Rex bounces ---------- */

  if(rnd()<.03)confetti(cam+20+rnd()*280,16+rnd()*30,5)}
