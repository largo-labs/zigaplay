<title>Neon Rex</title>
<style>
/* Neon Rex: one tall canvas, 180 pixels wide and 220 to 340 tall, scaled up with crisp edges. Outside the ZigaPlay, a DASH button sits under it on touch screens. */
:root{color-scheme:dark;--bg:#0c0e1a;--pad:#1e2238;--edge:#05060c}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 3px var(--edge),0 10px 30px rgba(0,0,0,.45);border-radius:4px}
html.zp #cv{box-shadow:none;border-radius:0}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-bottom,0px));gap:12px;touch-action:none}
html.touch:not(.zp) #pad{display:flex}
.pb{width:74px;height:74px;border-radius:50%;border:3px solid var(--edge);background:var(--pad);color:#fff3c4;font:700 22px/1 system-ui,sans-serif;box-shadow:0 4px 0 var(--edge);touch-action:none;display:grid;place-items:center;padding:0}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.pb small{display:block;font-size:11px;opacity:.8;margin-top:2px}
.grp{display:flex;gap:12px;align-items:center}
#bD{width:140px;border-radius:37px;background:#ffd84a;color:#2a1838}
#bP{width:54px;height:54px;font-size:16px}
</style>
<div id="stage"><canvas id="cv" width="180" height="300" aria-label="Neon Rex"></canvas></div>
<div id="pad"><button class="pb" id="bP" aria-label="Pause">II</button><button class="pb" id="bD" aria-label="Dash down">DASH</button></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */

 E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',
 I:'01110 00100 00100 00100 00100 00100 01110',J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',

 ':':'00000 01100 01100 00000 01100 01100 00000','-':'00000 00000 00000 11111 00000 00000 00000','+':'00000 00100 00100 11111 00100 00100 00000','*':'00000 10001 01010 00100 01010 10001 00000',
 "'":'00100 00100 01000 00000 00000 00000 00000','/':'00001 00010 00010 00100 01000 01000 10000','(':'00010 00100 01000 01000 01000 00100 00010',')':'01000 00100 00010 00010 00010 00100 01000',
 '<':'00010 00100 01000 10000 01000 00100 00010','>':'01000 00100 00010 00001 00010 00100 01000','·':'00000 00000 00000 00100 00000 00000 00000','#':'01010 11111 01010 01010 11111 01010 00000',
 '♥':'00000 01010 11111 11111 01110 00100 00000','▲':'00000 00100 01110 11111 00000 00000 00000','▼':'00000 00000 11111 01110 00100 00000 00000','◀':'00010 00110 01110 11110 01110 00110 00010','▶':'01000 01100 01110 01111 01110 01100 01000'};
const FONT={};for(const k in FD)FONT[k]=FD[k].replace(/ /g,'');
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function txt(s,x,y,col,sc=1,al='l',sh=null){s=String(s).toUpperCase();let X=al==='c'?Math.round(x-tw(s,sc)/2):al==='r'?x-tw(s,sc):x;
  if(sh){txt(s,X+sc,y+sc,sh,sc,'l')}ctx.fillStyle=col;
  for(const ch of s){const g=FONT[ch];if(g)for(let i=0;i<35;i++)if(g[i]==='1')ctx.fillRect(X+(i%5)*sc,y+Math.floor(i/5)*sc,sc,sc);X+=6*sc}}

/* ================= pixel sprites, drawn in code ================= */
class Buf{constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
  get(x,y){return x<0||y<0||x>=this.w||y>=this.h?null:this.d[y*this.w+x]}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1)this.px(x,y,c)}}
  poly(pts,c){let y0=1e9,y1=-1e9,x0=1e9,x1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}if(ins)this.px(x,y,c)}}
  swap(a,b,y0=0,y1=1e9){for(let y=Math.max(0,y0);y<=Math.min(this.h-1,y1);y++)for(let x=0;x<this.w;x++)if(this.d[y*this.w+x]===a)this.d[y*this.w+x]=b}
  outline(c=K){const o=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(o[y*this.w+x])continue;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<this.w&&Y<this.h&&o[Y*this.w+X]&&o[Y*this.w+X]!==c){this.d[y*this.w+x]=c;break}}}return this}
  canvas(flip=false){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const g=c.getContext('2d'),im=g.createImageData(this.w,this.h);

/* Rex: a little chrome cyber-raptor with a neon fin and a visor. 26x27, feet on the bottom row, facing right */
function dinoBuf(pose,ph){const b=new Buf(26,27),G='#4a5a80',D='#2c3654',L='#a8c4e8',Y='#3af0ff',PK='#ff2a8a',R='#3af0ff';
  const up=pose==='jump'||pose==='bounce'||pose==='dance'||pose==='dive',happy=pose!=='idle'&&pose!=='run'&&pose!=='sad'&&pose!=='climb';
  b.poly(up?[[1,14],[8,16],[9,21],[3,18]]:[[0,19],[8,16],[9,22],[2,21]],G);
  /* legs */
  if(pose==='jump'||pose==='bounce'||pose==='dive'){b.rect(8,22,3,2,D);b.rect(12,22,3,2,G);b.rect(8,24,4,1,D);b.rect(12,24,4,1,G)}
  else if(pose==='run'||pose==='dance'){if(ph%2){b.rect(5,23,3,2,D);b.rect(4,25,4,1,D);b.rect(13,23,3,3,G);b.rect(14,26,3,1,G)}else{b.rect(9,23,3,3,D);b.rect(9,26,4,1,D);b.rect(11,23,3,2,G);b.rect(11,25,4,1,G)}}
  else if(pose==='climb'){b.rect(8,21,3,3,D);b.rect(13,23,3,3,G);b.rect(13,26,3,1,G)}
  else{b.rect(7,23,3,3,D);b.rect(7,26,4,1,D);b.rect(12,23,3,3,G);b.rect(12,26,4,1,G)}
  b.ell(11,19,6.5,5,G);b.ell(13,21,3.6,2.6,L);b.px(7,15,D);b.px(9,14,D);b.px(11,14,D);
  b.ell(16.5,12,5.5,4.6,G);b.rect(18,11,6,4,G);b.px(23,11,D);
  if(happy||pose==='bounce'){b.rect(19,14,5,2,R);b.px(20,14,WH);b.px(22,14,WH)}else if(pose==='sad'){b.rect(19,15,4,1,D);b.px(23,14,D)}else{b.rect(19,14,5,1,D);b.px(20,14,WH)}
  if(pose==='sad'){b.rect(16,10,6,1,'#1a6a7a')}else{b.rect(16,9,7,3,K);b.rect(17,10,5,1,Y);b.px(21,10,WH)}
  b.px(16,13,'#ff9aa8');b.px(17,13,'#ff9aa8');
  if(pose==='bounce'||pose==='dance'||pose==='climb'){b.px(16,18,G);b.px(17,17,G);b.px(18,16,G)}else{b.rect(15,20,3,1,G);b.px(18,21,G)}
  b.poly([[12,9],[13,3],[15,7]],PK);b.poly([[14,8],[16,1],[18,7]],PK);b.poly([[17,8],[20,3],[21,8]],PK);b.px(16,2,'#ff9ad0');b.px(13,4,'#ff9ad0');b.px(20,4,'#ff9ad0');
  b.px(5,18,Y);b.px(3,19,Y);b.px(9,17,Y);b.px(12,16,Y);
  return b.outline()}
/* the goblin kids: party hats, face paint, pointy ears and a big grin. 18x20, feet on the bottom row, facing right */
const KTYPES={kid:{face:'#5affa0',sp:1,climb:1,hp:1},sprint:{face:'#ff8a4a',sp:1.55,climb:1.35,hp:1},hop:{face:'#5ad8ff',sp:.95,climb:1,hp:1,hop:1},big:{face:'#d07aff',sp:.72,climb:.75,hp:2,big:1}};
const SHIRTS=['#2a2f48','#3a2448','#1e3a48','#40263a','#2a3a2a','#3a3448','#202838','#48283a'],HATS=['#3af0ff','#ff2a8a','#ffd23a','#3affa0','#b04aff'];
function kidBuf(type,shirt,hat,pose,f){const b=new Buf(18,20),F=KTYPES[type].face,S=shirt,P='#3b4a78',SH='#2a2030';
  const crouch=pose==='dizzy'?3:0;
  b.rect(7,2+crouch,2,5,'#2a2f48');b.ell(8,1.6+crouch,1.9,1.7,hat);b.px(8,1+crouch,WH);
  b.poly([[4.6,8+crouch],[.8,5.5+crouch],[4.6,10.5+crouch]],F);b.poly([[11.4,8+crouch],[15.2,5.5+crouch],[11.4,10.5+crouch]],F);
  b.ell(8,9+crouch,4.2,3.8,F);
  const ey=8+crouch;
  if(pose==='dizzy'){for(const ex of[6,9]){b.px(ex,ey,K);b.px(ex+1,ey+1,K);b.px(ex+1,ey,K);b.px(ex,ey+1,K)}b.rect(7,ey+3,2,1,K)}
  else if(pose==='flee'){b.rect(6,ey,2,1,K);b.rect(9,ey,2,1,K);b.rect(6,ey+2,5,2,K);b.px(8,ey+2,'#ff6b6b');b.px(12,ey+1,'#8fd8ff');b.px(12,ey+2,'#8fd8ff')}
  else{b.rect(6,ey,2,1,WH);b.px(7,ey,K);b.rect(9,ey,2,1,WH);b.px(10,ey,K);b.px(6,ey-1,K);b.px(10,ey-1,K);b.rect(6,ey+3,5,1,K);b.px(7,ey+3,WH);b.px(9,ey+3,WH)}
  if(pose==='dizzy'){b.rect(5,14,6,3,S);b.rect(10,17,6,2,P);b.rect(15,17,1,2,SH);b.rect(3,16,2,2,F)}
  else if(pose==='climb'){b.rect(5,13,6,4,S);b.rect(10,9+f,2,5,S);b.rect(10,8+f,2,1,F);b.rect(5,17,2,2,P);b.rect(9,16-f,2,2,P);b.px(5,19,SH);b.px(10,18-f,SH)}
  else if(pose==='flee'||pose==='cheer'||pose==='hop'){b.rect(5,13,6,4,S);b.rect(3,9+(f%2),2,4,S);b.rect(11,9+((f+1)%2),2,4,S);b.rect(3,8+(f%2),2,1,F);b.rect(11,8+((f+1)%2),2,1,F);
    if(pose==='hop'){b.rect(5,17,2,2,P);b.rect(9,17,2,2,P)}else if(f%2){b.rect(4,17,2,2,P);b.rect(10,17,2,3,P);b.px(4,19,SH);b.px(10,19,SH)}else{b.rect(5,17,2,3,P);b.rect(9,17,2,3,P);b.px(5,19,SH);b.px(9,19,SH)}}
  else{/* run and grab: hunched, arms reaching out */b.rect(5,13,6,4,S);
    if(f%2){b.rect(10,14,3,2,S);b.rect(13,14,2,2,F);b.rect(4,17,2,2,P);b.px(3,19,SH);b.px(4,19,SH);b.rect(10,17,2,3,P);b.px(11,19,SH)}
    else{b.rect(10,13,4,2,S);b.rect(14,13,2,2,F);b.rect(5,17,2,3,P);b.px(5,19,SH);b.rect(9,17,2,3,P);b.px(9,19,SH)}}
  return b.outline()}
const SPR=new Map();
function spr(key,make){let s=SPR.get(key);if(!s){const b=make();s=[b.canvas(false),b.canvas(true)];SPR.set(key,s)}return s}
const dinoSpr=(pose,ph,face)=>spr('d'+pose+ph,()=>dinoBuf(pose,ph))[face<0?1:0];
const kidSpr=(k,pose,f)=>spr('k'+k.type+k.shirt+k.hat+pose+f,()=>kidBuf(k.type,k.shirt,k.hat,pose,f))[k.face<0?1:0];

/* ================= sound: little synths, no files ================= */
let AC=null,master=null,musicBus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.3;musicBus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.12,type='square',v=.2,t0=0,dest=null}){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.15,v=.2,f=1000,q=1,t0=0}){const a=AC;if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  jump(){tone({f:300,f2:640,d:.15,v:.16})},
  dive(){noise({d:.22,f:1600,q:.7,v:.2});tone({f:700,f2:160,d:.2,type:'sawtooth',v:.07})},
  bonk(n=1){tone({f:200,f2:90,d:.09,v:.26});tone({f:520+n*60,f2:1100+n*120,d:.2,type:'triangle',v:.22,t0:.05});noise({d:.08,f:3000,v:.12})},
  hit(){tone({f:160,f2:110,d:.12,v:.24});noise({d:.1,f:600,v:.2})},
  boing(){tone({f:260,f2:520,d:.12,type:'triangle',v:.18})},
  land(){noise({d:.09,f:260,q:.8,v:.3})},
  climb(){tone({f:420,d:.04,v:.07});tone({f:520,d:.04,v:.07,t0:.08})},
  nope(){tone({f:150,f2:120,d:.09,v:.14})},
  giggle(){for(let i=0;i<3;i++)tone({f:950+i*110+rnd()*90,f2:760,d:.06,v:.06,t0:i*.085})},
  warn(){tone({f:880,d:.06,v:.08});tone({f:1180,d:.07,v:.08,t0:.1})},
  pop(){noise({d:.07,f:2600,q:1.5,v:.3});tone({f:900,f2:1400,d:.08,type:'triangle',v:.1})},
  clear(){[523,659,784,1047,784,1047].forEach((f,i)=>tone({f,d:.16,type:'square',v:.13,t0:i*.1}));tone({f:262,d:.6,type:'triangle',v:.18,t0:.3})},
  over(){[392,370,349,311].forEach((f,i)=>tone({f,f2:f*.97,d:i===3?.7:.22,type:'sawtooth',v:.12,t0:i*.26}))},
  start(){[392,523,659,784].forEach((f,i)=>tone({f,d:.1,v:.12,t0:i*.07}))},
};
/* a bouncy party tune: melody, bass and a tiny drum, looped */

function loseSpeed(n){if(G.grace>0)return;P.spd=Math.max(0,P.spd-n*lossMul())}
/* Rex hits the floor: bump, bounce back up, and lose speed */
function thud(){const was=P.st;P.y=FLOOR;P.st='air';P.combo=0;P.squash=.14;P.vy=-6.6*VS;
  const before=P.spd;loseSpeed(LOSS.floor);G.thuds++;SFX.land();dust(P.x,P.y,was==='dive'?10:6);G.shake=was==='dive'?4:2;
  if(P.spd<before)popup(REXX,P.y-34,'SLOWER!','#ff9a9a',1);
  if(P.spd<=0)outOfSpeed()}
function updRex(){P.anim+=1/60;if(P.safe>0){P.safe-=1/60;if(P.safe<=0)P.hurt=false}if(P.squash>0)P.squash-=1/60;
  if(P.st==='tired'){/* out of speed: skid to a stop */P.vx*=.95;P.x+=P.vx;
    if(P.y<FLOOR){P.vy=Math.min(P.vy+GRAV,6.4*VS);P.y=Math.min(FLOOR,P.y+P.vy);if(P.y>=FLOOR){P.vy=0;SFX.land();dust(P.x,FLOOR,8)}}else if(P.vx>.2&&rnd()<.5)dust(P.x-6,P.y,1);return}
  P.vx+=(rexVx()-P.vx)*.06;P.x+=P.vx;
  if(P.st==='dive')P.vy=7.6*VS;else P.vy=Math.min(P.vy+GRAV,6.4*VS);
  P.y+=P.vy;
  if(hitKids())return;
  if(P.vy>0&&P.y>=FLOOR)thud()}
/* hit boxes: a dash reaches a little wider than Rex, and a goblin kid can be bonked anywhere on its whole picture
   (hat included), so a close call counts. Running into one from the side only hurts on its smaller body box. */
const rexBox=()=>P.st==='dive'?{l:P.x-8,r:P.x+8,t:P.y-18,b:P.y+2}:{l:P.x-6,r:P.x+6,t:P.y-16,b:P.y-2};
function kidBox(k,dive){const w=dive?(k.big?13:9):(k.big?7:5),h=dive?(k.big?29:20):(k.big?19:13);return{l:k.x-w,r:k.x+w,t:k.y-h,b:k.y}}
const kidLive=k=>k.st==='run'||k.st==='hop';
function hitKids(){const pb=rexBox();
  const dive=P.st==='dive';for(const k of G.kids){if(!kidLive(k))continue;const kb=kidBox(k,dive);if(pb.r<kb.l||pb.l>kb.r||pb.b<kb.t||pb.t>kb.b)continue;
    if(P.st==='dive'){bonk(k);return true}
    if(P.safe>0)continue;
    if(P.vy>.5&&P.y-kb.t<8*VS){/* landed on a head without dashing: a little boing, but no speed */
      P.y=kb.t;P.vy=-4.6*VS;P.safe=.15;k.squish=.2;G.boings++;SFX.boing();if(G.boings<=3||G.boings%6===0)popup(REXX,P.y-36,'DASH TO BONK!','#ffd84a',1);return true}
    bump(k);return true}
  return false}
function bonk(k){P.combo++;const gain=(k.big?14:Math.min(12,6+P.combo))*gainMul();P.spd=Math.min(MAXSPD,P.spd+gain);
  const pts=100*Math.min(P.combo,10)*(k.big?2:1);G.pts+=pts;G.bonks++;G.bestCombo=Math.max(G.bestCombo,P.combo);
  SFX.bonk(P.combo);popup(k.x,k.y-(k.big?36:28),P.combo>1?`+${pts} *${P.combo}`:`+${pts}`,P.combo>1?'#ffd84a':'#ffffff');confetti(k.x,k.y-10,k.big?26:16);
  k.st='bonked';k.vx=(-.6-rnd()*1.4)*HS;k.vy=-3.2*VS;
  P.st='air';P.y=Math.min(P.y,kidBox(k,true).t);P.vy=(k.big?-8.2:-7.2)*VS;P.safe=.3;P.hurt=false;G.shake=3}
/* running into a kid any other way: ouch */
function bump(k){P.combo=0;const before=P.spd;loseSpeed(LOSS.bump);P.vy=Math.min(P.vy,-4.2*VS);P.st='air';P.safe=.7;P.hurt=true;G.shake=4;G.bumps++;SFX.hit();k.flash=.4;
  if(P.spd<before)popup(REXX,P.y-34,'OUCH!','#ff9a9a',1);if(P.spd<=0)outOfSpeed()}
function outOfSpeed(){P.st='tired';P.spd=0;G.state='caught';G.t=2.4;G.banner=null;SFX.over();music(false);G.shake=6;
  let i=0;const slot=()=>(i%2?1:-1)*(16+10*(i>>1));
  for(const k of G.kids)if(kidLive(k)&&k.x>cam-10&&k.x<cam+W+10){k.st='cheer';k.off=slot();i++}
  for(;i<3;i++){/* a few more kids run in to celebrate */const k=spawnKid(planKid());k.st='cheer';k.off=slot();if(k.off<0)k.x=cam-14}}
/* ---------- the goblin kids: they run at Rex from the right ---------- */
function planKid(){const type=pick(G.D.types),T=KTYPES[type];return{type,sp:G.D.sp*T.sp*(.9+rnd()*.2)*HS}}
function spawnKid(pl){const T=KTYPES[pl.type],k={type:pl.type,shirt:pick(SHIRTS),hat:pick(HATS),x:cam+W+14,y:FLOOR,vx:0,vy:0,face:-1,st:'run',sp:pl.sp,
    big:!!T.big,hopper:!!T.hop,hopAt:(28+rnd()*30),hopped:false,anim:rnd()*9,flash:0,squish:0,spin:0};
  G.kids.push(k);if(rnd()<.3)SFX.giggle();return k}
/* kids are sent so they reach Rex a fair beat apart: never further apart than one good bounce can carry him */
function schedule(){if(!G.plan)G.plan=planKid();const T=(W+14-REXX)/(rexVx()+G.plan.sp);
  if(G.clock>=G.nextArr-T){const arrive=Math.max(G.nextArr,G.clock+T),D=G.D;spawnKid(G.plan);G.plan=null;G.nextArr=arrive+(rnd()<D.pair?8+rnd()*4:D.lo+rnd()*(D.hi-D.lo))}}
function kidFall(k){k.vy=Math.min(k.vy+GRAV,6*VS);k.y+=k.vy;if(k.vy>0&&k.y>=FLOOR){k.y=FLOOR;k.vy=0;return true}return false}
function updKid(k){k.anim+=1/60;if(k.flash>0)k.flash-=1/60;if(k.squish>0)k.squish-=1/60;
  switch(k.st){
  case'run':k.x-=k.sp;k.anim+=k.sp/(14*HS);
    if(k.hopper&&!k.hopped&&k.x-P.x<k.hopAt&&k.x>P.x+6){k.hopped=true;k.st='hop';k.vy=-4.4*VS}
    break;
  case'hop':k.x-=k.sp;if(kidFall(k))k.st='run';break;
  case'bonked':k.x+=k.vx;k.y+=k.vy;k.vy+=.28*VS;k.spin+=.35;if(k.y>H+40)k.gone=1;break;
  case'cheer':{const tx=P.x+k.off;if(Math.abs(tx-k.x)>1.2){k.face=Math.sign(tx-k.x);k.x+=k.face*1.1}else k.face=P.x>k.x?1:-1;if(k.y<FLOOR)kidFall(k);break}}
  if(k.x<cam-40)k.gone=1}
/* ---------- bonus balloons, particles and pop-ups ---------- */
function dust(x,y,n){for(let i=0;i<n;i++)G.parts.push({x:x+(rnd()-.5)*10,y:y-1,vx:(rnd()-.5)*1.4,vy:-rnd()*.8,life:.35+rnd()*.2,c:'#ffffff',s:2,g:.02})}
function confetti(x,y,n){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,v=1+rnd()*2.2;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,life:.8+rnd()*.6,c:pick(BUNT),s:rnd()<.3?2:1,g:.06,spin:1})}}
/* a pop-up stays where it happened, or (scr) stays on the screen next to Rex */
function popup(x,y,s,c,scr=0){if(scr)G.pops=G.pops.filter(p=>!p.scr);G.pops.push({x,y,s,c,life:1,scr})}
function updFx(){for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;if(p.spin)p.vx*=.98;p.life-=1/60}G.parts=G.parts.filter(p=>p.life>0&&p.x>cam-40);
  for(const p of G.pops){p.y-=.4;p.life-=1/60}G.pops=G.pops.filter(p=>p.life>0);
  if(G.state==='play'){G.balT-=1/60;if(G.balT<=0){G.balT=5+rnd()*5;const n=1+Math.floor(rnd()*3),x=cam+W+12,y=clamp(FLOOR-(50+rnd()*60)*VS,64,FLOOR-50);
    for(let i=0;i<n;i++)G.balloons.push({x:x+i*14,y:y+(i%2)*9,c:pick(BUNT),ph:rnd()*6})}}
  const pb=rexBox();for(const b of G.balloons){b.ph+=.04;b.y+=Math.sin(b.ph)*.15;
    if(!b.pop&&G.state==='play'&&b.x+5>pb.l&&b.x-5<pb.r&&b.y+6>pb.t&&b.y-7<pb.b){b.pop=1;G.pts+=50;SFX.pop();confetti(b.x,b.y,12);popup(b.x,b.y-14,'+50','#ffffff')}}
  G.balloons=G.balloons.filter(b=>!b.pop&&b.x>cam-20);if(G.shake>0)G.shake-=.4}
/* ---------- the flow of a run ---------- */
function checkLevel(){const L=Math.floor(P.x/RL)+1;if(L<=G.level)return;G.level=L;G.D=diff(L);const bonus=250*(L-1);G.pts+=bonus;
  G.banner={a:`LEVEL ${L} · ${themeOf(L-1).name}`,b:`BONUS +${bonus}`,t:2.6};SFX.clear();confetti(P.x+50,70,26)}
function update(){G.titleT+=1/60;mus.spb=.23-P.spd*.0007;
  if(G.state==='title'){updTitle();updFx();return}
  if(G.state==='pause')return;
  if(G.state==='play'){G.clock++;if(G.grace>0)G.grace--;
    for(const k of G.kids)updKid(k);
    updRex();cam=P.x-REXX;
    if(G.state==='play'){schedule();checkLevel();if(G.banner&&(G.banner.t-=1/60)<=0)G.banner=null}
    G.kids=G.kids.filter(k=>!k.gone);updFx();G.score=G.pts+Math.max(0,Math.floor((P.x-G.x0)/16));return}
  if(G.state==='caught'){G.t-=1/60;for(const k of G.kids)updKid(k);updRex();cam=P.x-REXX;G.kids=G.kids.filter(k=>!k.gone);updFx();
    if(G.t<=0){G.state='over';G.overT=.6;if(G.score>G.best){G.best=G.score;G.newBest=true;store.set('runbest',G.best)}G.saved=null;saveProgress(true)}return}
  if(G.state==='over'){if(G.overT>0)G.overT-=1/60;for(const k of G.kids)if(k.st==='cheer')k.anim+=1/60;updFx()}}
/* ---------- the title screen: the house drifts by while Rex bounces ---------- */
const TITLEKIDS=[{type:'kid',shirt:'#ff6b6b',hat:'#ffd84a',x:14,face:1,anim:0},{type:'sprint',shirt:'#4aa6e4',hat:'#a8ff6a',x:40,face:1,anim:.2},{type:'hop',shirt:'#66c659',hat:'#ff5fa8',x:164,face:-1,anim:.5}];
function titleLayout(){const ly=Math.round(clamp(H*.07,14,30)),py=ly+70,by=py+16;return{ly,py,by,boxB:by+66}}
function updTitle(){cam+=.6*HS;P.x=cam+120;P.anim+=1/60;P.vy+=GRAV*.7;P.y+=P.vy;if(P.y>=FLOOR){P.y=FLOOR;P.vy=-Math.sqrt(2*GRAV*.7*titleBounce());P.squash=.1}if(P.squash>0)P.squash-=1/60;
  if(rnd()<.03)confetti(cam+10+rnd()*160,30+rnd()*30,5)}

/* ================= drawing ================= */
function drawKid(k,now){if(k.flash>0&&Math.floor(k.flash*20)%2)return;
  const f=Math.floor(k.anim*7)%2,pose=k.st==='bonked'?'dizzy':k.st==='cheer'?'cheer':k.st==='hop'?'hop':'run';
  const im=kidSpr(k,pose,f),sc=k.big?1.5:1,w=18*sc,h=20*sc;
  if(k.st==='bonked'){ctx.save();ctx.translate(Math.round(k.x),Math.round(k.y-h/2));ctx.rotate(k.spin);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();return}
  ctx.fillStyle='rgba(40,20,60,.22)';ctx.fillRect(Math.round(k.x-5*sc),FLOOR-1,Math.round(10*sc),2);
  const sq=k.squish>0?.75:1,hh=Math.round(h*sq);ctx.drawImage(im,Math.round(k.x-w/2),Math.round(k.y-hh+1+(pose==='run'&&f?-1:0)),w,hh)}
function drawRex(now){const ph=Math.floor(P.anim*8)%2;let pose;
  if(P.st==='tired')pose=P.vx>.3?'run':'sad';else if(P.st==='dive')pose='dive';else pose=P.vy<-2*VS?'bounce':'jump';
  if(P.hurt&&P.safe>0&&Math.floor(P.safe*30)%2)return;
  const im=dinoSpr(pose,ph,1),x=Math.round(P.x),y=Math.round(P.y);
  const d=clamp((FLOOR-P.y)/(120*VS),0,1),sw=Math.round(14-8*d);ctx.fillStyle='rgba(40,20,60,.22)';ctx.fillRect(x-(sw>>1),FLOOR-1,sw,2);
  if(pose==='dive'){/* nose-down, with speed lines */ctx.save();ctx.translate(x,y-13);ctx.rotate(Math.PI/2);ctx.drawImage(im,-13,-14);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<3;i++)ctx.fillRect(x-14+i*6,y-38+i*3-Math.floor((now/30+i*5)%10),1,9);return}
  if(P.spd>75&&G.state==='play'){/* going really fast: a trail of Rexes */ctx.globalAlpha=.22;ctx.drawImage(im,x-13-8,y-27+2*VS);ctx.globalAlpha=.12;ctx.drawImage(im,x-13-16,y-27+4*VS);ctx.globalAlpha=1}
  if(P.squash>0)ctx.drawImage(im,x-15,y-22,30,22);else ctx.drawImage(im,x-13,y-27)}
function drawBalloon(b){const x=Math.round(b.x),y=Math.round(b.y),p=(Math.sin(performance.now()/160+b.ph)+1)/2;ctx.fillStyle=b.c+'40';disc(ctx,x,y,8+Math.round(p*2),b.c+'40');
  disc(ctx,x,y,6,K);disc(ctx,x,y,5,b.c);disc(ctx,x,y,3,lt(b.c));ctx.fillStyle='#ffffff';ctx.fillRect(x-2,y-3,2,2);ctx.fillStyle=b.c;ctx.fillRect(x,y+7+Math.round(p*2),1,1);ctx.fillRect(x-1,y+10,1,1)}
function drawParts(){for(const p of G.parts){ctx.globalAlpha=clamp(p.life*2.5,0,1);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}ctx.globalAlpha=1}
function drawPops(scr){for(const p of G.pops){if(!!p.scr!==scr)continue;ctx.globalAlpha=clamp(p.life*2,0,1);const half=tw(p.s)/2;
    txt(p.s,Math.round(scr?clamp(p.x,half+2,W-half-2):p.x),Math.round(p.y),p.c,1,'c',K)}ctx.globalAlpha=1}
/* streaks rushing past when Rex is quick */
function drawSpeedLines(now){const v=P.vx/HS;if(v<2.7||G.state!=='play')return;const n=Math.min(12,Math.floor((v-2.7)*10)+2);ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<n;i++){const y=40+((i*53)%Math.max(40,FLOOR-60)),len=8+((i*7)%12),x=W-((now*.12*v*HS+i*131)%(W+50));ctx.fillRect(Math.round(x),y,len,1)}}
function drawHud(now){ctx.fillStyle='rgba(27,20,48,.62)';ctx.fillRect(0,0,W,22);
  txt(`SCORE ${String(G.score).padStart(6,'0')}`,3,2,'#ffffff');txt(`LEVEL ${G.level}`,W-3,2,'#ffd84a',1,'r');
  const bx=36,bw=W-39,v=P.spd/MAXSPD;txt('SPEED',3,12,'#c8a8ff');ctx.fillStyle=K;ctx.fillRect(bx-1,11,bw+2,9);ctx.fillStyle='#3a2a50';ctx.fillRect(bx,12,bw,7);
  const col=P.spd>50?'#7ad86a':P.spd>25?'#ffd84a':'#ff5f5f',blink=P.spd<=25&&G.state==='play'&&Math.floor(now/150)%2;
  if(!blink&&v>0){const fw=Math.max(1,Math.round(bw*v));ctx.fillStyle=col;ctx.fillRect(bx,12,fw,7);ctx.fillStyle=lt(col);ctx.fillRect(bx,12,fw,1)}
  ctx.fillStyle='rgba(27,20,48,.7)';for(let i=1;i<4;i++)ctx.fillRect(bx+Math.round(bw*i/4),12,1,7);
  if(P.combo>1&&G.state==='play')txt(`COMBO *${P.combo}`,W-3,25,'#ffd84a',1,'r',K);
  if(G.banner&&G.state==='play'){const B=G.banner,w=Math.max(tw(B.a),tw(B.b))+10,x=Math.round(W/2-w/2);panel(x,38,w,22);txt(B.a,W/2,41,'#b8306e',1,'c');txt(B.b,W/2,51,'#2a1838',1,'c')}}
function panel(x,y,w,h){ctx.fillStyle=K;ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#ff5fa8';ctx.fillRect(x,y,w,h);ctx.fillStyle='#ffe0ef';ctx.fillRect(x+2,y+2,w-4,h-4)}
const KB=()=>!ZP&&!RT.classList.contains('touch');
function render(now){ctx.save();ctx.setTransform(1,0,0,1,0,0);
  let sx=0,sy=0;if(G.shake>0){sx=Math.round((rnd()-.5)*G.shake);sy=Math.round((rnd()-.5)*G.shake)}
  const cx=Math.round(cam);ctx.translate(sx-cx,sy);
  drawHouse(cx);
  for(const b of G.balloons)drawBalloon(b);
  for(const k of G.kids)drawKid(k,now);
  drawRex(now);drawParts();drawPops(false);
  ctx.setTransform(1,0,0,1,0,0);
  if(G.state==='title'){for(const k of TITLEKIDS)ctx.drawImage(kidSpr(k,'cheer',Math.floor(now/180+k.anim*3)%2),k.x-9,FLOOR-19);drawTitle(now);ctx.restore();return}
  drawSpeedLines(now);drawPops(true);drawHud(now);
  if(G.state==='caught'&&Math.floor(now/200)%2)txt('OUT OF STEAM!',W/2,Math.round(H*.3),'#ffffff',2,'c',K);
  if(G.state==='pause'){ctx.fillStyle='rgba(27,20,48,.6)';ctx.fillRect(0,0,W,H);const y=Math.round(H/2-30);panel(8,y,164,58);txt('PAUSED',W/2,y+8,'#b8306e',2,'c');
    txt(KB()?'ENTER OR Z: KEEP RUNNING':'START OR A: KEEP RUNNING',W/2,y+30,'#2a1838',1,'c');txt(KB()?'X: QUIT TO TITLE':'B: QUIT TO TITLE',W/2,y+42,'#2a1838',1,'c')}
  if(G.state==='over')drawOver(now);
  ctx.restore()}
function drawTitle(now){const L=titleLayout(),cs=['#ff2a8a','#3af0ff','#b04aff','#3affa0','#ffd23a'];
  ctx.fillStyle='rgba(27,20,48,.45)';ctx.fillRect(0,L.ly-6,W,70);
  let i=0;for(const[word,y0]of[['NEON',L.ly],['REX',L.ly+34]]){let x=Math.round(W/2-tw(word,4)/2);for(const ch of word){const y=y0+Math.round(Math.sin(now/220+i*.7)*2);txt(ch,x+3,y+3,K,4);txt(ch,x,y,cs[i%cs.length],4);x+=24;i++}}
  const kb=KB(),A=kb?'Z':'A',B=kb?'X':'B';
  if(G.saved)txt(`${A}: LEVEL ${G.saved.level||1} · ${B}: NEW RUN`,W/2,L.py,Math.floor(now/450)%2?'#ffffff':'#ffd84a',1,'c',K);
  else if(Math.floor(now/450)%2)txt(`PRESS ${A} TO RUN`,W/2,L.py,'#ffffff',1,'c',K);
  ctx.fillStyle='rgba(27,20,48,.62)';ctx.fillRect(0,L.by-4,W,L.boxB-L.by+4);
  txt(`${B} OR ${A}: DASH DOWN ON GOBLINS`,W/2,L.by,'#ffe0ef',1,'c');
  txt('BONKS SPEED REX UP,',W/2,L.by+11,'#ffe0ef',1,'c');
  txt('THE FLOOR SLOWS HIM DOWN.',W/2,L.by+22,'#ffe0ef',1,'c');
  txt("NO SPEED LEFT? GAME OVER!",W/2,L.by+33,'#ffd84a',1,'c');
  txt(`BEST ${G.best}`,4,L.by+48,'#ffffff');txt(`${kb?'M':'SELECT'}: SOUND ${muted?'OFF':'ON'}`,W-4,L.by+48,'#c8a8ff',1,'r')}
function drawOver(now){ctx.fillStyle='rgba(27,20,48,.62)';ctx.fillRect(0,0,W,H);const y=Math.round(H/2-78);panel(8,y,164,156);txt('SYSTEM DOWN!',W/2,y+8,'#b8306e',2,'c');
  txt('REX RAN OUT OF SPEED',W/2,y+28,'#2a1838',1,'c');
  txt(`SCORE ${G.score}`,W/2,y+44,'#b8306e',1,'c');
  txt(`${Math.max(0,Math.floor((P.x-G.x0)/16))} M · LEVEL ${G.level}`,W/2,y+56,'#2a1838',1,'c');
  txt(`${G.bonks} BONKS`,W/2,y+68,'#2a1838',1,'c');txt(`BEST COMBO *${G.bestCombo}`,W/2,y+80,'#2a1838',1,'c');
  txt(G.newBest?'NEW BEST!':`BEST ${G.best}`,W/2,y+96,G.newBest&&Math.floor(now/250)%2?'#ff5fa8':'#2a1838',1,'c');
  if(G.overT<=0){txt(KB()?'Z: RUN AGAIN':'A: RUN AGAIN',W/2,y+118,'#2a1838',1,'c');txt(KB()?'X: TITLE':'B: TITLE',W/2,y+132,'#2a1838',1,'c')}}

/* ================= input ================= */
function input(btn,down){if(!down)return;
  if(btn==='a'||btn==='b'||btn==='down')press(btn);else if(btn==='start')pressStart();else if(btn==='select'){setMute(!muted);if(!muted){unlock();SFX.start()}}}
const KEYMAP={ArrowDown:'down',z:'a',Z:'a',' ':'a',k:'a',K:'a',x:'b',X:'b',j:'b',J:'b',Enter:'start',p:'start',P:'start',Escape:'start',Shift:'select',m:'select',M:'select'};
addEventListener('keydown',e=>{const b=KEYMAP[e.key];if(!b)return;e.preventDefault();unlock();if(e.repeat)return;input(b,true)});
for(const[id,btn]of[['bD','b'],['bP','start']]){const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');input(btn,true)});
  const up=()=>el.classList.remove('on');el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
/* tapping the picture dashes too, or starts a party from the title and game-over screens */
cv.addEventListener('pointerdown',()=>{unlock();if(G.state==='play')dash();else if(G.state==='title')newGame(G.saved);else if(G.state==='over'&&G.overT<=0)newGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.state==='play')pause();music(false);saveProgress(true)}});

/* ================= the console ================= */
window.ZPCart={title:'Neon Rex',
  input(btn,down){unlock();input(btn,down)},
  /* power switch: from the title or the game-over screen, just turn off; mid-party, pause and let the console ask */
  home(){saveProgress(true);return true},
  snapshot(){return null}};
if(ZP&&ZP.cartReady)try{ZP.cartReady(window.ZPCart)}catch(e){}

/* ================= go ================= */
applySize();fit();toTitle();
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){acc+=Math.min(250,now-last);last=now;let n=0;if(window.__PR&&window.__PR.freeze)acc=0;while(acc>=STEP&&n<8){update();acc-=STEP;n++}if(n>=8)acc=0;render(now);requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
/* hooks for automated tests only (the address must end in #prtest) */
if(/prtest/.test(location.hash))window.__PR={G,P,input,update,render:()=>render(performance.now()),newGame,toTitle,spawnKid,planKid,schedule,diff,KTYPES,THEMES,rexVx,kidBox,rexBox,LOSS,RL,REXX,applySize,
  get cam(){return cam},set cam(v){cam=v},get H(){return H},get FLOOR(){return FLOOR},get VS(){return VS},
  cartArt(){/* the label (96x64, scaled up 3x): Rex diving onto a goblin kid at the party, drawn on the screen's corner and copied off */
    const LW=96,LH=64,fl=56;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.save();ctx.beginPath();ctx.rect(0,0,LW,LH);ctx.clip();
    const th=THEMES[0];ctx.drawImage(th.wc,30,FLOOR-fl-0,LW,fl,0,0,LW,fl);ctx.drawImage(th.fc,0,0,LW,22,0,fl-2,LW,22);
    for(let x=-2,i=0;x<LW;x+=10,i++){const y=1+Math.round(Math.sin(x/LW*Math.PI)*3);ctx.fillStyle=BUNT[i%6];ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+8,y);ctx.lineTo(x+4,y+7);ctx.closePath();ctx.fill()}
    const k1={type:'kid',shirt:'#ff6b6b',hat:'#ffd84a',face:-1},k2={type:'hop',shirt:'#66c659',hat:'#ff5fa8',face:-1},k3={type:'sprint',shirt:'#4aa6e4',hat:'#a8ff6a',face:-1};
    ctx.drawImage(kidSpr(k1,'run',0),40,fl-19);ctx.drawImage(kidSpr(k3,'run',1),74,fl-19);ctx.drawImage(kidSpr(k2,'hop',0),60,fl-30);
    const im=dinoSpr('dive',0,1);ctx.save();ctx.translate(49,20);ctx.rotate(Math.PI/2);ctx.drawImage(im,-13,-14);ctx.restore();
    ctx.fillStyle='#ffffff';for(let i=0;i<3;i++)ctx.fillRect(41+i*6,0+i*2,1,7);
    let sd=5;const r2=()=>(sd=(sd*9301+49297)%233280)/233280;for(let i=0;i<34;i++){ctx.fillStyle=BUNT[i%6];ctx.fillRect(Math.floor(r2()*LW),Math.floor(8+r2()*36),1+(i%3===0),1)}
    drawBalloon({x:12,y:22,c:'#ff5fa8',ph:1});drawBalloon({x:24,y:16,c:'#6ad0ff',ph:2});drawBalloon({x:86,y:20,c:'#ffd84a',ph:3});ctx.restore();
    const c=document.createElement('canvas');c.width=LW;c.height=LH;c.getContext('2d').drawImage(cv,0,0,LW,LH,0,0,LW,LH);ctx.restore();return c.toDataURL()}};
})();
</script>
</body></html>
