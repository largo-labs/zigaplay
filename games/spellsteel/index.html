<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spellsteel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Spellsteel: a 32-bit style RPG. The scene is a canvas 180 game pixels tall (280-400 wide, following the screen);
   menus, dialogue and the battle windows are HTML laid over it, sized in game pixels through --u. */
:root{color-scheme:dark;--u:2px;--ink:#f4f6ff;--dim:#a8b4e0;--gold:#ffd86a;--red:#ff6a6a;--green:#8aff9a;--blue:#8ad0ff;--ui:'Pixelify Sans',ui-monospace,monospace}
*,::before,::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#05060e;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#field{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#cv{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;overflow:hidden;font-size:calc(var(--u)*7.5);line-height:1.25;pointer-events:none}
#ui *{pointer-events:none}
h1,h2,h3,p{margin:0}
/* the windows: deep blue glass with a bright rim */
.win{position:absolute;background:linear-gradient(180deg,rgba(52,76,196,.97) 0%,rgba(26,40,128,.97) 55%,rgba(14,22,84,.98) 100%);border:calc(var(--u)*1) solid #e8eeff;border-radius:calc(var(--u)*3);
  box-shadow:0 0 0 calc(var(--u)*1) #060a24,inset 0 0 0 calc(var(--u)*1) rgba(120,150,255,.35),0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.5);padding:calc(var(--u)*4) calc(var(--u)*6);text-shadow:calc(var(--u)*.7) calc(var(--u)*.7) 0 #0a0c2a}
.win.plain{background:linear-gradient(180deg,rgba(26,32,80,.94),rgba(10,12,40,.96))}
.ttl{color:var(--gold);font-size:calc(var(--u)*8.5);margin-bottom:calc(var(--u)*2)}
.dim{color:var(--dim)}.gold{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}
.small{font-size:calc(var(--u)*6.5)}.tiny{font-size:calc(var(--u)*5.8)}.big{font-size:calc(var(--u)*11)}
/* lists with the pointing-hand cursor */
.list{display:flex;flex-direction:column;gap:calc(var(--u)*.5);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*.6) calc(var(--u)*2) calc(var(--u)*.6) calc(var(--u)*11);white-space:nowrap;border-radius:calc(var(--u)*2)}
.row .r{margin-left:auto;color:var(--dim)}
.row.off{color:#7a84b8}
.row.sel{background:rgba(255,255,255,.10)}
.row.sel::before{content:"";position:absolute;left:0;top:50%;width:calc(var(--u)*10);height:calc(var(--u)*7);transform:translateY(-50%);background:var(--hand) no-repeat center/contain;image-rendering:pixelated;animation:poke .5s steps(2) infinite}
.row.dimsel::before{opacity:.45;animation:none}
@keyframes poke{50%{transform:translate(calc(var(--u)*1),-50%)}}
.row .sw{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:calc(var(--u)*1.5);border:calc(var(--u)*.7) solid #fff;flex:0 0 auto}
.row .lock{color:#8a94c8;font-size:calc(var(--u)*6)}
.row .new{color:var(--gold);font-size:calc(var(--u)*6)}
/* a palette grid of dyes */
.grid{display:grid;gap:calc(var(--u)*1.5)}
.grid .c{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*2);border:calc(var(--u)*.8) solid rgba(0,0,0,.6);position:relative}
.grid .c.sel{outline:calc(var(--u)*1) solid #fff;outline-offset:calc(var(--u)*.8);transform:scale(1.12);z-index:2}
.grid .c.cur::after{content:"";position:absolute;inset:calc(var(--u)*3);border-radius:50%;background:#fff;box-shadow:0 0 0 calc(var(--u)*.6) #000}
/* letter entry */
.keys{display:grid;grid-template-columns:repeat(13,1fr);gap:calc(var(--u)*.8)}
.keys i{font-style:normal;text-align:center;padding:calc(var(--u)*.8) 0;border-radius:calc(var(--u)*1.5);background:rgba(0,0,0,.25)}
.keys i.sel{background:#fff;color:#1a2470;text-shadow:none}
.keys i.wide{grid-column:span 3}
.entry{font-size:calc(var(--u)*10);letter-spacing:calc(var(--u)*.6);border-bottom:calc(var(--u)*.8) solid var(--dim);min-height:calc(var(--u)*13);padding:0 calc(var(--u)*2);margin-bottom:calc(var(--u)*3)}
.entry b{animation:blink .8s steps(2) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
/* bars */
.bar{height:calc(var(--u)*2.4);background:#0a0c28;border-radius:calc(var(--u)*1);overflow:hidden;box-shadow:0 0 0 calc(var(--u)*.5) #000}
.bar i{display:block;height:100%;background:linear-gradient(#a0ffb0,#30b050)}
.bar.mp i{background:linear-gradient(#a8e0ff,#3a78e8)}
.bar.atb i{background:linear-gradient(#fff2a0,#e8a020)}
.bar.atb.full i{background:linear-gradient(#ffffff,#ffd040);animation:shine .4s steps(2) infinite}
.bar.lim i{background:linear-gradient(#ffb0e0,#d03090)}
.bar.lim.full i{animation:shine .3s steps(2) infinite}
@keyframes shine{50%{filter:brightness(1.5)}}
.bar.xp i{background:linear-gradient(#e0c8ff,#8a5ae0)}
/* battle windows */
.bparty .pr{display:grid;grid-template-columns:calc(var(--u)*34) 1fr calc(var(--u)*30) calc(var(--u)*30);align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*.4) calc(var(--u)*1);border-radius:calc(var(--u)*2)}
.bparty .pr.turn{background:rgba(255,255,255,.12)}
.bparty .pr.ko{color:#ff8a8a}
.bparty .num{font-size:calc(var(--u)*7);text-align:right}
.bparty .num small{font-size:calc(var(--u)*5.5);color:var(--dim)}
.tag{display:inline-block;font-size:calc(var(--u)*5);padding:0 calc(var(--u)*1.4);border-radius:calc(var(--u)*1.4);background:rgba(0,0,0,.35);margin-left:calc(var(--u)*1)}
/* the dialogue box */
.dlg{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*14);min-height:calc(var(--u)*44)}
.dlg .who{position:absolute;top:calc(var(--u)*-9);left:calc(var(--u)*6);padding:calc(var(--u)*1) calc(var(--u)*5);font-size:calc(var(--u)*7);color:var(--gold)}
.dlg .more{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*3);color:var(--gold);animation:blink .8s steps(2) infinite}
.toast{position:absolute;left:50%;top:calc(var(--u)*8);transform:translateX(-50%);padding:calc(var(--u)*2) calc(var(--u)*8);white-space:nowrap}
.hint{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*3);font-size:calc(var(--u)*5.8);color:var(--dim);text-shadow:0 calc(var(--u)*.6) 0 #000;white-space:nowrap}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--u)*8);height:calc(var(--u)*8);padding:0 calc(var(--u)*1.5);border-radius:calc(var(--u)*4);font-style:normal;font-size:calc(var(--u)*5.5);color:#fff;background:#5a5a72;margin:0 calc(var(--u)*.8);vertical-align:middle}
.k.a{background:#c8283c}.k.b{background:#3a5ab8}
.preview{position:absolute;image-rendering:pixelated}
.fade{animation:fade .35s both}@keyframes fade{from{opacity:0}}
.pop{animation:pop .22s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{transform:scale(.85);opacity:0}}
/* the title screen */
.logo{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#fff;letter-spacing:calc(var(--u)*1.2);font-size:calc(var(--u)*24);text-shadow:0 calc(var(--u)*1.5) 0 #2a1a6a,0 0 calc(var(--u)*8) rgba(140,180,255,.9)}
.logo small{display:block;font-size:calc(var(--u)*6.5);letter-spacing:calc(var(--u)*2.4);color:var(--gold);font-weight:400}
/* touch controls, only when playing on its own on a phone */
#touch{display:none;position:absolute;inset:auto 0 0 0;height:0}
html.touch:not(.zp) #touch{display:block}
#touch .pad{position:absolute;left:10px;bottom:10px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
#touch .tb{position:absolute;bottom:20px;width:54px;height:54px;border-radius:50%;background:rgba(200,40,60,.55);border:2px solid rgba(255,255,255,.25);color:#fff;font:700 18px var(--ui);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#touch .tb.b{background:rgba(58,90,184,.55)}#touch .tb.s{width:44px;height:26px;border-radius:13px;font-size:10px;background:rgba(90,90,114,.6)}
/* screens, menus and lists */
.screen{position:absolute;inset:0}
.screen.darken{background:rgba(4,6,20,.6)}
.lw{display:flex;flex-direction:column}
.lw .list{flex:0 0 auto}
.lw .ttl{white-space:nowrap;overflow:hidden}
.more2{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);bottom:calc(var(--u)*3);width:calc(var(--u)*6);pointer-events:none;color:var(--gold);font-size:calc(var(--u)*5)}
.more2 .up{position:absolute;top:0;right:0;animation:blink 1s steps(2) infinite}.more2 .dn{position:absolute;bottom:0;right:0;animation:blink 1s steps(2) infinite}
.foot{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);bottom:calc(var(--u)*3);white-space:nowrap;overflow:hidden}
.row>span:first-of-type{overflow:hidden;text-overflow:ellipsis}
.row .r{display:inline-flex;align-items:center;gap:calc(var(--u)*1)}
.row .tiny.dim{margin-left:calc(var(--u)*1)}
.titlemenu .row{justify-content:center}
.pop.win,.win.pop{z-index:5}
#fader{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}
/* dialogue */
.dlg{z-index:20}
.dlg .txt{min-height:calc(var(--u)*30);white-space:normal}
.letters{z-index:30}
.letters .keys i{font-size:calc(var(--u)*7)}
/* cards in the menu */
.card{display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*1) 0;border-bottom:calc(var(--u)*.5) solid rgba(255,255,255,.08);min-height:calc(var(--u)*32)}
.card:last-child{border-bottom:none}
.cb{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.row .card{border-bottom:none;padding:0;min-height:calc(var(--u)*28)}
.row:has(.card){padding-top:calc(var(--u)*.2);padding-bottom:calc(var(--u)*.2)}
.stats{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--u)*8)}
.sr{display:flex;justify-content:space-between;font-size:calc(var(--u)*7)}
.win .list .row{font-size:inherit}
/* battle */
.blayer{position:absolute;inset:0}
.banner{text-align:center;padding:calc(var(--u)*2) calc(var(--u)*6);z-index:6;font-size:calc(var(--u)*7.5)}
.benemy,.bparty{padding:calc(var(--u)*3) calc(var(--u)*4)}
.benemy .en{display:flex;flex-direction:column;font-size:calc(var(--u)*6.5);margin-bottom:calc(var(--u)*1.6)}
.benemy .en span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.ehp{height:calc(var(--u)*1.4);width:80%}.bar.ehp i{background:linear-gradient(#ffb0a0,#d04a3a)}
.bparty .pr{grid-template-columns:minmax(0,1fr) calc(var(--u)*44) calc(var(--u)*16) calc(var(--u)*30);font-size:calc(var(--u)*7)}
.bparty .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bparty .num.low{color:var(--gold)}.bparty .num.ko{color:var(--red)}.bparty .num.mp{color:var(--blue)}
.bparty .gg{display:flex;flex-direction:column;gap:calc(var(--u)*.8)}.bparty .gg .bar{height:calc(var(--u)*2)}
.bparty .gg .bar.lim{height:calc(var(--u)*1.2)}
.cmd{z-index:7}
.cmd .row{padding-top:calc(var(--u)*.2);padding-bottom:calc(var(--u)*.2)}
.dmg{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:calc(var(--u)*9);color:#fff;white-space:nowrap;z-index:8;
  text-shadow:calc(var(--u)*.7) 0 0 #000,calc(var(--u)*-.7) 0 0 #000,0 calc(var(--u)*.7) 0 #000,0 calc(var(--u)*-.7) 0 #000;animation:dmg 1.1s both}
.dmg.crit{color:#ffe04a;font-size:calc(var(--u)*11)}.dmg.heal{color:#8aff9a}.dmg.mp{color:#8ad0ff}.dmg.miss{color:#c8cce0;font-size:calc(var(--u)*7)}.dmg.st{color:#ffd86a;font-size:calc(var(--u)*6.5)}.dmg.tag{color:#ff8a5a;font-size:calc(var(--u)*6.5);margin-top:calc(var(--u)*-8)}
@keyframes dmg{0%{transform:translate(-50%,-60%) scale(.6);opacity:0}12%{transform:translate(-50%,-140%) scale(1.15);opacity:1}24%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1;transform:translate(-50%,-110%)}100%{opacity:0;transform:translate(-50%,-150%)}}
.results{z-index:9}
.results .rr{display:flex;align-items:center;gap:calc(var(--u)*4);margin-top:calc(var(--u)*2)}
.lvup{animation:blink .5s steps(2) 6}
/* the prologue and the credits */
.prol{position:absolute;left:12%;right:12%;top:52%;text-align:center;font-size:calc(var(--u)*8);line-height:1.45;color:#e8eeff;text-shadow:0 calc(var(--u)*.8) 0 #000}
.credit{position:absolute;left:8%;right:8%;top:24%;text-align:center;text-shadow:0 calc(var(--u)*1) 0 #000,0 0 calc(var(--u)*6) rgba(0,0,0,.6)}
.credit>div+div{margin-top:calc(var(--u)*3)}
.eld{display:inline-block;width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;margin-right:calc(var(--u)*1.6);vertical-align:middle;box-shadow:0 0 0 calc(var(--u)*.6) #05071c}
.bparty .pr{grid-template-columns:minmax(0,1fr) calc(var(--u)*44) calc(var(--u)*36);padding:calc(var(--u)*1.2) calc(var(--u)*2);gap:calc(var(--u)*3.5)}
.bparty .gg{gap:calc(var(--u)*1)}.bparty .gg .bar{height:calc(var(--u)*2)}.bparty .gg .bar.hpb{height:calc(var(--u)*2.6)}.bparty .gg .bar.hpb i{background:linear-gradient(#a0ffb0,#30b050)}.bparty .gg .bar.hpb.low i{background:linear-gradient(#ffe8a0,#e0a020)}
.benemy,.bparty{padding:calc(var(--u)*3.5) calc(var(--u)*4)}.benemy .en{margin-bottom:calc(var(--u)*2.4)}
.win{padding:calc(var(--u)*5) calc(var(--u)*7)}
.roomy .row{padding-top:calc(var(--u)*2.6);padding-bottom:calc(var(--u)*2.6)}
.roomy .row.sel{background:rgba(255,255,255,.13)}
</style></head><body>
<div id="app"><div id="field"><canvas id="cv"></canvas><div id="ui"></div></div>
<div id="touch"><div class="pad" id="tpad"></div><div class="tb b" style="right:76px" data-b="b">B</div><div class="tb" style="right:14px;bottom:56px" data-b="a">A</div><div class="tb s" style="right:150px;bottom:14px" data-b="select">SEL</div><div class="tb s" style="right:150px;bottom:46px" data-b="start">START</div></div></div>
<script>
(()=>{'use strict';
/* ================= pixel buffers: everything is drawn in code, pixel by pixel ================= */
const INK='#160f24';
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))};
/* a colour ramp: below zero toward a cool shadow, above zero toward a warm light */
const _sh={};
const shade=(c,k)=>{if(!c)return c;const key=c+k;if(_sh[key])return _sh[key];
  return _sh[key]=k<0?mix(c,'#1c1036',Math.min(.82,-k*.24)):mix(c,'#fff8e8',Math.min(.85,k*.22))};
const dk=c=>shade(c,-1),lt=c=>shade(c,1);
class Buf{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
  get(x,y){x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=this.w||y>=this.h?null:this.d[y*this.w+x]}
  has(x,y){return this.get(x,y)!==null}
  rect(x,y,w,h,c,clip){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!clip||this.has(x+i,y+j))this.px(x+i,y+j,c)}
  /* ellipse; sh shades it lit from the upper left (dark rim low right, light patch high left, a highlight) */
  ell(cx,cy,rx,ry,c,sh=1,clip=false){
    for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry,d=nx*nx+ny*ny;if(d>1||(clip&&!this.has(x,y)))continue;let col=c;
      if(sh&&c){const l=-(nx*.6+ny*.8);if(l<-.42&&d>.32)col=shade(c,-1);else if(l>.48&&d>.08&&d<.62)col=shade(c,1);if(sh>1&&l>.7&&d>.12&&d<.4)col=shade(c,2)}
      this.px(x,y,col)}}
  poly(pts,c,clip=false){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}
      if(ins&&(!clip||this.has(x,y)))this.px(x,y,c)}}
  tri(ax,ay,bx,by,cx,cy,c,clip){this.poly([[ax,ay],[bx,by],[cx,cy]],c,clip)}
  line(x0,y0,x1,y1,c,t=1,clip=false){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2));
    for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(t<=1){if(!clip||this.has(x,y))this.px(x,y,c)}
      else{const o=Math.floor(t/2);for(let a=0;a<t;a++)for(let b=0;b<t;b++){const X=x-o+a,Y=y-o+b;if(!clip||this.has(X,Y))this.px(X,Y,c)}}}}
  pl(pts,c,t=1,clip){for(let i=0;i<pts.length-1;i++)this.line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],c,t,clip)}
  /* a rounded limb from one point to another */
  limb(x0,y0,x1,y1,w0,c,w1=w0){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(let i=0;i<=n;i++){const t=i/n,r=Math.max(.5,(w0*(1-t)+w1*t)/2);this.ell(x0+(x1-x0)*t,y0+(y1-y0)*t,r,r,c,0)}}
  /* a tapered curve (quadratic) */
  horn(x0,y0,cx,cy,x1,y1,w0,c,w1=.8){const n=Math.ceil((Math.hypot(cx-x0,cy-y0)+Math.hypot(x1-cx,y1-cy))*2);for(let i=0;i<=n;i++){const t=i/n,u=1-t,x=u*u*x0+2*u*t*cx+t*t*x1,y=u*u*y0+2*u*t*cy+t*t*y1,r=Math.max(.5,(w0*(1-t)+w1*t)/2);this.ell(x,y,r,r,c,0)}}
  quill(x0,y0,x1,y1,w,c){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L*w/2,ny=dx/L*w/2;this.poly([[x0+nx,y0+ny],[x1,y1],[x0-nx,y0-ny]],c)}
  leaf(x0,y0,x1,y1,w,c,clip=false){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,A=[],B=[],n=12;for(let i=0;i<=n;i++){const t=i/n,h=Math.sin(Math.PI*Math.pow(t,.8))*w/2,x=x0+dx*t,y=y0+dy*t;A.push([x+nx*h,y+ny*h]);B.unshift([x-nx*h,y-ny*h])}this.poly(A.concat(B),c,clip)}
  plus(x,y,c){this.px(x,y,c);this.px(x-1,y,c);this.px(x+1,y,c);this.px(x,y-1,c);this.px(x,y+1,c)}

function drawEarsBack(b,P,L,sk){const e=L.ears||'Human',x=P.hx-6.5,y=P.hy+1;

function hairBangs(b,P,c,kind){const hx=P.hx,hy=P.hy,y0=hy-8.5;
  if(kind==='none')return;
  if(kind==='straight'){b.poly([[hx-3,y0+1],[hx+8.6,y0+3.5],[hx+8.4,hy-2.4],[hx-2,hy-2.4]],c);for(let x=Math.ceil(hx-1);x<hx+8;x+=2)b.px(x,hy-2.4,c)}
  else if(kind==='side'){b.poly([[hx-3,y0+.5],[hx+8.8,y0+3],[hx+8,hy-4.5],[hx+3,hy-3.4],[hx-1,hy-2]],c)}
  else if(kind==='swept'){b.poly([[hx-3,y0+.5],[hx+9,y0+3],[hx+8.6,hy+1.5],[hx+5,hy-1.5],[hx+1,hy-3]],c);b.line(hx+2,hy-4,hx+7.5,hy+.5,shade(c,-1))}
  else if(kind==='spiky'){b.poly([[hx-3,y0+.5],[hx+8.4,y0+2.4],[hx+8,hy-5]],c);for(const[x,l]of[[hx,4.5],[hx+3.2,5.4],[hx+6.2,4.8]])b.tri(x-1.8,hy-6,x+1.8,hy-6,x+1.2,hy-6+l,c)}
  else if(kind==='parted'){b.poly([[hx-3,y0+.5],[hx+8.6,y0+3.2],[hx+8.8,hy+3],[hx+7.2,hy+3.5],[hx+6.4,hy-3],[hx+3.4,hy-5.4],[hx+1.5,hy-2],[hx+.4,hy+2],[hx-1.4,hy+2]],c)}
  else if(kind==='long'){b.poly([[hx-3,y0+.5],[hx+8.6,y0+3.2],[hx+9,hy+6],[hx+7.4,hy+6.5],[hx+6.6,hy-3],[hx+1,hy-3.4],[hx-1,hy-1]],c)}
  else if(kind==='tuft'){b.poly([[hx-3,y0+.5],[hx+8.6,y0+3],[hx+7.6,hy-4.6],[hx+1,hy-4.2]],c);b.horn(hx+5,hy-5,hx+8,hy-3.6,hx+6.4,hy-1.6,2.2,c,.8)}
  else if(kind==='locks'){hairBangs(b,P,c,'side');b.poly([[hx+7.4,hy-3],[hx+9.4,hy-3],[hx+9,hy+7],[hx+7.4,hy+7.4]],c)}}
function hairBack(b,P,c,kind){const hx=P.hx,hy=P.hy,bx=hx-7.5;
  const fall=(y1,w=5.5,jag=1)=>{b.poly([[bx-1.8,hy-5],[bx+5,hy-4],[bx+4.2,y1-2],[bx+2,y1],[bx-.5,y1-1.2],[bx-2.6,y1-2.4],[bx-3,hy+2]],c);if(jag)for(let x=bx-2;x<bx+4;x+=2)b.px(x,y1-1.6+((x|0)%3===0?1:0),c)};
  switch(kind){
    case 'none':break;
    case 'short':b.ell(bx+1.5,hy+3.5,4,4.5,c,1);break;
    case 'bob':b.poly([[bx-1.8,hy-5],[hx+1,hy-6],[hx-1,hy+7],[bx-1,hy+7.6]],c);b.ell(bx+.4,hy+5.4,3,2.6,c,0);break;
    case 'shoulder':fall(hy+13);break;
    case 'long':fall(43+OY,6);break;
    case 'vlong':fall(52+OY,6.5);break;
    case 'mullet':b.ell(bx+1.5,hy+3.5,4,4.5,c,1);fall(hy+14);break;
    case 'wolf':fall(hy+13);for(const[y,l]of[[hy+4,4],[hy+8,5],[hy+12,4]])b.quill(bx-1,y,bx-2-l,y+3,3,c);break;
    case 'pony':b.ell(bx+1,hy-6,3,3,c,1);b.horn(bx,hy-6,bx-8,hy-4,bx-6,hy+12,5.2,c,1.5);break;
    case 'lowpony':b.ell(bx+1.5,hy+3.5,3.4,3.6,c,1);b.horn(bx,hy+4,bx-4,hy+9,bx-3,hy+20,4.2,c,1.2);break;
    case 'twin':b.ell(bx+1,hy-6,2.6,2.6,c,1);b.horn(bx,hy-6,bx-9,hy-3,bx-7,hy+16,4.6,c,1.6);b.ell(hx-3,hy-9.6,2.4,2.4,c,1);b.horn(hx-3.5,hy-9.6,hx-13,hy-6,hx-12,hy+13,4,shade(c,-1),1.4);break;
    case 'bun':b.ell(bx+.5,hy-6.5,4.2,4,c,2);break;
    case 'twinbun':b.ell(hx-5.5,hy-9.5,3.8,3.6,c,2);b.ell(hx+3.5,hy-10.6,3.8,3.6,c,2);break;
    case 'braid':b.ell(bx+1.5,hy+3,3.4,3.6,c,1);for(let k=0;k<6;k++){b.ell(bx-1-k*.6,hy+6+k*3.2,2.4,2,k%2?c:shade(c,1),0)}b.ell(bx-4.6,hy+25,1.6,2,c,0);break;
    case 'drills':fall(hy+8);for(const ox of[-1.5,2.5]){for(let k=0;k<5;k++)b.ell(bx+ox,hy+9+k*2.6,2.6-k*.3,1.6,k%2?c:shade(c,1),0)}break;
    case 'topknot':b.ell(hx-2,hy-11,3,2.8,c,2);b.rect(hx-3,hy-9,2,2,shade(c,-1));break;
    case 'locs':for(let k=0;k<5;k++){const x=bx-2+k*1.6;b.horn(x+2,hy-4,x-1,hy+6,x-1.5+k*.2,hy+15,2.2,k%2?c:shade(c,-1),1.6)}break;
    case 'halfup':fall(43+OY,6);b.ell(bx+.5,hy-7,3.2,3,c,2);break;
    case 'curlylong':fall(hy+16);for(let k=0;k<4;k++)b.ell(bx-2+k*1.8,hy+15+(k%2),2,2,c,1);break;
    case 'mane':fall(52+OY,7);for(let k=0;k<7;k++)b.quill(bx-1,hy+k*4,bx-6,hy+2+k*4,3.4,c);break;
  }}

function engraveFlat(b,str,cx,y,c,maxW){str=String(str||'').toUpperCase();while(str.length&&miniW(str)>maxW)str=str.slice(0,-1);miniText(b,str,Math.round(cx-miniW(str)/2),y,c)}

addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b){e.preventDefault();press(b,false)}});
addEventListener('blur',()=>{for(const b of[...held])press(b,false)});
let TEXT_HOOK=null;
/* touch, when playing on its own */
if(!ZP){addEventListener('touchstart',()=>document.documentElement.classList.add('touch'),{once:true,capture:true});
  const pad=$('#tpad');let pid=null,pd=null;const padSet=d=>{if(d===pd)return;if(pd)press(pd,false);pd=d;if(d)press(d,true)};
  const padAt=e=>{const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<12)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;pad.setPointerCapture(pid);padSet(padAt(e))});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)padSet(padAt(e))});
  for(const t of['pointerup','pointercancel'])pad.addEventListener(t,e=>{if(e.pointerId===pid){pid=null;padSet(null)}});
  for(const n of $$('#touch .tb')){const b=n.dataset.b;n.addEventListener('pointerdown',e=>{e.preventDefault();n.setPointerCapture(e.pointerId);press(b,true)});for(const t of['pointerup','pointercancel'])n.addEventListener(t,()=>press(b,false))}}

/* ---------- scenes: each owns the canvas drawing and the input while it runs ---------- */
let S_SCENE=null;
function setScene(sc){if(S_SCENE&&S_SCENE.leave)S_SCENE.leave();S_SCENE=sc;inputHandler=(b,rep)=>{if(MODAL.length){MODAL[MODAL.length-1].input(b,rep);return}if(S_SCENE&&S_SCENE.input)S_SCENE.input(b,rep)};inputUp=b=>{if(!MODAL.length&&S_SCENE&&S_SCENE.up)S_SCENE.up(b)};if(sc.enter)sc.enter()}
/* menus stack over the scene */
const MODAL=[];
function pushModal(m){MODAL.push(m);if(m.open)m.open();return m}
function popModal(m){const i=MODAL.indexOf(m);if(i>=0)MODAL.splice(i,1);if(m.close)m.close();if(m.el&&m.el.remove)m.el.remove()}
let last=performance.now(),TIME=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;TIME+=dt;
  try{if(S_SCENE){S_SCENE.update&&S_SCENE.update(dt);S_SCENE.draw&&S_SCENE.draw(dt)}for(const m of MODAL)m.tick&&m.tick(dt)}catch(e){console.error(e)}
  requestAnimationFrame(frame)}

/* ---------- sprites of characters, cached as canvases ---------- */
const _dollC=new Map();
function lookKey(L,w){return JSON.stringify([L,w&&[w.kind,w.parts,w.c1,w.c2,w.c3,w.c4,w.c5,w.gemC,w.engr,w.elem]])}
function heroSprite(L,w,pose,flip=false){const key=lookKey(L,w)+'|'+pose+'|'+flip;let c=_dollC.get(key);
  if(!c){const b=drawHero(L,w,pose);c=b.canvas(1,flip);_dollC.set(key,c);if(_dollC.size>500){const k0=_dollC.keys().next().value;_dollC.delete(k0)}}return c}
/* draw a character with the feet at (x, y) on the canvas */
function drawHeroAt(g,L,w,pose,x,y,flip=false,alpha=1){const c=heroSprite(L,w,pose,flip);g.globalAlpha=alpha;g.drawImage(c,Math.round(x-(flip?DOLL_W-DOLL_FX:DOLL_FX)),Math.round(y-DOLL_FY));g.globalAlpha=1}

const SKEY='spellsteel-save',ZC=ZP&&ZP.cloud&&typeof ZP.cloud.save==='function'?ZP.cloud:null;
function writeSave(data){data.savedAt=Date.now();const j=JSON.stringify(data);try{localStorage.setItem(SKEY,j)}catch(e){}
  if(ZC)try{ZC.save('spellsteel',j,{lv:data.party&&data.party[0]?data.party[0].lv:1,where:data.zoneName||''})}catch(e){}}
function readLocal(){try{const j=localStorage.getItem(SKEY);return j?JSON.parse(j):null}catch(e){return null}}
async function readBest(){let best=readLocal();
  if(ZC){try{const r=await Promise.race([ZC.load('spellsteel'),sleep(6000).then(()=>null)]);if(r&&r.ok&&r.json){const c=JSON.parse(r.json);if(c&&(!best||(+c.savedAt||0)>(+best.savedAt||0)))best=c}}catch(e){}}
  return best}

/* ================= windows: lists with the pointing hand, dialogue, the letter board, the dye grid ================= */
const px=n=>`calc(var(--u)*${n})`;
function place(e,b){for(const[k,p]of[['x','left'],['y','top'],['w','width'],['h','height'],['r','right'],['b','bottom']])if(b[k]!=null)e.style[p]=px(b[k]);return e}
function winEl(cls,box,parent=UI){const e=el('div','win '+(cls||''));if(box)place(e,box);parent.appendChild(e);return e}
/* ---------- a list: rows of {html|label, r, off, sw}; cursor with the D-pad ---------- */
class ListWin{
  constructor(o){this.o=o;this.rows=o.rows||[];this.i=clamp(o.sel||0,0,Math.max(0,this.rows.length-1));this.top=0;this.cols=o.cols||1;this.vis=o.vis||8;
    this.el=o.el||winEl(o.cls,o.box);this.el.classList.add('lw');
    if(o.title){this.tt=el('div','ttl',o.title);this.el.appendChild(this.tt)}
    this.body=el('div','list'+(this.cols>1?' cols':''));if(this.cols>1)this.body.style.cssText=`display:grid;grid-template-columns:repeat(${this.cols},1fr);gap:${px(.5)} ${px(4)}`;this.el.appendChild(this.body);
    this.more=el('div','more2');this.el.appendChild(this.more);
    if(o.foot){this.ft=el('div','foot small dim',o.foot);this.el.appendChild(this.ft)}
    this.render()}
  get row(){return this.rows[this.i]}
  set(rows,sel){this.rows=rows;if(sel!=null)this.i=sel;this.i=clamp(this.i,0,Math.max(0,rows.length-1));this.render()}
  input(b,rep){const n=this.rows.length,c=this.cols;
    if(b==='up'||b==='down'){if(!n)return;let j=this.i+(b==='up'?-c:c);
      if(j<0||j>=n){if(rep||this.o.noWrap)return;j=b==='up'?(c>1?Math.min(n-1,this.i%c+Math.floor((n-1)/c)*c):n-1):this.i%c}
      if(j>=n)j=n-1;this.move(j)}
    else if(b==='left'||b==='right'){const d=b==='left'?-1:1;
      if(c>1){const j=this.i+d;if(Math.floor(j/c)===Math.floor(this.i/c)&&j>=0&&j<n)this.move(j);else if(this.o.lr)this.o.lr(d,this.row,this.i,rep)}
      else if(this.o.lr)this.o.lr(d,this.row,this.i,rep)}
    else if(b==='a'){const r=this.row;if(!r)return;if(r.off&&!this.o.pickOff){SND.fx('no');return}if(!this.o.quiet)SND.fx('ok');this.o.pick&&this.o.pick(r,this.i)}
    else if(b==='b'){if(this.o.back){SND.fx('back');this.o.back()}}
    else if(this.o.key)this.o.key(b,this.row,this.i)}
  move(j){if(j===this.i)return;this.i=j;SND.fx('cur');this.render();this.o.move&&this.o.move(this.row,this.i)}
  render(){const c=this.cols,line=Math.floor(this.i/c),lines=Math.ceil(this.rows.length/c);
    if(line<this.top)this.top=line;if(line>=this.top+this.vis)this.top=line-this.vis+1;this.top=clamp(this.top,0,Math.max(0,lines-this.vis));
    const from=this.top*c,to=Math.min(this.rows.length,(this.top+this.vis)*c);let h='';
    for(let k=from;k<to;k++){const r=this.rows[k];h+=`<div class="row${k===this.i?(this.dim?' sel dimsel':' sel'):''}${r.off?' off':''}">${r.sw?`<span class="sw" style="background:${r.sw}"></span>`:''}${r.html!=null?r.html:`<span>${esc(r.label)}</span>`}${r.r!=null?`<span class="r">${r.r}</span>`:''}</div>`}
    if(!this.rows.length&&this.o.empty)h=`<div class="row off">${esc(this.o.empty)}</div>`;

/* ================= battle: active time, the way the old ones did it (time waits while you choose) =================
   The party stands on the right facing left, the foes on the left. Each fighter's gauge fills with speed; when a
   party member's is full their commands open. Foes act when theirs fill. */
const BSPD={Slow:.7,Normal:1,Fast:1.45},ANIM={Slow:.85,Normal:1,Fast:1.3};
let BT=null;
const HAND=(()=>{const b=new Buf(10,7);b.rect(0,2,6,3,'#f4f4f8');b.rect(5,1,4,2,'#f4f4f8');b.rect(6,3,3,1,'#d8dcec');b.rect(1,5,4,1,'#c8cce0');b.outline('#1a1c3a');return b.canvas(1)})();
const TGT_TXT={one:'One foe',all:'All foes',rand:'Random foes',ally:'One ally',party:'The whole party',self:'Self',dead:'A fallen ally'};
function artDesc(a){if(a.desc&&a.kind==='buff')return`${TGT_TXT[a.tgt]} · ${a.desc}`;const bits=[TGT_TXT[a.tgt]];
  if(a.kind==='heal')bits.push(a.revive&&a.tgt==='dead'?'Revives':a.pct?'Heals by a share of HP':'Heals');else if(a.kind==='buff')bits.push(STATUS[a.st]?STATUS[a.st].n:'');
  else{if(a.hits>1)bits.push(a.hits+' hits');if(a.elem)bits.push(a.elem);bits.push(a.kind==='mag'?'Magic':'Strike')}
  if(a.st&&a.kind!=='buff'&&STATUS[a.st])bits.push((a.chance>=1?'':'May ')+STATUS[a.st].n.toLowerCase().replace(/^(def|atk) -$/,m=>m));
  if(a.crit)bits.push('Keen');if(a.execute)bits.push('Finishes the weak');if(a.drain)bits.push('Drains HP');if(a.refund)bits.push('Refunds MP');if(a.sure)bits.push('Never misses');if(a.after==='regen')bits.push('then Regen');return bits.join(' · ')}
/* ---------- time inside a battle ---------- */

const easeOut=t=>1-(1-t)*(1-t),easeIn=t=>t*t;

/* ---------- the fighters ---------- */
function unitP(m,i){const s=statsOf(m);return{side:'p',m,name:m.name,hp:clamp(m.hp,0,s.hp),mhp:s.hp,mp:clamp(m.mp,0,s.mp),mmp:s.mp,s,atb:.15+rnd()*.55,st:s.regen?{regen:999}:{},alive:m.hp>0,i,ox:0,oy:0,pose:null,poseT:0,nk:0,guard:false}}

  const E=BT.E,m=E.length,sp=BT.o.boss?[[.27,118]]:{1:[[.28,112]],2:[[.17,100],[.37,116]],3:[[.14,92],[.37,100],[.23,120]]}[m]||[[.27,110]];
  E.forEach((u,i)=>{const s=sp[Math.min(i,sp.length-1)];u.hx=Math.max(u.spr.fx+4,Math.round(W*s[0]+(BT.o.boss?0:0)));u.hy=s[1]-(u.F.fly?26:0)})}

/* numbers in play, with statuses */
function stat(u,k){let v=u.s[k];const st=u.st;
  if(k==='atk'||k==='mag'){if(st.atkUp&&k==='atk')v*=1.35;if(st.atkDown)v*=.7;if(st.berserk&&k==='atk')v*=1.5}
  if(k==='def'||k==='mdef'){if(st.defUp)v*=1.5;if(st.defDown)v*=.6;if(st.berserk)v*=.75}return v}
function atbRate(u){let r=(stat(u,'spd')+30)/88;if(u.st.haste)r*=1.5;if(u.st.slow)r*=.5;return r*BSPD[SET.speed]}
/* ---------- damage ---------- */
function calc(src,t,o){const phys=o.kind!=='mag';const A=stat(src,phys?'atk':'mag'),D=stat(t,phys?'def':'mdef');
  const r={dmg:0,crit:false,miss:false,weak:false,resist:false};
  if(phys&&!o.sure){let miss=.04;if(t.st.evade)miss+=.5;if(rnd()<miss){r.miss=true;return r}}
  let d=A*(o.pow||1)*(src.side==='p'?2.4:2.0)*(55/(55+D))*(.92+rnd()*.16);
  const el=o.elem||(phys&&src.side==='p'&&src.m.weapon.elem!=='None'?src.m.weapon.elem:null)||(src.side==='p'?innateEl(src.m):null);
  if(el&&t.side==='e'){if(t.F.weak.includes(el)){d*=1.5;r.weak=true}else if(t.F.res.includes(el)){d*=.5;r.resist=true}}
  if(phys){let cc=(src.s.crit||.05)+(o.crit||0);if(src.st.focus)cc=1;if(rnd()<cc){d*=1.75;r.crit=true}}
  if(t.guard)d*=.5;if(o.execute&&t.side==='e'){if(t.hp/t.mhp<.3&&!t.F.boss)d=t.hp;else d*=1.3}

async function interact(ev){WD.busy=true;try{
  if(ev.k==='door'){SND.fx('door');await openPlace(ev.to,WD.zone)}
  else if(ev.k==='npc'){await talkTo(ev)}
  else if(ev.k==='sign'){await say('',ev.text)}
  else if(ev.k==='chest'){await openChest(ev)}
  else if(ev.k==='save'){SND.fx('save');healAll();await say('','The crystal hums. Your party is fully restored.');if(await ask('','Save your journey?',['Save','Not now'])===0){autosave(true);await say('','Your journey is saved.')}}
 }finally{WD.busy=false}}
async function openChest(ev){SND.fx('chest');G.opened[ev.id]=1;let txt;
  if(ev.item){addItem(ev.item,ev.n||1);txt=`${ITEMS[ev.item].n}${ev.n>1?' ×'+ev.n:''}`}
  else if(ev.charm){addCharm(ev.charm);txt=CHARMS[ev.charm].n+' (a charm)'}
  else if(ev.cos){G.owned[ev.cos[0]+':'+ev.cos[1]]=1;txt=`${ev.cos[1]} — new for the wardrobe!`}
  await say('',`Found ${txt}`)}
function encounter(Z){let tot=0;for(const f of Z.enc)tot+=f[1];let r=rnd()*tot,form=Z.enc[0][0];for(const f of Z.enc){r-=f[1];if(r<=0){form=f[0];break}}
  startFight(form,{theme:Z.theme,grey:isGrey(Z)}).catch(e=>{if(e!==ABORT)console.error(e)})}
/* a fight; if the party falls and you choose to load or quit, whatever was running stops */
async function startFight(form,o){const was=WD.busy;WD.busy=true;const r=await battle(form,o);if(r==='load'||r==='title'){await afterFight(r);throw ABORT}WD.busy=was;return r}
async function afterFight(r){if(r==='load'){await loadGame();return}if(r==='title'){toTitle();return}}
async function bossEvent(ev){WD.busy=true;WD.moving=false;const Z=ZONES[WD.zone];
  if(ev.pre)await runStory(ev.pre);
  const r=await battle(ev.foes,{boss:true,final:FOE[ev.foes[0]].final,theme:Z.theme,grey:isGrey(Z)});
  if(r!=='win'){await afterFight(r);WD.busy=false;return}
  G.flags[ev.flag]=1;if(EMBERS[ev.flag]){G.flags['ember_'+ev.flag]=1}
  if(ev.post)await runStory(ev.post);
  if(Z.grey===ev.flag){WD.restore=0;SND.fx('holy')}
  autosave();WD.busy=false}

    else if(c==='Charms'){const m=await pickMember(root,box,'Who wears a charm?');if(m)await charmMenu(root,m)}

async function partyMenu(){

      +`<div class="tiny dim" style="margin-top:calc(var(--u)*1.5)">ELEMENT REACTIONS</div>`+(rx.length?rx.slice(0,3).map(x=>`<div class="small"><b style="color:${x.c}">${x.n}</b> <span class="tiny dim">${esc(x.who)}</span></div>`).join(''):`<div class="tiny dim">Mix elements, like Pyro with Cryo, to blow up enemies.</div>`)};draw();

    const cur=G.party[i],j=G.party.indexOf(c);

    clampParty();draw()}});
  root.remove()}
/* ---------- wishes: 100 gems each, a new friend every time ---------- */
function wishPull(){G.pity=(G.pity||0)+1;const five=G.pity>=WISH.pity||rnd()<WISH.rate5;if(five)G.pity=0;
  const ids=WISH_IDS.filter(id=>CHARS[id].rar===(five?5:4)),id=ids[Math.floor(rnd()*ids.length)],had=owned(id);
  if(had)G.gems+=WISH.dupe;else join(id);return{id,five,had}}
async function wishMenu(){
  const root=screenRoot(),info=winEl('plain',{x:4,y:4,w:W-8,h:24},root),side=winEl('plain',{x:W-168,y:32,w:164,h:144},root);
  const draw=()=>{info.innerHTML=`<span class="blue">◆ ${fmt(G.gems||0)}</span> <span class="dim">gems</span> · <span class="gold">${wishes()}</span> <span class="dim">wish${wishes()===1?'':'es'}</span> · <span class="dim">5★ guaranteed in</span> ${Math.max(1,WISH.pity-(G.pity||0))}`;
    side.innerHTML='<div style="column-count:2;column-gap:4px">'+WISH_IDS.map(id=>{const C=CHARS[id],R=ROLES[C.role];return`<div class="tiny" style="break-inside:avoid;color:${owned(id)?'#fff':'#7a82a8'}">${C.rar===5?'<span class="gold">★5</span>':'<span class="blue">★4</span>'} <i class="eld" style="background:${ELEMS[C.el].c}"></i>${esc(C.n)} <span style="color:${R.c}">${R.s}</span>${owned(id)?'✓':''}</div>`}).join('')+'</div>'};draw();
  const one=winEl('plain',{x:4,y:32,w:W-176,h:60},root);one.innerHTML='<div class="tiny dim">Defeat enemies for gems. Every 100 gems is a wish. A repeat turns into 50 gems.</div>';
  await menuLoop({el:winEl('roomy',{x:4,y:96,w:W-176,h:80},root),rows:[{label:'Wish ×1'},{label:'Wish ×10'},{label:'Back'}],vis:3,act:async(row,i)=>{if(i===2)return 'close';
    const n=i?10:1;if(wishes()<n){SND.fx('no');await say('',`You need ${n*WISH.cost} gems for that.`);return}
    G.gems-=n*WISH.cost;const res=[];for(let k=0;k<n;k++)res.push(wishPull());draw();
    const fresh=res.filter(r=>!r.had),dupes=res.length-fresh.length,box=winEl('pop results',{x:Math.round(W/2-120),y:8,w:240},root);
    box.innerHTML=`<div class="ttl">${n===1?'A wish comes true!':'Ten wishes!'}</div>`+fresh.slice(0,5).map(r=>{const m=allMembers().find(x=>x.id===r.id),R=ROLES[CHARS[r.id].role];return`<div class="rr">${portraitHTML(m)}<div style="flex:1"><div class="small">${esc(CHARS[r.id].n)} <span class="${r.five?'gold':'blue'}">★${CHARS[r.id].rar}</span> <span style="color:${R.c}">${R.n}</span></div><div class="tiny green">Joined your roster!</div></div></div>`}).join('')
      +(dupes?`<div class="small dim">${dupes} repeat${dupes>1?'s':''} → ◆${dupes*WISH.dupe} back</div>`:'')+`<div class="tiny dim" style="text-align:right"><i class="k a">A</i>continue</div>`;
    SND.fx(res.some(r=>r.five)?'limit':'level');
    await new Promise(r=>{const m={el:box,input(b){if(b==='a'||b==='b'){popModal(m);box.remove();r()}}};setTimeout(()=>pushModal(m),250)});draw()}});
  root.remove()}

function migrate(d){const g=Object.assign({v:1,party:[],gold:0,inv:{},charms:{},owned:{},flags:{},opened:{},zone:'emberwick',x:96,dir:1,time:0,steps:0,battles:0},d);

  const fixM=m=>{const base=makeMember(m.id||'hero',m.lv||1,m.look,m.weapon,m.name);return Object.assign(base,m,{look:Object.assign({},DEFAULT_LOOK,m.look||{}),weapon:Object.assign(base.weapon,m.weapon||{},{parts:Object.assign({},base.weapon.parts,(m.weapon||{}).parts||{})})})};
  g.roster=(g.roster||[]).filter(m=>CHARS[m.id]).map(fixM);g.gems=g.gems|0;g.pity=g.pity|0;while(g.party.length>3)g.roster.push(g.party.pop());
  if(!g.party.length)g.party=[makeMember('hero',1,DEFAULT_LOOK,null,'Ren')];if(!ZONES[g.zone]){g.zone='emberwick';g.x=96}delete g.zoneName;delete g.savedAt;return g}
async function loadGame(data){clearUI();const d=data||await readBest();if(!d){toTitle();return}G=migrate(d);setScene(WORLD_SCENE);enterZone(G.zone,G.x,G.dir);await fadeIn(200)}
function clearUI(){while(MODAL.length)popModal(MODAL[MODAL.length-1]);TEXT_HOOK=null;for(const c of[...UI.children])if(c.id!=='fader')c.remove();WD.busy=false}

/* ---------- the title ---------- */
const TITLE_CAST=(()=>{const h=Object.assign({},DEFAULT_LOOK);const w=newWeapon('sword');w.parts.Blade='Flamberge';w.parts.Guard='Wings';w.c1='Platinum';w.engr='SPELLSTEEL';

    {look:CHARS.bram.look,w:Object.assign(newWeapon('warhammer'),CHARS.bram.weapon,{parts:Object.assign(newWeapon('warhammer').parts,CHARS.bram.weapon.parts)})},{look:CHARS.kit.look,w:Object.assign(newWeapon('bow'),CHARS.kit.weapon,{parts:Object.assign(newWeapon('bow').parts,CHARS.kit.weapon.parts)})}]})();
const TITLE_SCENE={creator:false,
 enter(){SND.play('title');this.creator=false;this.t=0;this.build()},

 update(dt){this.t+=dt},

};

const PROLOGUE_SCENE={update(){},draw(){const g=ctx;g.fillStyle='#05060e';g.fillRect(0,0,W,H);const cols=['#ff6a2a','#3a8ae8','#e8f4ff','#ffd86a','#a070ff'];
