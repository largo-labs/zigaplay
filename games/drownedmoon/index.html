<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strike at Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Tides of the Drowned Moon: a 16-bit style RPG for the ZigaPlay.
   The world is drawn on a small canvas stretched to the screen; windows and text are HTML on top of it. */
:root{color-scheme:dark;--ink:#f3f6ff;--dim:#9fb0d8;--gold:#ffd77a;--hp:#7dffb0;--mp:#8fd0ff;--bad:#ff7a7a;
  --win1:#24508f;--win2:#0b1a40;--edge:#e6eeff;--ui:'Pixelify Sans',ui-monospace,monospace}
*,::before,::after{box-sizing:border-box}
html{font-size:clamp(10px,4.4vw,17px)}
html,body{height:100%;margin:0}
body{background:#02040c;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#02040c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.white{background:#e8f4ff}
#fade.red{background:#a0001c}

/* windows */
.win{position:absolute;background:linear-gradient(180deg,var(--win1),var(--win2));border:2px solid var(--edge);border-radius:5px;
  box-shadow:0 0 0 2px #050a1c,inset 0 0 0 1px #4d7cc4,0 3px 8px #0008;padding:.45rem .6rem;line-height:1.3;text-shadow:1px 1px 0 #050a1c}
.win h3{margin:0 0 .25rem;font-size:.8rem;font-weight:600;color:var(--gold);letter-spacing:.06em}
.dlg{left:.4rem;right:.4rem;bottom:.4rem;min-height:5.2rem;font-size:1rem}
.dlg.top{top:1.55rem;bottom:auto}
.dlg .who{position:absolute;top:-1.15rem;left:.5rem;padding:.05rem .45rem;font-size:.78rem;color:var(--gold);background:var(--win2);border:2px solid var(--edge);border-radius:4px 4px 0 0;border-bottom:0}
.dlg .more{position:absolute;right:.55rem;bottom:.25rem;width:0;height:0;border:.3rem solid transparent;border-top-color:var(--gold);border-bottom:0;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.list{display:flex;flex-direction:column}
.opt{position:relative;padding:.08rem .2rem .08rem 1rem;display:flex;justify-content:space-between;gap:.6rem;white-space:nowrap}
.opt.off{color:#7d8bb0}
.opt.sel::before{content:'';position:absolute;left:.1rem;top:50%;margin-top:-.3rem;border:.3rem solid transparent;border-left:.5rem solid var(--gold);border-right:0;animation:poke .5s steps(2) infinite}
@keyframes poke{50%{transform:translateX(2px)}}
.opt .r{color:var(--dim)}
.scroll{overflow:hidden}
.small{font-size:.78rem;color:var(--dim)}
.gold{color:var(--gold)}.hpc{color:var(--hp)}.mpc{color:var(--mp)}.bad{color:var(--bad)}
.bar{height:.28rem;background:#04081a;border:1px solid #000;border-radius:2px;overflow:hidden;margin-top:.1rem}
.bar i{display:block;height:100%;background:linear-gradient(#a8ffcc,#36c46f)}
.bar.mp i{background:linear-gradient(#bfe6ff,#3e8fe0)}
.toast{left:50%;top:.6rem;transform:translateX(-50%);font-size:.85rem;white-space:nowrap;text-align:center}
.mapname{left:50%;top:1.2rem;transform:translateX(-50%);font-size:.9rem;padding:.3rem .9rem;letter-spacing:.08em;color:var(--gold);animation:fadeout 2.6s forwards}
@keyframes fadeout{0%,75%{opacity:1}100%{opacity:0}}

/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#title .logo{margin-top:16%;text-align:center;line-height:1;letter-spacing:.06em;text-shadow:0 0 8px #7fb4ff,2px 2px 0 #04081a}
#title .logo small{display:block;font-size:.8rem;color:#bcd2ff;letter-spacing:.35em;margin-bottom:.4rem}
#title .logo b{display:block;font-size:2.1rem;font-weight:600;color:#f4f8ff}
#title .logo em{display:block;font-style:normal;font-size:1.05rem;color:var(--gold);letter-spacing:.3em;margin-top:.35rem}
#title .press{position:absolute;bottom:30%;font-size:.9rem;color:#dfe8ff;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#title .foot{position:absolute;bottom:.6rem;font-size:.65rem;color:#6b7ba8}

/* battle */
.bparty{right:.3rem;bottom:.3rem;width:62%;font-size:.76rem;padding:.22rem .4rem .3rem .3rem;display:flex;flex-direction:column;gap:.04rem}
.phead,.prow{display:grid;grid-template-columns:3.5rem minmax(0,1fr) 1.75rem 1.25rem;column-gap:.35rem;align-items:center}
.phead{padding:0 .2rem 0 .7rem;font-size:.5rem;letter-spacing:.12em;color:var(--dim);text-align:right;line-height:1.2}
.prow{position:relative;padding:.17rem .2rem .17rem .7rem;border-radius:3px}
.prow.act{background:linear-gradient(90deg,rgba(255,215,122,.22),rgba(255,215,122,0) 90%)}
.prow.act::before{content:'';position:absolute;left:.08rem;top:50%;margin-top:-.28rem;border:.28rem solid transparent;border-left:.42rem solid var(--gold);border-right:0;animation:poke .5s steps(2) infinite}
.prow .nm{display:flex;align-items:center;gap:.2rem;min-width:0;white-space:nowrap;line-height:1.1}
.prow .n{overflow:hidden;text-overflow:ellipsis}
.prow .st{display:none;font-size:.5rem;padding:.02rem .18rem 0;border-radius:2px;line-height:1.3;letter-spacing:.04em;text-shadow:none}
.prow .st.on{display:inline-block}
.prow .st.psn{background:#5b2d82;color:#ecc8ff}.prow .st.zz{background:#2b3f8a;color:#d6e4ff}.prow .st.ko{background:#7a1c2c;color:#ffc4c4}
.prow .hpb{position:relative;height:.44rem;background:#050a1c;border:1px solid #000;box-shadow:0 0 0 1px rgba(110,140,200,.55);border-radius:2px;overflow:hidden}
.prow .hpb s,.prow .hpb i{position:absolute;left:0;top:0;bottom:0;display:block;text-decoration:none}
.prow .hpb s{background:#fff1c4}
.prow .hpb i{background:linear-gradient(#d2ffe2,#4cd884 40%,#1f8c4b);transition:width .2s ease-out}
.prow .hpb i.mid{background:linear-gradient(#fff4bf,#f4c63c 40%,#ad7a10)}
.prow .hpb i.lo{background:linear-gradient(#ffd0d0,#ff5b5b 40%,#ac2230)}
.prow .hpt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.prow.low .hpt{color:var(--bad)}
.prow .mpt{text-align:right;font-size:.66rem;color:var(--mp);font-variant-numeric:tabular-nums;line-height:1}
.prow.ko{opacity:.55}.prow.ko .n{color:var(--bad)}
.prow .lbb{grid-column:1/-1;display:flex;align-items:center;gap:.32rem;margin-top:.24rem}
.prow .lbb b{font-size:.6rem;letter-spacing:.12em;color:#ffc864;font-weight:600;line-height:1;min-width:2.9rem}
.prow .lbb .lbar{flex:1;position:relative;height:.46rem;background:#050a1c;border:1px solid #000;box-shadow:0 0 0 1px rgba(255,200,80,.45);border-radius:2px;overflow:hidden}
.prow .lbb .lbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe9a0,#ffb22a 50%,#c86a0a);transition:width .3s}
.prow .lbb em{font-style:normal;font-size:.6rem;color:#ffe3a0;min-width:2.5rem;text-align:right;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.prow .lbb.ready .lbar{box-shadow:0 0 0 1px #ffd36a,0 0 6px #ffb22a}
.prow .lbb.ready b,.prow .lbb.ready em{color:#fff2b8;animation:lbglow .7s ease-in-out infinite alternate}
.prow .lbb.on b,.prow .lbb.on em{color:#fff;text-shadow:0 0 4px #ff9a2a,0 0 8px #ff6a1a}
.prow .lbb.on .lbar i{background:linear-gradient(90deg,#ff6a2a,#ffe36a,#ffffff,#ffe36a,#ff6a2a);background-size:200% 100%;animation:lbflow .8s linear infinite}
.prow .mpt.inf{font-size:1rem;color:#ffe36a;text-shadow:0 0 4px #ff9a2a}
@keyframes lbglow{from{text-shadow:0 0 2px #ffb22a}to{text-shadow:0 0 7px #ffb22a,0 0 12px #ff8a1a}}
@keyframes lbflow{to{background-position:200% 0}}
/* CP mode: no MP column, a CP gauge in the header, a tappable Limit bar */
.bparty.cpm .phead,.bparty.cpm .prow{grid-template-columns:3.5rem minmax(0,1fr) 1.75rem 0}
.bparty.cpm .phead{display:flex;justify-content:space-between;align-items:center;padding-left:.5rem}
.bparty.cpm .mpt{display:none}
.cpv{display:flex;align-items:center;gap:.16rem;text-align:left;letter-spacing:0}
.cpv b{font-size:.56rem;color:#ffe36a;letter-spacing:.1em;margin-right:.18rem}
.cpv i{width:.42rem;height:.42rem;transform:rotate(45deg);background:#141a36;border:1px solid #4a5a8a;display:inline-block}
.cpv i.on{background:linear-gradient(135deg,#fff6c0,#ffc23a);border-color:#fff2b8;box-shadow:0 0 4px #ffb22a}
.cpv em{font-style:normal;font-size:.6rem;color:#ffe36a;margin-left:.2rem;min-width:.5rem}
.cpc{color:#ffe36a}
.bcmd .cpc{font-size:.62rem;letter-spacing:.02em}
.bparty.cpm{width:56%}
.bparty.cpm .phead,.bparty.cpm .prow{grid-template-columns:2.9rem minmax(0,1fr) 1.6rem 0;column-gap:.28rem}
.ultl{color:#ffe36a;text-shadow:0 0 6px #ff9a2a}
.prow .lbb{cursor:pointer;touch-action:manipulation}
.prow .lbb.tap .lbar{box-shadow:0 0 0 1px #fff2b8,0 0 9px #ffb22a;animation:lbtap .5s ease-in-out infinite alternate}
.prow .lbb.tap b,.prow .lbb.tap em{color:#fff;text-shadow:0 0 5px #ffb22a}
.prow .lbb.on .lbar i{background:linear-gradient(90deg,#ff6a2a,#ffe36a,#ffffff,#ffe36a,#ff6a2a);background-size:200% 100%;animation:lbflow .8s linear infinite}
@keyframes lbtap{from{transform:scaleY(1)}to{transform:scaleY(1.35)}}
.win.lbbanner small{display:block;font-size:.55rem;letter-spacing:.4em;color:#ffd890;text-align:center;margin-bottom:.1rem}
.win.lbbanner{left:50%;top:30%;transform:translateX(-50%);padding:0;font-size:1.55rem;font-weight:600;letter-spacing:.14em;white-space:nowrap;color:#fff2b8;background:none;border:0;box-shadow:none;
  text-shadow:0 0 6px #ff9a2a,0 0 14px #ff6a1a,2px 2px 0 #3a1400;animation:lbpop 1.1s ease-out forwards}
@keyframes lbpop{0%{transform:translateX(-50%) scale(.4);opacity:0}25%{transform:translateX(-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateX(-50%) scale(1);opacity:0}}
.bmsg{left:.3rem;right:.3rem;top:.3rem;text-align:center;font-size:.9rem;padding:.3rem .5rem}
.win.tidebadge{right:.35rem;top:.35rem;font-size:.6rem;padding:.06rem .4rem .02rem;letter-spacing:.08em;border-width:1px;border-radius:999px;box-shadow:none;background:rgba(6,14,40,.72)}
.tidebadge span{opacity:.7}
.tidebadge.flood{color:#9fd6ff}.tidebadge.ebb{color:#fff1b8}
.bcmd{font-size:.95rem;min-width:7.4rem}

/* the four friends' intro cards */
.fcard{left:6%;right:6%;top:16%;padding:.6rem .75rem .9rem;font-size:.88rem;line-height:1.35}
.fcard .fc-top{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.45rem}
.fcard .fc-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
.fcard .fc-pic{width:5.5rem;height:6.5rem;image-rendering:pixelated;image-rendering:crisp-edges;background:radial-gradient(closest-side,rgba(120,170,255,.25),rgba(120,170,255,0));flex:0 0 auto}
.fcard .fc-id{display:flex;flex-direction:column;gap:.1rem}
.fcard .fc-id b{font-size:1.3rem;font-weight:600;color:var(--gold);letter-spacing:.04em;line-height:1}
.fcard .fc-id span{font-size:.8rem;color:#cfe0ff}
.fcard .fc-id em{font-style:normal;font-size:.72rem;color:var(--hp)}
.fcard p{margin:.3rem 0 0}
.fcard .fc-who{color:#e8eeff}
.fcard .fc-fight{color:#cfdcf6;font-size:.82rem}
.fcard .fc-fight b{color:var(--gold);font-weight:600}
/* the hero creator */
.custom{left:5%;right:5%;top:4%;padding:.5rem .6rem .55rem;font-size:.84rem}
.custom .cz-prev{display:flex;align-items:flex-end;justify-content:center;gap:1.4rem;margin:.1rem 0 .35rem;padding:.3rem 0;border-radius:4px;
  background:radial-gradient(closest-side,rgba(120,170,255,.22),rgba(120,170,255,0))}
.custom canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.custom .cz-f{width:3rem;height:4.5rem}.custom .cz-b{width:7rem;height:7.5rem}
.custom .cz-rows{max-height:12.2rem;overflow:hidden;position:relative}
.custom .cz-rows.dn{-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.custom .cz-rows.up{-webkit-mask-image:linear-gradient(transparent,#000 20%);mask-image:linear-gradient(transparent,#000 20%)}
.custom .cz-rows.up.dn{-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.custom .cz-rows .opt{padding:.1rem .2rem .1rem 1rem}
.custom .cz-rows .opt em{font-style:normal;font-size:.6rem;color:var(--dim);margin-left:.15rem}
.custom .cz-sw{display:inline-block;width:.7rem;height:.7rem;border:1px solid #e6eeff;border-radius:2px;margin:0 .3rem -.08rem 0}
.custom .cz-help{text-align:center;margin-top:.3rem}
.fcard .fc-pic.big{width:5.6rem;height:6rem}
/* full menu */
.mm{inset:0;font-size:.9rem;display:flex;flex-direction:column;gap:.35rem;background:rgba(2,4,16,.62);border:0;border-radius:0;box-shadow:none;padding:.3rem}
.card{display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;align-items:center}
.card canvas{width:2.4rem;height:3.6rem;image-rendering:pixelated;grid-row:span 3}
.desc{font-size:.78rem;color:#cfe0ff;min-height:2.1em}
.statgrid{display:grid;grid-template-columns:auto auto;gap:.05rem 1rem;font-size:.85rem}
.up{color:#7dffb0}.down{color:#ff8a8a}
/* the second telling: Lift's forms, and the wanted poster */
.formcard{font-size:.82rem}
.formcard .fm-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem}
.formcard .fm-pic{width:4.4rem;height:4.7rem;image-rendering:pixelated;image-rendering:crisp-edges;flex:0 0 auto;background:radial-gradient(closest-side,rgba(120,170,255,.22),rgba(120,170,255,0))}
.formcard h3{font-size:1rem;margin:0}
.formcard .fm-lean{color:#ffe3a0;margin-top:.1rem}
.formcard .fm-row{margin-top:.3rem}
.win.poster{left:9%;right:9%;top:6%;padding:.7rem .8rem .8rem;text-align:center;color:#3a2412;text-shadow:none;border:2px solid #5a3a1f;border-radius:2px;
  background:linear-gradient(180deg,#e9d6a8,#d8bf88);box-shadow:0 0 0 2px #2a1a0e,inset 0 0 18px rgba(90,58,31,.45),0 4px 12px #000a}
.poster .wp-head{font-size:2.1rem;font-weight:600;letter-spacing:.18em;line-height:1;color:#3a1a0e}
.poster .wp-sub{font-size:.7rem;letter-spacing:.4em;margin:.15rem 0 .45rem;color:#6a2a1a}
.poster .wp-pic{display:flex;justify-content:center;margin:.1rem auto .4rem;width:6.2rem;height:7rem;align-items:center;border:2px solid #5a3a1f;background:#e6d2a0}
.poster .wp-face{width:5rem;height:5.6rem;image-rendering:pixelated;image-rendering:crisp-edges}
.poster .wp-name{font-size:1.05rem;font-weight:600;letter-spacing:.1em}
.poster .wp-for{font-size:.72rem;margin-top:.1rem;color:#5a3a1f}
.poster .wp-rew{margin-top:.5rem;font-size:.66rem;letter-spacing:.3em;color:#6a2a1a}
.poster .wp-rew b{display:block;font-size:1.35rem;letter-spacing:.08em;color:#8a1a10;margin-top:.1rem}
.poster .wp-notes{list-style:none;padding:0;margin:.45rem 0 0;font-size:.72rem;color:#4a2a14}
.poster .wp-notes li::before{content:'— '}
.poster .wp-foot{margin-top:.5rem;font-size:.58rem;letter-spacing:.06em;color:#7a5a3a}
/* touch controls, only when the game runs on its own on a phone */
body.touch{display:flex;flex-direction:column}
body.touch #app{height:auto;flex:1;min-height:0}
#pad{display:none}
body.touch #pad{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:36vh;max-height:300px;padding:.6rem 1.2rem calc(.6rem + env(safe-area-inset-bottom,0px));background:#0a0f24;border-top:2px solid #1d2a55;position:relative}
#pad .dp{position:relative;width:9.5rem;height:9.5rem;justify-self:center}
#pad .dp b{position:absolute;width:3.2rem;height:3.2rem;background:#263466;border:2px solid #3d4f8a;border-radius:.5rem}
#pad .dp b.on,#pad .ab b.on,#pad .ss b.on{background:#4a64b0}
#pad .dp .u{left:3.15rem;top:0}#pad .dp .d{left:3.15rem;bottom:0}#pad .dp .l{left:0;top:3.15rem}#pad .dp .r{right:0;top:3.15rem}
#pad .ab{position:relative;width:9rem;height:7rem;justify-self:center}
#pad .ab b{position:absolute;width:3.8rem;height:3.8rem;border-radius:50%;background:#7a2a5a;border:2px solid #b04a86;color:#ffd0ea;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
#pad .ab .a{right:0;top:0}#pad .ab .b{left:0;bottom:0}
#pad .ss{position:absolute;left:50%;bottom:calc(.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:1rem}
#pad .ss b{padding:.25rem .8rem;border-radius:1rem;background:#263466;border:2px solid #3d4f8a;font-size:.65rem;color:#bcd2ff;letter-spacing:.08em;font-weight:400}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="160" height="256"></canvas>
  <div id="ui"></div>
  <div id="fade"></div>
</div>
<div id="pad"><div class="dp"><b class="u" data-b="up"></b><b class="d" data-b="down"></b><b class="l" data-b="left"></b><b class="r" data-b="right"></b></div>
<div class="ab"><b class="a" data-b="a">A</b><b class="b" data-b="b">B</b></div><div class="ss"><b data-b="select">SELECT</b><b data-b="start">START</b></div></div>
<script>
(()=>{'use strict';
/* ===================== AUDIO: chip sound effects and a small music sequencer ===================== */
const AU=(()=>{
  const ZP=(()=>{try{return window.parent&&window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
  const AC=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;
  let ctx=null,master=null,musicBus=null,sfxBus=null,noiseBuf=null,pulses={};
  let musicOn=true,sfxOn=true,pending='',gestured=false;
  function init(){
    if(ctx||!AC)return;
    try{ctx=new AC()}catch(e){return}
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    musicBus=ctx.createGain();musicBus.gain.value=.55;musicBus.connect(master);
    sfxBus=ctx.createGain();sfxBus.gain.value=.8;sfxBus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    for(const duty of [.125,.25,.5]){const n=32,re=new Float32Array(n),im=new Float32Array(n);
      for(let k=1;k<n;k++){im[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*duty)}
      pulses[duty]=ctx.createPeriodicWave(re,im)}
  }
  function unlock(){gestured=true;init();if(ctx&&ctx.state!=='running')ctx.resume().then(()=>{if(pending&&!cur){const n=pending;curName='';playMusic(n)}}).catch(()=>{})}
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  function freq(n){const m=/^([A-G])([#b]?)(-?\d)$/.exec(n);if(!m)return 0;
    let s=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(s-69)/12)}
  function osc(type,f,t,len,vol,bus,opt={}){
    if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();
    if(type==='p12')o.setPeriodicWave(pulses[.125]);else if(type==='p25')o.setPeriodicWave(pulses[.25]);else o.type=type;
    o.frequency.setValueAtTime(f,t);
    if(opt.slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,opt.slide),t+len);
    if(opt.vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start(t+Math.min(.12,len*.5));l.stop(t+len+.05)}
    const a=opt.a||.006,r=Math.min(opt.r||.06,len*.6);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);
    if(opt.decay)g.gain.exponentialRampToValueAtTime(Math.max(.0004,vol*opt.decay),t+len);
    else{g.gain.setValueAtTime(vol,t+Math.max(a,len-r))}
    g.gain.linearRampToValueAtTime(0,t+len);

  // A channel is a string of tokens "D5:4 F5:2 -:2": lengths in sixteenths (a bare token keeps the last length).

    for(const tok of str.trim().split(/\s+/)){if(!tok)continue;const [n,l]=tok.split(':');if(l)len=+l;
      if(n==='-'){out.push([0,len]);continue}

const monCache=new Map();
function scaleParts(parts,k){if(k===1)return parts;return parts.map(p=>{const q={...p};for(const f of ['x','y','rx','ry','x1','y1','x2','y2','r','r2','cut','cutT'])if(q[f]!=null)q[f]*=k;if(q.pts)q.pts=q.pts.map(([x,y])=>[x*k,y*k]);return q})}
function monImg(kind,ramp){const k=kind+'|'+ramp;let c=monCache.get(k);if(!c){c=MON[kind](ramp);monCache.set(k,c)}return c}

/* ---------- tiny pixel digits for damage numbers ---------- */
const GLYPH={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
  'M':'101111111101101','I':'111010010010111','S':'111100111001111','+':'000010111010000','L':'100100100100111','V':'101101101101010','U':'101101101101111','P':'111101111100100','!':'010010010000010','Z':'111001010100111'};
function drawNum(g,s,x,y,col,ol='#0a0a14'){s=String(s);const w=s.length*4-1;let cx=Math.round(x-w/2);
  for(const ch of s){const gl=GLYPH[ch];if(gl){for(let pass=0;pass<2;pass++)for(let i=0;i<15;i++)if(gl[i]==='1'){const px=cx+i%3,py=y+(i/3|0);
    if(pass===0){g.fillStyle=ol;g.fillRect(px-1,py-1,3,3)}else{g.fillStyle=col;g.fillRect(px,py,1,1)}}}cx+=4}}

  const band=(y,hh,col)=>{g.fillStyle=col;g.fillRect(0,y,w,hh)};
  const hy=Math.round(h*.34);h=Math.round(h);
  if(kind==='beach'){grad([[0,'#0b1640'],[.4,'#2a3f80'],[.42,'#1d3f8e'],[.55,'#2f7cc6'],[.56,'#e6d39d'],[1,'#c9b27a']]);for(let i=0;i<40;i++){g.fillStyle=i%5?'#c8d8ff':'#fff';g.fillRect(r()*w|0,r()*hy*.8|0,1,1)}
    for(let i=0;i<14;i++){g.fillStyle='#7fc0f0';g.fillRect(r()*w|0,hy+3+(r()*h*.12|0),4,1)}g.fillStyle='#f5e7bd';for(let i=0;i<30;i++)g.fillRect(r()*w|0,h*.58+r()*h*.42|0,1,1)}

    for(let i=0;i<6;i++){const x=r()*w|0,y=h*.6+r()*h*.32|0,ww=10+r()*14|0;g.fillStyle='#2e4262';g.fillRect(x+2,y,ww-4,1);g.fillRect(x,y+1,ww,2);g.fillRect(x+2,y+3,ww-4,1);g.fillStyle='#6b93c6';g.fillRect(x+3,y+1,Math.max(2,ww/3|0),1)}}

function genWorld(){
  const W=46,H=46,m=[];for(let y=0;y<H;y++)m.push(Array(W).fill('~'));
  const nz=(x,y,s)=>Math.sin(x*.9+s)*.5+Math.sin(y*1.1+s*1.7)*.5+Math.sin((x+y)*.55+s*.3)*.45;
  const blob=(cx,cy,rx,ry,ch,s=0,amp=.2,only)=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;if(d<1+nz(x,y,s)*amp&&(!only||only.includes(m[y][x])))m[y][x]=ch}};
  const set=(x,y,ch)=>{if(x>=0&&y>=0&&x<W&&y<H)m[y][x]=ch};
  const line=(x0,y0,x1,y1,ch,only)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);if(!only||only.includes(m[y][x]))set(x,y,ch)}};
  // shallows
  blob(10,36,7,6.5,',',1);blob(9,8,7.5,6.5,',',2);blob(25,24,8.5,7,',',3,.28);blob(37,32,5,5,',',4);blob(36,9,6.5,5.5,',',5);blob(13,22,3,3,',',12);
  // land

    if(l&&(!cs[i]||(l.saved||0)>(cs[i].saved||0)))localNewer=true}

(()=>{let inConsole=false;try{inConsole=window.parent!==window&&!!window.parent.ZIGAPLAY}catch(e){}
  const touch='ontouchstart' in window||matchMedia('(pointer:coarse)').matches;if(inConsole||!touch)return;
  document.body.classList.add('touch');const pad=$('#pad');const active=new Map();
  const hit=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.dataset&&e.dataset.b?e:null};
  const upd=(ev)=>{ev.preventDefault();const now=new Map();for(const t of ev.touches){const e=hit(t.clientX,t.clientY);if(e)now.set(e.dataset.b,e)}
    for(const [b,e] of active)if(!now.has(b)){e.classList.remove('on');btn(b,false)}for(const [b,e] of now)if(!active.has(b)){e.classList.add('on');btn(b,true)}
    active.clear();for(const [b,e] of now)active.set(b,e)};

function tileAt(m,x,y){if(x<0||y<0||x>=m.w||y>=m.h)return m.border;return m.rows[y][x]}
function footOK(ch,tide){const t=TILE[ch];if(!t)return true;if(t.solid||t.deep)return false;
  if(t.shallow||t.reef||t.pool)return tide==='ebb';if(t.drift)return tide!=='ebb';
  if(ch==='u')return tide==='ebb';if(ch==='w'||ch==='i'&&false)return false;return true}
function sailOK(ch,tide){return tide==='flood'&&['~',',','u','w'].includes(ch)}
function onBoat(){const m=FD.map;return m.world&&!footOK(tileAt(m,FD.x,FD.y),S.tide)}
function npcAt(x,y){return FD.npcs.find(n=>n.visible&&n.x===x&&n.y===y)}
function chestAt(x,y){return FD.map.chests.find(c=>c.x===x&&c.y===y)}
function canEnter(x,y){const m=FD.map;
  if(x<0||y<0||x>=m.w||y>=m.h)return m.edge&&!m.world?'edge':null;
  if(npcAt(x,y)||chestAt(x,y))return null;
  const ch=tileAt(m,x,y);if(footOK(ch,S.tide))return'foot';
  if(m.world&&S.boat&&sailOK(ch,S.tide))return'boat';return null}

/* friends walking behind the leader: each takes the tile the one ahead just left */
function initTrail(){FD.trail=[];const m=FD.map,[dx,dy]=DIRS[FD.dir]||[0,1];let px=FD.x,py=FD.y;
  for(let k=1;k<=3;k++){const nx=FD.x-dx*k,ny=FD.y-dy*k;if(px===FD.x-dx*(k-1)&&py===FD.y-dy*(k-1)&&nx>=0&&ny>=0&&nx<m.w&&ny<m.h&&footOK(tileAt(m,nx,ny),S.tide)){px=nx;py=ny}FD.trail.push({x:px,y:py})}}

function applyHeal(h,kind,{amt,pct,mag}){const s=stats(h);
  if(kind==='revive'){if(h.hp>0)return 0;h.hp=Math.max(1,Math.round(s.hp*pct));h.st={};return h.hp}
  if(h.hp<=0)return 0;
  if(kind==='heal'){const v=amt!=null?amt:Math.round(s.hp*pct);const before=h.hp;h.hp=Math.min(s.hp,h.hp+v);return h.hp-before}
  if(kind==='mp'){const b=h.mp;h.mp=Math.min(s.mp,h.mp+amt);return h.mp-b}
  if(kind==='cure'){h.st={};return 1}
  if(kind==='full'){h.hp=s.hp;h.mp=s.mp;h.st={};return 1}return 0}
function itemUsable(id,h){const it=ITEMS[id];if(it.kind==='revive')return h.hp<=0;if(h.hp<=0)return false;const s=stats(h);

async function strike(src,dst,o,fx,quiet){

  if(fx==='slash'&&src.kind==='hero'&&!hasBig(src.id)){const [x,y]=heroPos(src);B.fx.push({kind:'swing',x,y,t:0,dur:13})}
  if(o.kind==='phys'&&Math.random()<.04&&!(dst.kind==='foe'&&asleep(dst))){if(fx)fxAt(dst,fx);AU.play('miss');pop(dst,'MISS','#ffffff');await sleep(380);return}

    sparks(dst,crit?12:7,fromHero?(crit?['#fff','#ffd77a','#ffb347']:['#fff','#bfe6ff','#7cc8ff']):['#fff','#ffb0a0','#ff5a4a'],fromHero?-1:1);
    if(crit&&fx==='slash')fxAt(dst,'slash2',{crit:1})}
  AU.play(crit?'crit':o.el==='water'&&!quiet?'water':'hit');if(o.el==='water'&&fx)AU.play('water');if(o.el==='moon')AU.play('moon');
  const lb=src.kind==='hero'&&B.ultNow===src;if(dst.kind==='hero')chargeLimit(dst.h,4);
  dst.fl=12;if(dst.kind==='hero')B.shake=6;if(lb)B.shake=7;pop(dst,v,dst.kind==='hero'?'#ffffff':lb?'#ffcf3a':crit?'#ffe08a':'#ffffff');
  if(asleep(dst)&&Math.random()<.5)setSleep(dst,0);

function pop(a,v,col='#fff',dy=0){const [x,y]=centerOf(a);B.nums.push({x,y:y-4+dy,v:String(v),col,t:0})}
function centerOf(a){if(a.kind==='foe')return[a.x,a.y-a.img.height/2];const [x,y]=heroPos(a);return hasBig(a.id)?[x+8,y]:[x+8,y+13]}
const eOut=x=>1-Math.pow(1-x,3),eIn=x=>x*x;
function heroPos(a){const H=sceneH(),n=B.heroes.length,big=hasBig(a.id);
  const top=n===2?H*.62:n===3?H*.5:H*.52,bot=H*.94,feet=n===1?H*.8:top+(bot-top)*a.i/(n-1);

/* ---------- fleeing, winning, losing ---------- */
async function tryFlee(){const ps=B.heroes.filter(alive).reduce((s,a)=>s+bst(a).spd,0)/Math.max(1,B.heroes.filter(alive).length);
  const fs=B.foes.filter(f=>!f.dead).reduce((s,f)=>s+f.def.spd,0)/Math.max(1,B.foes.filter(f=>!f.dead).length);
  const ch=clamp(.55+(ps-fs)*.03,.25,.92);if(Math.random()<ch){AU.play('flee');await bmsg('You slip away!',700);return true}
  await bmsg('Couldn\'t get away!',700);
  for(const f of B.foes.filter(f=>!f.dead)){await doAction(foeChoose(f));updateBattleUI();if(checkEnd())break}
  return false}
async function battleEnd(res){
  for(const h of partyHeroes()){h.st.sleep=0;h.st.poison=0;h.lbTurns=0}
  if(res==='flee'){return'flee'}
  if(res==='lose'&&B.opt.scripted){AU.music('');await bmsg(B.opt.loseMsg||'You fall...',1500);return'scripted'}
  if(res==='lose'){AU.music('');await bmsg(S&&S.lore>=3?'Lift falls...':'The sea closes over you...',1600);return'lose'}
  // win
  await sleep(500);AU.music('victory');
  const exp=B.foes.reduce((s,f)=>s+f.def.exp,0),gold=B.foes.reduce((s,f)=>s+f.def.gold,0);
  S.gold+=gold;const drops=[];for(const f of B.foes){const d=f.def.drop;if(d&&Math.random()<d[1]){addItem(d[0],1);drops.push(itemName(d[0]))}}
  B.over=true;
  const lines=[];if(exp)lines.push(`Gained <span class="gold">${exp} EXP</span> and <span class="gold">${gold} ${CUR()}</span>.`);
  if(drops.length)lines.push(`Found ${drops.map(d=>`<span class="gold">${d}</span>`).join(', ')}.`);
  const ups=[];
  for(const a of B.heroes){if(!alive(a))continue;const h=a.h;h.exp+=exp;
    while(h.lv<40&&h.exp>=expFor(h.lv+1)){const before=stats(h),oldSk=heroSkills(h);h.lv++;const after=stats(h);h.hp+=after.hp-before.hp;h.mp+=after.mp-before.mp;
      ups.push(`${a.name} is now <span class="gold">level ${h.lv}</span>!`);for(const s of heroSkills(h))if(!oldSk.includes(s))ups.push(`${a.name} learned <span class="gold">${SKILLS[s].name}</span>!`)}}
  for(const l of lines)await say(null,l);
  if(ups.length){AU.play('level');for(const u of ups)await say(null,u)}
  if(B.opt.boss)await sleep(100);
  return'win'}

  if(fw){g.fillStyle=c[1];g.fillRect(x,y,fw,3);g.fillStyle=c[0];g.fillRect(x,y,fw,1);g.fillStyle=c[2];g.fillRect(x,y+2,fw,1)}
  if(r<=.25&&r>0&&animT%24<12){g.globalCompositeOperation='lighter';g.globalAlpha*=.5;g.fillStyle='#ff6080';g.fillRect(x,y,fw,3)}
  g.restore()}
/* slash trails: a curved swoosh that grows from a thin tail to a sharp head, then wipes away */
function bez(P0,C,P1,s){const u=1-s;return[u*u*P0[0]+2*u*s*C[0]+s*s*P1[0],u*u*P0[1]+2*u*s*C[1]+s*s*P1[1]]}
function trail(P0,P1,bow,head,tail,wMax,col,alpha){if(head-tail<.02||alpha<=0)return;
  const dx=P1[0]-P0[0],dy=P1[1]-P0[1],L=Math.hypot(dx,dy)||1;const C=[(P0[0]+P1[0])/2-dy/L*bow,(P0[1]+P1[1])/2+dx/L*bow];
  const N=14,A=[],Z=[];
  for(let i=0;i<=N;i++){const u=i/N,s=tail+(head-tail)*u;const p=bez(P0,C,P1,s),q=bez(P0,C,P1,Math.min(1,s+.02)),q0=bez(P0,C,P1,Math.max(0,s-.02));
    const tx=q[0]-q0[0],ty=q[1]-q0[1],tl=Math.hypot(tx,ty)||1;const w=wMax*Math.sin(Math.PI*Math.pow(u,1.7))/2;
    A.push([p[0]-ty/tl*w,p[1]+tx/tl*w]);Z.push([p[0]+ty/tl*w,p[1]-tx/tl*w])}
  g.globalAlpha=alpha;g.fillStyle=col;g.beginPath();g.moveTo(A[0][0],A[0][1]);for(const p of A)g.lineTo(p[0],p[1]);for(let i=Z.length-1;i>=0;i--)g.lineTo(Z[i][0],Z[i][1]);g.closePath();g.fill();g.globalAlpha=1}
function drawFx(f){const p=f.t/f.dur;
  if(f.kind==='slash'||f.kind==='slash2'){const k=f.sc||1,rev=f.kind==='slash2';
    const head=eOut(clamp(p/.38,0,1)),tail=eIn(clamp((p-.14)/.56,0,1)),al=p<.7?1:1-(p-.7)/.3;
    const P0=[f.x+(rev?-16:16)*k,f.y-13*k],P1=[f.x+(rev?15:-15)*k,f.y+12*k],bow=(rev?-8:8)*k;
    trail(P0,P1,bow,head,tail,11*k,f.crit?'#ffb627':'#3f9dff',.5*al);
    trail(P0,P1,bow,head,tail,5.5*k,f.crit?'#fff1b8':'#cdeeff',.9*al);
    trail(P0,P1,bow,head,tail,2.4*k,'#ffffff',al);
    if(p>.2&&p<.5){const q=1-(p-.2)/.3,r=Math.round((2+q*5)*k);g.fillStyle=`rgba(255,255,255,${q})`;g.fillRect(Math.round(f.x-r),Math.round(f.y),r*2+1,1);g.fillRect(Math.round(f.x),Math.round(f.y-r),1,r*2+1)}}
  else if(f.kind==='claw'){const k=f.sc||1,al=p<.7?1:1-(p-.7)/.3;
    for(let i=-1;i<=1;i++){const d=(i+1)*.07;const head=eOut(clamp((p-d)/.36,0,1)),tail=eIn(clamp((p-d-.14)/.5,0,1));
      const o=i*4*k;const P0=[f.x-11*k+o*.7,f.y-11*k-o*.7],P1=[f.x+10*k+o*.7,f.y+9*k-o*.7];
      trail(P0,P1,-4*k,head,tail,6*k,'#ff3a2e',.55*al);trail(P0,P1,-4*k,head,tail,2.6*k,'#ffe2da',al)}}
  else if(f.kind==='lbflash'){g.fillStyle=`rgba(255,236,170,${.6*(1-p)})`;g.fillRect(0,0,VW,VH)}
  else if(f.kind==='arrow'){const q=Math.min(1,f.t/8),x=f.x0+(f.x1-f.x0)*q,y=f.y0+(f.y1-f.y0)*q,L=Math.hypot(f.x1-f.x0,f.y1-f.y0)||1,ux=(f.x1-f.x0)/L,uy=(f.y1-f.y0)/L;
    if(q<1){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.beginPath();g.moveTo(x-ux*14,y-uy*14);g.lineTo(x,y);g.stroke();
      g.strokeStyle='#e8dcc0';g.beginPath();g.moveTo(x-ux*7,y-uy*7);g.lineTo(x,y);g.stroke();g.fillStyle='#ffffff';g.fillRect(Math.round(x)-1,Math.round(y)-1,2,2);g.fillStyle='#c84a4a';g.fillRect(Math.round(x-ux*7),Math.round(y-uy*7)-1,1,3)}
    else{const r=Math.round(2+(f.t-8)*1.2),al=1-(f.t-8)/6;g.fillStyle=`rgba(255,255,255,${al})`;g.fillRect(Math.round(f.x1)-r,Math.round(f.y1),r*2+1,1);g.fillRect(Math.round(f.x1),Math.round(f.y1)-r,1,r*2+1)}}
  else if(f.kind==='swing'){const head=eOut(clamp(p/.45,0,1)),tail=eIn(clamp((p-.12)/.6,0,1)),al=p<.6?1:1-(p-.6)/.4;
    const P0=[f.x+5,f.y+3],P1=[f.x-1,f.y+23];trail(P0,P1,-8,head,tail,6,'#5fb6ff',.4*al);trail(P0,P1,-8,head,tail,2.4,'#ffffff',.9*al)}
  else if(f.kind==='water'){for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=p*14;g.fillStyle=i%2?'#7fc0f0':'#e8f6ff';g.fillRect(f.x+Math.cos(a)*r|0,f.y+Math.sin(a)*r-p*4|0,2,2)}}
  else if(f.kind==='moon'){g.fillStyle='rgba(255,255,255,'+(1-p)+')';for(let i=0;i<6;i++){const a=i/6*Math.PI*2+p*2;g.fillRect(f.x+Math.cos(a)*10*p|0,f.y+Math.sin(a)*10*p|0,2,2)}g.fillRect(f.x-1,f.y-14+p*10|0,2,12)}
  else if(f.kind==='heal'){for(let i=0;i<8;i++){g.fillStyle=i%2?'#a8ffcc':'#ffffff';g.fillRect(f.x-8+i*2,f.y+8-((p*30+i*7)%20)|0,1,2)}}
  else if(f.kind==='sleep'){g.fillStyle='#ffb0e0';for(let i=0;i<3;i++)g.fillRect(f.x+i*4-4,f.y-p*12-i*3|0,2,2)}
  else if(f.kind==='bigwater'){const H=sceneH();const x=VW*(1-p*1.4);g.fillStyle='rgba(80,160,240,.55)';g.beginPath();g.moveTo(x,H);for(let y=H;y>=H*.2;y-=4)g.lineTo(x+Math.sin(y/9+f.t/3)*6-(H-y)*.2,y);g.lineTo(x+60,H*.2);g.lineTo(x+60,H);g.fill();g.fillStyle='#e8f6ff';for(let y=H*.2;y<H;y+=6)g.fillRect(x+Math.sin(y/9+f.t/3)*6-(H-y)*.2|0,y|0,2,2)}
  else if(f.kind==='bigmoon'){g.fillStyle=`rgba(230,245,255,${.5*(1-Math.abs(p-.5)*2)})`;g.fillRect(0,0,VW,sceneH());for(const t of f.ts||[]){const [x,y]=centerOf(t);g.fillStyle='#fff';g.fillRect(x-1,0,3,y*Math.min(1,p*2))}}
  else if(f.kind==='bigheal'){}
  else if(f.kind==='bigtide'){const H=sceneH();g.fillStyle=`rgba(160,210,255,${.4*(1-p)})`;g.fillRect(0,0,VW,H);g.strokeStyle='#e8f6ff';g.beginPath();for(let x=0;x<VW;x+=2)g.lineTo(x,H*(1-p)+Math.sin(x/8+f.t/2)*4);g.stroke()}
  else if(f.kind==='bigguard'){for(const a of B.heroes){const [x,y]=heroPos(a);g.strokeStyle=`rgba(159,214,255,${1-p})`;g.strokeRect(x-2-p*4,y-2-p*4,20+p*8,28+p*8)}}
  else if(f.kind==='bigslam'||f.kind==='bigslash'){g.fillStyle=`rgba(255,255,255,${.35*(1-p)})`;g.fillRect(0,0,VW,sceneH())}
  else if(f.kind==='bigsleep'){}}

/* ===================== STORY: scenes and conversations ===================== */
const M='Marin',PE='Pell',YS='Ysolde',CO='Corvane';
const npc=id=>FD.npcs.find(n=>n.id===id);
function spawn(def){const n={hx:def.x,hy:def.y,ox:0,oy:0,dir:'down',wt:999,mv:0,visible:true,...def};FD.npcs.push(n);return n}
function despawn(id){FD.npcs=FD.npcs.filter(n=>n.id!==id)}
async function walkNpc(id,path){const n=npc(id);if(!n)return;for(const d of path){const [dx,dy]=DIRS[d];n.dir=d;n.x+=dx;n.y+=dy;n.mv=1;n.mvp=0;n.ox=-dx*16;n.oy=-dy*16;while(n.mv)await frames(1)}}
async function walkMe(path){for(const d of path){const [dx,dy]=DIRS[d];FD.dir=d;pushTrail(FD.x,FD.y);FD.x+=dx;FD.y+=dy;FD.moving=1;FD.mp=0;FD.scripted=1;FD.boatMove=0;FD.ox=-dx*16;FD.oy=-dy*16;while(FD.moving)await frames(1)}FD.scripted=0;S.x=FD.x;S.y=FD.y}
function face(id,d){if(id==='me')FD.dir=d;else{const n=npc(id);if(n)n.dir=d}}
async function flash(){AU.play('bell');await fade(1,true,180);await fade(0,true,500)}
async function getItem(id,n=1){addItem(id,n);AU.play('chest');await say(null,`Received <span class="gold">${itemName(id)}</span>${n>1?' ×'+n:''}.`)}
async function join(id){const lv=Math.max(S.heroes.marin.lv,id==='pell'?3:7);S.heroes[id]=mkHero(id,lv);S.party.push(id);AU.play('level');await say(null,`<span class="gold">${HEROES[id].name}</span> joins the party!`)}
function nearestWater(x,y){const m=MAPS.world;let best=null,bd=1e9;for(let yy=y-6;yy<=y+6;yy++)for(let xx=x-6;xx<=x+6;xx++){const ch=tileAt(m,xx,yy);if(sailOK(ch,'flood')&&ch!=='w'&&ch!=='u'){const d=Math.abs(xx-x)+Math.abs(yy-y);if(d<bd){bd=d;best=[xx,yy]}}}return best}
async function boss(id,opt={}){const r=await startBattle([id],{boss:1,bg:opt.bg||FD.map.bg,...opt});return r==='win'}
function pushBack(){FD.x=FD.px;FD.y=FD.py;S.x=FD.x;S.y=FD.y}

const STORY={
/* ---------- opening ---------- */

},

  if(F('pell'))return lines([['Gran Tilly','You\'ve got a boat now? With a salvager? Your mother would laugh herself silly.']]);

/* ===================== THE NEW TELLING: four friends and the Thorn =====================
   Lore 2. Marin, Pell, Ysolde and Wren walk the cliff road above Saltmere looking for a ruin on an old map, find a
   red sword in a ring of stones, and Marin touches it. The vines take all four; one may be pulled free, and whoever
   is pulled free carries the story from Thornwick on. */
const WR='Wren';
const THORN={k:1,fx:null};
const FRIEND_NPC={pell:'fpell',ysolde:'fysolde',wren:'fwren'};
const CHOSEN=()=>(S&&S.flags.chosen)||(S&&S.party[0])||'marin';
const CN=()=>HEROES[CHOSEN()].name;
/* lines of story text on black, one at a time; each stays until A is pressed */
function waitA(minMs=350){const t0=performance.now();uiCount++;return new Promise(r=>{const off=pushInput(b=>{if((b==='a'||b==='start')&&performance.now()-t0>=minMs){off();uiCount--;AU.play('ok');r()}})})}
async function crawl(lines){
  for(const t of lines){const w=win('',`<div style="text-align:center;line-height:1.5">${t}</div><div class="more" style="position:relative;margin:.6rem auto 0;right:auto;bottom:auto"></div>`,{left:'8%',right:'8%',top:'36%',background:'none',border:'0',boxShadow:'none',zIndex:'5'});
    w.style.opacity=0;w.style.transition='opacity .6s';await frames(2);w.style.opacity=1;await waitA();w.style.opacity=0;await sleep(500);w.remove()}}
/* the four friends, one card each: who they are and what they fight with */
const FRIENDS=[
  {id:'marin',role:'Tide-Diver',weapon:'Diver\'s Knife',who:'The best swimmer in Saltmere, and always the first one in.',fight:'Fights up close with a short diver\'s knife. Her <b>Tide</b> skills strike with seawater, and Turn Tide flips the battle between Flood and Ebb.'},
  {id:'pell',role:'Harpooner',weapon:'Old Harpoon',who:'Big, loud and loyal. Talks his way into trouble and fights his way out.',fight:'His long harpoon punches straight through armor. <b>Anchor Guard</b> braces the whole party against the next blows.'},
  {id:'ysolde',role:'Singer',weapon:'Silver Bell',who:'Quiet, until she sings. Then everyone stops to listen.',fight:'She rings a silver hand-bell as she sings. Her <b>Hymns</b> heal wounds, wash away poison and sing enemies to sleep.'},
  {id:'wren',role:'Scout',weapon:'Shortbow',who:'Sharp-eyed and quick, and the one who found the old map.',fight:'Fights from a distance with a shortbow. <b>Quick Shot</b> fires before anyone else can move, and <b>Volley</b> rains arrows on every foe.'}];
function portrait(id){if(hasBig(id)){const b=mk(58,62);b.getContext('2d').drawImage(heroBig(LOOKS[HEROES[id].look],'idle'),0,0);b.className='fc-pic big';return b}
  const c=mk(22,26),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(personImg(LOOKS[HEROES[id].look],'left',0),4,1);drawWeapon(x,HEROES[id].wt,4,8,0);c.className='fc-pic';return c}
async function friendCards(){
  for(let i=0;i<FRIENDS.length;i++){const f=FRIENDS[i],H=HEROES[f.id];
    const w=win('fcard',`<div class="fc-top"><span>Four friends from Saltmere</span><span>${i+1}/4</span></div>

async function flashRed(){fadeEl.classList.remove('white');fadeEl.classList.add('red');fadeEl.style.transitionDuration='90ms';fadeEl.style.opacity=.8;await sleep(110);
  fadeEl.style.transitionDuration='700ms';fadeEl.style.opacity=0;await sleep(720);fadeEl.classList.remove('red')}
async function sinkTo(who,to,ms){const st=who.map(w=>w==='me'?(FD.sink||0):((npc(w)||{}).sink||0)),t0=performance.now();
  while(true){const p=Math.min(1,(performance.now()-t0)/ms);who.forEach((w,i)=>{const v=st[i]+(to-st[i])*p;if(w==='me')FD.sink=v;else{const n=npc(w);if(n)n.sink=v}});if(p>=1)break;await frames(1)}}

/* the red vines: they creep out of the stone toward each of the four, then coil up around their legs */
const V={on:false};
function startVines(){V.on=true;V.t=0;V.fade=1;V.src=[7*16+8,6*16+13];
  V.tg=[['me',0],['fpell',10],['fysolde',18],['fwren',26]].map(([who,d])=>({who,d,grow:0,wrap:0,freed:false,ph:Math.random()*6}));
  V.ten=[...Array(9)].map((_,i)=>({a:i/9*Math.PI*2+Math.random()*.4,len:16+Math.random()*26,ph:Math.random()*6}));THORN.fx=drawVines}
function vinePos(t){if(t.who==='me')return[FD.x*16+FD.ox+8,FD.y*16+FD.oy+14];const n=npc(t.who);return n?[n.x*16+n.ox+8,n.y*16+n.oy+14]:null}
function drawVines(g,cx,cy){if(!V.on)return;V.t++;const [sx,sy]=V.src;
  const line=(pts,w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x-cx,y-cy):g.moveTo(x-cx,y-cy));g.stroke()};
  for(const d of V.ten){const L=d.len*Math.min(1,V.t/50)*V.fade;if(L<1)continue;const pts=[];
    for(let u=0;u<=1.001;u+=.1){const r=L*u,a=d.a+Math.sin(u*5+d.ph)*.35;pts.push([sx+Math.cos(a)*r,sy+Math.sin(a)*r*.6])}line(pts,2,'#4a0410');line(pts,1,'#b8182e')}
  for(const t of V.tg){const p=vinePos(t);if(!p)continue;
    if(t.freed){t.grow=Math.max(0,t.grow-.05);t.wrap=Math.max(0,t.wrap-.12)}else if(V.t>t.d){t.grow=Math.min(1,t.grow+.03);if(t.grow>=1)t.wrap=Math.min(1,t.wrap+.015)}
    const gr=t.grow*V.fade;if(gr<=0)continue;
    const [tx,ty]=p,dx=tx-sx,dy=ty-sy,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,pts=[];
    for(let u=0;u<=gr+.001;u+=.05){const w=Math.sin(u*Math.PI*3+t.ph+V.t/20)*3*(1-u*.6);pts.push([sx+dx*u+nx*w,sy+dy*u+ny*w])}
    line(pts,2.4,'#4a0410');line(pts,1,'#d0243c');
    for(let i=2;i<pts.length;i+=3){g.fillStyle='#ff7a8a';g.fillRect((pts[i][0]-cx+(i%2?1:-2))|0,(pts[i][1]-cy-1)|0,1,1)}
    const wr=t.wrap*V.fade;if(wr>0)for(let k=0;k<3;k++){if(k/3>=wr)break;const ry=ty-1-k*4.5-cy,rx=tx-cx;
      g.strokeStyle='#4a0410';g.lineWidth=2;g.beginPath();g.ellipse(rx,ry,6.5,2.2,-.25,0,Math.PI*2);g.stroke();
      g.strokeStyle='#e0304a';g.lineWidth=1;g.beginPath();g.ellipse(rx,ry,6.5,2.2,-.25,Math.PI*1.1,Math.PI*1.9);g.stroke()}}}

/* ===================== STRIKE AT NIGHT =====================
   Lore 3. Lift, the strongest fighter in Millbrook, holds the town against a night raid, until the Bandit Devil King
   comes through the gate. Beaten and on one knee, Lift is saved by a white fairy who blocks the killing blow, then
   goes into Lift; everything goes black, and Lift wakes in the Pale Wood. The story stops there for now. */

/* the white fairy: a tiny figure in a white dress with glassy wings, wrapped in light */
function drawFairy(g,x,y,t,k=1){x=Math.round(x);y=Math.round(y);const fl=Math.sin(t/2.6);
  g.save();g.globalCompositeOperation='lighter';const R=30*k;
  const gr=g.createRadialGradient(x,y-4,1,x,y-4,R);gr.addColorStop(0,'rgba(240,250,255,.95)');gr.addColorStop(.35,'rgba(180,215,255,.4)');gr.addColorStop(1,'rgba(160,200,255,0)');g.fillStyle=gr;g.fillRect(x-R,y-4-R,R*2,R*2);
  g.fillStyle='rgba(210,235,255,.55)';for(const s of [-1,1]){g.beginPath();g.ellipse(x+s*5,y-7,3.2,6+fl*1.6,s*.55,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(x+s*4,y-1,2.2,3.4+fl,s*-.4,0,Math.PI*2);g.fill()}
  g.restore();
  const p=(c,a,b,w=1,h=1)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h)};
  p('#ffffff',-1,-12,3,1);p('#ffffff',-2,-11,5,3);p('#ffeef0',-1,-10,3,2);p('#7a9ad8',-1,-10);p('#7a9ad8',1,-10);
  p('#ffffff',-1,-8,3,1);p('#f4f8ff',-2,-7,5,3);p('#dfeaff',-3,-4,7,3);p('#c8dcff',-3,-1,7,1);p('#fff4f0',-3,-6);p('#fff4f0',3,-6);
  for(let i=0;i<5;i++){const a=t/9+i*1.26,r=9+Math.sin(t/7+i)*2;p(i%2?'#ffffff':'#bfe0ff',Math.round(Math.cos(a)*r),Math.round(Math.sin(a)*r*.7-5))}}
/* the barrier the fairy throws up: a ring of white light that bursts outward */
function drawRing(g,r,cx,cy){r.t++;const p=r.t/r.dur;if(p>=1){FAIRY.ring=null;return}g.save();g.globalCompositeOperation='lighter';
  g.strokeStyle=`rgba(235,248,255,${1-p})`;g.lineWidth=3*(1-p)+1;g.beginPath();g.ellipse(r.x-cx,r.y-cy,8+p*40,10+p*44,0,0,Math.PI*2);g.stroke();
  g.fillStyle=`rgba(220,240,255,${.5*(1-p)})`;g.beginPath();g.ellipse(r.x-cx,r.y-cy,6+p*22,12+p*18,0,0,Math.PI*2);g.fill();g.restore()}

function absorbFx(sx,sy,cols){const t0=animT,P=[];for(let i=0;i<40;i++)P.push({d:i*1.5,a:Math.random()*Math.PI*2,r:6+Math.random()*12,big:Math.random()<.35});

    for(const p of P){const k=(t-p.d)/44;if(k<0){live=true;continue}if(k>1)continue;live=true;const e=k*k*(3-2*k);
      const x=sx+(tx-sx)*e+Math.cos(p.a+k*7)*p.r*(1-e),y=sy+(ty-sy)*e+Math.sin(p.a+k*7)*p.r*(1-e)-Math.sin(k*Math.PI)*12;
      g.globalAlpha=1-k*.4;g.fillStyle=cols[i0(p.d)%cols.length];g.fillRect(Math.round(x-cx),Math.round(y-cy),p.big?2:1,p.big?2:1)}
