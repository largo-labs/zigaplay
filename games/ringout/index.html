<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ring Out</title>
<style>
/* Ring Out: one tall canvas, 180 pixels wide and 220 to 340 tall, scaled up with crisp edges.
   Outside the ZigaPlay, touch screens get a D-pad and A/B buttons under it. */
:root{color-scheme:dark;--bg:#120c24;--pad:#2a2048;--edge:#06030f;--ink:#fff3c4}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 3px var(--edge),0 10px 30px rgba(0,0,0,.45);border-radius:4px}
html.zp #cv{box-shadow:none;border-radius:0}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:10px max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px));touch-action:none}
html.touch:not(.zp) #pad{display:flex}
.dp{position:relative;width:132px;height:132px}
.pb{position:absolute;border:3px solid var(--edge);background:var(--pad);color:var(--ink);font:700 18px/1 system-ui,sans-serif;box-shadow:0 4px 0 var(--edge);touch-action:none;display:grid;place-items:center;padding:0}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dp .pb{width:44px;height:44px;border-radius:8px}
#bU{left:44px;top:0}#bD{left:44px;top:88px}#bL{left:0;top:44px}#bR{left:88px;top:44px}
.ab{position:relative;width:150px;height:120px}
.ab .pb{width:64px;height:64px;border-radius:50%}
#bA{right:0;top:12px;background:#ff5f6a;color:#1a0610}#bB{left:6px;top:52px;background:#ffd84a;color:#1a1206}
#bS{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:12px;width:46px;height:34px;border-radius:17px;font-size:12px;display:none}
html.touch:not(.zp) #bS{display:grid}
</style>
<div id="stage"><canvas id="cv" width="180" height="300" aria-label="Ring Out"></canvas></div>
<div id="pad">
  <div class="dp"><button class="pb" id="bU" aria-label="Up">▲</button><button class="pb" id="bL" aria-label="Left">◀</button><button class="pb" id="bR" aria-label="Right">▶</button><button class="pb" id="bD" aria-label="Down">▼</button></div>
  <div class="ab"><button class="pb" id="bB" aria-label="B">B</button><button class="pb" id="bA" aria-label="A">A</button></div>
</div>
<button class="pb" id="bS" aria-label="Start">START</button>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
/* The screen is 180 pixels wide and as tall as the phone allows (220 to 340). Everything vertical in a fight
   (stage heights, jumps, gravity, launches) is designed for a 220-tall screen and scaled by VS, so a fight plays
   the same on every phone. */
const W=180,K='#140c22',WH='#ffffff',DH=220;
let H=300,VS=H/DH;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(rnd()*a.length)],lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0;
const store={get(k,d){try{const v=localStorage.getItem('ringout-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ringout-'+k,JSON.stringify(v))}catch(e){}}};
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const dk=c=>mix(c,'#140c22',.32),lt=c=>mix(c,'#ffffff',.38);
function padH(){return RT.classList.contains('touch')&&!ZP?Math.min(170,innerHeight*.3):0}
function targetH(){const aw=Math.max(1,innerWidth-(ZP?0:16)),ah=Math.max(1,innerHeight-padH()-(ZP?0:16));return clamp(Math.round(W*ah/aw/2)*2,220,340)}
function applySize(h){H=h||targetH();VS=H/DH;cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false}
function fit(){const pad=padH(),aw=innerWidth-(ZP?0:16),ah=innerHeight-pad-(ZP?0:16);
  let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s*2)/2;cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  document.getElementById('stage').style.bottom=pad+'px'}

/* ================= a pixel font (5x7), so the words stay crisp everywhere ================= */
const FD={A:'01110 10001 10001 11111 10001 10001 10001',B:'11110 10001 10001 11110 10001 10001 11110',C:'01110 10001 10000 10000 10000 10001 01110',D:'11110 10001 10001 10001 10001 10001 11110',
 E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',
 I:'01110 00100 00100 00100 00100 00100 01110',J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',
 M:'10001 11011 10101 10101 10001 10001 10001',N:'10001 10001 11001 10101 10011 10001 10001',O:'01110 10001 10001 10001 10001 10001 01110',P:'11110 10001 10001 11110 10000 10000 10000',
 Q:'01110 10001 10001 10001 10101 10010 01101',R:'11110 10001 10001 11110 10100 10010 10001',S:'01111 10000 10000 01110 00001 00001 11110',T:'11111 00100 00100 00100 00100 00100 00100',
 U:'10001 10001 10001 10001 10001 10001 01110',V:'10001 10001 10001 10001 10001 01010 00100',W:'10001 10001 10001 10101 10101 10101 01010',X:'10001 10001 01010 00100 01010 10001 10001',
 Y:'10001 10001 01010 00100 00100 00100 00100',Z:'11111 00001 00010 00100 01000 10000 11111',
 0:'01110 10001 10011 10101 11001 10001 01110',1:'00100 01100 00100 00100 00100 00100 01110',2:'01110 10001 00001 00010 00100 01000 11111',3:'11110 00001 00001 01110 00001 00001 11110',
 4:'00010 00110 01010 10010 11111 00010 00010',5:'11111 10000 11110 00001 00001 10001 01110',6:'00110 01000 10000 11110 10001 10001 01110',7:'11111 00001 00010 00100 01000 01000 01000',
 8:'01110 10001 10001 01110 10001 10001 01110',9:'01110 10001 10001 01111 00001 00010 01100',
 '!':'00100 00100 00100 00100 00100 00000 00100','?':'01110 10001 00001 00010 00100 00000 00100','.':'00000 00000 00000 00000 00000 01100 01100',',':'00000 00000 00000 00000 01100 00100 01000',
 ':':'00000 01100 01100 00000 01100 01100 00000','-':'00000 00000 00000 11111 00000 00000 00000','+':'00000 00100 00100 11111 00100 00100 00000','*':'00000 10001 01010 00100 01010 10001 00000',
 "'":'00100 00100 01000 00000 00000 00000 00000','/':'00001 00010 00010 00100 01000 01000 10000','(':'00010 00100 01000 01000 01000 00100 00010',')':'01000 00100 00010 00010 00010 00100 01000',
 '<':'00010 00100 01000 10000 01000 00100 00010','>':'01000 00100 00010 00001 00010 00100 01000','·':'00000 00000 00000 00100 00000 00000 00000','#':'01010 11111 01010 01010 11111 01010 00000',
 '♥':'00000 01010 11111 11111 01110 00100 00000','▲':'00000 00100 01110 11111 00000 00000 00000','▼':'00000 00000 11111 01110 00100 00000 00000','◀':'00010 00110 01110 11110 01110 00110 00010','▶':'01000 01100 01110 01111 01110 01100 01000'};
const FONT={};for(const k in FD)FONT[k]=FD[k].replace(/ /g,'');
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function txt(s,x,y,col,sc=1,al='l',sh=null){s=String(s).toUpperCase();let X=al==='c'?Math.round(x-tw(s,sc)/2):al==='r'?x-tw(s,sc):x;
  if(sh){txt(s,X+sc,y+sc,sh,sc,'l')}ctx.fillStyle=col;
  for(const ch of s){const g=FONT[ch];if(g)for(let i=0;i<35;i++)if(g[i]==='1')ctx.fillRect(X+(i%5)*sc,y+Math.floor(i/5)*sc,sc,sc);X+=6*sc}}
FONT['%']='11000'+'11001'+'00010'+'00100'+'01000'+'10011'+'00011';
FONT['=']='00000'+'00000'+'11111'+'00000'+'11111'+'00000'+'00000';
FONT['★']='00100'+'00100'+'11111'+'01110'+'01010'+'10001'+'00000';
FONT['&']='01100'+'10010'+'10100'+'01000'+'10101'+'10010'+'01101';
FONT['_']='00000'+'00000'+'00000'+'00000'+'00000'+'00000'+'11111';
/* a box with a pixel border, used by every menu */
function box(x,y,w,h,fill='#1e1438',edge='#ffd36a'){ctx.fillStyle=K;ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle=edge;ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}

/* ================= sound: little synths, no files ================= */
let AC=null,master=null,musicBus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.26;musicBus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.12,type='square',v=.2,t0=0,dest=null}){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.15,v=.2,f=1000,q=1,t0=0}){const a=AC;if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  swing(){noise({d:.07,f:2400,q:.8,v:.09})},
  hit(p=1){/* p: 0 light, 1 medium, 2 heavy */tone({f:220-p*40,f2:80,d:.08+p*.04,v:.22+p*.04});noise({d:.06+p*.05,f:1400-p*300,v:.2+p*.06})},
  smash(){tone({f:120,f2:40,d:.35,type:'sawtooth',v:.2});noise({d:.3,f:500,v:.32})},
  jump(){tone({f:330,f2:560,d:.1,type:'triangle',v:.12})},
  land(){noise({d:.05,f:300,v:.12})},
  dash(){noise({d:.09,f:900,q:.6,v:.12})},
  dodge(){tone({f:900,f2:1500,d:.08,type:'triangle',v:.08})},
  perfect(){[1047,1319,1568].forEach((f,i)=>tone({f,d:.12,type:'triangle',v:.13,t0:i*.05}))},
  shoot(){tone({f:700,f2:300,d:.12,type:'square',v:.1})},
  boom(){noise({d:.35,f:300,q:.5,v:.35});tone({f:90,f2:40,d:.3,v:.2})},
  counter(){tone({f:1400,d:.06,v:.12});tone({f:1800,d:.12,v:.12,t0:.06})},
  ko(){noise({d:.8,f:200,q:.4,v:.4});tone({f:200,f2:30,d:.7,type:'sawtooth',v:.22});tone({f:1200,f2:300,d:.5,type:'triangle',v:.1,t0:.05})},
  move(){tone({f:660,d:.04,v:.08})},
  pick(){tone({f:520,d:.06,v:.12});tone({f:780,d:.1,v:.12,t0:.06})},
  back(){tone({f:400,f2:260,d:.08,v:.1})},
  beep(){tone({f:520,d:.15,v:.14})},
  go(){tone({f:1040,d:.4,v:.16});tone({f:780,d:.4,type:'triangle',v:.12})},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone({f,d:.16,v:.12,t0:i*.1}))},
};
/* music: a driving fight loop (and a calmer one for the menus), melody, bass and drums */
const FMEL=[69,0,72,69,76,0,74,72,69,0,67,69,72,74,72,0, 69,0,72,69,79,0,77,76,74,0,72,74,76,72,69,0],FBASS=[45,45,57,45,48,48,60,48,43,43,55,43,45,45,57,45];
const MMEL=[64,67,71,72,71,67,64,0,62,66,69,71,69,66,62,0],MBASS=[40,40,47,47,38,38,45,45];
const mf=n=>440*Math.pow(2,(n-69)/12);let mus={on:false,step:0,next:0,timer:0,song:'menu'};
function musicTick(){const a=AC;if(!a||!mus.on)return;const fight=mus.song==='fight',spb=fight?.13:.2;
  while(mus.next<a.currentTime+.2){const s=mus.step,t=mus.next-a.currentTime,M=fight?FMEL:MMEL,B=fight?FBASS:MBASS;
    const n=M[s%M.length];if(n&&!muted)tone({f:mf(n),d:fight?.11:.18,type:'square',v:.07,t0:t,dest:musicBus});
    if(s%2===0){const bn=B[(s/2)%B.length];if(bn&&!muted)tone({f:mf(bn),d:.22,type:'triangle',v:.2,t0:t,dest:musicBus})}
    if(fight&&!muted){if(s%4===0)tone({f:110,f2:45,d:.1,v:.16,t0:t,dest:musicBus});if(s%4===2)noise({d:.05,f:4000,v:.05,t0:t})}
    mus.step++;mus.next+=spb}}
function music(on,song){if(song&&song!==mus.song){mus.song=song;mus.step=0}mus.on=on;const a=AC;if(on&&a){mus.next=Math.max(mus.next,a.currentTime+.05);if(!mus.timer)mus.timer=setInterval(musicTick,50)}}
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.5}

/* ================= input =================
   The buttons are held/released by the console (or the keyboard, or the touch pad). A press is remembered until
   the next game frame reads it, so a quick tap between two frames is never lost. */
const BTN=['up','down','left','right','a','b','start','select'];
const IN={held:{},pressed:{},released:{},last:{},frame:0};
for(const b of BTN){IN.held[b]=false;IN.pressed[b]=false;IN.released[b]=false;IN.last[b]=-99}
function input(btn,down){if(!BTN.includes(btn))return;if(down){if(!IN.held[btn])IN.pressed[btn]=true;IN.held[btn]=true}else{if(IN.held[btn])IN.released[btn]=true;IN.held[btn]=false}}
function clearPresses(){for(const b of BTN){IN.pressed[b]=false;IN.released[b]=false}}

/* ================= the fighters' bodies: little puppets drawn in code =================
   A fighter is a head, a body, two arms and two legs, posed by angles (0 = hanging straight down, 90 = pointing
   forward, 180 = straight up, -90 = pointing back), plus ears, a hat or hair, something on the back (a tail, a cape,
   a shell) and maybe a weapon. Each frame the pose is drawn into a small canvas, outlined in dark ink, and put on
   the screen facing the right way. */
const D2R=Math.PI/180;
const SIZES={S:{r:4,bw:6,bh:5,ll:5,al:5},M:{r:5,bw:7,bh:6,ll:6,al:6},L:{r:5,bw:9,bh:8,ll:7,al:6}};
const SP=56,OX=28,OY=44;
const SPR=document.createElement('canvas');SPR.width=SPR.height=SP;const sg=SPR.getContext('2d');
const SIL=document.createElement('canvas');SIL.width=SIL.height=SP;const lg=SIL.getContext('2d');
function sp(x,y,w,h,c){sg.fillStyle=c;sg.fillRect(Math.round(OX+x),Math.round(OY+y),w,h)}
function sdisc(cx,cy,r,c){sg.fillStyle=c;for(let dy=-Math.ceil(r);dy<=Math.ceil(r);dy++){const w=Math.sqrt(Math.max(0,r*r-dy*dy));if(w<.5)continue;sg.fillRect(Math.round(OX+cx-w),Math.round(OY+cy+dy),Math.round(w*2),1)}}
function seg(x0,y0,x1,y1,th,c){sg.fillStyle=c;const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*1.4));for(let i=0;i<=n;i++){const t=i/n;sg.fillRect(Math.round(OX+x0+(x1-x0)*t-th/2),Math.round(OY+y0+(y1-y0)*t-th/2),th,th)}}
function spoly(pts,c){sg.fillStyle=c;sg.beginPath();sg.moveTo(OX+pts[0][0],OY+pts[0][1]);for(let i=1;i<pts.length;i++)sg.lineTo(OX+pts[i][0],OY+pts[i][1]);sg.closePath();sg.fill()}
const endp=(x,y,a,l)=>[x+Math.sin(a*D2R)*l,y+Math.cos(a*D2R)*l];
/* poses: lean (degrees forward), arms aF/aB, legs lF/lB, eF (front arm reach, 1 = normal), kF (front leg reach),
   tuck (legs bent up), bob (head bob), sq (squash) */
const POSES={
  idle:{lean:0,aF:25,aB:-20,lF:6,lB:-6},
  crouch:{lean:8,aF:40,aB:-30,lF:35,lB:-35,tuck:.6,sq:.85},
  jump:{lean:-4,aF:150,aB:-150,lF:45,lB:-15,tuck:.75},
  fall:{lean:0,aF:110,aB:-110,lF:15,lB:-15},
  hurt:{lean:-22,aF:160,aB:140,lF:25,lB:-30},
  tumble:{lean:-10,aF:170,aB:-170,lF:60,lB:-60},
  dodge:{lean:10,aF:60,aB:-60,lF:40,lB:-40,tuck:.7,sq:.88},
  helpless:{lean:-8,aF:170,aB:-170,lF:10,lB:-10},
  win:{lean:0,aF:165,aB:-165,lF:10,lB:-10},
  lose:{lean:20,aF:10,aB:-10,lF:15,lB:-15,sq:.92},
  ledge:{lean:10,aF:150,aB:130,lF:20,lB:-10},
  /* attacks */
  jab1:{lean:8,aF:92,aB:-30,lF:20,lB:-15,eF:1.5},
  jab2:{lean:10,aF:40,aB:95,lF:-10,lB:25,eB:1.5},
  jab3:{lean:-6,aF:120,aB:-50,lF:95,lB:-5,kF:1.4},
  ftilt:{lean:14,aF:88,aB:-60,lF:25,lB:-25,eF:1.6},
  utilt:{lean:-6,aF:178,aB:-40,lF:10,lB:-10,eF:1.5},
  dtilt:{lean:18,aF:70,aB:-40,lF:80,lB:-40,tuck:.4,kF:1.4,sq:.85},
  dash:{lean:28,aF:100,aB:-80,lF:75,lB:-35,kF:1.4},
  nair:{lean:0,aF:100,aB:-100,lF:80,lB:-80,kF:1.3},
  fair:{lean:10,aF:80,aB:-40,lF:30,lB:-20,eF:1.6},
  uair:{lean:-14,aF:180,aB:170,lF:30,lB:-30,eF:1.5},
  dair:{lean:0,aF:150,aB:-150,lF:-4,lB:4,kF:1.4},
  cast:{lean:6,aF:90,aB:85,lF:20,lB:-20,eF:1.3,eB:1.2},
  charge:{lean:-8,aF:-50,aB:-80,lF:30,lB:-30,tuck:.5,sq:.92},
  punch:{lean:24,aF:90,aB:-90,lF:40,lB:-40,eF:1.8},
  rise:{lean:-6,aF:180,aB:-40,lF:10,lB:-20,eF:1.4},
  slam:{lean:0,aF:20,aB:-20,lF:0,lB:0},
  guard:{lean:-6,aF:130,aB:110,lF:15,lB:-15,eF:.8},
  spin:{lean:0,aF:95,aB:-95,lF:45,lB:-45,eF:1.3},
  grab:{lean:16,aF:85,aB:80,lF:20,lB:-20,eF:1.5,eB:1.4},
  throw:{lean:-14,aF:150,aB:130,lF:10,lB:-25},
  kick:{lean:-10,aF:120,aB:-60,lF:100,lB:-10,kF:1.5},
};
function walkPose(t,run){const s=Math.sin(t*(run?.5:.32)),m=run?48:28;return{lean:run?16:3,aF:-s*m*.9,aB:s*m*.9,lF:s*m,lB:-s*m,bob:Math.abs(s)<.5?-1:0}}
/* draws one fighter's sprite into SPR, then its dark silhouette into SIL */
function buildSprite(ch,P,t){const z=SIZES[ch.size],r=z.r,ll=z.ll*(P.tuck?1-P.tuck*.35:1),lean=P.lean||0;
  sg.clearRect(0,0,SP,SP);
  const hipY=-ll-0.5,neckX=Math.sin(lean*D2R)*z.bh,neckY=hipY-z.bh,hx=neckX+Math.sin(lean*D2R)*r*.6,hy=neckY-r+1+(P.bob||0);
  const skin=ch.skin,suit=ch.suit,acc=ch.acc,hair=ch.hair||ch.skin,dS=dk(skin),dU=dk(suit),dA=dk(acc);

    case'adodge':{const t=this.t;if(t<=6&&this.pr('a')){this.inv=0;this.startMove(this.N.dair);break}if(t<=6&&this.pr('b')){this.inv=0;this.special(0,1);break}

    case'grabbed':{const g=this.grabber;if(!g||g.dead||!g.mv||g.mv.victim!==this||this.t>80){this.st=this.ground?'ground':'air';this.t=0;this.grabber=null;break}return}

  ctlGround(c,h){

  G.kobeam={x,y,c:f.ch.fx,t:24};

  if(f.stocks<=0)G.matchEnd=G.matchEnd||{loser:f,t:90}}

/* ================= hits, launches, projectiles and effects ================= */
const ov=(a,b)=>a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;
function hurtBox(f){return{l:f.x-f.hw,r:f.x+f.hw,t:f.y-f.h,b:f.y}}
function worldBox(f,b){const x=f.x+f.face*b.x,y=f.y+b.y;return{l:x-b.w/2,r:x+b.w/2,t:y-b.h/2,b:y+b.h/2,cx:x,cy:y}}
function moveBoxes(f){const m=f.mv;if(!m)return[];const d=m.def;if(d.boxes)return d.boxes(f,m)||[];if(m.f>=d.s&&m.f<d.s+d.a)return d.hb;return[]}
const dodging=f=>(f.st==='dodge'||f.st==='adodge')&&f.inv>0;
/* knockback: grows with the target's percent (after the hit) and the hit's damage; heavier fighters fly less */
function kbSpeed(b,pct,w){return(b.kb+b.kg*pct/40*(1+b.dmg/28))*(200/(w+100))*.5}
function launch(A,B,b,dir,ranged){if(B.st==='grabbed'&&!b.thrown&&B.grabber&&B.grabber!==A){B.grabber.mv=null;B.grabber.st='air'}
  const wasHurt=B.st==='hurt'||B.st==='grabbed';if(B.mv&&B.mv.victim){const v=B.mv.victim;if(v.st==='grabbed'){v.st=v.ground?'ground':'air';v.t=0}}
  B.pct=Math.min(999,B.pct+b.dmg);if(A){A.dealt+=b.dmg}
  const v=kbSpeed(b,B.pct,B.w);let ang=b.ang;if(b.spikeAir&&B.ground)ang=60;if(ang<0&&B.ground)ang=-ang*.6;
  /* holding away from the hit nudges the angle a little (DI) */
  const di=B.hH*dir;if(di&&ang<80)ang+=di>0?-6:6;
  const r=ang*D2R;B.kx=Math.cos(r)*v*dir;B.ky=-Math.sin(r)*v*1.6*VS;B.vx=0;B.vy=0;if(B.ky<-.1)B.ground=null;
  B.hitstun=Math.round(clamp(v*8+5,8,70));B.st='hurt';B.t=0;B.tumble=v>2.6;B.mv=null;B.inv=0;
  const hl=Math.round(clamp(2+b.dmg/2.2,3,13));B.hitlag=hl;if(A&&!ranged)A.hitlag=hl;
  B.flash=8;B.upUsed=B.sideUsed=false;B.adodged=false;B.lastHit=A;
  if(A){if(wasHurt&&A.comboT>0)A.combo++;else A.combo=1;A.comboT=70;A.bestCombo=Math.max(A.bestCombo,A.combo);if(A.combo>=2)G.comboShow={f:A,n:A.combo,t:60}}
  const cx=B.x-dir*2,cy=B.y-B.h/2;spark(cx,cy,v>3.2?3:v>1.8?2:1,A?A.ch.fx:'#ffffff');SFX.hit(v>3.2?2:v>1.8?1:0);
  if(v>3.4){G.shake=Math.min(9,v*1.6);SFX.smash();G.kobeam=null}}
/* a perfectly timed dodge: the attacker is left wide open */
function perfectDodge(B,A){G.slow=18;SFX.perfect();text(B.x,B.y-B.h-8,'PERFECT DODGE!','#6af0ff');B.perfects++;
  B.st=B.ground?'ground':'air';B.t=0;B.inv=8;B.mv=null;B.adodged=false;
  A.st='stagger';A.t=0;A.stag=38;A.mv=null;A.vx*=.3;A.flash=0;burst(A.x,A.y-A.h-2,'#ffd84a',8)}
/* a counter catches the hit and strikes back */
function counterHit(B,A,inc){B.mv.done=1;B.mv.window=false;SFX.counter();text(B.x,B.y-B.h-8,'COUNTER!','#ffd84a');G.slow=10;
  if(A&&Math.abs(A.x-B.x)<60&&Math.abs(A.y-B.y)<50){B.face=sgn(A.x-B.x)||B.face;burst((A.x+B.x)/2,B.y-12,'#ffffff',12);
    launch(B,A,{dmg:Math.max(8,Math.round((inc.dmg||6)*1.3)),kb:3.3,kg:1.1,ang:38},B.face,false);B.hitlag=A.hitlag=12}}
function resolveHits(){
  for(const A of G.fighters){if(A.dead||!A.mv||A.hitlag>0)continue;const m=A.mv,d=m.def;
    for(const b of moveBoxes(A))if(hitWith(A,m,b,worldBox(A,b),d))break}
  for(const tb of G.tboxes){const A=tb.own;for(const b of tb.boxes)hitWith(A,tb,b,worldBox(A,b),null)}
  G.tboxes=G.tboxes.filter(t=>--t.life>0)}
function hitWith(A,m,b,wb,d){
  for(const B of G.fighters){if(B===A||B.dead||B.st==='respawn')continue;
    const last=m.hit.get(B);if(last!==undefined&&(!b.rehit||last===m.f))continue;if(!ov(wb,hurtBox(B)))continue;
    if(B.inv>0){if(dodging(B)&&!m.pdodged&&!b.grab&&d){m.pdodged=1;perfectDodge(B,A);return true}continue}
    if(b.grab){if(B.st==='grabbed')continue;m.hit.set(B,m.f);if(d&&d.onGrab){d.onGrab(A,m,B);B.grabber=A}return true}
    if(B.mv&&B.mv.window){m.hit.set(B,m.f);counterHit(B,A,b);return true}
    m.hit.set(B,m.f);m.connected=true;
    const dir=b.radial?(sgn(B.x-wb.cx)||A.face):b.back?-A.face:A.face;
    launch(A,B,b,dir,false);if(d&&d.onHit)d.onHit(A,m,B);return true}

/* ---------- projectiles ---------- */
function spawnProj(own,o){const p=Object.assign({own,t:0,hit:new Map()},o);p.vx0=p.vx;G.proj.push(p);return p}
const countProj=(own,tag)=>G.proj.filter(p=>p.own===own&&p.tag===tag&&p.life>0).length;
function projBox(p){return{l:p.x-p.w/2,r:p.x+p.w/2,t:p.y-p.h/2,b:p.y+p.h/2}}
function explode(p){p.life=0;SFX.boom();G.shake=Math.max(G.shake,4);burst(p.x,p.y,'#ffd84a',14);burst(p.x,p.y,'#ff8a3a',10);
  G.blasts.push({own:p.own,x:p.x,y:p.y,r:17,life:5,b:{dmg:p.dmg,kb:p.kb,kg:p.kg,ang:p.ang},hit:new Set()})}
function updProj(p){p.t++;p.life--;
  if(p.mine){if(!p.landed){p.vy+=p.g;p.y+=p.vy;const pl=platUnder(p.x,p.y-p.vy-1);if(pl&&p.y>=pl.y-2){p.y=pl.y-2;p.landed=1;p.vy=0}}}
  else if(p.boomer){const back=p.t>26;if(!back)p.vx=p.vx0*(1-p.t/30);else{const o=p.own,dx=o.x-p.x,dy=o.y-12-p.y,l=Math.hypot(dx,dy)||1;p.vx=lerp(p.vx,dx/l*3.6,.12);p.vy=lerp(p.vy,dy/l*3.6,.12);if(l<8&&!o.dead)p.life=0}p.x+=p.vx;p.y+=p.vy}
  else{p.vy+=p.g||0;p.x+=p.vx;p.y+=p.vy;if(p.float)p.y+=Math.sin(p.t*.15)*.5;
    if(p.hug){const pl=platUnder(p.x,p.y);if(!pl||pl.y-p.y>14)p.life=0;else p.y=pl.y-5}
    else if(p.vy>0){const pl=platUnder(p.x,p.y-p.vy-1);if(pl&&p.y>=pl.y-p.h/2){if(p.explode)explode(p);else if(p.bounce&&(p.bn=(p.bn||0)+1)<3){p.y=pl.y-p.h/2;p.vy=-1.6*VS}}}}
  if(p.x<-30||p.x>W+30||p.y>H+30||p.y<-60)p.life=0;
  if(p.life<=0){if(p.explode&&!p.boom&&p.t>1&&!p.mine){p.boom=1;explode(p)}return}
  const pb=projBox(p);
  for(const B of G.fighters){if(B===p.own||B.dead||B.st==='respawn')continue;
    if(p.mine&&p.t<p.arm)continue;
    const last=p.hit.get(B);if(last!==undefined&&(!p.rehit||p.t-last<p.rehit))continue;
    if(!ov(pb,hurtBox(B)))continue;
    if(B.mv&&B.mv.def.slot==='d'&&B.mv.reflect&&!p.mine){p.own=B;p.vx=-p.vx*1.25;p.vx0=-p.vx0;p.vy=-p.vy;p.hit=new Map();p.t=Math.min(p.t,4);SFX.counter();burst(p.x,p.y,B.ch.fx,6);text(B.x,B.y-B.h-8,'REFLECT!','#bff4ff');continue}
    if(B.mv&&B.mv.window){p.life=0;counterHit(B,p.own,p);continue}
    if(B.inv>0)continue;
    p.hit.set(B,p.t);
    if(p.explode){explode(p);return}
    launch(p.own,B,p,sgn(p.vx)||p.own.face,true);
    if(!p.boomer)p.life=0;return}
  /* two projectiles from different fighters cancel out */
  for(const q of G.proj)if(q!==p&&q.life>0&&q.own!==p.own&&!q.mine&&!p.mine&&ov(pb,projBox(q))){p.life=0;q.life=0;burst((p.x+q.x)/2,(p.y+q.y)/2,'#ffffff',6);SFX.hit(0)}}
function updBlasts(){for(const x of G.blasts){x.life--;for(const B of G.fighters){if(B===x.own||B.dead||B.inv>0||x.hit.has(B)||B.st==='respawn')continue;
      if(ov({l:x.x-x.r,r:x.x+x.r,t:x.y-x.r,b:x.y+x.r},hurtBox(B))){x.hit.add(B);launch(x.own,B,x.b,sgn(B.x-x.x)||1,true)}}}
  G.blasts=G.blasts.filter(x=>x.life>0)}
function addBoxFx(own,boxes,life){G.tboxes.push({own,boxes,life,hit:new Map(),f:0})}
/* ---------- particles and words ---------- */
function fx(o){G.parts.push(Object.assign({g:0},o))}
function dust(x,y,n){for(let i=0;i<n;i++)G.parts.push({x:x+(rnd()-.5)*8,y:y-1,vx:(rnd()-.5)*1.2,vy:-rnd()*.6,life:14+rnd()*8,c:'#ffffff',s:2,g:.02})}
function puff(x,y){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;G.parts.push({x,y,vx:Math.cos(a)*1.1,vy:Math.sin(a)*.5,life:12,c:'#ffffff',s:2,g:0})}}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,v=.6+rnd()*2;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:12+rnd()*12,c,s:rnd()<.3?2:1,g:.03})}}
function spark(x,y,lv,c){G.parts.push({x,y,life:6+lv*2,spark:lv,c,vx:0,vy:0,g:0});burst(x,y,c,3+lv*3)}
function text(x,y,s,c){G.texts.push({x:clamp(x,tw(s)/2+2,W-tw(s)/2-2),y,s,c,life:60})}
function updFx(){for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;if(p.ko){p.vx*=.95;p.vy*=.95}p.life--}G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=.3;t.life--}G.texts=G.texts.filter(t=>t.life>0);if(G.shake>0)G.shake-=.5;
  if(G.kobeam&&--G.kobeam.t<=0)G.kobeam=null;if(G.comboShow&&--G.comboShow.t<=0)G.comboShow=null}

/* ================= the CPU =================
   The computer presses the same buttons a player does, through its own pad. Level 1 to 9 sets how fast it
   reacts, how often it dodges in time, how readily it extends combos and how aggressive it is. */
function makePad(){const p={held:{},pressed:{},released:{}};for(const b of BTN){p.held[b]=false;p.pressed[b]=false;p.released[b]=false}return p}
const RANGED=['shot','charge','boomerang','bomb','beam','wave'];
class CPU{
  constructor(f,lv){this.f=f;this.lv=lv;this.pad=f.ctrl;this.t=0;this.next=0;this.taps=[];this.holdB=0;this.seenMove=null;this.dodgeAt=-1;this.wait=0;this.walkDir=0;this.rnd=rnd()}
  get react(){return Math.round(26-this.lv*2.5)}
  tap(b,delay=0){this.taps.push({b,at:this.t+delay})}
  clear(){for(const b of BTN){this.pad.pressed[b]=false;this.pad.released[b]=false}}
  hold(b,on){if(on&&!this.pad.held[b])this.pad.pressed[b]=true;if(!on&&this.pad.held[b])this.pad.released[b]=true;this.pad.held[b]=on}
  dirs(h,v){this.hold('left',h<0);this.hold('right',h>0);this.hold('up',v<0);this.hold('down',v>0)}
  think(){this.t++;const me=this.f,op=G.fighters.find(o=>o!==me);if(!op)return;
    for(const k of this.taps.filter(k=>k.at<=this.t)){this.pad.pressed[k.b]=true;this.pad.held[k.b]=true;k.done=1;k.rel=this.t+2}
    this.taps=this.taps.filter(k=>!k.done);
    if(this.holdB>0){this.holdB--;this.pad.held.b=true;if(this.holdB===0)this.hold('b',false)}else if(this.pad.held.b&&!this.pad.pressed.b)this.hold('b',false);
    if(this.pad.held.a&&!this.pad.pressed.a)this.hold('a',false);
    if(me.dead||me.hitlag>0)return;
    const S=G.stage.main,lv=this.lv,dx=op.x-me.x,dy=op.y-me.y,adx=Math.abs(dx),toward=sgn(dx)||me.face;
    if(me.st==='hurt'){this.dirs(me.x<W/2?1:-1,0);return}
    if(me.st==='grabbed'||me.st==='stagger'||me.st==='climb')return;
    if(me.st==='respawn'){if(this.t%40===0&&rnd()<.6)this.tap('down');return}
    /* off the stage: get back */
    const off=me.x<S.l-2||me.x>S.r+2;
    if(!me.ground&&(off||me.y>S.y+4)){const mid=(S.l+S.r)/2,under=!off&&me.y>S.y+2;
      /* under the stage: head for the nearer edge first, then come up around it */
      const home=under?(me.x<mid?-1:1):(me.x<mid?1:-1),edge=me.x<mid?S.l:S.r,far=Math.abs(me.x-edge);
      this.dirs(home,0);
      if(me.st==='air'){const low=me.y>S.y-12*VS;
        if(!under&&far>46&&!me.sideUsed&&['dash','rocket','blink','flipkick'].includes(me.ch.sp.s[0])&&me.y<S.y+30*VS&&lv>1){this.dirs(home,0);this.tap('b');return}
        if(low&&me.jumps>0&&me.vy>-.5*VS&&this.t%6===0&&!(under&&far<30))this.tap('up');
        else if(low&&me.jumps<=0&&!me.upUsed&&(under?far>18||me.x<S.l||me.x>S.r:true)&&(me.y>S.y+6*VS||far>34)&&(lv>2||rnd()<.5)){this.dirs(under?home:home,-1);this.tap('b')}}
      else if(me.st==='special'&&me.mv&&me.mv.def.slot==='u')this.dirs(home,-1);
      return}
    if(me.st==='helpless'||me.st==='attack'&&!me.mv.connected||me.st==='land'||me.st==='jsq')return this.combo(me,op);
    if(me.st==='special')return this.chargeCheck(me,op);
    /* a dodge, timed to the opponent's swing */
    if(op.mv&&op.mv!==this.seenMove&&(op.st==='attack'||op.st==='special')&&adx<46&&Math.abs(dy)<40){this.seenMove=op.mv;
      const d=op.mv.def,until=(d.s!=null?d.s:8)-op.mv.f;
      if(rnd()<.04+lv*.09){const err=Math.round((rnd()-.5)*(12-lv));this.dodgeAt=this.t+Math.max(0,until-3+err)}}
    if(this.dodgeAt>=0&&this.t>=this.dodgeAt){this.dodgeAt=-1;if(me.st==='ground'||me.st==='air'){this.dirs(rnd()<.4?-toward:0,0);this.tap('down');return}}
    if(op.st==='stagger'||op.st==='land'&&op.lag>8){/* punish */this.approachAndHit(me,op,dx,dy,adx,toward,1);return}
    if(this.t<this.next){this.keepMoving(me,op,toward,adx);return}
    this.next=this.t+Math.max(3,this.react+Math.round(rnd()*6));
    this.approachAndHit(me,op,dx,dy,adx,toward,0)}
  approachAndHit(me,op,dx,dy,adx,toward,punish){const lv=this.lv,ch=me.ch,S=G.stage.main,ranged=RANGED.includes(ch.sp.n[0]);
    const reach=ch.style==='sword'?24:ch.size==='L'?20:17,same=Math.abs(dy)<16*VS;
    if(op.dead||op.st==='respawn'){this.dirs(sgn(W/2-me.x)*(Math.abs(W/2-me.x)>20?1:0),0);return}
    if(adx<reach&&same){me.face=toward;this.dirs(0,0);
      const r=rnd();if(me.ground){if(r<.45)this.tap('a');else if(r<.75){this.dirs(toward,0);this.tap('a')}else if(r<.9){this.dirs(0,1);this.tap('down');this.tap('a',1)}else{const room=toward>0?S.r-me.x:me.x-S.l;if(room>70||['whip','grab'].includes(ch.sp.s[0])){this.dirs(toward,0);this.tap('b')}else this.tap('a')}}
      else this.tap('a');
      this.comboWant=rnd()<.25+lv*.08;return}
    if(adx<20&&dy<-14*VS&&dy>-60*VS){this.dirs(0,-1);this.tap('up');this.tap('a',rnd()<.5?1:6);return}
    if(!me.ground&&adx<14&&dy>8*VS){this.dirs(0,1);this.tap('a');return}
    if(ranged&&adx>40&&adx<120&&same&&rnd()<.2+lv*.03){me.face=toward;this.dirs(0,0);this.tap('b');if(ch.sp.n[0]==='charge')this.holdB=20+Math.round(rnd()*40);return}
    if(!punish&&adx<60&&rnd()<.12+lv*.015&&me.ground){/* a side special, but never one that runs off the edge */const room=toward>0?S.r-me.x:me.x-S.l;if(room>70||adx<room){this.dirs(toward,0);this.tap('b');return}}
    /* get closer: run when far, jump up to a platform the opponent stands on */
    this.walkDir=toward;
    if(dy<-20*VS&&adx<50&&me.ground&&rnd()<.5){this.tap('up');return}
    if(adx>36&&me.ground&&me.st==='ground'&&!me.run){this.dirs(0,0);this.tap(toward<0?'left':'right');this.tap(toward<0?'left':'right',3)}}
  keepMoving(me,op,toward,adx){const S=G.stage.main;
    if(me.st!=='ground'&&me.st!=='air')return;
    let h=adx>14?toward:0;if(me.ground===S&&((me.x<S.l+12&&h<0)||(me.x>S.r-12&&h>0)))h=0;
    if(!me.ground&&!(me.x<S.l||me.x>S.r))h=adx>10?toward:0;
    this.hold('left',h<0);this.hold('right',h>0);this.hold('up',false);this.hold('down',false)}
  combo(me,op){/* after a hit: keep going with A, or cancel into a special */
    const m=me.mv;if(!m)return;if(m.connected&&this.comboWant){const d=m.def,r=rnd();
      if(d.next&&r<.75){this.tap('a');return}
      if(r<.5){const h=sgn(op.x-me.x),S=G.stage.main,room=h>0?S.r-me.x:me.x-S.l;let v=rnd();if(v<.35&&room<70&&me.ch.sp.s[0]!=='whip'&&me.ch.sp.s[0]!=='grab')v=.5;if(v<.35)this.dirs(h,0);else if(v<.6)this.dirs(0,-1);else if(v<.75)this.dirs(0,1);else this.dirs(0,0);this.tap('b');this.comboWant=false}}
    else if(m.def.next&&rnd()<.3&&Math.abs(op.x-me.x)<20)this.tap('a')}
  chargeCheck(me,op){if(me.mv&&me.mv.def.slot==='u'){const S=G.stage.main;this.dirs(me.x<(S.l+S.r)/2?1:-1,-1)}}
}

/* ================= stages =================
   Laid out on a 180 x 220 design screen; heights are scaled by VS to the real screen. The main stage is solid
   (land on it, bump into it); the small platforms can be jumped up through and dropped through (tap down twice). */
const STAGES=[
  {id:'sky',name:'SKY TEMPLE',main:{l:28,r:152,y:158,th:22},soft:[{l:42,r:78,y:120},{l:102,r:138,y:120},{l:72,r:108,y:84},{l:16,r:48,y:52},{l:132,r:164,y:52}],spawn:42,
   sky:['#5aa8ff','#bfe6ff'],top:'#7ad86a',side:'#c8b89a',dark:'#8a7a62',plank:'#e8dcc0'},
  {id:'bridge',name:'OLD BRIDGE',main:{l:14,r:166,y:162,th:12},soft:[{l:62,r:118,y:120},{l:20,r:56,y:84},{l:124,r:160,y:84},{l:70,r:110,y:50}],spawn:30,
   sky:['#ff8a5a','#ffd890'],top:'#b07a44',side:'#8a5a34',dark:'#5a3a1e',plank:'#c08a54'},
  {id:'lava',name:'LAVA PEAK',main:{l:36,r:144,y:156,th:30},soft:[{l:16,r:52,y:118},{l:128,r:164,y:118},{l:72,r:108,y:84},{l:24,r:56,y:52},{l:124,r:156,y:52}],spawn:40,
   sky:['#2a0c1a','#8a2a1a'],top:'#5a4a4a',side:'#3a2e30',dark:'#241c1e',plank:'#6a5a5a'},
  {id:'roof',name:'NEON ROOF',main:{l:22,r:158,y:160,th:22},soft:[{l:30,r:70,y:124},{l:110,r:150,y:124},{l:70,r:110,y:90},{l:24,r:60,y:56},{l:120,r:156,y:56}],spawn:30,
   sky:['#0c0a2a','#3a1a5a'],top:'#4a4a6a',side:'#2a2a44',dark:'#1a1a30',plank:'#ff5fd8'},
];

  for(let y=0;y<H;y+=8){ctx.fillStyle=(y/8)%2?'#170f2e':'#140c28';ctx.fillRect(0,y,W,8)}
  txt(step?'CHOOSE YOUR RIVAL':'CHOOSE YOUR FIGHTER',W/2,3,step?TAGC[1]:TAGC[0],1,'c',K);
  const gy=gridY(),ch=ROSTER[sel.cur[step]],ty=13,th=gy-ty-5;
  box(3,ty,W-6,th,'#1e1438',step?TAGC[1]:TAGC[0]);
  const c=portrait(ch,'idle'),px=27,py=ty+th/2+16;circle(px,py-18,20,'#3a2a6a');circle(px,py-18,16,'#4a3a86');ctx.drawImage(c,0,0,SP,SP,px-OX*2,py-OY*2,SP*2,SP*2);
  const ix=50;txt(ch.name,ix,ty+4,'#ffffff',2,'l',K);
  const wins=(G.wins[ch.id]||0);if(wins)txt('★'+wins,W-7,ty+4,'#ffd84a',1,'r');
  const bl=wrap(ch.blurb,21);bl.slice(0,2).forEach((s,i)=>txt(s,ix,ty+20+i*8,'#c8b8ff'));
  const sp=ch.sp,ln=[['B',sp.n[1].name],['B◀▶',sp.s[1].name],['B▲',sp.u[1].name],['B▼',sp.d[1].name]];
  const ly=ty+th-36;ln.forEach(([k,n],i)=>{txt(k,ix,ly+i*8,'#ffd84a');txt(n,ix+26,ly+i*8,'#ffffff')});
  if(step)txt('SELECT: RANDOM',W-7,ty+th-46,'#8a7ab0',1,'r');
  for(let i=0;i<ROSTER.length;i++){const cx=5+(i%GC)*CW,cy=gy+Math.floor(i/GC)*CH,c2=ROSTER[i];
    ctx.fillStyle=(i+Math.floor(i/GC))%2?'#241a44':'#2a2050';ctx.fillRect(cx,cy,CW-2,CH-2);
    ctx.save();ctx.beginPath();ctx.rect(cx,cy,CW-2,CH-2);ctx.clip();const pc=portrait(c2,'idle');ctx.drawImage(pc,cx+(CW-2)/2-OX,cy+CH-4-OY);ctx.restore();
    if(step===1&&sel.picked[0]===i){ctx.fillStyle=TAGC[0];ctx.fillRect(cx+1,cy+1,6,5);txt('1',cx+2,cy,'#fff')}
    if(sel.cur[step]===i){const on=Math.floor(now/250)%2;ctx.strokeStyle=on?'#ffffff':(step?TAGC[1]:TAGC[0]);ctx.lineWidth=2;ctx.strokeRect(cx,cy,CW-2,CH-2)}}}
function selectInput(){const p=IN.pressed,sel=G.sel,s=sel.step;let c=sel.cur[s];
  if(p.left){c=(c%GC===0)?c+GC-1:c-1;SFX.move()}if(p.right){c=(c%GC===GC-1)?c-GC+1:c+1;SFX.move()}
  if(p.up){c=(c-GC+ROSTER.length)%ROSTER.length;SFX.move()}if(p.down){c=(c+GC)%ROSTER.length;SFX.move()}
  sel.cur[s]=c;
  if(p.b){SFX.back();if(s===0)toTitle();else sel.step=0;return}
  if(s===1&&p.select){sel.cur[1]=Math.floor(rnd()*ROSTER.length);sel.picked[1]=sel.cur[1];SFX.pick();toStage();return}
  if(p.a||p.start){SFX.pick();sel.picked[s]=c;if(s===0){sel.step=1;if(sel.cur[1]==null||sel.cur[1]===c)sel.cur[1]=(c+1+Math.floor(rnd()*(ROSTER.length-1)))%ROSTER.length}else toStage()}}
/* ---------- choose a stage ---------- */
function drawStageSel(now){ctx.fillStyle='#120c24';ctx.fillRect(0,0,W,H);txt('CHOOSE A STAGE',W/2,4,'#ffd84a',1,'c',K);
  const st=G.stageThumbs[G.stageSel],tw2=Math.round(W*.78),th2=Math.round(H*.78*.78),tx=Math.round(W/2-tw2/2),ty=16;
  box(tx,ty,tw2,th2,'#000','#ffd36a');ctx.drawImage(st.bg,0,0,W,H,tx,ty,tw2,th2);
  const[a,b]=G.sel.picked.map(i=>ROSTER[i]),sc=tw2/W;
  ctx.save();ctx.translate(tx,ty);ctx.scale(sc,th2/H);for(const p of st.plats)if(p.soft){ctx.fillStyle=st.def.plank;ctx.fillRect(p.l,p.y,p.r-p.l,3)}
  ctx.restore();
  const by=ty+th2+8;txt('◀ '+st.name+' ▶',W/2,by,'#ffffff',1,'c',K);
  txt(STAGES.map((_,i)=>i===G.stageSel?'*':'·').join(' '),W/2,by+11,'#ffd84a',1,'c');
  const cy=by+24;ctx.drawImage(portrait(a),W/2-40-OX,cy+26-OY);txt('VS',W/2,cy+8,'#ffd84a',2,'c',K);ctx.save();ctx.translate(W/2+40,0);ctx.scale(-1,1);ctx.drawImage(portrait(b),-OX,cy+26-OY);ctx.restore();
  if(cy+40<H)hint('A: FIGHT!   B: BACK',Math.min(H-10,cy+40))}
function stageInput(){const p=IN.pressed;if(p.left){G.stageSel=(G.stageSel+STAGES.length-1)%STAGES.length;SFX.move()}if(p.right){G.stageSel=(G.stageSel+1)%STAGES.length;SFX.move()}
  if(p.b){SFX.back();G.state='select';G.sel.step=1;return}if(p.a||p.start){SFX.pick();startFight(G.sel.picked[0],G.sel.picked[1],G.stageSel)}}
/* ---------- pause: your moves ---------- */
function drawPause(now){ctx.fillStyle='rgba(10,6,24,.72)';ctx.fillRect(0,0,W,H);const f=G.fighters[0],ch=f.ch,y=Math.round(H/2-62);
  box(6,y,W-12,124,'#1e1438','#ffd36a');txt('PAUSED',W/2,y+5,'#ffd84a',2,'c',K);txt(ch.name+"'S MOVES",W/2,y+22,'#c8b8ff',1,'c');
  const sp=ch.sp,ln=[['B',sp.n[1].name],['B◀▶',sp.s[1].name],['B▲',sp.u[1].name],['B▼',sp.d[1].name]];
  ln.forEach(([k,n],i)=>{txt(k,14,y+34+i*10,'#ffd84a');txt(n,40,y+34+i*10,'#ffffff')});
  txt('A A A JAB · A+◀▶ SMACK',W/2,y+78,'#c8b8ff',1,'c');txt('HIT WITH A, THEN B = COMBO',W/2,y+88,'#c8b8ff',1,'c');
  txt('A: KEEP FIGHTING',W/2,y+102,'#ffffff',1,'c');txt('B: QUIT THE MATCH',W/2,y+112,'#ffffff',1,'c')}
/* ---------- results ---------- */
function drawResults(now){const r=G.result,st=G.stage;ctx.drawImage(st.bg,0,0);ctx.fillStyle='rgba(10,6,24,.66)';ctx.fillRect(0,0,W,H);
  const w=r.winner;logo('GAME!',Math.round(H*.05),now,1);
  const fy=Math.round(H*.05)+34+60;ctx.save();const c=portrait(w.ch,'win');ctx.translate(W/2,fy);ctx.drawImage(c,0,0,SP,SP,-OX*2,-OY*2,SP*2,SP*2);ctx.restore();
  txt(w.ch.name+' WINS!',W/2,fy+6,TAGC[w.slot],2,'c',K);
  const ty=fy+26;box(8,ty,W-16,62,'#1e1438','#ffd36a');
  const rows=[['KOS',f=>f.kos],['FALLS',f=>f.falls],['DAMAGE',f=>f.dealt+'%'],['BEST COMBO',f=>f.bestCombo],['PERFECT DODGE',f=>f.perfects]];
  txt('P1',W-58,ty+3,TAGC[0],1,'c');txt('CPU',W-26,ty+3,TAGC[1],1,'c');
  rows.forEach(([k,fn],i)=>{const yy=ty+13+i*9;txt(k,14,yy,'#c8b8ff');txt(fn(G.fighters[0]),W-58,yy,'#ffffff',1,'c');txt(fn(G.fighters[1]),W-26,yy,'#ffffff',1,'c')});
  if(G.resT<=0&&ty+70<H){hint('A: REMATCH',Math.min(H-20,ty+68),'#ffffff');hint('B: NEW FIGHTERS',Math.min(H-10,ty+78),'#ffffff')}}
function resultInput(){if(G.resT>0)return;const p=IN.pressed;if(p.a||p.start){SFX.pick();startFight(G.sel.picked[0],G.sel.picked[1],G.stageSel)}else if(p.b){SFX.back();toSelect(0)}}

/* ================= the flow of the game ================= */
const SAVED=store.get('settings',{});G.stocks=clamp(SAVED.stocks||3,1,5);G.level=clamp(SAVED.level||3,1,9);G.wins=store.get('wins',{});
G.menu={sel:0};G.sel={step:0,cur:[0,null],picked:[0,1]};G.stageSel=0;G.cpus=[];
function toTitle(){G.state='title';G.menu.sel=0;G.titleStage=buildStage(STAGES[0]);G.titleFighters=[pick(ROSTER),pick(ROSTER)];music(true,'menu')}
function toSelect(step){G.state='select';G.sel.step=step;music(true,'menu')}
function toStage(){G.state='stage';G.stageThumbs=STAGES.map(buildStage)}
/* a mirror match gives the rival other colours */
function hue(c,deg){let[r,g,b]=hx(c).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}h=(h+deg+360)%360;
  const C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs((h/60)%2-1)),m=l-C/2,[a,bb,cc]=h<60?[C,X,0]:h<120?[X,C,0]:h<180?[0,C,X]:h<240?[0,X,C]:h<300?[X,0,C]:[C,0,X];
  return'#'+[a,bb,cc].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('')}
function altLook(ch){const lowS=c=>{const[r,g,b]=hx(c);return Math.max(r,g,b)-Math.min(r,g,b)<40};
  return Object.assign({},ch,{id:ch.id+'_alt',suit:lowS(ch.suit)?'#3a8a5a':hue(ch.suit,150),acc:lowS(ch.acc)?'#ffb030':hue(ch.acc,150)})}
function startFight(i1,i2,si,opts={}){if(targetH()!==H)applySize();
  G.stage=buildStage(STAGES[si]);G.proj=[];G.blasts=[];G.tboxes=[];G.parts=[];G.texts=[];G.shake=0;G.slow=0;G.matchEnd=null;G.kobeam=null;G.comboShow=null;
  const c1=ROSTER[i1],c2=i1===i2?altLook(ROSTER[i2]):ROSTER[i2],S=G.stage.main;
  const p1=new Fighter(c1,0,opts.p1cpu?makePad():IN,!!opts.p1cpu),p2=new Fighter(c2,1,makePad(),true);
  G.fighters=[p1,p2];p1.spawnAt(S.l+30,S.y,1);p2.spawnAt(S.r-30,S.y,-1);
  G.cpus=[new CPU(p2,opts.level||G.level)];if(opts.p1cpu)G.cpus.push(new CPU(p1,opts.p1level||G.level));
  G.state='ready';G.readyT=opts.quick?1:170;G.banner=null;clearPresses();music(true,'fight')}
function stepFight(){
  for(const c of G.cpus)c.think();
  for(const f of G.fighters)f.update();
  resolveHits();for(const p of G.proj)updProj(p);G.proj=G.proj.filter(p=>p.life>0);updBlasts();updFx();
  for(const c of G.cpus)c.clear();
  if(G.matchEnd&&--G.matchEnd.t<=0)toResults()}
function toResults(){const loser=G.matchEnd.loser,winner=G.fighters.find(f=>f!==loser);G.result={winner,loser};G.state='result';G.resT=50;
  if(!winner.cpu){G.wins[winner.ch.id.replace('_alt','')]=(G.wins[winner.ch.id.replace('_alt','')]||0)+1;store.set('wins',G.wins)}SFX.win();music(false)}
function update(){G.frame++;IN.frame++;let keep=false;
  switch(G.state){
  case'title':titleInput();break;
  case'select':selectInput();break;
  case'stage':stageInput();break;
  case'ready':G.readyT--;for(const f of G.fighters){f.anim++}updFx();
    if(G.readyT%45===0&&G.readyT>0)SFX.beep();
    if(G.readyT<=0){G.state='fight';G.banner={s:'GO!',t:40};SFX.go()}break;
  case'fight':
    if(IN.pressed.start&&!G.matchEnd){G.state='pause';music(false);SFX.move();break}
    if(G.banner&&--G.banner.t<=0)G.banner=null;
    if(G.matchEnd&&!G.matchEnd.shown){G.matchEnd.shown=1;G.banner={s:'GAME!',t:120};G.slow=60}
    if(G.slow>0){G.slow--;if(G.frame%2){updFx();keep=true;break}}
    stepFight();break;
  case'pause':if(IN.pressed.a||IN.pressed.start){G.state='fight';music(true,'fight');SFX.move()}else if(IN.pressed.b){SFX.back();toSelect(0)}break;
  case'result':if(G.resT>0)G.resT--;updFx();resultInput();break}
  if(IN.pressed.select&&G.state!=='select'&&!keep){setMute(!muted);if(!muted){unlock();SFX.pick()}}
  if(!keep)clearPresses()}
function render(now){ctx.save();ctx.setTransform(1,0,0,1,0,0);
  switch(G.state){
  case'title':drawTitle(now);break;
  case'select':drawSelect(now);break;
  case'stage':drawStageSel(now);break;
  case'result':drawResults(now);break;
  default:drawMatch(now)}
  ctx.restore()}
function drawMatch(now){const st=G.stage;let sx=0,sy=0;if(G.shake>0){sx=Math.round((rnd()-.5)*G.shake);sy=Math.round((rnd()-.5)*G.shake)}
  ctx.translate(sx,sy);ctx.drawImage(st.bg,0,0);drawStageFx(st,now);drawSoftPlats(st,now);
  for(const p of G.proj)drawProj(p,now);
  const order=[...G.fighters].sort((a,b)=>(a.mv?1:0)-(b.mv?1:0));for(const f of order)drawFighter(f,now);
  drawFx(now);drawKoBeam();ctx.setTransform(1,0,0,1,0,0);
  for(const f of G.fighters)drawOffscreen(f);
  drawHud(now);
  if(G.comboShow&&G.comboShow.n>=3){const c=G.comboShow;txt(c.n+' HIT COMBO!',W/2,Math.round(H*.16),'#ffd84a',1,'c',K)}
  if(G.state==='ready'){const n=Math.ceil(G.readyT/45);if(n<=3&&n>=1){const k=(G.readyT%45)/45;txt(String(n),W/2,Math.round(H*.3),'#ffffff',4+Math.round(k*2),'c',K)}
    else{txt(G.fighters[0].ch.name,W/2,Math.round(H*.24),TAGC[0],2,'c',K);txt('VS',W/2,Math.round(H*.24)+18,'#ffd84a',1,'c',K);txt(G.fighters[1].ch.name,W/2,Math.round(H*.24)+30,TAGC[1],2,'c',K)}}
  if(G.banner)txt(G.banner.s,W/2,Math.round(H*.3),G.banner.s==='GO!'?'#a8ff6a':'#ffd84a',4,'c',K);
  if(G.slow>0&&!G.matchEnd){ctx.fillStyle='rgba(106,240,255,.08)';ctx.fillRect(0,0,W,H)}
  if(G.state==='pause')drawPause(now)}
/* ================= buttons ================= */
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'a',Z:'a',x:'b',X:'b',Enter:'start',Shift:'select',' ':'a',k:'a',K:'a',j:'b',J:'b',p:'start',P:'start',Escape:'start',m:'select',M:'select'};
addEventListener('keydown',e=>{const b=KEYMAP[e.key];if(!b)return;e.preventDefault();unlock();if(e.repeat)return;input(b,true)});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)input(b,false)});
addEventListener('blur',()=>{for(const b of BTN)IN.held[b]=false});
for(const[id,btn]of[['bU','up'],['bD','down'],['bL','left'],['bR','right'],['bA','a'],['bB','b'],['bS','start']]){const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');input(btn,true)});
  const up=()=>{el.classList.remove('on');input(btn,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.state==='fight'){G.state='pause'}music(false)}});
addEventListener('resize',()=>{fit();if(G.state!=='fight'&&G.state!=='ready'&&G.state!=='pause'&&targetH()!==H){applySize();fit();if(G.state==='title')G.titleStage=buildStage(STAGES[0]);if(G.state==='stage')G.stageThumbs=STAGES.map(buildStage);if(G.state==='result')G.stage=buildStage(G.stage.def)}});
/* ================= the console ================= */
window.ZPCart={title:'Ring Out',
  input(btn,down){unlock();input(btn,down)},
  /* power switch: on a menu, just turn off; mid-fight, pause and let the console ask */
  home(){if(G.state==='fight'||G.state==='ready'||G.state==='pause'){if(G.state!=='pause'){G.state='pause';music(false)}return'ask'}return true},
  snapshot(){return null}};
if(ZP&&ZP.cartReady)try{ZP.cartReady(window.ZPCart)}catch(e){}
/* ================= go ================= */
applySize();fit();toTitle();
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){acc+=Math.min(250,now-last);last=now;let n=0;if(window.__RO&&window.__RO.freeze)acc=0;while(acc>=STEP&&n<6){update();acc-=STEP;n++}if(n>=6)acc=0;render(now);requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
/* hooks for automated tests only (the address must end in #rotest) */
if(/rotest/.test(location.hash))window.__RO={G,IN,input,update,render:()=>render(performance.now()),startFight,stepFight,ROSTER,STAGES,Fighter,CPU,makePad,applySize,kbSpeed,clearPresses,
  get H(){return H},get VS(){return VS}};

})();
</script>
