'use strict';
/* =====================================================================================================
   VAULTBREAKER: a knight fights through waves of monsters in a side-on dungeon.
   ◀ and ▶ dodge back or forward, and holding either keeps you running that way. Monsters block the way, so you dodge their
   attacks and press ATTACK to lunge in after them. B is your weapon's special, D (top) its ultimate, C a flask.
   Coins and XP from every raid buy weapons, upgrades, charms and points for three skill trees.
   Inside ZigaPlay it is a wide, four-button cartridge; on its own it draws touch buttons.
   ===================================================================================================== */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a),ri=n=>Math.floor(rnd()*n),pick=a=>a[ri(a.length)];
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';

/* ---------------------------------------------------------------- sound */
const SND=(()=>{const AC=window.AudioContext||window.webkitAudioContext;let ctx=null,master=null,musicG=null,mode=2,song=null,sStep=0,sNext=0,timer=0,nbuf=null,paused=false;
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const freq=n=>{const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;const s=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12*(+m[3]+1);return 440*Math.pow(2,(s-69)/12)};
  function unlock(){if(!AC)return;try{if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=mode?0.5:0;master.connect(ctx.destination);
      musicG=ctx.createGain();musicG.gain.value=mode>1?.45:0;musicG.connect(master);
      nbuf=ctx.createBuffer(1,ctx.sampleRate*.6,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
    if(ctx.state!=='running'&&!paused)ctx.resume().catch(()=>{})}catch(e){}}
  function tone(f,d,o={}){if(!ctx||!mode||ctx.state!=='running')return;const t=Math.max(ctx.currentTime,o.t||0)+(o.at||0),os=ctx.createOscillator(),g=ctx.createGain(),v=o.vol||.1;
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);os.connect(g);g.connect(o.dest||master);os.start(t);os.stop(t+d+.03)}
  function noise(d,o={}){if(!ctx||!mode||ctx.state!=='running')return;const t=Math.max(ctx.currentTime,o.t||0)+(o.at||0),s=ctx.createBufferSource(),g=ctx.createGain(),v=o.vol||.1;s.buffer=nbuf;
    let n=s;if(o.hp||o.lp){const f=ctx.createBiquadFilter();f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.hp||o.lp;s.connect(f);n=f}
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);n.connect(g);g.connect(o.dest||master);s.start(t);s.stop(t+d+.03)}
  function seq(type,vol,str){const tk=str.trim().split(/\s+/),ev=[];let last=null;tk.forEach((x,i)=>{if(x==='.'){last=null}else if(x==='-'){if(last)last.n++}else{last={f:type==='drum'?x:freq(x),n:1};ev[i]=last}});return{type,vol,ev,len:tk.length}}
  function tick(){if(!ctx||!song||mode<2||ctx.state!=='running')return;const spb=60/song.bpm/4;if(sNext<ctx.currentTime)sNext=ctx.currentTime+.06;
    while(sNext<ctx.currentTime+.3){for(const ch of song.ch){const e=ch.ev[sStep%ch.len];if(!e)continue;
        if(ch.type==='drum'){if(e.f==='k')tone(130,.12,{type:'sine',to:42,vol:ch.vol*1.7,t:sNext,dest:musicG});else if(e.f==='s')noise(.1,{vol:ch.vol,hp:1500,t:sNext,dest:musicG});else noise(.03,{vol:ch.vol*.5,hp:6500,t:sNext,dest:musicG})}
        else tone(e.f,Math.max(.06,e.n*spb*.95),{type:ch.type,vol:ch.vol,t:sNext,dest:musicG})}
      sStep++;sNext+=spb}}
  return{unlock,tone,noise,seq,
    play(sg){if(song===sg)return;song=sg;sStep=0;sNext=0;if(!timer)timer=setInterval(tick,60)},
    stop(){song=null},
    get mode(){return mode},set mode(v){mode=v;if(master)master.gain.value=v?0.5:0;if(musicG)musicG.gain.value=v>1?.45:0},
    pause(p){paused=p;if(!ctx||ctx.state==='closed')return;try{(p?ctx.suspend():ctx.resume()).catch(()=>{})}catch(e){}}}})();

/* ---------------------------------------------------------------- saves */
function makeSave(id,fresh){const KEY=id+'-save';let SV=fresh(),cloud=false,t=0;
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')SV=Object.assign(fresh(),s)}catch(e){}
  const ZC=ZP&&ZP.cloud&&typeof ZP.cloud.save==='function'?ZP.cloud:null,push=()=>{try{ZC.save(id,JSON.stringify(SV),{})}catch(e){}};
  return{get v(){return SV},
    save(){SV.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}if(cloud){clearTimeout(t);t=setTimeout(push,1500)}},
    reset(){SV=fresh();this.save()},
    async init(onLoad){if(!ZC)return;for(let a=0;a<6;a++){let r=null;try{r=await ZC.load(id)}catch(e){}
        if(r&&r.ok){cloud=true;let cs=null;try{cs=r.json?JSON.parse(r.json):null}catch(e){}
          if(cs&&typeof cs==='object'&&(+cs.savedAt||0)>(+SV.savedAt||0)){const snd=SV.sound;SV=Object.assign(fresh(),cs);SV.sound=snd;try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}if(onLoad)onLoad()}
          else if(SV.savedAt)push();return}
        await sleep(9000)}},
    async flush(){if(!cloud)return;clearTimeout(t);push();try{await ZC.flush(id)}catch(e){}}}}

function calcStats(){const v=SV.v,s={};
  s.maxhp=Math.round((100+12*frank('vit'))*(1+.06*rank('tough')));
  s.dmg=(1+.05*frank('whet'))*(1+.05*rank('edge'));
  s.dr=Math.min(.6,.04*frank('arm')+.04*rank('iron'));
  s.crit=.04*rank('crit');s.chase=1+.2*rank('lunge');s.lungeMul=1+.25*rank('lunge');
  s.combo3=1+.25*rank('combo');s.exec=rank('exec')>0;s.atkSpd=1+.07*rank('fury');
  s.flasks=2+frank('flask');s.flaskHeal=.35+.08*frank('pot')+.10*rank('brew');
  s.thorns=10*rank('thorns');s.stand=rank('stand')>0;s.regen=.04*rank('regen');
  s.move=1+.07*rank('swift');s.iframe=.3+.06*rank('evade');s.dodgeCd=Math.max(.03,.15-.04*rank('evade'));
  s.perfect=8*rank('perfect');s.ultMul=1+.1*rank('focus');s.specMul=1-.08*rank('quick');
  s.coin=1+.08*frank('greed');s.charms=new Set(v.equip.slice(0,slots()));
  if(s.charms.has('lucky'))s.coin+=.3;if(s.charms.has('hour'))s.specMul*=.75;
  s.dodgeDist=s.charms.has('cloak')?1.3:1;if(s.charms.has('cloak'))s.iframe+=.12;

  const vg=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,W*.7);vg.addColorStop(0,'rgba(0,0,0,.1)');vg.addColorStop(1,'rgba(0,0,0,.75)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  K=K||{x:0,y:GROUND,face:1,state:'walk',anim:0,t:0,yo:0};
  drawKnight(W/2-60,GROUND,{weapon:'sword',face:1,state:'walk',anim:t,pose:{ang:-.9+Math.sin(t*2)*.05,ex:0,ang2:null}});
  const sk={type:'skel',d:FOES.skel,face:-1,anim:t,walk:true,state:'move',flash:0,dead:false,rise:0,fly:false,x:W/2+60+cam,y:GROUND,w:14,h:30,hp:1,max:1,stun:0,burnT:0};drawFoe(sk);
  const sk2=Object.assign({},sk,{type:'brute',d:FOES.brute,x:W/2+95+cam,w:24,h:38,anim:t+1});drawFoe(sk2);
  T('VAULTBREAKER',W/2,62,{a:'center',s:30,c:'#ffd36a',shc:'#5a1420'});T('a knight against the endless dungeon',W/2,78,{a:'center',s:8,c:'#d8c8a8'});
  if(window.__vbBare)return;
  const a=(Math.sin(t*4)+1)/2;T(ZP?'PRESS ATK':'TAP TO BEGIN',W/2,112,{a:'center',s:10,c:`rgba(255,233,160,${.4+a*.6})`});
  if(!ZP&&!TOUCH)T('Arrows move · Z attack · X special · V ult · C flask',W/2,H-8,{a:'center',s:7,c:'#8a7a6a'})}
function drawResults(t){drawCampBg(t);ctx.fillStyle='rgba(6,3,10,.7)';ctx.fillRect(0,0,W,H);res.t+=1/60;const r=res,p=clamp((r.t-.4)/1.2,0,1);
  T(r.reason==='retreat'?'YOU RETREATED':'YOU FELL',W/2,36,{a:'center',s:18,c:r.reason==='retreat'?'#ffe9a0':'#ff8a6a'});
  T(r.weapon+' · waves cleared: '+r.waves+(r.best?'  · NEW BEST!':''),W/2,50,{a:'center',s:8,c:r.best?'#9adfff':'#d8c8a8'});
  const bx=W/2-100;box(bx,60,200,92,{bg:'rgba(18,12,20,.9)'});
  const row=(l,v,y,c)=>{T(l,bx+12,y,{s:8,c:'#a89878'});T(v,bx+188,y,{a:'right',s:9,c})};
  row('Monsters slain',String(Math.round(r.kills*p)),76,'#f0e0c0');row('Coins earned','+'+fmt(r.coins*p),92,'#ffd34a');row('XP earned','+'+fmt(r.xp*p),108,'#9adfff');
  const v=SV.v;T('LV '+v.lvl,bx+12,128,{s:8,c:'#c8e0ff'});bar(bx+44,123,144,5,v.xp/xpFor(v.lvl),'#6ab0ff','#141a2a');
  if(r.lv1>r.lv0&&r.t>1.4){const a=(Math.sin(r.t*6)+1)/2;T('LEVEL UP!  +'+(r.lv1-r.lv0)+' skill point'+(r.lv1-r.lv0>1?'s':''),W/2,144,{a:'center',s:9,c:`rgba(154,223,255,${.6+a*.4})`})}
  if(r.t>1)btn('ok',W/2-60,H-44,120,22,'BACK TO CAMP',goCamp)}

/* ---------------------------------------------------------------- input routing */
function onBtn(b,d){
  if(scr==='run'&&!paused&&!run.shrine){onRunBtn(b,d);return}
  if(!d)return;
  if(scr==='title'){if(['a','start','b','c','d'].includes(b))goCamp();return}
  if(b==='up')nav(0,-1);else if(b==='down')nav(0,1);else if(b==='left')nav(-1,0);else if(b==='right')nav(1,0);
  else if(b==='a'||(b==='start'&&scr!=='run'))activate();
  else if(b==='b'||b==='start'){if(scr==='run'&&paused){paused=false;sfx.ok()}else if(['armory','skills','forge','charms'].includes(scr)){scr='camp';sfx.back()}else if(scr==='results'&&res&&res.t>1)goCamp()}}

/* ---------------------------------------------------------------- loop */
let last=0,tt=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;tt+=dt;
  if(scr==='run'&&run)stepRun(dt);
  ctx.setTransform(KS,0,0,KS,0,0);ctx.imageSmoothingEnabled=false;UI=[];
  try{if(scr==='title')drawTitle(tt);else if(scr==='camp')drawCamp(tt);else if(scr==='armory')drawArmory(tt);else if(scr==='skills')drawSkills(tt);
    else if(scr==='forge')drawForge(tt);else if(scr==='charms')drawCharms(tt);else if(scr==='results')drawResults(tt);else if(scr==='run')drawRun()}catch(e){console.error(e)}
  if(scr==='camp'&&toastT>0){toastT-=1/60;T(toastMsg,W/2,H-20,{a:'center',s:8,c:'#ffe9c0'})}
  fixSel();updTouch()}
function updTouch(){if(!TOUCH)return;const show=scr==='run'&&run&&!paused&&!run.shrine&&K.state!=='dead';document.getElementById('touch').hidden=!(scr==='run');
  for(const id of['tLeft','tRight','tAtk','tSpc','tUlt','tPot'])TB[id].style.visibility=show?'visible':'hidden';if(!show)return;
  const sp=run.spec>0?run.spec/(run.specMax||1):0;TB.tSpc.querySelector('.cd').style.setProperty('--p',(sp*100).toFixed(1)+'%');
  TB.tUlt.querySelector('.fill').style.height=run.ult+'%';TB.tUlt.classList.toggle('ready',run.ult>=100);document.getElementById('tPotN').textContent=run.flasks}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(scr==='run'&&run&&!run.over){paused=true;SEL.run='resume'}for(const b in held)if(held[b])btnSet(b,false)}});

window.ZPCart={title:'Vaultbreaker',input(b,d){btnSet(b,d)},async home(){try{await SV.flush()}catch(e){}return scr==='run'&&run&&!run.over?'ask':true},snapshot:()=>null};
if(ZP){try{if(ZP.takeRestore)ZP.takeRestore('vaultbreaker')}catch(e){}try{if(ZP.cartReady)ZP.cartReady(window.ZPCart)}catch(e){}}
SV.init(()=>{S.mode=SV.v.sound});
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
/* hooks for tests and the label maker */
window.__vb={get scr(){return scr},set scr(v){scr=v},get run(){return run},get K(){return K},get foes(){return foes},SV,startRun,stepRun,btnSet,spawnFoe,endRun,goCamp,nextWave,calcStats,WEAPONS,TREES,
  get res(){return res},openShrine,takeBless,setCam(v){cam=v},drawRun};
</script>
</body></html>
