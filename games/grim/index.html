<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grim Ascent</title>
<style>
/* Grim Ascent: one tall canvas, 180 pixels wide and 220 to 340 tall, scaled up with crisp edges.
   Outside the ZigaPlay, touch screens get SLAM and ATTACK buttons under it (and arrows when the phone can't tilt). */
:root{color-scheme:dark;--bg:#0c0a14;--pad:#241c34;--edge:#05040a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 3px var(--edge),0 10px 30px rgba(0,0,0,.6);border-radius:4px}
html.zp #cv{box-shadow:none;border-radius:0}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-bottom,0px));gap:12px;touch-action:none}
html.touch:not(.zp) #pad{display:flex}
.pb{width:70px;height:70px;border-radius:50%;border:3px solid var(--edge);background:var(--pad);color:#e8e4ff;font:800 15px/1 system-ui,sans-serif;box-shadow:0 4px 0 var(--edge);touch-action:none;display:grid;place-items:center;padding:0}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.grp{display:flex;gap:12px;align-items:center}
#bA{background:#c8303a;color:#fff}#bB{background:#5a3aa8;color:#fff}
#bP{width:50px;height:50px;font-size:14px}
.arr{display:none}html.notilt .arr{display:grid}
</style>
<div id="stage"><canvas id="cv" width="180" height="300" aria-label="Grim Ascent"></canvas></div>
<div id="pad"><div class="grp"><button class="pb arr" id="bL" aria-label="Left">&#9664;</button><button class="pb arr" id="bR" aria-label="Right">&#9654;</button><button class="pb" id="bP" aria-label="Pause">II</button></div>
<div class="grp"><button class="pb" id="bB" aria-label="Slam">SLAM</button><button class="pb" id="bA" aria-label="Attack">ATTACK</button></div></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const W=180,K='#07050c',WH='#ffffff';let H=300;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(rnd()*a.length)],lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0;
const store={get(k,d){try{const v=localStorage.getItem('grim-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('grim-'+k,JSON.stringify(v))}catch(e){}}};
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
/* the picture is always 180 wide; its height follows the screen (220 to 340), fixed while a climb is on */
function targetH(){const pad=RT.classList.contains('touch')&&!ZP?Math.min(130,innerHeight*.3):0,aw=Math.max(1,innerWidth-(ZP?0:16)),ah=Math.max(1,innerHeight-pad-(ZP?0:16));
  return clamp(Math.round(W*ah/aw/2)*2,220,340)}
function fit(){const pad=RT.classList.contains('touch')&&!ZP?Math.min(130,innerHeight*.3):0,aw=innerWidth-(ZP?0:16),ah=innerHeight-pad-(ZP?0:16);
  let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s*2)/2;cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  document.getElementById('stage').style.bottom=pad+'px'}
function applySize(h){H=h||targetH();cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;fit()}

/* ================= sound: little synths, no files ================= */
let AC=null,master=null,musicBus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.28;musicBus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.12,type='square',v=.2,t0=0,dest=null}){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.15,v=.2,f=1000,q=1,t0=0,dest=null}){const a=AC;if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bp);bp.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+.02)}
const SFX={
  jump(){tone({f:240,f2:420,d:.1,type:'triangle',v:.12})},
  spring(){tone({f:200,f2:900,d:.25,type:'triangle',v:.18});noise({d:.08,f:2200,v:.08})},
  slam(){noise({d:.25,f:900,q:.6,v:.22});tone({f:520,f2:110,d:.24,type:'sawtooth',v:.08})},
  thud(){noise({d:.12,f:200,q:.8,v:.32});tone({f:110,f2:55,d:.15,v:.2})},
  swing(n=0){noise({d:.07,f:2400+n*500,q:1.2,v:.14})},
  hit(n=0){tone({f:180+n*40,f2:90,d:.08,v:.24});noise({d:.06,f:1800+n*300,q:1,v:.16});tone({f:600+n*150,f2:900+n*200,d:.08,type:'triangle',v:.1,t0:.02})},
  finish(){tone({f:140,f2:60,d:.22,v:.3});noise({d:.2,f:700,q:.7,v:.25});tone({f:880,f2:1320,d:.18,type:'triangle',v:.14,t0:.05})},
  kill(){[659,784,988,1319].forEach((f,i)=>tone({f,d:.12,type:'triangle',v:.12,t0:i*.05}));noise({d:.3,f:500,q:.5,v:.12})},
  soul(){tone({f:1320,f2:1760,d:.08,type:'sine',v:.1})},
  heart(){[784,988,1175].forEach((f,i)=>tone({f,d:.1,type:'square',v:.08,t0:i*.07}))},
  hurt(){tone({f:300,f2:120,d:.25,type:'sawtooth',v:.16});noise({d:.15,f:400,v:.18})},
  crumble(){noise({d:.2,f:300,q:.6,v:.2})},
  spit(){noise({d:.15,f:1200,q:2,v:.1});tone({f:300,f2:200,d:.1,type:'sawtooth',v:.06})},
  die(){[330,311,294,262,196].forEach((f,i)=>tone({f,f2:f*.95,d:i===4?.9:.25,type:'sawtooth',v:.12,t0:i*.22}))},
  move(){tone({f:520,d:.04,v:.06})},
  pick(){tone({f:660,d:.05,v:.08});tone({f:990,d:.07,v:.08,t0:.05})},
  start(){[262,311,392,523].forEach((f,i)=>tone({f,d:.12,type:'square',v:.1,t0:i*.08}))},
};
/* a creeping minor tune: organ chords, a walking bass and a bell, looped */
const MEL=[69,0,72,71,69,0,64,0,65,0,69,67,64,0,0,0,69,0,72,74,76,0,74,72,71,0,67,69,71,0,0,0],BASS=[45,45,52,52,41,41,48,48,43,43,50,50,40,40,47,44];
const mf=n=>440*Math.pow(2,(n-69)/12);let mus={on:false,step:0,next:0,timer:0,spb:.16};
function musicTick(){const a=AC;if(!a||!mus.on)return;const spb=mus.spb;while(mus.next<a.currentTime+.2){const s=mus.step,t=mus.next-a.currentTime;
    const n=MEL[s%MEL.length];if(n&&!muted){tone({f:mf(n),d:.22,type:'triangle',v:.1,t0:t,dest:musicBus});tone({f:mf(n+12),d:.1,type:'sine',v:.03,t0:t,dest:musicBus})}
    if(s%2===0){const bn=BASS[(s/2)%BASS.length];if(!muted)tone({f:mf(bn-12),d:.3,type:'square',v:.07,t0:t,dest:musicBus})}
    if(s%8===4&&!muted)noise({d:.05,f:6000,v:.03,t0:t,dest:musicBus});mus.step++;mus.next+=spb}}
function music(on){mus.on=on;const a=AC;if(on&&a){mus.next=Math.max(mus.next,a.currentTime+.05);if(!mus.timer)mus.timer=setInterval(musicTick,50)}}
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.55}
/* a buzz on hits: vibrate where it exists; on iPhone, a hidden switch gives a haptic tick */
const HAP={on:store.get('vib',true),lab:null,last:0};
function haptic(ms){if(!HAP.on)return;const now=performance.now();if(now-HAP.last<40)return;HAP.last=now;let w=window;try{if(ZP)w=window.parent}catch(e){}
  try{if(typeof w.navigator.vibrate==='function'){w.navigator.vibrate(ms);return}}catch(e){}
  try{if(!HAP.lab||!HAP.lab.isConnected){const d=w.document,id='zp-haptic';let lab=d.getElementById(id+'-l');
      if(!lab){const inp=d.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id=id;inp.tabIndex=-1;lab=d.createElement('label');lab.id=id+'-l';lab.htmlFor=id;
        for(const e of[inp,lab]){e.setAttribute('aria-hidden','true');e.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none'}d.body.append(inp,lab)}
      HAP.lab=lab}HAP.lab.click()}catch(e){}}

/* ================= a pixel font (5x7), so the words stay crisp everywhere ================= */
const FD={A:'01110 10001 10001 11111 10001 10001 10001',B:'11110 10001 10001 11110 10001 10001 11110',C:'01110 10001 10000 10000 10000 10001 01110',D:'11110 10001 10001 10001 10001 10001 11110',
 E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',
 I:'01110 00100 00100 00100 00100 00100 01110',J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',
 M:'10001 11011 10101 10101 10001 10001 10001',N:'10001 10001 11001 10101 10011 10001 10001',O:'01110 10001 10001 10001 10001 10001 01110',P:'11110 10001 10001 11110 10000 10000 10000',
 Q:'01110 10001 10001 10001 10101 10010 01101',R:'11110 10001 10001 11110 10100 10010 10001',S:'01111 10000 10000 01110 00001 00001 11110',T:'11111 00100 00100 00100 00100 00100 00100',
 U:'10001 10001 10001 10001 10001 10001 01110',V:'10001 10001 10001 10001 10001 01010 00100',W:'10001 10001 10001 10101 10101 10101 01010',X:'10001 10001 01010 00100 01010 10001 10001',
 Y:'10001 10001 01010 00100 00100 00100 00100',Z:'11111 00001 00010 00100 01000 10000 11111',
 0:'01110 10001 10011 10101 11001 10001 01110',1:'00100 01100 00100 00100 00100 00100 01110',2:'01110 10001 00001 00010 00100 01000 11111',3:'11110 00001 00001 01110 00001 00001 11110',
 4:'00010 00110 01010 10010 11111 00010 00010',5:'11111 10000 11110 00001 00001 10001 01110',6:'00110 01000 10000 11110 10001 10001 01110',7:'11111 00001 00010 00100 01000 01000 01000',
 8:'01110 10001 10001 01110 10001 10001 01110',9:'01110 10001 10001 01111 00001 00010 01100',
 '!':'00100 00100 00100 00100 00100 00000 00100','?':'01110 10001 00001 00010 00100 00000 00100','.':'00000 00000 00000 00000 00000 01100 01100',',':'00000 00000 00000 00000 01100 00100 01000',
 ':':'00000 01100 01100 00000 01100 01100 00000','-':'00000 00000 00000 11111 00000 00000 00000','+':'00000 00100 00100 11111 00100 00100 00000','*':'00000 10001 01010 00100 01010 10001 00000',
 "'":'00100 00100 01000 00000 00000 00000 00000','/':'00001 00010 00010 00100 01000 01000 10000','(':'00010 00100 01000 01000 01000 00100 00010',')':'01000 00100 00010 00010 00010 00100 01000',
 '<':'00010 00100 01000 10000 01000 00100 00010','>':'01000 00100 00010 00001 00010 00100 01000','·':'00000 00000 00000 00100 00000 00000 00000','#':'01010 11111 01010 01010 11111 01010 00000',
 '♥':'00000 01010 11111 11111 01110 00100 00000','▲':'00000 00100 01110 11111 00000 00000 00000','▼':'00000 00000 11111 01110 00100 00000 00000','◀':'00010 00110 01110 11110 01110 00110 00010','▶':'01000 01100 01110 01111 01110 01100 01000'};
const FONT={};for(const k in FD)FONT[k]=FD[k].replace(/ /g,'');
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function txt(s,x,y,col,sc=1,al='l',sh=null){s=String(s).toUpperCase();let X=al==='c'?Math.round(x-tw(s,sc)/2):al==='r'?x-tw(s,sc):x;
  if(sh){txt(s,X+sc,y+sc,sh,sc,'l')}ctx.fillStyle=col;
  for(const ch of s){const g=FONT[ch];if(g)for(let i=0;i<35;i++)if(g[i]==='1')ctx.fillRect(X+(i%5)*sc,y+Math.floor(i/5)*sc,sc,sc);X+=6*sc}}

/* ================= pixel sprites, drawn in code ================= */
class Buf{constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
  get(x,y){return x<0||y<0||x>=this.w||y>=this.h?null:this.d[y*this.w+x]}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1)this.px(x,y,c)}}
  poly(pts,c){let y0=1e9,y1=-1e9,x0=1e9,x1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}if(ins)this.px(x,y,c)}}
  swap(a,b,y0=0,y1=1e9){for(let y=Math.max(0,y0);y<=Math.min(this.h-1,y1);y++)for(let x=0;x<this.w;x++)if(this.d[y*this.w+x]===a)this.d[y*this.w+x]=b}
  outline(c=K){const o=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(o[y*this.w+x])continue;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<this.w&&Y<this.h&&o[Y*this.w+X]&&o[Y*this.w+X]!==c){this.d[y*this.w+x]=c;break}}}return this}
  canvas(flip=false){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const g=c.getContext('2d'),im=g.createImageData(this.w,this.h);
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const v=this.d[y*this.w+(flip?this.w-1-x:x)];if(!v)continue;const i=(y*this.w+x)*4,[r,gg,bb]=hx(v);im.data[i]=r;im.data[i+1]=gg;im.data[i+2]=bb;im.data[i+3]=255}
    g.putImageData(im,0,0);return c}}
const SPR=new Map();
function spr(key,make){let s=SPR.get(key);if(!s){const b=make();s=[b.canvas(false),b.canvas(true)];SPR.set(key,s)}return s}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g);return c}

/* ================= the reaper: a little figure in a black cloak with a skull mask =================
   16x20, the hem on the bottom row, facing right. The sword is drawn separately so it can swing. */
const CL='#191322',CL2='#2c2140',CL3='#463463',BONE='#eee8d4',BONE2='#b9b098',EYE='#7af0ff';
function reaperBuf(pose){const b=new Buf(16,20);
  /* the cloak */
  if(pose==='fall')b.poly([[4,9],[12,9],[16,17],[13,15],[11,19],[8,16],[5,19],[3,15],[0,17]],CL);
  else if(pose==='slam')b.poly([[4,8],[12,8],[14,13],[12,19],[8,17],[4,19],[2,13]],CL);
  else if(pose==='dead')b.poly([[1,14],[15,14],[16,19],[0,19]],CL);
  else b.poly([[4,9],[12,9],[14,19],[12,17],[10,19],[8,17],[6,19],[4,17],[2,19]],CL);
  if(pose!=='dead'){for(let y=10;y<18;y++){b.px(4+(y>13?-1:0),y,CL2)}b.rect(7,11,1,6,CL2)}
  /* the hood and the mask */
  const hy=pose==='dead'?13:pose==='slam'?6:6;
  b.ell(8,hy,5.6,5.4,CL);b.ell(8,hy-1,5,4.6,CL2);b.ell(8.6,hy+.5,4.2,4.2,CL);
  if(pose!=='dead'){b.ell(9.4,hy+1,3,3.4,BONE);b.rect(7,hy+3,5,1,BONE2);
    b.px(8,hy,K);b.px(8,hy+1,K);b.px(11,hy,K);b.px(11,hy+1,K);b.px(8,hy,EYE);b.px(11,hy,EYE);
    b.px(9,hy+3,K);b.px(11,hy+3,K);b.px(10,hy+2,BONE2)}
  else{b.ell(12,16,2.6,2.2,BONE);b.px(11,16,K);b.px(13,16,K)}
  /* the sleeve and a bony hand holding the sword */
  if(pose==='hit'||pose==='slam'){b.rect(11,11,3,2,CL);b.px(14,11,BONE)}else if(pose!=='dead'){b.rect(11,12,2,3,CL);b.px(12,15,BONE)}
  if(pose==='hurt')b.swap(BONE,'#ffb0b0');
  return b.outline()}
const reaperSpr=pose=>spr('r'+pose,()=>reaperBuf(pose));
/* the hand, where the sword is held, for each pose (sprite pixels) */
const HAND={up:[12,15],fall:[12,15],hit:[14,11],slam:[14,11],hurt:[12,15],dead:[12,17]};

/* ================= the monsters ================= */
function wispBuf(f){const b=new Buf(12,14),T='#3ae0c0',T2='#a8fff0';
  b.poly([[6,0+f],[9,4],[11,8],[10,12],[6,13],[2,12],[1,8],[3,4]],T);b.poly([[6,4+f],[8,7],[8,10],[6,11],[4,10],[4,7]],T2);
  b.rect(4,7,1,2,K);b.rect(7,7,1,2,K);return b.outline('#0a2a26')}
function batBuf(f){const b=new Buf(18,10),M='#2a1838',M2='#4a2e62';
  if(f){b.poly([[8,4],[1,1],[3,5],[0,6],[7,7]],M);b.poly([[10,4],[17,1],[15,5],[18,6],[11,7]],M)}else{b.poly([[8,4],[2,8],[4,5],[0,3],[7,3]],M);b.poly([[10,4],[16,8],[14,5],[18,3],[11,3]],M)}
  b.rect(3,f?2:5,3,1,M2);b.rect(12,f?2:5,3,1,M2);b.ell(9,5,2.6,2.6,BONE);b.px(8,5,'#ff3a4a');b.px(10,5,'#ff3a4a');b.px(9,7,BONE2);return b.outline()}
function ghoulBuf(f){const b=new Buf(14,18),S='#86a072',S2='#5e7a50',R='#3a3048',R2='#544468';
  b.rect(4+f,13,2,5,S2);b.rect(8-f,13,2,5,S2);b.poly([[3,7],[11,6],[12,14],[2,14]],R);b.rect(3,9,9,1,R2);

/* ================= the climb =================
   World y grows downward like the screen; climbing means going to smaller y. 10 pixels are a metre.
   The reaper bounces on every platform by itself; tilt steers, B slams down, A slashes. */
const GRAV=.22,JUMP=5.9,AIRSPD=2.7,SLAMV=8.2,MAXFALL=7.2;
const MON={/* hp is counted in combos: a combo (slam + four slashes) does 6 */
  wisp:{c:1,w:6,h:7,pts:100,from:0},bat:{c:1,w:8,h:5,pts:100,from:0},ghoul:{c:2,w:6,h:9,pts:250,from:60},
  wraith:{c:2,w:7,h:10,pts:250,from:250},garg:{c:3,w:9,h:8,pts:400,from:350},golem:{c:4,w:13,h:15,pts:700,from:600}};
const G={state:'title',t:0,plats:[],mons:[],items:[],fx:[],shots:[],pops:[],camY:0,top:0,maxH:0,kills:0,souls:0,best:store.get('best',0),bestCombo:0,shake:0,hitstop:0,nextMon:0,nextHeart:0,soulBank:0,menu:0};
const P={x:90,y:0,vx:0,vy:0,face:1,st:'air',hp:3,inv:0,slashT:0,slashN:0,canSlam:true,target:null,comboN:0,comboT:0,buf:{},ft:0};
const meters=y=>Math.max(0,Math.floor(-y/10));
function newGame(){Object.assign(G,{state:'play',t:0,plats:[],mons:[],items:[],fx:[],shots:[],pops:[],camY:-H+40,top:0,maxH:0,kills:0,souls:0,bestCombo:0,shake:0,hitstop:0,nextMon:-220,nextHeart:-3000,soulBank:0,deadT:0});
  Object.assign(P,{x:W/2,y:0,vx:0,vy:-JUMP,face:1,st:'air',hp:3,inv:0,slashT:0,slashN:0,canSlam:true,target:null,comboN:0,comboT:0,buf:{},ft:0});
  G.plats.push({x:W/2,y:6,w:W+40,kind:'stone',vx:0});/* the tower floor: nothing to fall off at the start */G.top=6;genUpTo(G.camY-H);music(true)}
/* ---------- building the tower upward ---------- */
function genUpTo(yTarget){while(G.top>yTarget){const m=meters(G.top),gapMax=36+Math.min(34,m*.034),gapMin=22+Math.min(14,m*.012);
    const y=G.top-(gapMin+rnd()*(gapMax-gapMin)),w=m>600?24+Math.floor(rnd()*8):28+Math.floor(rnd()*8);let x=14+w/2+rnd()*(W-28-w);
    const last=G.plats[G.plats.length-1];let kind='stone';const r=rnd();
    if(r<Math.min(.3,m/2200))kind='rune';else if(r<Math.min(.3,m/2200)+Math.min(.22,m/2600)&&last&&last.kind!=='crumble')kind='crumble';
    const p={x,y,w,kind,vx:kind==='rune'?(rnd()<.5?-1:1)*(.4+Math.min(.8,m/1500)):0};G.plats.push(p);G.top=y;
    if(kind==='stone'&&rnd()<.06&&m>20)G.items.push({t:'spring',plat:p,dx:(rnd()-.5)*(w-14),y});
    if(rnd()<.22)G.items.push({t:'soul',x:14+rnd()*(W-28),y:y-14-rnd()*10,ph:rnd()*6});
    if(y<G.nextHeart){G.nextHeart=y-3500-rnd()*1000;G.items.push({t:'heart',x:p.x,y:y-16,ph:0})}
    if(y<G.nextMon&&m>15){spawnMon(p,m);G.nextMon=y-Math.max(110,260-m*.12)-rnd()*90}}}
function spawnMon(p,m){const pool=Object.keys(MON).filter(k=>m>=MON[k].from&&k!=='golem');let t=pick(pool);
  if(m>=600&&rnd()<.14)t='golem';const d=MON[t],mon={t,w:d.w,h:d.h,hp:d.c*6,max:d.c*6,st:'live',flash:0,safe:0,ph:rnd()*6,f:0,vx:0,stun:0,shotT:90+rnd()*90};
  if(t==='ghoul'||t==='garg'||t==='golem'){if(t==='golem'){p.w=Math.max(p.w,64);p.kind='stone';p.vx=0;p.x=clamp(p.x,p.w/2+6,W-p.w/2-6)}
    mon.plat=p;mon.dx=0;mon.x=p.x;mon.y=p.y-d.h-1;mon.vx=t==='garg'?0:(rnd()<.5?-1:1)*(t==='golem'?.25:.4)}
  else{mon.bx=12+rnd()*(W-24);mon.by=p.y-26-rnd()*14;mon.x=mon.bx;mon.y=mon.by;if(t==='bat')mon.vx=(rnd()<.5?-1:1)*(.7+Math.min(.6,m/2000))}
  G.mons.push(mon)}
/* ---------- each frame ---------- */
function update(){G.t++;if(G.state==='dying'){if(--G.deadT<=0)gameOver();stepFx();return}if(G.state!=='play')return;
  if(G.hitstop>0){G.hitstop--;stepFx();return}
  if(G.shake>0)G.shake*=.85;if(G.shake<.2)G.shake=0;
  stepPlayer();stepPlats();stepMons();stepItems();stepShots();stepFx();
  /* the camera only goes up */
  const want=P.y-H*.46;if(want<G.camY)G.camY=lerp(G.camY,want,.25);genUpTo(G.camY-H);
  const cut=G.camY+H+60;G.plats=G.plats.filter(p=>p.y<cut&&!p.gone);G.mons=G.mons.filter(m=>m.y<cut+40&&m.st!=='gone');G.items=G.items.filter(i=>(i.plat?i.plat.y:i.y)<cut&&!i.got);
  const h=meters(P.y);if(h>G.maxH)G.maxH=h;
  if(P.st!=='dead'&&P.y-G.camY>H+24)die('fall')}
function pressed(b){if(P.buf[b]!=null&&G.t-P.buf[b]<=(P.st==='combo'?18:8)){P.buf[b]=null;return true}return false}
function stepPlayer(){P.ft++;if(P.inv>0)P.inv--;if(P.slashT>0)P.slashT--;
  if(P.st==='combo'){stepCombo();return}
  const steer=steerX();if(Math.abs(steer)>.08)P.face=sgn(steer);
  if(P.st==='slam'){/* a slam homes in a little on a monster right below */const mt=G.mons.find(m=>m.st==='live'&&m.y>P.y-6&&m.y<P.y+90&&Math.abs(m.x-P.x)<28);
    P.vx=mt?lerp(P.vx,clamp((mt.x-P.x)*.2,-2.4,2.4),.35):lerp(P.vx,steer*AIRSPD*.35,.2);P.vy=SLAMV;if(G.t%2===0)G.fx.push({k:'trail',x:P.x,y:P.y-8,t:10})}
  else{P.vx=lerp(P.vx,steer*AIRSPD,P.st==='hurt'?.06:.22);P.vy=Math.min(MAXFALL,P.vy+GRAV)}
  if(P.st==='hurt'&&P.inv<70)P.st='air';
  if(P.st==='air'&&P.canSlam&&pressed('b')){P.st='slam';P.vx*=.3;SFX.slam()}
  if(P.st!=='slam'&&pressed('a'))freeSlash();
  const oy=P.y;P.x+=P.vx;P.y+=P.vy;
  if(P.x<-8)P.x+=W+16;if(P.x>W+8)P.x-=W+16;
  /* landing on a platform bounces, a slam bounces higher */
  if(P.vy>0)for(const p of G.plats){if(p.gone)continue;const half=p.w/2+4;if(Math.abs(P.x-p.x)>half)continue;if(oy<=p.y+1&&P.y>=p.y){land(p);break}}
  /* monsters */
  for(const m of G.mons){if(m.st==='dying'||m.st==='gone')continue;if(!touch(m))continue;
    if(P.st==='slam'){startCombo(m);return}
    if(P.vy>1&&P.y-(m.y-m.h)<6&&m.st!=='stun'){P.vy=-JUMP*.8;P.canSlam=true;m.safe=20;SFX.jump();G.pops.push({x:m.x,y:m.y-m.h-8,s:'BOUNCE',c:'#c8b8ff',t:30});continue}
    if(m.safe<=0&&m.st==='live'&&P.inv<=0)hurt(sgn(P.x-m.x)||-P.face)}}
const touch=m=>{const r=P.st==='slam'?9:5;return Math.abs(P.x-m.x)<m.w+r&&P.y>m.y-m.h-(P.st==='slam'?4:2)&&P.y-16<m.y+m.h}
function land(p){P.y=p.y;let v=JUMP,slam=P.st==='slam';
  const sp=G.items.find(i=>i.t==='spring'&&i.plat===p&&Math.abs(P.x-(p.x+i.dx))<9);
  if(sp){v=JUMP*1.7;SFX.spring();sp.boing=12;G.pops.push({x:P.x,y:P.y-22,s:'SPRING!',c:'#e8c8ff',t:40})}
  else if(slam){v=JUMP*1.32;SFX.thud();G.shake=3;haptic(14);for(let i=0;i<10;i++)G.fx.push({k:'dust',x:P.x+(rnd()-.5)*14,y:p.y,vx:(rnd()-.5)*2,vy:-rnd()*1.2,t:22})}
  else SFX.jump();
  P.vy=-v;P.st='air';P.canSlam=true;
  if(p.kind==='crumble'){p.crumble=1;SFX.crumble();for(let i=0;i<8;i++)G.fx.push({k:'chip',x:p.x+(rnd()-.5)*p.w,y:p.y+2,vx:(rnd()-.5)*1.5,vy:rnd()*.5,t:40,c:PCOL.crumble[1]});p.gone=true}}
/* ---------- fighting ---------- */
function freeSlash(){P.slashT=12;P.slashN=0;SFX.swing(0);
  const x0=P.x+(P.face>0?-2:-24),x1=P.x+(P.face>0?24:2),y0=P.y-20,y1=P.y+2;
  for(const m of G.mons){if(m.st!=='live'&&m.st!=='stun')continue;if(m.x+m.w<x0||m.x-m.w>x1||m.y+m.h<y0||m.y-m.h>y1)continue;
    damage(m,1,0);m.safe=Math.max(m.safe,24);if(m.plat)m.dx=clamp((m.dx||0)+P.face*5,-m.plat.w/2,m.plat.w/2);else m.bx=(m.bx??m.x)+P.face*8}
  for(const s of G.shots)if(Math.abs(s.x-(x0+x1)/2)<14&&s.y>y0&&s.y<y1+4){s.life=0;spark(s.x,s.y,'#ffb04a',6)}}
function startCombo(m){P.st='combo';P.target=m;P.comboN=0;P.comboT=56;P.vx=P.vy=0;P.face=sgn(m.x-P.x)||P.face;m.st='stun';m.stun=0;
  P.x=m.x-P.face*(m.w+5);P.y=m.y+7;SFX.thud();SFX.hit(0);G.shake=4;G.hitstop=7;haptic(30);
  G.combo=1;damage(m,1,0);G.pops.push({x:m.x,y:m.y-m.h-10,s:'SLAM!',c:'#c88aff',t:36});for(let i=0;i<12;i++)G.fx.push({k:'dust',x:m.x+(rnd()-.5)*16,y:m.y+m.h,vx:(rnd()-.5)*2.5,vy:-rnd()*1.5,t:20})}
function stepCombo(){const m=P.target;if(!m||m.st==='gone'||m.st==='dying'){endCombo(true);return}
  P.x=m.x-P.face*(m.w+5);P.y=m.y+7;
  if(pressed('a')){P.comboN++;const n=P.comboN,fin=n>=4;P.slashT=fin?16:11;P.slashN=n;damage(m,fin?2:1,n);P.comboT=56;G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);
    G.hitstop=fin?10:4;G.shake=fin?5:2;haptic(fin?40:14);if(fin)SFX.finish();else SFX.hit(n);
    if(m.st==='dying'){endCombo(true);return}
    if(fin){m.st='live';m.safe=80;if(m.plat)m.dx=clamp((m.dx||0)+P.face*10,-m.plat.w/2,m.plat.w/2);else{m.bx=(m.bx??m.x)+P.face*16;m.by=(m.by??m.y)-6}endCombo(false,true);return}}
  if(--P.comboT<=0){m.st='live';m.safe=70;endCombo(false)}}
function endCombo(killed,finished){P.st='air';P.target=null;P.canSlam=true;P.vy=-JUMP*(killed?1.2:finished?1.1:.8);P.vx=0;
  if(G.combo>=2)G.pops.push({x:P.x,y:P.y-30,s:G.combo+' HITS',c:'#ffd84a',t:45})}
function damage(m,n,k){m.hp-=n;m.flash=6;spark(m.x+(rnd()-.5)*4,m.y-(rnd()*m.h),k>=4?'#ffd84a':'#ffffff',k>=4?14:7);if(k)G.fx.push({k:'arc',x:m.x,y:m.y,n:k,f:P.face,t:9});

function kill(m){m.st='dying';m.dieT=26;G.kills++;const d=MON[m.t];G.pts=(G.pts||0)+d.pts;SFX.kill();haptic(30);
  G.pops.push({x:m.x,y:m.y-m.h-12,s:'+'+d.pts,c:'#ffffff',t:40});for(let i=0;i<d.c*3;i++)G.items.push({t:'soul',x:m.x+(rnd()-.5)*10,y:m.y-rnd()*m.h,ph:rnd()*6,vx:(rnd()-.5)*3,vy:-1-rnd()*2,fly:1})
  for(let i=0;i<16;i++)G.fx.push({k:'smoke',x:m.x+(rnd()-.5)*m.w*2,y:m.y-rnd()*m.h*2,vx:(rnd()-.5)*1.2,vy:-rnd()*1,t:30+rnd()*20})}
function hurt(dir){if(P.inv>0||P.st==='dead')return;P.hp--;P.inv=90;P.st='hurt';P.vy=-3.6;P.vx=dir*2.2;SFX.hurt();G.shake=5;haptic(60);
  G.pops.push({x:P.x,y:P.y-24,s:'-1',c:'#ff6a7a',t:36});if(P.hp<=0)die('hit')}
function die(why){if(P.st==='dead')return;P.st='dead';P.vx=0;G.state='dying';G.deadT=why==='fall'?50:90;SFX.die();music(false);haptic(90);
  if(why==='hit'){P.vy=-3;for(let i=0;i<20;i++)G.fx.push({k:'smoke',x:P.x+(rnd()-.5)*10,y:P.y-rnd()*16,vx:(rnd()-.5)*1.5,vy:-rnd()*1.2,t:40})}}
function gameOver(){G.state='over';G.overT=40;G.newBest=G.maxH>G.best;if(G.newBest){G.best=G.maxH;store.set('best',G.best)}}
const spark=(x,y,c,n)=>{for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=.6+rnd()*1.8;G.fx.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:10+rnd()*8,c})}};
/* ---------- the world moving ---------- */
function stepPlats(){for(const p of G.plats){if(!p.vx)continue;p.x+=p.vx;if(p.x<p.w/2+4||p.x>W-p.w/2-4)p.vx*=-1}}
function stepMons(){for(const m of G.mons){m.f++;if(m.flash>0)m.flash--;if(m.safe>0)m.safe--;
    if(m.st==='dying'){if(--m.dieT<=0)m.st='gone';continue}if(m.st==='stun')continue;
    const t=G.t+m.ph*60;
    if(m.plat){if(m.plat.gone){m.y+=3;continue}m.dx=(m.dx||0)+m.vx;const lim=m.plat.w/2-m.w;if(Math.abs(m.dx)>lim){m.dx=clamp(m.dx,-lim,lim);m.vx*=-1}m.x=m.plat.x+m.dx;m.y=m.plat.y-m.h-1;
      if(m.t==='garg'&&--m.shotT<=0){m.shotT=150;const dy=P.y-m.y,dx=P.x-m.x;if(dy>-40&&dy<160&&Math.abs(dx)<130){const l=Math.hypot(dx,dy)||1;G.shots.push({x:m.x,y:m.y+2,vx:dx/l*1.3,vy:dy/l*1.3,life:200});m.open=20;SFX.spit()}}
      if(m.open>0)m.open--}
    else if(m.t==='wisp'){m.x=m.bx+Math.sin(t*.025)*22;m.y=m.by+Math.sin(t*.05)*4}
    else if(m.t==='bat'){m.bx+=m.vx;if(m.bx<-10)m.bx=W+10;if(m.bx>W+10)m.bx=-10;m.x=m.bx;m.y=m.by+Math.sin(t*.08)*8}
    else if(m.t==='wraith'){const dy=P.y-10-m.by;if(Math.abs(dy)<130&&P.st!=='dead'){m.bx+=sgn(P.x-m.bx)*.32;m.by+=clamp(dy,-1,1)*.18}m.x=m.bx;m.y=m.by+Math.sin(t*.06)*3}}}
function stepItems(){for(const i of G.items){if(i.got)continue;if(i.boing>0)i.boing--;let x=i.x,y=i.y;if(i.plat){x=i.plat.x+i.dx;y=i.plat.y;if(i.plat.gone)i.got=1;continue}
    if(i.fly){i.x+=i.vx;i.y+=i.vy;i.vx*=.92;i.vy*=.92;if(Math.abs(i.vx)+Math.abs(i.vy)<.3)i.fly=0}
    if(i.t==='soul'){const dx=P.x-i.x,dy=P.y-8-i.y,d=Math.hypot(dx,dy);if(d<46&&P.st!=='dead'){i.x+=dx/d*2.4;i.y+=dy/d*2.4}if(d<8){i.got=1;G.souls++;G.soulBank++;SFX.soul();
        if(G.soulBank>=40){G.soulBank-=40;if(P.hp<5){P.hp++;SFX.heart();G.pops.push({x:P.x,y:P.y-28,s:'+1 ♥',c:'#ff8a9a',t:50})}}}}
    if(i.t==='heart'&&Math.abs(P.x-i.x)<9&&Math.abs(P.y-8-i.y)<12){i.got=1;P.hp=Math.min(5,P.hp+1);SFX.heart();G.pops.push({x:P.x,y:P.y-28,s:'+1 ♥',c:'#ff8a9a',t:50})}}}
function stepShots(){for(const s of G.shots){s.x+=s.vx;s.y+=s.vy;s.life--;if(G.t%3===0)G.fx.push({k:'ember',x:s.x,y:s.y,vx:0,vy:-.2,t:12});
    if(P.st!=='combo'&&P.st!=='dead'&&Math.abs(s.x-P.x)<6&&s.y>P.y-16&&s.y<P.y+2){s.life=0;hurt(sgn(s.vx)||1)}}
  G.shots=G.shots.filter(s=>s.life>0&&s.y<G.camY+H+20)}
function stepFx(){for(const e of G.fx){e.t--;e.x+=e.vx||0;e.y+=e.vy||0;if(e.k==='chip'||e.k==='dust')e.vy=(e.vy||0)+.08}G.fx=G.fx.filter(e=>e.t>0);
  for(const q of G.pops){q.t--;q.y-=.35}G.pops=G.pops.filter(q=>q.t>0)}

/* ================= drawing ================= */
const sy=y=>Math.round(y-G.camY);
/* a crisp pixel line, for the sword */
function pline(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy2=y0<y1?1:-1;let e=dx+dy;ctx.fillStyle=c;
  for(let i=0;i<64;i++){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy2}}}
function drawSword(hx,hy,ang,len=10){const c=Math.cos(ang),s=Math.sin(ang);
  pline(hx-c*2,hy-s*2,hx,hy,'#6a4a2a');pline(hx-s*2,hy+c*2,hx+s*2,hy-c*2,'#c8a040');
  pline(hx+c,hy+s,hx+c*len,hy+s*len,'#d8e2ee');ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(hx+c*len),Math.round(hy+s*len),1,1)}
/* where the sword points: resting low, and the arc of each slash in a combo */
const SWING=[[-1.3,1.1],[-.9,.6],[.9,-.7],[-1.6,1.4],[-2.6,3.6]];
function swordAngle(){if(P.st==='slam')return Math.PI/2;if(P.st==='dead')return .2;
  if(P.slashT>0){const[a,b]=SWING[Math.min(4,P.slashN)],dur=P.slashN>=4?16:P.slashN?11:12,t=1-P.slashT/dur,e=1-(1-t)*(1-t);return a+(b-a)*e}
  return P.vy<0?1.2:.7}
function drawReaper(){if(P.inv>0&&P.st!=='dead'&&Math.floor(P.inv/4)%2)return;
  const pose=P.st==='dead'?'dead':P.st==='slam'?'slam':P.st==='hurt'?'hurt':P.slashT>0||P.st==='combo'?'hit':P.vy<0?'up':'fall';
  const im=reaperSpr(pose)[P.face<0?1:0],x=Math.round(P.x-8),y=sy(P.y)-20;ctx.drawImage(im,x,y);
  if(P.st==='dead')return;
  const h=HAND[pose]||HAND.up,hx=x+(P.face>0?h[0]:15-h[0]),hy=y+h[1];let a=swordAngle();if(P.face<0)a=Math.PI-a;
  /* a swoosh behind the blade while it swings */
  if(P.slashT>0){const[a0,a1]=SWING[Math.min(4,P.slashN)];let s0=a0,s1=swordAngle();if(P.face<0){s0=Math.PI-s0;s1=Math.PI-s1}
    ctx.strokeStyle=P.slashN>=4?'rgba(255,216,74,.85)':'rgba(170,240,255,.75)';ctx.lineWidth=P.slashN>=4?3:2;ctx.beginPath();ctx.arc(hx,hy,P.slashN>=4?14:11,Math.min(s0,s1),Math.max(s0,s1));ctx.stroke()}
  drawSword(hx,hy,a,P.slashN>=4&&P.slashT>0?13:10)}
function drawMon(m){const t=m.t,fr=t==='garg'?(m.open>0?1:0):Math.floor((m.f+m.ph*10)/12)%2;let im=monSpr(t,fr)[(m.plat?m.vx<0:P.x<m.x)?1:0];
  if(m.flash>0||m.st==='dying'&&m.dieT%4<2)im=flashOf(im);
  const x=Math.round(m.x-im.width/2),y=sy(m.y+m.h)-im.height;if(m.st==='dying')ctx.globalAlpha=Math.max(0,m.dieT/26);ctx.drawImage(im,x,y);ctx.globalAlpha=1;
  if(m.st==='dying')return;
  if(m.st==='stun'){for(let i=0;i<3;i++){const a=G.t*.12+i*2.1;ctx.fillStyle='#ffd84a';ctx.fillRect(Math.round(m.x+Math.cos(a)*7),y-3+Math.round(Math.sin(a)*2),1,1)}}
  /* how many combos it still takes: one red pip each; the bar is what is left of the current one */
  const left=Math.ceil(m.hp/6),part=(m.hp%6||6)/6,pw=left*4-1,px=Math.round(m.x-pw/2),py=y-5;
  for(let i=0;i<left;i++){ctx.fillStyle=K;ctx.fillRect(px+i*4-1,py-1,5,5);ctx.fillStyle=i===left-1?'#ff3a4a':'#a01828';ctx.fillRect(px+i*4,py,3,3)}
  if(m.hp<m.max){ctx.fillStyle=K;ctx.fillRect(px-1,py+4,pw+2,3);ctx.fillStyle='#ffd84a';ctx.fillRect(px,py+5,Math.max(1,Math.round(pw*part)),1)}}
function drawWorld(){const m=meters(G.camY+H/2),z=zoneAt(m),zi=ZONES.indexOf(z);ctx.drawImage(skyCanvas(z),0,0);
  if(zi>0&&m<z.at+60){ctx.globalAlpha=1-(m-z.at)/60;ctx.drawImage(skyCanvas(ZONES[zi-1]),0,0);ctx.globalAlpha=1}
  const sc=silCanvas(z),off=((-G.camY*.3)%200+200)%200;for(let y=off-200;y<H;y+=200)ctx.drawImage(sc,0,Math.round(y));
  const fg=ctx.createLinearGradient(0,H-70,0,H);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(1,z.fog+'66');ctx.fillStyle=fg;ctx.fillRect(0,H-70,W,70);
  /* the best height so far, as a dashed line across the tower */
  if(G.best>0){const by=sy(-G.best*10);if(by>-4&&by<H){ctx.fillStyle='rgba(255,216,74,.5)';for(let x=0;x<W;x+=6)ctx.fillRect(x,by,3,1);txt('BEST',2,by-8,'#ffd84a',1,'l',K)}}
  for(const p of G.plats){const c=platCanvas(p.kind,p.w),y=sy(p.y);if(y<-10||y>H+10)continue;ctx.drawImage(c,Math.round(p.x-p.w/2-1),y-1)}
  for(const i of G.items){if(i.got)continue;if(i.t==='spring'){const y=sy(i.plat.y)-7-(i.boing>0?2:0);ctx.drawImage(SPRING(),Math.round(i.plat.x+i.dx-6),y);continue}
    const b=Math.round(Math.sin(G.t*.08+i.ph)*1.5),y=sy(i.y);if(y<-10||y>H+10)continue;ctx.drawImage(i.t==='soul'?SOUL():HEART(),Math.round(i.x-(i.t==='soul'?3:4)),y-4+b)}
  for(const m of G.mons)drawMon(m);
  for(const s of G.shots){const x=Math.round(s.x),y=sy(s.y);ctx.fillStyle='rgba(255,120,40,.4)';ctx.fillRect(x-3,y-3,7,7);ctx.fillStyle='#ffb04a';ctx.fillRect(x-2,y-2,5,5);ctx.fillStyle='#fff0c0';ctx.fillRect(x-1,y-1,3,3)}
  drawReaper();
  for(const e of G.fx){const x=Math.round(e.x),y=sy(e.y);
    if(e.k==='spark'){ctx.fillStyle=e.c;ctx.fillRect(x,y,1,1)}
    else if(e.k==='dust'||e.k==='smoke'){ctx.fillStyle=e.k==='smoke'?'rgba(150,130,190,'+(e.t/50).toFixed(2)+')':'rgba(200,190,220,'+(e.t/24).toFixed(2)+')';ctx.fillRect(x,y,2,2)}
    else if(e.k==='chip'){ctx.fillStyle=e.c;ctx.fillRect(x,y,2,2)}
    else if(e.k==='ember'){ctx.fillStyle='rgba(255,140,40,'+(e.t/12).toFixed(2)+')';ctx.fillRect(x,y,1,1)}
    else if(e.k==='trail'){ctx.fillStyle='rgba(120,90,200,'+(e.t/14).toFixed(2)+')';ctx.fillRect(x-4,y-6,9,10)}}
  for(const q of G.pops)txt(q.s,Math.round(q.x),sy(q.y),q.c,1,'c',K)}
function hearts(x,y){for(let i=0;i<5;i++){if(i>=P.hp&&i>=3)continue;const im=HEART();if(i<P.hp)ctx.drawImage(im,x-i*10,y);else{ctx.globalAlpha=.25;ctx.drawImage(im,x-i*10,y);ctx.globalAlpha=1}}}
function drawHUD(){ctx.fillStyle='rgba(7,5,12,.55)';ctx.fillRect(0,0,W,13);txt(meters(P.y)+'M',3,3,'#ffffff',1,'l',K);
  ctx.drawImage(SOUL(),52,2);txt(G.souls,61,3,'#a8dcff',1,'l',K);hearts(W-11,2);
  /* in a combo: one pip per slash, and the time left to press A */
  if(P.st==='combo'){const cx=W/2,y=H-22;ctx.fillStyle='rgba(7,5,12,.7)';ctx.fillRect(cx-34,y-2,68,16);
    for(let i=0;i<4;i++){ctx.fillStyle=i<P.comboN?'#ffd84a':'#3a2c52';ctx.fillRect(cx-28+i*14,y+1,10,6)}txt(P.comboN<4?'A':'',cx+30,y,'#ff6a7a',1,'c');
    ctx.fillStyle='#c88aff';ctx.fillRect(cx-32,y+10,Math.round(64*P.comboT/56),2)}

  ctx.drawImage(platCanvas('stone',44),W/2-22,H-40);const by=H-40-Math.abs(Math.sin(G.t*.06))*36;const sv=P.y;P.x=W/2;P.y=by+G.camY;P.face=1;P.st='air';P.vy=Math.cos(G.t*.06)>0?-1:1;P.slashT=0;P.inv=0;drawReaper();P.y=sv;

  const rows=[['HEIGHT',G.maxH+'M'],['BEST',G.best+'M'],['KILLS',G.kills],['SOULS',G.souls],['BEST COMBO',G.bestCombo+' HITS']];
  rows.forEach(([a,b],i)=>{txt(a,24,76+i*13,'#c8c0e0');txt(b,W-24,76+i*13,'#ffffff',1,'r')});if(G.newBest&&G.t%40<28)txt('NEW BEST!',W/2,144,'#ffd84a',1,'c',K);

/* ================= steering: tilt the phone, or the D-pad where tilt isn't available =================
   Tilt comes from the phone's orientation sensor. iPhone asks permission first, and only inside a tap, so the game
   asks on the first button press. On the ZigaPlay the sensor is read from the console page, where the touches are. */
const OPT={steer:store.get('steer','auto'),sens:store.get('sens',1)};
const FULL=[30,20,13];
const TILT={raw:0,abs:0,center:store.get('tc',0),live:false,lastAt:-1e9,perm:'unknown'};
const TW=(()=>{try{return ZP?window.parent:window}catch(e){return window}})();
const held={};
function orientAngle(){try{const o=TW.screen&&TW.screen.orientation;if(o&&typeof o.angle==='number')return o.angle;if(typeof TW.orientation==='number')return TW.orientation}catch(e){}return 0}
function onTilt(e){if(e.gamma==null&&e.beta==null)return;const a=((orientAngle()%360)+360)%360,g=e.gamma||0,b=e.beta||0;
  const lat=a===90?b:a===270?-b:a===180?-g:g;TILT.abs=lat;TILT.raw=lat-TILT.center;TILT.lastAt=performance.now();TILT.live=true}
try{TW.addEventListener('deviceorientation',onTilt)}catch(e){addEventListener('deviceorientation',onTilt)}
function requestTilt(){if(TILT.perm==='granted'||TILT.perm==='denied'||TILT.perm==='asking')return;let D=null;try{D=TW.DeviceOrientationEvent}catch(e){}
  if(D&&typeof D.requestPermission==='function'){TILT.perm='asking';try{D.requestPermission().then(r=>{TILT.perm=r==='granted'?'granted':'denied'}).catch(()=>{TILT.perm='unknown'})}catch(e){TILT.perm='unknown'}}
  else TILT.perm='granted'}
function tiltLive(){if(performance.now()-TILT.lastAt>1500)TILT.live=false;return TILT.live}
const tiltOK=()=>tiltLive();
function tiltLine(){if(tiltLive())return'TILT ON: TILT TO STEER';if(TILT.perm==='denied')return'TILT OFF: D-PAD STEERS';
  let D=null;try{D=TW.DeviceOrientationEvent}catch(e){}if(D&&typeof D.requestPermission==='function'&&TILT.perm!=='granted')return'PRESS A TO ALLOW TILT';return'NO TILT HERE: D-PAD STEERS'}
function steerMode(){if(OPT.steer==='pad')return'pad';if(OPT.steer==='tilt')return'tilt';return tiltLive()?'tilt':'pad'}
function steerX(){if(steerMode()==='tilt'){let v=TILT.raw/FULL[OPT.sens];if(Math.abs(v)<.08)v=0;return clamp(v*Math.abs(v)*.35+v*.65,-1,1)}
  return(held.right?1:0)-(held.left?1:0)}
function centerTilt(){TILT.center=TILT.abs;TILT.raw=0;store.set('tc',TILT.center);SFX.pick();if(G.state==='play'||G.state==='pause')G.pops.push({x:P.x,y:P.y-30,s:'TILT CENTERED',c:'#7af0ff',t:50})}
document.documentElement.classList.toggle('notilt',true);setInterval(()=>RT.classList.toggle('notilt',steerMode()!=='tilt'),500);

/* ================= buttons ================= */
function input(btn,down){unlock();requestTilt();held[btn]=down;if(!down)return;const s=G.state;
  const nav=(n,fn)=>{if(btn==='up'){G.menu=(G.menu+n-1)%n;SFX.move()}else if(btn==='down'){G.menu=(G.menu+1)%n;SFX.move()}else fn()};
  if(s==='title')nav(3,()=>{if(btn!=='a'&&btn!=='start')return;SFX.pick();if(G.menu===0){SFX.start();newGame()}else if(G.menu===1)G.state='how';else{G.optBack='title';G.state='opts';G.menu=0}});
  else if(s==='how'){if(btn==='a'||btn==='b'||btn==='start'){SFX.pick();G.state='title';G.menu=1}}
  else if(s==='opts')nav(6,()=>{const i=G.menu,ch=btn==='left'?-1:btn==='right'?1:btn==='a'?1:0;
    if(btn==='b'||(btn==='a'&&i===5)||btn==='start'){SFX.pick();if(G.optBack==='pause'){G.state='pause';G.menu=2}else{G.state='title';G.menu=2}return}
    if(!ch)return;if(i===0){const o=['auto','tilt','pad'];OPT.steer=o[(o.indexOf(OPT.steer)+ch+3)%3];store.set('steer',OPT.steer)}
    else if(i===1){OPT.sens=(OPT.sens+ch+3)%3;store.set('sens',OPT.sens)}else if(i===2){if(btn==='a')centerTilt();return}
    else if(i===3){setMute(!muted);if(!muted)unlock()}else if(i===4){HAP.on=!HAP.on;store.set('vib',HAP.on);if(HAP.on)haptic(25)}SFX.move()});
  else if(s==='play'){if(btn==='a'||btn==='b')P.buf[btn]=G.t;else if(btn==='start'){pause()}else if(btn==='select')centerTilt()}
  else if(s==='pause')nav(4,()=>{if(btn==='start'||btn==='b'){resume();return}if(btn!=='a')return;SFX.pick();
    if(G.menu===0)resume();else if(G.menu===1){centerTilt();resume()}else if(G.menu===2){G.optBack='pause';G.state='opts';G.menu=0}else toTitle()});
  else if(s==='over'&&G.overT<=0){if(btn==='a'||btn==='start'){SFX.start();newGame()}else if(btn==='b'){SFX.pick();toTitle()}}}
function pause(){if(G.state!=='play')return;G.state='pause';G.menu=0;music(false)}
function resume(){G.state='play';music(true)}
function toTitle(){G.state='title';G.menu=0;music(true)}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'a',Z:'a',k:'a',K:'a',' ':'a',x:'b',X:'b',j:'b',J:'b',Enter:'start',Escape:'start',p:'start',Shift:'select'};
addEventListener('keydown',e=>{const b=KEYMAP[e.key];if(!b)return;e.preventDefault();if(e.repeat)return;input(b,true)});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)input(b,false)});
addEventListener('blur',()=>{for(const k in held)held[k]=false});
for(const[id,btn]of[['bA','a'],['bB','b'],['bP','start'],['bL','left'],['bR','right']]){const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');input(btn,true)});
  const up=()=>{if(!el.classList.contains('on'))return;el.classList.remove('on');input(btn,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
/* tapping the picture: choose on the menus (and asks for tilt on iPhone) */
cv.addEventListener('pointerup',()=>{if(G.state==='title'||G.state==='how'||(G.state==='over'&&G.overT<=0))input('a',true),input('a',false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();music(false)}});
addEventListener('resize',()=>{if(G.state==='title'&&targetH()!==H)applySize();else fit()});

/* ================= the console ================= */
window.ZPCart={title:'Grim Ascent',input(btn,down){input(btn,down)},
  status(){return{state:G.state,tilt:tiltLive(),perm:TILT.perm,raw:Math.round(TILT.raw),steer:+steerX().toFixed(2),h:G.maxH}},
  home(){if(G.state==='title'||G.state==='over'||G.state==='how'||G.state==='opts'&&G.optBack==='title')return true;pause();return'ask'},snapshot(){return null}};
if(ZP&&ZP.cartReady)try{ZP.cartReady(window.ZPCart)}catch(e){}

/* ================= go ================= */
applySize();toTitle();
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){acc+=Math.min(250,now-last);last=now;let n=0;if(window.__GA&&window.__GA.freeze)acc=0;
  while(acc>=STEP&&n<6){update();if(G.state==='over'&&G.overT>0)G.overT--;acc-=STEP;n++}if(n>=6)acc=0;render();requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
/* hooks for automated tests only (the address must end in #grimtest) */
if(/grimtest/.test(location.hash))window.__GA={G,P,TILT,OPT,held,input,update,render,newGame,toTitle,spawnMon,startCombo,steerX,onTilt,platCanvas,monSpr,reaperSpr,MON};

})();
</script>
</body></html>
