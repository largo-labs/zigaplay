<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipsqueak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>
:root{color-scheme:dark;--ui:'Pixelify Sans',ui-monospace,Menlo,monospace;--num:'VT323',ui-monospace,Menlo,monospace;--s:2}
*,::before,::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg,#0b0a16);color:var(--ink,#f4f1ff);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
#app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;flex:none;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--s)*7px);line-height:1}
#hud[hidden]{display:none}
#hud>*{position:absolute;white-space:nowrap}
#hud .n{font-family:var(--num);font-size:calc(var(--s)*10px);letter-spacing:.02em}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*4px);padding:calc(var(--s)*5px);text-align:center;background:var(--veil,rgba(8,6,24,.8));font-size:calc(var(--s)*7px);line-height:1.25;overflow:hidden}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:calc(var(--s)*17px);line-height:1;letter-spacing:.04em;font-weight:700}
#ov h2{margin:0;font-size:calc(var(--s)*11px);line-height:1.1;letter-spacing:.06em;font-weight:700}
#ov p{margin:0;max-width:calc(var(--s)*150px);opacity:.86}
#ov .foot{font-size:calc(var(--s)*5.5px);opacity:.7;letter-spacing:.04em}
#ov .big{font-family:var(--num);font-size:calc(var(--s)*20px);line-height:.9}
.menu{display:flex;flex-direction:column;gap:calc(var(--s)*2px);width:min(92%,calc(var(--s)*112px))}
.menu button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;display:flex;justify-content:space-between;align-items:center;gap:calc(var(--s)*4px);
  padding:calc(var(--s)*2.5px) calc(var(--s)*4px);border:calc(var(--s)*1px) solid var(--line,#3a3566);border-radius:calc(var(--s)*2px);background:var(--panel,#1d1a3a);letter-spacing:.06em;text-align:left}
.menu button:focus{outline:none}
.menu button em{font-style:normal;opacity:.9}
.menu button.adj em::before{content:'◀ ';opacity:.5}.menu button.adj em::after{content:' ▶';opacity:.5}
.menu button.hot{background:var(--hot,#ffd166);color:var(--hotink,#1a1230);border-color:#fff}
body{--bg:#101a30;--panel:#27304f;--line:#56628f;--hot:#ffd23f;--hotink:#2a1a08;--veil:rgba(14,18,40,.78)}
#hud .bar{left:0;right:0;top:calc(var(--s)*3px);display:flex;justify-content:space-between;padding:0 calc(var(--s)*5px);color:#fff;font-size:calc(var(--s)*7px);letter-spacing:.04em;
  text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #1a1230}
#hud .bar b{font-weight:700}
#hCoins{color:#ffd23f}
#ov.title{background:rgba(14,18,40,.38)}
#ov.card{background:#0e1228}
#ov.card h2{color:#ffd23f}
#ov.card .pip{margin-top:calc(var(--s)*4px)}
.logo{color:#ffd23f;text-shadow:0 calc(var(--s)*2px) 0 #c8601a,0 calc(var(--s)*3px) 0 #3a1a08,calc(var(--s)*-1px) 0 0 #3a1a08,calc(var(--s)*1px) 0 0 #3a1a08,0 calc(var(--s)*-1px) 0 #3a1a08}
#ov.title p{text-shadow:0 calc(var(--s)*1px) 0 #1a1230;opacity:1}
.keys{line-height:1.6;text-align:left}.keys b{color:#ffd23f;font-weight:700}
</style></head><body>
<div id="app"><div id="stage"><canvas id="cv"></canvas>
<div id="hud" hidden><div class="bar"><b id="hLives"></b><b id="hCoins"></b><b id="hScore"></b><b id="hWorld"></b><b id="hTime"></b></div></div>
<div id="ov" hidden></div></div></div>

<script>
(()=>{
'use strict';
/* ---------- shared kit: console hookup, buttons, sound, saves, menus ---------- */
/* ZigaPlay: inside the console, window.parent.ZIGAPLAY is the console's API (same origin). */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random,ri=n=>Math.floor(rnd()*n),pick=a=>a[ri(a.length)];
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
/* how big one game pixel is on screen: the largest size, in whole device pixels, at which a view of at least minW x minH still fits */
function pickScale(W,H,minW,minH){const dpr=Math.max(1,window.devicePixelRatio||1),k=Math.max(1,Math.floor(Math.min(W/minW,H/minH)*dpr+1e-6));return k/dpr}
/* the console's second screen (below the hinge): rows of numbers and one small canvas; missing when the game runs on its own */
const PANEL=ZP&&ZP.panel&&typeof ZP.panel.rows==='function'?ZP.panel:null;

/* ---------- sound: a few oscillators for effects and a step sequencer for the tune ---------- */
const SND=(()=>{const AC=window.AudioContext||window.webkitAudioContext;let ctx=null,master=null,musicG=null,mode=2,song=null,sStep=0,sNext=0,timer=0,nbuf=null,paused=false;
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const freq=n=>{const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;const s=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12*(+m[3]+1);return 440*Math.pow(2,(s-69)/12)};
  function unlock(){if(!AC)return;try{if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=mode?0.55:0;master.connect(ctx.destination);
      musicG=ctx.createGain();musicG.gain.value=.5;musicG.connect(master);
      nbuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
    if(ctx.state!=='running'&&!paused)ctx.resume().catch(()=>{})}catch(e){}}
  function tone(f,d,o={}){if(!ctx||!mode||ctx.state!=='running')return;const t=Math.max(ctx.currentTime,o.t||0)+(o.at||0),os=ctx.createOscillator(),g=ctx.createGain(),v=o.vol||.1;
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);os.connect(g);g.connect(o.dest||master);os.start(t);os.stop(t+d+.03)}
  function noise(d,o={}){if(!ctx||!mode||ctx.state!=='running')return;const t=Math.max(ctx.currentTime,o.t||0)+(o.at||0),s=ctx.createBufferSource(),g=ctx.createGain(),v=o.vol||.1;s.buffer=nbuf;
    let n=s;if(o.hp||o.lp){const f=ctx.createBiquadFilter();f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.hp||o.lp;s.connect(f);n=f}
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);n.connect(g);g.connect(o.dest||master);s.start(t);s.stop(t+d+.03)}
  /* a channel: 'E5 . G5 - k h' -> one token per sixteenth; '.' rests, '-' holds the note before it; k h s are drums */
  function seq(type,vol,str){const tk=str.trim().split(/\s+/),ev=[];let last=null;tk.forEach((x,i)=>{if(x==='.'){last=null}else if(x==='-'){if(last)last.n++}else{last={f:type==='drum'?x:freq(x),n:1};ev[i]=last}});return{type,vol,ev,len:tk.length}}
  function tick(){if(!ctx||!song||mode<2||ctx.state!=='running')return;const spb=60/song.bpm/4;if(sNext<ctx.currentTime)sNext=ctx.currentTime+.06;
    while(sNext<ctx.currentTime+.3){for(const ch of song.ch){const e=ch.ev[sStep%ch.len];if(!e)continue;
        if(ch.type==='drum'){if(e.f==='k')tone(140,.11,{type:'sine',to:45,vol:ch.vol*1.6,t:sNext,dest:musicG});else if(e.f==='s')noise(.09,{vol:ch.vol,hp:1800,t:sNext,dest:musicG});else noise(.03,{vol:ch.vol*.6,hp:6000,t:sNext,dest:musicG})}
        else tone(e.f,Math.max(.06,e.n*spb*.95),{type:ch.type,vol:ch.vol,t:sNext,dest:musicG})}
      sStep++;sNext+=spb}}
  return{unlock,tone,noise,seq,
    play(sg){if(song===sg)return;song=sg;sStep=0;sNext=0;if(!timer)timer=setInterval(tick,60)},
    stop(){song=null},
    get mode(){return mode},set mode(v){mode=v;if(master)master.gain.value=v?0.55:0},
    pause(p){paused=p;if(!ctx||ctx.state==='closed')return;try{(p?ctx.suspend():ctx.resume()).catch(()=>{})}catch(e){}},
    get ctx(){return ctx},get out(){return master},
    ui:{tick(){tone(1320,.035,{vol:.05})},ok(){tone(880,.06,{vol:.07});tone(1320,.1,{vol:.07,at:.06})},back(){tone(520,.07,{vol:.06,type:'triangle'});tone(390,.1,{vol:.06,type:'triangle',at:.06})}}}})();
const SOUND_NAMES=['OFF','EFFECTS','ALL'];

/* ---------- saved progress: this phone's storage, plus the player's account through the console ---------- */
function makeSave(id,fresh){const KEY=id+'-save';let SV=fresh(),cloud=false,t=0;
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')SV=Object.assign(fresh(),s)}catch(e){}
  const ZC=ZP&&ZP.cloud&&typeof ZP.cloud.save==='function'?ZP.cloud:null,push=()=>{try{ZC.save(id,JSON.stringify(SV),{})}catch(e){}};
  return{get v(){return SV},
    save(){SV.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}if(cloud){clearTimeout(t);t=setTimeout(push,1500)}},
    async init(onLoad){if(!ZC)return;for(let a=0;a<6;a++){let r=null;try{r=await ZC.load(id)}catch(e){}
        if(r&&r.ok){cloud=true;let cs=null;try{cs=r.json?JSON.parse(r.json):null}catch(e){}
          if(cs&&typeof cs==='object'&&(+cs.savedAt||0)>(+SV.savedAt||0)){const snd=SV.sound;SV=Object.assign(fresh(),cs);SV.sound=snd;try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}if(onLoad)onLoad()}
          else if(SV.savedAt)push();return}
        await sleep(9000)}},
    async flush(){if(!cloud)return;clearTimeout(t);push();try{await ZC.flush(id)}catch(e){}}}}

/* ---------- buttons: the console's own, or the keyboard when the game has focus ---------- */
const held={};let onBtn=()=>{},stickX=0,stickY=0;
function btnSet(b,d){d=!!d;if(!!held[b]===d)return;held[b]=d;if(d)SND.unlock();try{onBtn(b,d)}catch(e){console.error(e)}}
const KEYMAP=(()=>{const src=(ZP&&ZP.keys)||{up:['ArrowUp','w'],down:['ArrowDown','s'],left:['ArrowLeft','a'],right:['ArrowRight','d'],a:['z',' '],b:['x','Escape'],c:['c'],d:['v'],start:['Enter'],select:['Shift']},m={};
  for(const b in src)for(const k of src[b]){if(!k)continue;m[k]=b;if(k.length===1)m[k.toUpperCase()]=b}return m})();
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const b=KEYMAP[e.key];if(!b)return;e.preventDefault();if(!e.repeat)btnSet(b,true)});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)btnSet(b,false)});
addEventListener('blur',()=>{for(const b in held)if(held[b])btnSet(b,false)});
document.addEventListener('contextmenu',e=>e.preventDefault());
function hookConsole(id,title,save,extra){window.ZPCart=Object.assign({title,input(b,d){btnSet(b,d)},stick(x,y){stickX=x;stickY=y},async home(){try{await save.flush()}catch(e){}return true},snapshot:()=>null},extra||{});
  if(ZP){document.documentElement.classList.add('zp');try{if(ZP.takeRestore)ZP.takeRestore(id)}catch(e){}try{if(ZP.cartReady)ZP.cartReady(window.ZPCart)}catch(e){}}}

/* ---------- menus: a list of buttons over the game; the D-pad moves, A picks, B goes back ---------- */
const ov=$('#ov');let M=null;
function menu(o){M={items:o.items||[],i:o.i||0,back:o.back||null};ov.hidden=false;ov.className=o.cls||'';
  ov.innerHTML=(o.html||'')+'<div class="menu"></div>'+(o.foot?`<p class="foot">${o.foot}</p>`:'');const box=$('.menu',ov);
  M.items.forEach((it,n)=>{const b=el('button','',`<span>${it.t}</span>${it.v!=null?'<em></em>':''}`);b.tabIndex=-1;if(it.adj)b.classList.add('adj');
    b.addEventListener('click',()=>{SND.unlock();if(!M)return;M.i=n;menuMark();menuAct(it,1)});box.append(b)});menuMark()}
function menuMark(){if(!M)return;$$('.menu button',ov).forEach((b,n)=>{b.classList.toggle('hot',n===M.i);const it=M.items[n],em=$('em',b);if(em)em.textContent=typeof it.v==='function'?it.v():it.v})}
function menuAct(it,dir){if(it.adj){it.adj(dir);SND.ui.tick();menuMark()}else if(it.fn){SND.ui.ok();it.fn()}}
function menuInput(b){if(!M)return false;const n=M.items.length;if(!n){if(b==='b'&&M.back)M.back();return true}
  if(b==='up'){M.i=(M.i+n-1)%n;SND.ui.tick();menuMark()}else if(b==='down'){M.i=(M.i+1)%n;SND.ui.tick();menuMark()}
  else if(b==='left'||b==='right'){const it=M.items[M.i];if(it.adj){it.adj(b==='left'?-1:1);SND.ui.tick();menuMark()}}
  else if(b==='a'||b==='start')menuAct(M.items[M.i],1);else if(b==='b'){if(M.back){SND.ui.back();M.back()}}return true}
function closeMenu(){M=null;ov.hidden=true;ov.innerHTML=''}

/* =====================================================================================================
   PIPSQUEAK: a small chick runs, jumps and stomps across four lands to reach the balloon home.
   The world is a grid of 16-pixel tiles drawn on a small canvas scaled up in whole steps.
   ===================================================================================================== */
const S=makeSave('pipsqueak',()=>({v:1,sound:2,unlocked:1,best:0,done:0,spicy:0,savedAt:0}));
SND.mode=S.v.sound;
const cv=$('#cv'),g=cv.getContext('2d'),stage=$('#stage'),hud=$('#hud');
const TS=16,LH=13;

/* ---------- pixel painting: every sprite and tile is drawn here once, at load ---------- */
function paint(w,h,fn){const c=mkCanvas(w,h),x=c.getContext('2d');fn({r(col,X,Y,W=1,H=1){x.fillStyle=col;x.fillRect(X,Y,W,H)},
  d(col,cx,cy,rx,ry=rx){x.fillStyle=col;for(let Y=Math.floor(cy-ry)-1;Y<=cy+ry+1;Y++)for(let X=Math.floor(cx-rx)-1;X<=cx+rx+1;X++){const dx=(X+.5-cx)/rx,dy=(Y+.5-cy)/ry;if(dx*dx+dy*dy<=1)x.fillRect(X,Y,1,1)}},
  s(rows,pal,ox=0,oy=0){rows.forEach((row,Y)=>{for(let X=0;X<row.length;X++){const ch=row[X];if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(ox+X,oy+Y,1,1)}}})}},x);return c}
const flipX=c=>{const o=mkCanvas(c.width,c.height),x=o.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return o};
const both=c=>[c,flipX(c)];
const PIPPAL=[{O:'#4a2a08',B:'#ffd23f',L:'#fff1a8',W:'#f0a920',K:'#ff8a2a',E:'#221633',T:'#ffb020'},{O:'#5a1a08',B:'#ff8a3d',L:'#ffd9a0',W:'#e0541e',K:'#ffd23f',E:'#221633',T:'#ff3d3d'}];
const pipSmall=(p,f)=>paint(14,14,P=>{P.d(p.O,7,7.5,6,6);P.d(p.B,7,7.5,5,5);P.d(p.L,6,9.5,3,2.2);if(f===3)P.d(p.W,3.5,5.5,2,1.5);else P.d(p.W,4.5,8,2,1.6);
  P.r(p.E,9,5,2,2);P.r('#fff',9,5,1,1);P.r(p.K,12,7,2,1);P.r(p.K,12,8,1,1);P.r(p.T,7,0,1,2);P.r(p.T,5,1,1,1);
  const ft=[[4,8,13],[3,9,13],[5,7,13],[3,10,12]][f];P.r(p.K,ft[0],ft[2],2,1);P.r(p.K,ft[1],ft[2],2,1)});
const pipBig=(p,f)=>paint(16,24,P=>{P.d(p.O,8,13.5,7,10);P.d(p.B,8,13.5,6,9);P.d(p.L,7,16.5,3.6,5);if(f===3)P.d(p.W,3.5,10,2.4,2.4);else P.d(p.W,4.5,14.5,2.4,3.4);
  P.r(p.E,10,8,2,3);P.r('#fff',10,8,1,1);P.r(p.K,14,11,2,2);P.r(p.K,14,13,1,1);P.r(p.T,8,0,1,4);P.r(p.T,6,1,1,3);P.r(p.T,10,2,1,2);
  const ft=[[4,9,23],[3,10,23],[5,8,23],[3,10,22]][f];P.r(p.K,ft[0],ft[2],3,1);P.r(p.K,ft[1],ft[2],3,1)});
/* PIP[form][frame][dir]: form 0 small, 1 big, 2 pepper; frames stand, step, step, jump */
const PIP=[0,1,2].map(fm=>[0,1,2,3].map(f=>both(fm===0?pipSmall(PIPPAL[0],f):pipBig(PIPPAL[fm-1],f))));
const SPR={
  s:[0,1].map(f=>both(paint(14,12,P=>{P.d('#2a1440',7,6.5,6.5,5.5);P.d('#9a62e8',7,6.5,5.5,4.5);P.d('#c39aff',8.5,3.6,2.2,1);
    P.r('#fff',3,5,3,3);P.r('#fff',8,5,3,3);P.r('#221633',3,6,2,2);P.r('#221633',8,6,2,2);P.r('#2a1440',3,4,2,1);P.r('#2a1440',5,5,1,1);P.r('#2a1440',9,4,2,1);P.r('#2a1440',8,5,1,1);
    P.r('#ffb05c',f?2:3,11,3,1);P.r('#ffb05c',f?9:8,11,3,1)}))),
  sq:paint(14,5,P=>{P.d('#2a1440',7,3,6.5,2.5);P.d('#9a62e8',7,3,5.5,1.5);P.r('#fff',4,2,2,1);P.r('#fff',8,2,2,1)}),
  p:[0,1].map(f=>both(paint(14,12,P=>{P.d('#1c2a3a',7,7,6.5,5);P.d('#6f93b8',7,7,5.5,4);P.d('#a8c8e8',8,4.6,3,.9);for(const x of[5,8,11])P.r('#44658a',x,4+(x===8?-1:0),1,6);
    P.d('#1c2a3a',2.5,8.5,2.6,2.6);P.d('#f0c890',2.5,8.5,1.6,1.6);P.r('#221633',2,8,1,1);for(const x of f?[4,7,10]:[5,8,11])P.r('#1c2a3a',x,11,1,1)}))),
  pb:[0,1].map(f=>paint(12,12,P=>{P.d('#1c2a3a',6,6,6,6);P.d('#6f93b8',6,6,5,5);if(f){P.r('#44658a',3,2,1,8);P.r('#44658a',6,1,1,10);P.r('#44658a',9,2,1,8)}else{P.r('#44658a',2,3,8,1);P.r('#44658a',1,6,10,1);P.r('#44658a',2,9,8,1)}P.d('#a8c8e8',4,3.5,1.6,1)})),
  k:[0,1].map(f=>both(paint(14,14,P=>{for(const x of[2,5,8,11]){P.r('#fff6dc',x,0,1,2);P.r('#e8d0a0',x-1,2,3,2)}P.d('#40140a',7,8.5,6.5,5.5);P.d('#e8552a',7,8.5,5.5,4.5);P.d('#ff9a6a',8.5,5.8,2.2,.9);
    P.r('#fff',3,7,3,3);P.r('#fff',8,7,3,3);P.r('#221633',3,8,2,2);P.r('#221633',8,8,2,2);P.r('#40140a',3,6,3,1);P.r('#40140a',8,6,3,1);P.r('#ffcf5a',f?2:3,13,3,1);P.r('#ffcf5a',f?9:8,13,3,1)}))),

function moveBody(o,dt){o.hitL=o.hitR=false;o.bump=null;const pb=o.y+o.h;
  o.x+=o.vx*dt;let y0=Math.floor(o.y/TS),y1=Math.floor((o.y+o.h-.01)/TS);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-.01)/TS);for(let ty=y0;ty<=y1;ty++)if(isSolid(at(tx,ty))){o.x=tx*TS-o.w;o.vx=0;o.hitR=true;break}}
  else if(o.vx<0){const tx=Math.floor(o.x/TS);for(let ty=y0;ty<=y1;ty++)if(isSolid(at(tx,ty))){o.x=(tx+1)*TS;o.vx=0;o.hitL=true;break}}
  o.y+=o.vy*dt;o.onG=false;const x0=Math.floor(o.x/TS),x1=Math.floor((o.x+o.w-.01)/TS);

function stepPlay(dt){
  /* planks that move, and Pip riding one */
  for(const pl of plats){const ox=pl.x,oy=pl.y;pl.t+=dt;if(pl.m==='>')pl.x=pl.bx+Math.sin(pl.t*1.1)*44;else pl.y=pl.by+Math.sin(pl.t*1.1)*34;pl.dx=pl.x-ox;pl.dy=pl.y-oy}
  if(P.ride){const pl=P.ride;if(P.x+P.w>pl.x&&P.x<pl.x+pl.w&&P.vy>=0){P.x+=pl.dx;P.y=pl.y-P.h}else P.ride=null}

  const din=(held.right?1:0)-(held.left?1:0);if(din){P.dir=din;if(P.onG&&Math.sign(P.vx)===din)P.dash+=dt}else P.dash=0;

  if(din){const skid=P.vx*din<0;P.vx+=din*(skid?(P.onG?1100:800):P.onG?560:480)*dt;if(Math.abs(P.vx)>cap)P.vx=Math.sign(P.vx)*Math.max(cap,Math.abs(P.vx)-900*dt)}
  else{const f=(P.onG?700:160)*dt;P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f}
  if(P.onG){P.coy=.09;chain=0}else P.coy-=dt;P.jbuf-=dt;
  if(P.jbuf>0&&P.coy>0){P.vy=-338-(Math.abs(P.vx)>125?22:0);P.jbuf=0;P.coy=0;P.ride=null;SFX.jump()}
  if(P.vy>=0)P.spr=0;P.vy=Math.min(P.vy+(P.vy<0&&(held.a||P.spr)?820:2100)*dt,400);P.prevB=P.y+P.h;const wasG=P.onG;

  if(P.onG&&P.under==='S'&&!P.ride){P.vy=-470;P.spr=1;P.onG=false;P.coy=0;SFX.spring();bumps.push({tx:P.ux,ty:P.uy,t:.16,down:1})}
  if(P.onG&&Math.abs(P.vx)>10)P.walk+=Math.abs(P.vx)*dt;if(P.inv>0)P.inv-=dt;
  /* coins and spikes under Pip's box */
  for(let ty=Math.floor(P.y/TS);ty<=Math.floor((P.y+P.h-1)/TS);ty++)for(let tx=Math.floor(P.x/TS);tx<=Math.floor((P.x+P.w-1)/TS);tx++){const c=at(tx,ty);
    if(c==='o'){G[ty][tx]=' ';addCoin(tx*TS,ty*TS)}else if(c==='^'&&P.y+P.h>ty*TS+8)hurt()}
  if(P.y>LH*TS+24){die();return}

  for(const it of items){if(it.rise>0){it.rise-=34*dt;it.y-=34*dt;continue}if(it.k!=='pepper')it.vx=it.dir*46;it.vy=Math.min(it.vy+1400*dt,380);moveBody(it,dt);if(it.hitL)it.dir=1;if(it.hitR)it.dir=-1;if(it.y>LH*TS+20)it.gone=true;
    if(overlap(P,it)){it.gone=true;if(it.k==='heart'){lives++;SFX.life();pops.push({x:it.x,y:it.y-8,t:1.2,txt:'1UP'})}else{addScore(1000,it.x,it.y-8);SFX.grow();if(it.k==='pepper')setForm(2);else if(!P.form)setForm(1)}}}

  for(const e of foes){if(e.dead||e.sq>0||!e.act||!overlap(P,e))continue;
    if(e.type==='p'&&e.ball&&!e.roll){e.roll=true;e.dir=P.x+P.w/2<e.x+e.w/2?1:-1;e.vx=e.dir*190;e.kick=.3;SFX.kick();if(P.vy>0)P.vy=-190;continue}
    if(P.vy>0&&P.prevB<=e.y+6&&e.type!=='k'&&e.type!=='K'){chain++;const pts=Math.min(1600,100*Math.pow(2,chain-1));P.vy=held.a?-310:-200;P.y=e.y-P.h;SFX.stomp();

    for(const e of foes)if(!e.dead&&!e.sq&&e.act&&overlap(m,e)){m.gone=true;if(e===boss){e.hp--;e.flash=.25;SFX.stomp();if(e.hp<=0)killFoe(e,Math.sign(vx))}else killFoe(e,Math.sign(vx),100);break}}

  if(bell&&!bell.rung&&overlap(P,bell))ringBell();
  if(goal&&overlap(P,{x:goal.x+6,y:goal.y+20,w:18,h:30})){if(bell&&!bell.rung)ringBell();state='win';winT=0;P.vx=P.vy=0;SND.stop();SFX.goal()}

function stepFoe(e,dt){if(e.dead){e.vy+=1400*dt;e.y+=e.vy*dt;e.x+=e.vx*dt;if(e.y>LH*TS+50)e.gone=true;return}

  e.t+=dt;if(e.kick>0)e.kick-=dt;if(e.flash>0)e.flash-=dt;
  if(e.type==='f'){e.x+=e.dir*e.spd*dt;if(e.x<e.bx-40)e.dir=1;else if(e.x>e.bx+40)e.dir=-1;e.y=e.by+Math.sin(e.t*3)*12;return}

  if(e.type==='p'&&e.ball){if(e.roll)e.vx=e.dir*190;else{e.vx=0;e.ballT-=dt;if(e.ballT<=0){e.ball=false;e.y+=2;e.h=10}}}
  else if(e===boss){if(e.fall){e.vx=0}else{e.vx=e.dir*e.spd;e.hop-=dt;if(e.hop<=0&&e.onG){e.vy=-330;e.hop=1.5+rnd()*1.6}if(Math.abs(P.x-e.x)>30&&e.onG&&rnd()<dt*.8)e.dir=P.x<e.x?-1:1;if(e.x<e.minX)e.dir=1;else if(e.x>e.maxX)e.dir=-1}}

function step(dt){T+=dt;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.coin?500:420)*dt}
  for(let i=pops.length-1;i>=0;i--){pops[i].t-=dt;pops[i].y-=22*dt;if(pops[i].t<=0)pops.splice(i,1)}
  for(let i=bumps.length-1;i>=0;i--){bumps[i].t-=dt;if(bumps[i].t<=0)bumps.splice(i,1)}
  if(state==='play')stepPlay(dt);
  else if(state==='dying'){dieT+=dt;if(dieT>.35){P.vy+=1100*dt;P.y+=P.vy*dt}if(dieT>2){lives--;if(lives<=0)gameOver();else{loadLevel(lvl,true);card()}}}
  else if(state==='win'){winT+=dt;if(winT>.5){const n=Math.min(timeLeft,dt*150);if(n>0){timeLeft-=n;score+=Math.round(n*10);if(Math.floor(winT*20)%2===0)SFX.tally()}goal.y-=26*dt;P.x=goal.x+10;P.y=goal.y+goal.h-P.h-3}
    if(winT>3.2&&timeLeft<=0)nextLevel()}

function draw(){const cx=Math.round(camX),cy=Math.round(camY);g.drawImage(skyC,0,0,VW,VH);
  if(th.moon){g.fillStyle='#fff6d0';g.beginPath();g.arc(VW-44,34,13,0,7);g.fill();g.fillStyle=th.sky[0];g.beginPath();g.arc(VW-39,30,11,0,7);g.fill()}
  if(th.cloud){g.fillStyle=th.cloud;for(let i=0;i<5;i++){const x=((i*131-cx*.15-T*4)%(VW+80)+VW+80)%(VW+80)-60,y=14+(i*37)%50;g.fillRect(x,y,34,8);g.fillRect(x+6,y-5,20,6);g.fillRect(x+12,y+7,16,3)}}

  if(P&&!(P.inv>0&&Math.floor(T*20)%2)&&state!=='title'){const fr=state==='dying'?3:!P.onG?3:Math.abs(P.vx)>10?1+Math.floor(P.walk/9)%2:0,s=PIP[P.form][fr][P.dir>0?0:1],X=Math.round(P.x-cx)-(P.form?3:2),Y=Math.round(P.y-cy)-2;

  for(const m of embers)g.drawImage(SPR.ember[Math.floor(T*16)%2],Math.round(m.x-cx),Math.round(m.y-cy));

  $('#hLives').textContent='PIP ×'+lives;$('#hCoins').textContent='● '+String(coins).padStart(2,'0');$('#hScore').textContent=String(score).padStart(6,'0');$('#hWorld').textContent='LAND '+(lvl+1);$('#hTime').textContent='⏱ '+Math.ceil(timeLeft)}
function card(){state='card';cardT=1.7;hud.hidden=false;hudText();M=null;ov.hidden=false;ov.className='card';ov.innerHTML=`<p>LAND ${lvl+1} OF ${LEVELS.length}</p><h2>${th.name}</h2><p class="pip">PIP × ${lives}</p>`}

  else{S.v.done++;S.save();state='end';hud.hidden=true;menu({cls:'end',html:`<h2>HOME AT LAST!</h2><p>Pipsqueak floats over the keep and all the way home.</p><div class="big">${fmt(score)}</div><p>${score>=S.v.best?'BEST SCORE! · ':''}SPICY MODE UNLOCKED</p>`,items:[{t:'TITLE',fn:title}],back:title})}}

  menu({html:`<h2>GAME OVER</h2><div class="big">${fmt(score)}</div><p>LAND ${lvl+1} · ${th.name}</p>`,items:[{t:'TRY AGAIN',fn:()=>newRun(lvl)},{t:'TITLE',fn:title}],back:title})}
const soundItem=()=>({t:'SOUND',v:()=>SOUND_NAMES[S.v.sound],adj:d=>{S.v.sound=(S.v.sound+d+3)%3;SND.mode=S.v.sound;S.save()}});

let pickLv=0;
