<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strike at Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Strike at Night, a Spellsteel story: a 32-bit style RPG. The scene is a canvas 180 game pixels tall (280-400 wide, following the screen);
   menus, dialogue and the battle windows are HTML laid over it, sized in game pixels through --u. */
:root{color-scheme:dark;--u:2px;--ink:#f4f6ff;--dim:#a8b4e0;--gold:#ffd86a;--red:#ff6a6a;--green:#8aff9a;--blue:#8ad0ff;--ui:'Pixelify Sans',ui-monospace,monospace}
*,::before,::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#05060e;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#field{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#cv{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;overflow:hidden;font-size:calc(var(--u)*7.5);line-height:1.25;pointer-events:none}
#ui *{pointer-events:none}
h1,h2,h3,p{margin:0}
/* the windows: deep blue glass with a bright rim */
.win{position:absolute;background:linear-gradient(180deg,rgba(52,76,196,.97) 0%,rgba(26,40,128,.97) 55%,rgba(14,22,84,.98) 100%);border:calc(var(--u)*1) solid #e8eeff;border-radius:calc(var(--u)*3);
  box-shadow:0 0 0 calc(var(--u)*1) #060a24,inset 0 0 0 calc(var(--u)*1) rgba(120,150,255,.35),0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.5);padding:calc(var(--u)*4) calc(var(--u)*6);text-shadow:calc(var(--u)*.7) calc(var(--u)*.7) 0 #0a0c2a}
.win.plain{background:linear-gradient(180deg,rgba(26,32,80,.94),rgba(10,12,40,.96))}
.ttl{color:var(--gold);font-size:calc(var(--u)*8.5);margin-bottom:calc(var(--u)*2)}
.dim{color:var(--dim)}.gold{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}
.small{font-size:calc(var(--u)*6.5)}.tiny{font-size:calc(var(--u)*5.8)}.big{font-size:calc(var(--u)*11)}
/* lists with the pointing-hand cursor */
.list{display:flex;flex-direction:column;gap:calc(var(--u)*.5);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*.6) calc(var(--u)*2) calc(var(--u)*.6) calc(var(--u)*11);white-space:nowrap;border-radius:calc(var(--u)*2)}
.row .r{margin-left:auto;color:var(--dim)}
.row.off{color:#7a84b8}
.row.sel{background:rgba(255,255,255,.10)}
.row.sel::before{content:"";position:absolute;left:0;top:50%;width:calc(var(--u)*10);height:calc(var(--u)*7);transform:translateY(-50%);background:var(--hand) no-repeat center/contain;image-rendering:pixelated;animation:poke .5s steps(2) infinite}
.row.dimsel::before{opacity:.45;animation:none}
@keyframes poke{50%{transform:translate(calc(var(--u)*1),-50%)}}
.row .sw{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:calc(var(--u)*1.5);border:calc(var(--u)*.7) solid #fff;flex:0 0 auto}
.row .lock{color:#8a94c8;font-size:calc(var(--u)*6)}
.row .new{color:var(--gold);font-size:calc(var(--u)*6)}
/* a palette grid of dyes */
.grid{display:grid;gap:calc(var(--u)*1.5)}
.grid .c{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*2);border:calc(var(--u)*.8) solid rgba(0,0,0,.6);position:relative}
.grid .c.sel{outline:calc(var(--u)*1) solid #fff;outline-offset:calc(var(--u)*.8);transform:scale(1.12);z-index:2}
.grid .c.cur::after{content:"";position:absolute;inset:calc(var(--u)*3);border-radius:50%;background:#fff;box-shadow:0 0 0 calc(var(--u)*.6) #000}
/* letter entry */
.keys{display:grid;grid-template-columns:repeat(13,1fr);gap:calc(var(--u)*.8)}
.keys i{font-style:normal;text-align:center;padding:calc(var(--u)*.8) 0;border-radius:calc(var(--u)*1.5);background:rgba(0,0,0,.25)}
.keys i.sel{background:#fff;color:#1a2470;text-shadow:none}
.keys i.wide{grid-column:span 3}
.entry{font-size:calc(var(--u)*10);letter-spacing:calc(var(--u)*.6);border-bottom:calc(var(--u)*.8) solid var(--dim);min-height:calc(var(--u)*13);padding:0 calc(var(--u)*2);margin-bottom:calc(var(--u)*3)}
.entry b{animation:blink .8s steps(2) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
/* bars */
.bar{height:calc(var(--u)*2.4);background:#0a0c28;border-radius:calc(var(--u)*1);overflow:hidden;box-shadow:0 0 0 calc(var(--u)*.5) #000}
.bar i{display:block;height:100%;background:linear-gradient(#a0ffb0,#30b050)}
.bar.mp i{background:linear-gradient(#a8e0ff,#3a78e8)}
.bar.atb i{background:linear-gradient(#fff2a0,#e8a020)}
.bar.atb.full i{background:linear-gradient(#ffffff,#ffd040);animation:shine .4s steps(2) infinite}
.bar.lim i{background:linear-gradient(#ffb0e0,#d03090)}
.bar.lim.full i{animation:shine .3s steps(2) infinite}
@keyframes shine{50%{filter:brightness(1.5)}}
.bar.xp i{background:linear-gradient(#e0c8ff,#8a5ae0)}
/* battle windows */
.bparty .pr{display:grid;grid-template-columns:calc(var(--u)*34) 1fr calc(var(--u)*30) calc(var(--u)*30);align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*.4) calc(var(--u)*1);border-radius:calc(var(--u)*2)}
.bparty .pr.turn{background:rgba(255,255,255,.12)}
.bparty .pr.ko{color:#ff8a8a}
.bparty .num{font-size:calc(var(--u)*7);text-align:right}
.bparty .num small{font-size:calc(var(--u)*5.5);color:var(--dim)}
.tag{display:inline-block;font-size:calc(var(--u)*5);padding:0 calc(var(--u)*1.4);border-radius:calc(var(--u)*1.4);background:rgba(0,0,0,.35);margin-left:calc(var(--u)*1)}
/* the dialogue box */
.dlg{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*14);min-height:calc(var(--u)*44)}
.dlg .who{position:absolute;top:calc(var(--u)*-9);left:calc(var(--u)*6);padding:calc(var(--u)*1) calc(var(--u)*5);font-size:calc(var(--u)*7);color:var(--gold)}
.dlg .more{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*3);color:var(--gold);animation:blink .8s steps(2) infinite}
.crawl{position:absolute;inset:0;background:#000;z-index:61;opacity:0;transition:opacity .3s;display:flex;align-items:center;justify-content:center}
.crawl.on{opacity:1}
.crawl .cl{position:absolute;left:10%;right:10%;text-align:center;font-size:calc(var(--u)*8.5);line-height:1.5;color:#e8eeff;opacity:0;transition:opacity .35s;text-shadow:0 calc(var(--u)*.8) 0 #000}
.crawl .cl.on{opacity:1}
.crawl .cl .big{letter-spacing:calc(var(--u)*1.2)}
.logo.night{color:#f4ecd8;text-shadow:0 calc(var(--u)*1.5) 0 #3a0a14,0 0 calc(var(--u)*9) rgba(200,40,60,.85);font-size:calc(var(--u)*21)}
.logo.night small{color:#c8d0ff}
.poster{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1.5deg);width:calc(var(--u)*118);padding:calc(var(--u)*5) calc(var(--u)*6);background:#e8d8a8;border:calc(var(--u)*1) solid #8a6a3a;box-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.5),inset 0 0 calc(var(--u)*10) rgba(120,80,30,.45);color:#3a2414;text-align:center;z-index:40}
.poster .pt{font-size:calc(var(--u)*17);font-weight:700;letter-spacing:calc(var(--u)*2);line-height:1;color:#5a1a10}
.poster .ps{font-size:calc(var(--u)*6.5);letter-spacing:calc(var(--u)*1.5);margin-top:calc(var(--u)*1)}
.poster img{display:block;margin:calc(var(--u)*3) auto;width:calc(var(--u)*56);height:calc(var(--u)*60);image-rendering:pixelated;border:calc(var(--u)*1) solid #6a4a2a}
.poster .pn{font-size:calc(var(--u)*8);font-weight:700}
.poster .pc2{font-size:calc(var(--u)*5.5);line-height:1.35;margin-top:calc(var(--u)*1.5)}
.poster .pr{font-size:calc(var(--u)*10);font-weight:700;color:#7a1a10;margin-top:calc(var(--u)*2)}
.toast{position:absolute;left:50%;top:calc(var(--u)*8);transform:translateX(-50%);padding:calc(var(--u)*2) calc(var(--u)*8);white-space:nowrap}
.hint{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*3);font-size:calc(var(--u)*5.8);color:var(--dim);text-shadow:0 calc(var(--u)*.6) 0 #000;white-space:nowrap}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--u)*8);height:calc(var(--u)*8);padding:0 calc(var(--u)*1.5);border-radius:calc(var(--u)*4);font-style:normal;font-size:calc(var(--u)*5.5);color:#fff;background:#5a5a72;margin:0 calc(var(--u)*.8);vertical-align:middle}
.k.a{background:#c8283c}.k.b{background:#3a5ab8}
.preview{position:absolute;image-rendering:pixelated}
.fade{animation:fade .35s both}@keyframes fade{from{opacity:0}}
.pop{animation:pop .22s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{transform:scale(.85);opacity:0}}
/* the title screen */
.logo{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#fff;letter-spacing:calc(var(--u)*1.2);font-size:calc(var(--u)*24);text-shadow:0 calc(var(--u)*1.5) 0 #2a1a6a,0 0 calc(var(--u)*8) rgba(140,180,255,.9)}
.logo small{display:block;font-size:calc(var(--u)*6.5);letter-spacing:calc(var(--u)*2.4);color:var(--gold);font-weight:400}
/* touch controls, only when playing on its own on a phone */
#touch{display:none;position:absolute;inset:auto 0 0 0;height:0}
html.touch:not(.zp) #touch{display:block}
#touch .pad{position:absolute;left:10px;bottom:10px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
#touch .tb{position:absolute;bottom:20px;width:54px;height:54px;border-radius:50%;background:rgba(200,40,60,.55);border:2px solid rgba(255,255,255,.25);color:#fff;font:700 18px var(--ui);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#touch .tb.b{background:rgba(58,90,184,.55)}#touch .tb.s{width:44px;height:26px;border-radius:13px;font-size:10px;background:rgba(90,90,114,.6)}
/* screens, menus and lists */
.screen{position:absolute;inset:0}
.screen.darken{background:rgba(4,6,20,.6)}
.lw{display:flex;flex-direction:column}
.lw .list{flex:0 0 auto}
.lw .ttl{white-space:nowrap;overflow:hidden}
.more2{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);bottom:calc(var(--u)*3);width:calc(var(--u)*6);pointer-events:none;color:var(--gold);font-size:calc(var(--u)*5)}
.more2 .up{position:absolute;top:0;right:0;animation:blink 1s steps(2) infinite}.more2 .dn{position:absolute;bottom:0;right:0;animation:blink 1s steps(2) infinite}
.foot{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);bottom:calc(var(--u)*3);white-space:nowrap;overflow:hidden}
.row>span:first-of-type{overflow:hidden;text-overflow:ellipsis}
.row .r{display:inline-flex;align-items:center;gap:calc(var(--u)*1)}
.row .tiny.dim{margin-left:calc(var(--u)*1)}
.titlemenu .row{justify-content:center}
.pop.win,.win.pop{z-index:5}
#fader{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}
/* dialogue */
.dlg{z-index:20}
.dlg.low{top:auto;bottom:calc(var(--u)*8)}
.dlg .txt{min-height:calc(var(--u)*30);white-space:normal}
.letters{z-index:30}
.letters .keys i{font-size:calc(var(--u)*7)}
/* cards in the menu */
.card{display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*1) 0;border-bottom:calc(var(--u)*.5) solid rgba(255,255,255,.08);min-height:calc(var(--u)*32)}
.card:last-child{border-bottom:none}
.cb{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.row .card{border-bottom:none;padding:0;min-height:calc(var(--u)*28)}
.row:has(.card){padding-top:calc(var(--u)*.2);padding-bottom:calc(var(--u)*.2)}
.stats{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--u)*8)}
.sr{display:flex;justify-content:space-between;font-size:calc(var(--u)*7)}
.win .list .row{font-size:inherit}
/* battle */
.blayer{position:absolute;inset:0}
.banner{text-align:center;padding:calc(var(--u)*2) calc(var(--u)*6);z-index:6;font-size:calc(var(--u)*7.5)}
.benemy,.bparty{padding:calc(var(--u)*3) calc(var(--u)*4)}
.benemy .en{display:flex;flex-direction:column;font-size:calc(var(--u)*6.5);margin-bottom:calc(var(--u)*1.6)}
.benemy .en span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.ehp{height:calc(var(--u)*1.4);width:80%}.bar.ehp i{background:linear-gradient(#ffb0a0,#d04a3a)}
.bparty .pr{grid-template-columns:minmax(0,1fr) calc(var(--u)*44) calc(var(--u)*16) calc(var(--u)*30);font-size:calc(var(--u)*7)}
.bparty .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bparty .num.low{color:var(--gold)}.bparty .num.ko{color:var(--red)}.bparty .num.mp{color:var(--blue)}
.bparty .gg{display:flex;flex-direction:column;gap:calc(var(--u)*.8)}.bparty .gg .bar{height:calc(var(--u)*2)}
.bparty .gg .bar.lim{height:calc(var(--u)*1.2)}
.cmd{z-index:7}
.cmd .row{padding-top:calc(var(--u)*.2);padding-bottom:calc(var(--u)*.2)}
.dmg{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:calc(var(--u)*9);color:#fff;white-space:nowrap;z-index:8;
  text-shadow:calc(var(--u)*.7) 0 0 #000,calc(var(--u)*-.7) 0 0 #000,0 calc(var(--u)*.7) 0 #000,0 calc(var(--u)*-.7) 0 #000;animation:dmg 1.1s both}
.dmg.crit{color:#ffe04a;font-size:calc(var(--u)*11)}.dmg.heal{color:#8aff9a}.dmg.mp{color:#8ad0ff}.dmg.miss{color:#c8cce0;font-size:calc(var(--u)*7)}.dmg.st{color:#ffd86a;font-size:calc(var(--u)*6.5)}.dmg.tag{color:#ff8a5a;font-size:calc(var(--u)*6.5);margin-top:calc(var(--u)*-8)}
@keyframes dmg{0%{transform:translate(-50%,-60%) scale(.6);opacity:0}12%{transform:translate(-50%,-140%) scale(1.15);opacity:1}24%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1;transform:translate(-50%,-110%)}100%{opacity:0;transform:translate(-50%,-150%)}}
.results{z-index:9}
.results .rr{display:flex;align-items:center;gap:calc(var(--u)*4);margin-top:calc(var(--u)*2)}
.lvup{animation:blink .5s steps(2) 6}
/* the prologue and the credits */
.prol{position:absolute;left:12%;right:12%;top:52%;text-align:center;font-size:calc(var(--u)*8);line-height:1.45;color:#e8eeff;text-shadow:0 calc(var(--u)*.8) 0 #000}
.credit{position:absolute;left:8%;right:8%;top:24%;text-align:center;text-shadow:0 calc(var(--u)*1) 0 #000,0 0 calc(var(--u)*6) rgba(0,0,0,.6)}
.credit>div+div{margin-top:calc(var(--u)*3)}
.eld{display:inline-block;width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;margin-right:calc(var(--u)*1.6);vertical-align:middle;box-shadow:0 0 0 calc(var(--u)*.6) #05071c}
.bparty .pr{grid-template-columns:minmax(0,1fr) calc(var(--u)*44) calc(var(--u)*36);padding:calc(var(--u)*1.2) calc(var(--u)*2);gap:calc(var(--u)*3.5)}
.bparty .gg{gap:calc(var(--u)*1)}.bparty .gg .bar{height:calc(var(--u)*2)}.bparty .gg .bar.hpb{height:calc(var(--u)*2.6)}.bparty .gg .bar.hpb i{background:linear-gradient(#a0ffb0,#30b050)}.bparty .gg .bar.hpb.low i{background:linear-gradient(#ffe8a0,#e0a020)}
.benemy,.bparty{padding:calc(var(--u)*3.5) calc(var(--u)*4)}.benemy .en{margin-bottom:calc(var(--u)*2.4)}
.win{padding:calc(var(--u)*5) calc(var(--u)*7)}
.roomy .row{padding-top:calc(var(--u)*2.6);padding-bottom:calc(var(--u)*2.6)}
.roomy .row.sel{background:rgba(255,255,255,.13)}
/* the battle strip: team CP, then one card a fighter */
.bhud{position:absolute;display:flex;gap:calc(var(--u)*2);align-items:stretch;z-index:4}
.bhud>div{background:linear-gradient(180deg,rgba(44,64,170,.95),rgba(16,24,90,.97));border:calc(var(--u)*.8) solid #e8eeff;border-radius:calc(var(--u)*2.5);box-shadow:0 0 0 calc(var(--u)*.8) #060a24;text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #0a0c2a}
.cpb{width:calc(var(--u)*40);flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1)}
.cpb .lbl{font-size:calc(var(--u)*6);color:#8affff;letter-spacing:calc(var(--u)*.6)}
.cpb .pips{display:grid;grid-template-columns:repeat(3,auto);gap:calc(var(--u)*1.2) calc(var(--u)*2)}
.cpb .pips i{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);transform:rotate(45deg);background:#141a48;box-shadow:0 0 0 calc(var(--u)*.6) #4a5aa8;display:block}
.cpb .pips i.on{background:#8affff;box-shadow:0 0 0 calc(var(--u)*.6) #e0ffff,0 0 calc(var(--u)*3) rgba(138,255,255,.8)}
.cpb.pulse{animation:cpp .45s}@keyframes cpp{30%{transform:scale(1.12)}}
.pc{flex:1;min-width:0;padding:calc(var(--u)*1.2) calc(var(--u)*3);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*.9);font-size:calc(var(--u)*6.2)}
.pc .l1{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*2);line-height:1}
.pc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.pc .hpn{font-size:calc(var(--u)*6.2)}
.pc .bar{display:block;height:calc(var(--u)*1.7)}.pc .bar.hpb{height:calc(var(--u)*2.2)}
.pc .bar.hpb i{background:linear-gradient(#a0ffb0,#30b050)}.pc .bar.hpb.low i{background:linear-gradient(#ffd0a0,#e05a30)}
.pc .bar.lim{height:calc(var(--u)*1.4)}
.bhud .pc.turn{background:linear-gradient(180deg,rgba(90,110,230,.98),rgba(30,44,140,.98));box-shadow:0 0 0 calc(var(--u)*.8) #060a24,0 0 calc(var(--u)*5) rgba(255,216,106,.7)}
.bhud .pc.ko{filter:grayscale(.8) brightness(.7)}
.ultr{color:#ffa0e0;animation:blink .6s steps(2) infinite}
.cmd .who2{position:absolute;top:calc(var(--u)*-8);left:calc(var(--u)*5);padding:calc(var(--u)*.5) calc(var(--u)*4);font-size:calc(var(--u)*6);color:var(--gold);background:#1a2470;border:calc(var(--u)*.7) solid #e8eeff;border-radius:calc(var(--u)*2)}
.win.cmd{padding:calc(var(--u)*3) calc(var(--u)*4)}
.win.cmd .row{padding-top:calc(var(--u)*.4);padding-bottom:calc(var(--u)*.4)}
.win.sub{z-index:8}
/* an Ult: a band across the screen */
.cutin{position:absolute;left:0;right:0;top:34%;height:calc(var(--u)*46);display:flex;align-items:center;gap:calc(var(--u)*8);padding-left:18%;z-index:9;
  background:linear-gradient(90deg,rgba(120,20,90,0),rgba(170,40,130,.92) 18%,rgba(90,20,120,.92) 80%,rgba(60,10,80,0));border-top:calc(var(--u)*1) solid #ffd0f0;border-bottom:calc(var(--u)*1) solid #ffd0f0;animation:cut 1.1s both}
.cutin .cn{font-size:calc(var(--u)*13);font-weight:700;color:#fff;letter-spacing:calc(var(--u)*.8);text-shadow:0 0 calc(var(--u)*6) #ff6ad0,calc(var(--u)*1) calc(var(--u)*1) 0 #3a0a3a}
.cutin .cw{font-size:calc(var(--u)*7);color:#ffd0f0}
@keyframes cut{0%{transform:translateX(100%) skewX(-12deg)}18%{transform:translateX(0) skewX(-12deg)}82%{transform:translateX(0) skewX(-12deg);opacity:1}100%{transform:translateX(-100%) skewX(-12deg);opacity:0}}

<script>
(()=>{'use strict';
/* ================= pixel buffers: everything is drawn in code, pixel by pixel ================= */
const INK='#160f24';
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');

const _sh={};
const shade=(c,k)=>{if(!c)return c;const key=c+k;if(_sh[key])return _sh[key];
  return _sh[key]=k<0?mix(c,'#1c1036',Math.min(.82,-k*.24)):mix(c,'#fff8e8',Math.min(.85,k*.22))};

class Buf{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c}
  get(x,y){x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=this.w||y>=this.h?null:this.d[y*this.w+x]}
  has(x,y){return this.get(x,y)!==null}
  rect(x,y,w,h,c,clip){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!clip||this.has(x+i,y+j))this.px(x+i,y+j,c)}
  /* ellipse; sh shades it lit from the upper left (dark rim low right, light patch high left, a highlight) */
  ell(cx,cy,rx,ry,c,sh=1,clip=false){
    for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry,d=nx*nx+ny*ny;if(d>1||(clip&&!this.has(x,y)))continue;let col=c;
      if(sh&&c){const l=-(nx*.6+ny*.8);if(l<-.42&&d>.32)col=shade(c,-1);else if(l>.48&&d>.08&&d<.62)col=shade(c,1);if(sh>1&&l>.7&&d>.12&&d<.4)col=shade(c,2)}

  poly(pts,c,clip=false){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}
      if(ins&&(!clip||this.has(x,y)))this.px(x,y,c)}}
  tri(ax,ay,bx,by,cx,cy,c,clip){this.poly([[ax,ay],[bx,by],[cx,cy]],c,clip)}
  line(x0,y0,x1,y1,c,t=1,clip=false){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2));
    for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(t<=1){if(!clip||this.has(x,y))this.px(x,y,c)}
      else{const o=Math.floor(t/2);for(let a=0;a<t;a++)for(let b=0;b<t;b++){const X=x-o+a,Y=y-o+b;if(!clip||this.has(X,Y))this.px(X,Y,c)}}}}
  pl(pts,c,t=1,clip){for(let i=0;i<pts.length-1;i++)this.line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],c,t,clip)}
  /* a rounded limb from one point to another */
  limb(x0,y0,x1,y1,w0,c,w1=w0){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(let i=0;i<=n;i++){const t=i/n,r=Math.max(.5,(w0*(1-t)+w1*t)/2);this.ell(x0+(x1-x0)*t,y0+(y1-y0)*t,r,r,c,0)}}
  /* a tapered curve (quadratic) */
  horn(x0,y0,cx,cy,x1,y1,w0,c,w1=.8){const n=Math.ceil((Math.hypot(cx-x0,cy-y0)+Math.hypot(x1-cx,y1-cy))*2);for(let i=0;i<=n;i++){const t=i/n,u=1-t,x=u*u*x0+2*u*t*cx+t*t*x1,y=u*u*y0+2*u*t*cy+t*t*y1,r=Math.max(.5,(w0*(1-t)+w1*t)/2);this.ell(x,y,r,r,c,0)}}
  quill(x0,y0,x1,y1,w,c){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L*w/2,ny=dx/L*w/2;this.poly([[x0+nx,y0+ny],[x1,y1],[x0-nx,y0-ny]],c)}
  leaf(x0,y0,x1,y1,w,c,clip=false){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,A=[],B=[],n=12;for(let i=0;i<=n;i++){const t=i/n,h=Math.sin(Math.PI*Math.pow(t,.8))*w/2,x=x0+dx*t,y=y0+dy*t;A.push([x+nx*h,y+ny*h]);B.unshift([x-nx*h,y-ny*h])}this.poly(A.concat(B),c,clip)}
  plus(x,y,c){this.px(x,y,c);this.px(x-1,y,c);this.px(x+1,y,c);this.px(x,y-1,c);this.px(x,y+1,c)}
  star(cx,cy,r,c,n=5,inner=.45,rot=-Math.PI/2){const p=[];for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr=i%2?r*inner:r;p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}this.poly(p,c)}
  eye(x,y,r=2,col='#ffffff'){this.ell(x,y,r,r*1.2,col,0);const pr=Math.max(.9,r*.55);this.ell(x+r*.3,y+r*.2,pr,pr*1.3,INK,0);this.px(x+r*.3-pr*.4,y-r*.25,'#ffffff')}
  angry(x,y,inner=1,col='#ffe27a'){const X=i=>inner>0?x+i:x+3-i;this.px(X(0),y,col);this.px(X(1),y,col);for(let i=0;i<4;i++)this.px(X(i),y+1,col);this.px(X(2),y+1,INK);for(const[i,j]of[[-1,-1],[0,-1],[1,-1],[2,0],[3,0],[4,1]])this.px(X(i),y+j,INK)}
  fangs(x0,x1,y,dir=1,c='#f4f1ea'){for(let x=x0;x<=x1;x+=2){this.px(x,y,c);this.px(x+1,y,c);this.px(x,y+dir,c)}}
  zap(x,y,s,c,flip=false){const P=[[3,0],[0,5.5],[2.6,5.5],[1,10],[6,3.6],[3.4,3.6],[5.2,0]];this.poly(P.map(([a,b2])=>[x+(flip?6-a:a)*s,y+b2*s]),c)}
  crystal(x,y,h,w,c,cl,cd){this.poly([[x-w/2,y],[x-w/2,y-h*.7],[x,y-h],[x+w/2,y-h*.7],[x+w/2,y]],c);this.line(x-w/2+1,y-1,x-w/2+1,y-h*.7,cl,1,true);this.line(x,y-h+1,x-w/2+1,y-h*.7,cl,1,true);this.line(x+w/2-1,y-1,x+w/2-1,y-h*.65,cd,1,true)}
  /* recolour what is already there (clip), e.g. a shadow side */
  tint(fn){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const v=this.d[y*this.w+x];if(v!==null){const r=fn(x,y,v);if(r!==undefined)this.d[y*this.w+x]=r}}}
  outline(c=INK){const o=this.d.slice(),w=this.w;for(let y=0;y<this.h;y++)for(let x=0;x<w;x++){if(o[y*w+x]!==null)continue;
    if((x>0&&o[y*w+x-1]!==null)||(x<w-1&&o[y*w+x+1]!==null)||(y>0&&o[(y-1)*w+x]!==null)||(y<this.h-1&&o[(y+1)*w+x]!==null))this.d[y*w+x]=c}return this}
  /* outline drawn in each neighbour's own dark shade: the soft 32-bit edge */
  softline(){const o=this.d.slice(),w=this.w;for(let y=0;y<this.h;y++)for(let x=0;x<w;x++){if(o[y*w+x]!==null)continue;let n=null;
    for(const[dx,dy]of[[0,1],[-1,0],[1,0],[0,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<this.h&&o[Y*w+X]!==null){n=o[Y*w+X];break}}
    if(n)this.d[y*w+x]=mix(n,INK,.72)}return this}
  rim(c,cols,dirs=[[0,-1],[-1,0]]){const o=this.d.slice(),w=this.w,set=cols?new Set(cols):null;for(let y=0;y<this.h;y++)for(let x=0;x<w;x++){const v=o[y*w+x];if(v===null||(set&&!set.has(v)))continue;for(const[dx,dy]of dirs){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=this.h||o[Y*w+X]===null){this.d[y*w+x]=c;break}}}return this}
  over(b,dx=0,dy=0){for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const v=b.d[y*b.w+x];if(v!==null)this.px(x+dx,y+dy,v)}return this}
  /* paste another buffer turned by an angle about its point (gx,gy), landing that point at (tx,ty) */
  blitRot(b,gx,gy,ang,tx,ty,flip=false){const ca=Math.cos(ang),sa=Math.sin(ang),R=Math.ceil(Math.hypot(b.w,b.h));
    for(let y=Math.floor(ty-R);y<=ty+R;y++)for(let x=Math.floor(tx-R);x<=tx+R;x++){const rx=x+.5-tx,ry=y+.5-ty;let sx=rx*ca+ry*sa,sy=-rx*sa+ry*ca;if(flip)sx=-sx;
      const u=Math.floor(sx+gx),v=Math.floor(sy+gy);if(u<0||v<0||u>=b.w||v>=b.h)continue;const c=b.d[v*b.w+u];if(c!==null)this.px(x,y,c)}return this}
  canvas(scale=1,flip=false,sil=null){const c=document.createElement('canvas');c.width=this.w*scale;c.height=this.h*scale;const x=c.getContext('2d');
    for(let y=0;y<this.h;y++)for(let i=0;i<this.w;i++){const v=this.d[y*this.w+i];if(v===null)continue;x.fillStyle=sil||v;x.fillRect((flip?this.w-1-i:i)*scale,y*scale,scale,scale)}return c}
}
/* a tiny 3x5 font for words engraved on weapons and written on covers */
const MINI=(()=>{const G={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
  '0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
  '!':'010010010000010','?':'110001010000010','.':'000000000000010',',':'000000000010100','-':'000000111000000',"'":'010010000000000',':':'000010000010000','&':'010101010101011','+':'000010111010000','*':'101010101000000','#':'101111101111101','/':'001001010100100','<':'001010100010001','>':'100010001010100','~':'000011110000000','♥':'000101111111010','★':'010111010101000',' ':'000000000000000'};
  return G})();
function miniText(b,str,x,y,c,vertical=false){let cx=x,cy=y;for(const ch0 of String(str).toUpperCase()){const g=MINI[ch0]||MINI['?'];
    for(let r=0;r<5;r++)for(let k=0;k<3;k++)if(g[r*3+k]==='1'){if(vertical)b.px(cx+k,cy+r,c);else b.px(cx+k,cy+r,c)}
    if(vertical)cy+=6;else cx+=4}}
const miniW=s=>String(s).length*4-1;

/* ================= the paper doll: one rig, every item drawn onto it in layers =================
   A character is drawn into a 64x64 buffer facing right, feet on y=60. The rig gives the head, torso, arms and
   legs for a pose; each wardrobe layer is drawn from that, so every item fits every pose. */
const DYES=[
 ['Crimson','#c8283c'],['Red','#e24a4a'],['Rose','#f07a8a'],['Maroon','#7a1e2e'],['Blood','#8a0e1e'],
 ['Orange','#f08a2a'],['Amber','#f4b030'],['Rust','#b4581e'],['Ginger','#d0662a'],['Peach','#ffb890'],
 ['Gold','#f2c84a'],['Lemon','#f8e870'],['Blonde','#f0d27a'],['Mustard','#c8a030'],['Cream','#fff0c8'],
 ['Lime','#9ae050'],['Green','#4ab048'],['Forest','#2a7a3a'],['Olive','#7a8a3a'],['Mint','#9ae8c0'],['Teal','#2aa898'],
 ['Sky','#78c8f8'],['Azure','#3a8ae8'],['Royal','#2a50c0'],['Navy','#1e2a6a'],['Ice','#c8ecff'],['Cyan','#3ad8e8'],['Sea','#1a6a8a'],
 ['Lilac','#c8a8f0'],['Lavender','#e0d0ff'],['Violet','#8a5ae0'],['Purple','#6a2aa8'],['Plum','#5a1e5a'],['Magenta','#d83ab8'],['Pink','#f8a8d8'],['Sakura','#ffc8dc'],
 ['Tan','#d8b080'],['Leather','#a06a3a'],['Brown','#8a5a32'],['Chocolate','#5a3420'],
 ['White','#f4f4f8'],['Platinum','#efe9d8'],['Ash','#b8b0a8'],['Silver','#c8ccd8'],['Grey','#8a8ca0'],['Slate','#5a5e74'],['Charcoal','#33344a'],['Black','#1e1c28'],
 ['Steel','#9aa8bc'],['Bronze','#b8783a'],['Copper','#d0784a'],['Brass','#d8b048']];
const DYE=Object.fromEntries(DYES.map(([n,c])=>[n,c]));
const SKINS=[['Porcelain','#ffe4d0'],['Fair','#f8d2b4'],['Peach','#f0c09a'],['Honey','#e0a878'],['Tan','#c88a5a'],['Bronze','#a86c42'],['Umber','#8a5432'],['Ebony','#5e3a22'],
 ['Frost','#c4e4ff'],['Sylvan','#c8eec0'],['Fae','#e0c8ff'],['Stone','#a4a6b4'],['Ember','#ffb0a0'],['Night','#5a5a8a']];
const EYES=['Round','Sharp','Sleepy','Sparkle','Cat','Happy','Fierce','Dot','Star','Wide'];
const MOUTHS=['Smile','Calm','Grin','Open','Smirk','Frown','Cat','Fang'];
const BROWS=['None','Soft','Thick','Angled','Worried'];
const EARS=['Human','Elf','Long elf','Fin'];

/* ---------- the rig ---------- */
/* the buffer is roomy so a raised greatsword or a pair of wings still fits; the feet stand at (DOLL_FX, DOLL_FY) */
const DOLL_W=104,DOLL_H=84,OX=20,OY=14,DOLL_FX=32+OX,DOLL_FY=60+OY;
/* pose: arm angles are measured from straight down, positive swinging forward (to the right) */
function rig(pose){const p=Object.assign({bob:0,lean:0,na:[.15,-.35],fa:[-.1,-.25],nl:[0,0],fl:[0,0],crouch:0,face:'normal'},pose||{});
  const lx=p.lean,by=p.bob+p.crouch;
  const P={p,hx:33+OX+lx*1.4,hy:21+OY+by,cx:32+OX+lx,top:31+OY+by,hip:45+OY+p.crouch*.6,gy:60+OY,face:p.face};
  P.nS=[35.5+OX+lx,33+OY+by];P.fS=[28.5+OX+lx,33+OY+by];
  const arm=(S,[a1,a2])=>{const E=[S[0]+Math.sin(a1)*5.5,S[1]+Math.cos(a1)*5.5],H=[E[0]+Math.sin(a1+a2)*5.5,E[1]+Math.cos(a1+a2)*5.5];return{S,E,H,a1,a2}};
  P.nArm=arm(P.nS,p.na);P.fArm=arm(P.fS,p.fa);
  const leg=(x,[t,k])=>{const Hp=[x,P.hip],K=[x+Math.sin(t)*7.5,P.hip+Math.cos(t)*7.5],F=[K[0]+Math.sin(t+k)*7.5,K[1]+Math.cos(t+k)*7.5];return{H:Hp,K,F,t,k}};
  P.nLeg=leg(34+OX+lx*.5,p.nl);P.fLeg=leg(30+OX+lx*.5,p.fl);
  /* the torso outline, from the shoulders to the hips */
  const c=P.cx,t=P.top,h=P.hip;P.torso=[[c-5.5,t],[c+5.5,t],[c+6.5,t+3],[c+4.5,t+10],[c+5,h],[c-5,h],[c-4.5,t+10],[c-6.5,t+3]];
  return P}
const POSES={
  idle:{},
  breathe:{bob:1},
  walk0:{nl:[.45,-.2],fl:[-.4,-.35],na:[-.35,-.3],fa:[.35,-.3]},
  walk1:{nl:[.15,-.5],fl:[-.1,-.1],na:[-.1,-.3],fa:[.1,-.3],bob:-1},
  walk2:{nl:[-.4,-.35],fl:[.45,-.2],na:[.35,-.3],fa:[-.35,-.3]},
  walk3:{nl:[-.1,-.1],fl:[.15,-.5],na:[.1,-.3],fa:[-.1,-.3],bob:-1},
};

/* ---------- colour helpers ---------- */
const skinOf=L=>(SKINS.find(s=>s[0]===L.skin)||SKINS[1])[1];
const dyeOf=(n,def)=>DYE[n]||n&&n[0]==='#'&&n||DYE[def]||def||'#8a8ca0';
/* the far half of a shape goes a shade darker, so the body reads as round */
function sideShade(b,cols,splitX,yFrom=0){const set=new Set(cols);b.tint((x,y,v)=>set.has(v)&&x<splitX&&y>=yFrom?dk(v):undefined)}

/* ---------- head, face and ears ---------- */
function drawEarsBack(b,P,L,sk){const e=L.ears||'Human',x=P.hx-6.5,y=P.hy+1;
  if(e==='Elf')b.poly([[x+2,y-1],[x-5,y-5],[x+1,y+3]],sk);else if(e==='Long elf')b.poly([[x+2,y-1],[x-8,y-8],[x+1,y+3]],sk);
  else if(e==='Fin'){b.poly([[x+2,y-3],[x-4,y-6],[x-3,y+1],[x+1,y+3]],mix(sk,'#5ab8e8',.35))}
  else b.ell(x+1,y+.5,2,2.6,sk,0)}
function drawHead(b,P,L){const sk=skinOf(L),hx=P.hx,hy=P.hy,sd=shade(sk,-1),hl=shade(sk,1);
  b.ell(hx,hy,8.5,8.2,sk,0);b.ell(hx+3,hy+4.2,4.9,3.6,sk,0);
  /* the back of the head in shadow, a soft light on the brow; the face itself stays clean */
  b.tint((x,y,v)=>{if(v!==sk)return;const dx=x+.5-hx,dy=y+.5-hy;if(dx<-3.6&&(dx*dx)/72+(dy*dy)/67>.3)return sd;if(dy>6.4&&dx<2)return sd;if(dx>-2&&dx<3&&dy>-6.5&&dy<-3.6)return hl});
  b.ell(hx+6.4,hy+3.4,1.3,.9,mix(sk,'#ff8a9a',.3),0);
  drawEarsBack(b,P,L,sk);if((L.ears||'Human')==='Human')b.px(hx-5.6,hy+1.5,sd)}
function drawFace(b,P,L){const hx=P.hx,hy=P.hy,ec=dyeOf(L.eyeC,'Brown'),e=L.eyes||'Round',f=P.face,sk=skinOf(L),ink='#2a1a2a';
  const ex1=hx+1.5,ex2=hx+6.2,ey=hy+.5;
  if(f==='hurt'||f==='closed'){for(const ex of[ex1,ex2]){b.line(ex-1.2,ey+.5,ex+1.2,ey-.5,ink)}}
  else if(f==='ko'){for(const ex of[ex1,ex2]){b.line(ex-1,ey-1,ex+1,ey+1,ink);b.line(ex-1,ey+1,ex+1,ey-1,ink)}}
  else{const eye=(x,w)=>{
    if(e==='Happy'){b.line(x-1.2,ey+.5,x,ey-.8,ink);b.line(x,ey-.8,x+1.2,ey+.5,ink);return}
    if(e==='Dot'){b.rect(x,ey-1,1,2,ink);return}
    if(e==='Sleepy'){b.rect(x-1,ey,w+1,1,ink);b.rect(x-1,ey+1,w+1,1,ec);return}

function sleeveColor(T,c1,sk){return T.sleeve==='none'?sk:c1}

  const{S,E,H}=A;

    if(s==='wide'){b.limb(E[0],E[1],H[0]+(H[0]-E[0])*.2,H[1]+2.6,4.4,col,5)}
    if(s==='puff')b.ell(S[0],S[1]+1,3,2.8,col,1)}
  else if(s==='short'){b.limb(S[0],S[1],E[0],E[1],3.6,col,3.2);const m=[(S[0]+E[0])/2,(S[1]+E[1])/2];b.limb(m[0],m[1],E[0],E[1],2.6,sk,2.6);b.limb(E[0],E[1],H[0],H[1],2.6,sk,2.4)}
  else{b.limb(S[0],S[1],E[0],E[1],2.8,sk,2.6);b.limb(E[0],E[1],H[0],H[1],2.6,sk,2.4)}
  if(T&&T.trim&&s!=='none'){const tx=s==='short'?E:H;b.ell(tx[0],tx[1],1.8,1.4,c2,0)}
  b.ell(H[0],H[1],2.1,2.1,glove||sk,1)}

    if(T.obi)b.rect(c-5,h-4,10.5,3.4,c2)}
  b.poly(P.torso,c1);
  if(T.poncho){b.poly([[c-7.4,t+1],[c+7.4,t+1],[c+8,h-1],[c,h+3],[c-8,h-1]],c1)}
  /* the patterns sit on the body only */

  if(pat==='mesh')for(let y=t+1;y<t+8;y+=2)for(let x=c-3;x<c+6;x+=2)b.px(x+((y/2)%2),y,shade(c1,1));

/* ================= the party, the bag and the rules that tie them together ================= */
let G=null; // the game in play
const TIERS=['Plain','Fine','Keen','Runed','Starforged','Embered','Legendary'];
const MAXTIER=TIERS.length-1;
/* what reforging to the next tier asks for */
const forgeCost=t=>({gold:120*(t+1)*(t+1),ore:2*(t+1),star:t>=3?t-2:0});
/* a weapon's numbers at its tier */
function weaponStats(w){const T=WTYPES[w.kind]||WTYPES.sword,o={},t=w.tier||0;
  for(const k of['atk','mag','def','spd']){const v=T.stat[k]||0;o[k]=v>0?Math.round(v*(1+.55*t)+t*1.5):v}return o}
/* everything about a member at their level, with weapon and charm */
function statsOf(m){const C=CHARS[m.id]||CHARS.hero,L=m.lv,ws=weaponStats(m.weapon),ch=CHARMS[m.charm||'none']||{};
  const g=k=>Math.round(C.base[k]+C.grow[k]*(L-1));
  const s={hp:g('hp'),mp:g('mp'),atk:g('atk')+ws.atk,mag:g('mag')+ws.mag,def:g('def')+ws.def,spd:Math.max(3,g('spd')+ws.spd)};
  for(const k of['hp','mp','atk','mag','def','spd'])if(ch[k])s[k]=Math.round(s[k]*(1+ch[k]));
  const sy=synOf(m);for(const k in sy)if(s[k]!=null)s[k]=Math.round(s[k]*(1+sy[k]));
  if(m.id==='hero'&&typeof G!=='undefined'&&G&&G.flags)for(const[f,P]of Object.entries(POWERS))if(G.flags[f])for(const k in P.mod)s[k]=Math.round(s[k]*(1+P.mod[k]));
  s.mdef=Math.round((s.def+s.mag)/2);s.crit=.05+(ch.crit||0);s.limitGain=1+(ch.limit||0);s.xpMul=1+(ch.xp||0);s.goldMul=1+(ch.gold||0);s.regen=!!ch.regen;
  s.hp=Math.min(9999,s.hp);s.mp=Math.min(999,s.mp);return s}
/* the arts a member knows with the weapon in hand */
/* powers Lift takes from the strong foes he beats: each lifts his stats and gives him one more Special */
const POWERS={
 hound:{n:'Hound',from:'Garrick the Hound',desc:'Garrick\'s speed, and his nose. You can follow a scent now.',mod:{spd:.15,atk:.06},art:{id:'hunt',n:'Hunt',mp:0,lv:1,tgt:'one',kind:'phys',pow:1.1,hits:2,st:'bleed',chance:.45,power:1}},

};
const artsOf=m=>{const l=(ARTS[m.weapon.kind]||ARTS.sword).list.filter(a=>a.lv<=m.lv);if(m.id==='hero'&&typeof G!=='undefined'&&G&&G.flags)for(const[f,P]of Object.entries(POWERS))if(G.flags[f])l.push(P.art);return l};
const limitOf=m=>(ARTS[m.weapon.kind]||ARTS.sword).limit;
const artLabel=m=>(ARTS[m.weapon.kind]||ARTS.sword).label;
/* a member made fresh at a level */
function makeMember(id,lv,look,weapon,name){const C=CHARS[id];
  const w=weapon?Object.assign(newWeapon(weapon.kind),JSON.parse(JSON.stringify(weapon))):newWeapon('sword');
  if(weapon&&weapon.parts)w.parts=Object.assign(newWeapon(weapon.kind).parts,weapon.parts);
  const m={id,name:name||C.n,lv:lv||1,xp:0,look:Object.assign({},DEFAULT_LOOK,look||C.look||{}),weapon:w,charm:'none',limit:0,hp:1,mp:1};
  const s=statsOf(m);m.hp=s.hp;m.mp=s.mp;return m}
/* experience: returns what each level brought */
function giveXP(m,n){const out=[];m.xp+=n;while(m.lv<MAXLV&&m.xp>=needXP(m.lv)){m.xp-=needXP(m.lv);const before=statsOf(m);m.lv++;const after=statsOf(m);
    m.hp+=after.hp-before.hp;m.mp+=after.mp-before.mp;out.push({lv:m.lv,learned:(ARTS[m.weapon.kind]||ARTS.sword).list.filter(a=>a.lv===m.lv).map(a=>a.n)})}
  if(m.lv>=MAXLV)m.xp=0;return out}
/* the bag */
const addItem=(id,n=1)=>{G.inv[id]=Math.min(99,(G.inv[id]||0)+n);if(G.inv[id]<=0)delete G.inv[id]};
const hasItem=id=>(G.inv[id]||0)>0;
const addCharm=(id,n=1)=>{G.charms[id]=(G.charms[id]||0)+n};
/* how many of a charm are free to put on */
const charmFree=id=>(G.charms[id]||0)-allMembers().filter(m=>m.charm===id).length;
function healAll(){for(const m of allMembers()){const s=statsOf(m);m.hp=s.hp;m.mp=s.mp}}

/* ================= battle: active time, the way the old ones did it (time waits while you choose) =================
   The party stands on the right facing left, the foes on the left. Each fighter's gauge fills with speed; when a
   party member's is full their commands open. Foes act when theirs fill. */

function artDesc(a){if(a.desc&&a.kind==='buff')return`${TGT_TXT[a.tgt]} · ${a.desc}`;const bits=[TGT_TXT[a.tgt]];
  if(a.kind==='heal')bits.push(a.revive&&a.tgt==='dead'?'Revives':a.pct?'Heals by a share of HP':'Heals');else if(a.kind==='buff')bits.push(STATUS[a.st]?STATUS[a.st].n:'');
  else{if(a.hits>1)bits.push(a.hits+' hits');if(a.elem)bits.push(a.elem);bits.push(a.kind==='mag'?'Magic':'Strike')}
  if(a.st&&a.kind!=='buff'&&STATUS[a.st])bits.push((a.chance>=1?'':'May ')+STATUS[a.st].n.toLowerCase().replace(/^(def|atk) -$/,m=>m));
  if(a.crit)bits.push('Keen');if(a.execute)bits.push('Finishes the weak');if(a.drain)bits.push('Drains HP');if(a.refund)bits.push('Refunds MP');if(a.sure)bits.push('Never misses');if(a.after==='regen')bits.push('then Regen');return bits.join(' · ')}
/* ---------- time inside a battle ---------- */
const bwait=ms=>new Promise(r=>BT.timers.push({t:ms/1000/ANIM[SET.speed],r}));
function tween(o,props,ms,ease=t=>t){return new Promise(r=>{const from={};for(const k in props)from[k]=o[k];BT.tweens.push({o,from,props,t:0,d:Math.max(.001,ms/1000/ANIM[SET.speed]),ease,r})})}
const easeOut=t=>1-(1-t)*(1-t),easeIn=t=>t*t,easeIO=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
function addFx(life,draw,o={}){const e=Object.assign({t:0,life,draw},o);BT.fx.push(e);return e}
/* ---------- the fighters ---------- */
function unitP(m,i){const s=statsOf(m);return{side:'p',m,name:m.name,hp:clamp(m.hp,0,s.hp),mhp:s.hp,mp:clamp(m.mp,0,s.mp),mmp:s.mp,s,atb:.15+rnd()*.55,st:s.regen?{regen:999}:{},alive:m.hp>0,i,ox:0,oy:0,pose:null,poseT:0,nk:0,guard:false}}

const HUD_Y=149;
function bLayout(){const P=BT.P,n=P.length,sl={1:[[64,128]],2:[[92,118],[56,138]],3:[[104,124],[66,108],[62,141]],4:[[106,124],[72,108],[66,142],[34,126]]}[n]||[[64,128]];
  P.forEach((u,i)=>{u.hx=W-sl[i][0];u.hy=sl[i][1]});
  const E=BT.E,m=E.length,sp=BT.o.boss?[[.27,140]]:{1:[[.28,132]],2:[[.17,116],[.39,138]],3:[[.15,108],[.39,120],[.23,142]]}[m]||[[.27,132]];

/* ---------- the camera: it leans in for Specials and Ults ---------- */
function bcamTo(x,y,z,ms=260){const hw=W/(2*z),hh=H/(2*z);return tween(BT.cam,{x:clamp(x,hw,W-hw),y:clamp(y,hh,H-hh),z},ms,easeIO)}

function camOn(units,z){units=units.filter(Boolean);if(!units.length)return Promise.resolve();const xs=units.map(midX),ys=units.map(midY);return bcamTo((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2,z)}
const toScreen=(x,y)=>{const c=BT.cam||{x:W/2,y:H/2,z:1};return[(x-c.x)*c.z+W/2,(y-c.y)*c.z+H/2]};
/* the middle of a fighter, for effects and numbers */
const midX=u=>u.hx+u.ox,midY=u=>u.side==='p'?u.hy+u.oy-24:u.hy+u.oy-u.spr.fy+u.spr.h*.5,topY=u=>u.side==='p'?u.hy+u.oy-46:u.hy+u.oy-u.spr.fy+6;
const alive=l=>l.filter(u=>u.alive);
/* numbers in play, with statuses */
function stat(u,k){let v=u.s[k];const st=u.st;
  if(k==='atk'||k==='mag'){if(st.atkUp&&k==='atk')v*=1.35;if(st.atkDown)v*=.7;if(st.berserk&&k==='atk')v*=1.5}
  if(k==='def'||k==='mdef'){if(st.defUp)v*=1.5;if(st.defDown)v*=.6;if(st.berserk)v*=.75}return v}
function atbRate(u){let r=(stat(u,'spd')+30)/88;if(u.st.haste)r*=1.5;if(u.st.slow)r*=.5;return r*BSPD[SET.speed]}
/* ---------- damage ---------- */
function calc(src,t,o){const phys=o.kind!=='mag';const A=stat(src,phys?'atk':'mag'),D=stat(t,phys?'def':'mdef');
  const r={dmg:0,crit:false,miss:false,weak:false,resist:false};
  if(phys&&!o.sure){let miss=.04;if(t.st.evade)miss+=.5;if(rnd()<miss){r.miss=true;return r}}
  let d=A*(o.pow||1)*(src.side==='p'?2.4:2.0)*(55/(55+D))*(.92+rnd()*.16);
  const el=o.elem||(phys&&src.side==='p'&&src.m.weapon.elem!=='None'?src.m.weapon.elem:null)||(src.side==='p'?innateEl(src.m):null);
  if(el&&t.side==='e'){if(t.F.weak.includes(el)){d*=1.5;r.weak=true}else if(t.F.res.includes(el)){d*=.5;r.resist=true}}
  if(phys){let cc=(src.s.crit||.05)+(o.crit||0);if(src.st.focus)cc=1;if(rnd()<cc){d*=1.75;r.crit=true}}
  if(t.guard)d*=.5;if(o.execute&&t.side==='e'){if(t.hp/t.mhp<.3&&!t.F.boss)d=t.hp;else d*=1.3}
  r.dmg=clamp(Math.round(d),1,9999);r.elem=el;return r}
/* a number over someone's head */
function num(u,txt,cls=''){const k=u.nk++%4,[x,y]=toScreen(midX(u)+(k%2?6:-6)*(k>1?1:0)+(k===3?-4:0),topY(u)+10+(k>1?-7:0));
  const e=el('div','dmg '+cls,txt);e.style.left=px(x);e.style.top=px(y);BT.layer.appendChild(e);setTimeout(()=>e.remove(),1150);setTimeout(()=>{u.nk=Math.max(0,u.nk-1)},500)}
function hurt(u,amount){u.hp=Math.max(0,u.hp-amount);
  if(u.side==='p'){u.pose='hurt';u.poseT=.32;const g=amount/u.mhp*100*1.15*u.s.limitGain;u.m.limit=Math.min(100,(u.m.limit||0)+g)}else{u.flash=.16;u.shake=.25}
  if(u.hp<=0)knockOut(u)}
function healU(u,n){const v=Math.min(u.mhp-u.hp,Math.round(n));u.hp+=v;num(u,v,'heal');return v}
function knockOut(u){u.alive=false;u.atb=0;u.st={};u.guard=false;
  if(u.side==='p'){SND.fx('ko');BT.ready=BT.ready.filter(x=>x!==u);if(BT.cur===u)closeCommand(true);for(const p of BT.P)if(p.alive)p.m.limit=Math.min(100,p.m.limit+12)}
  else{SND.fx('die');u.dying=0}}
/* a hit from src on t: shows it, applies it, returns the result */
function strike(src,t,o){if(!t.alive)return null;const r=calc(src,t,o);
  if(r.miss){num(t,'Miss','miss');SND.fx('miss');return r}
  hurt(t,r.dmg);num(t,r.dmg,r.crit?'crit':'');if(r.weak)num(t,'Weak!','tag');if(r.elem&&src.side==='p')applyAura(src,t,r);
  if(r.crit)SND.fx('crit');if(src.side==='p')src.m.limit=Math.min(100,src.m.limit+1.5*src.s.limitGain);

function wishPull(){G.pity=(G.pity||0)+1;G.wishes=(G.wishes||0)+1;const five=G.pity>=WISH.pity||rnd()<WISH.rate5;if(five)G.pity=0;
  const ids=WISH_IDS.filter(id=>CHARS[id].rar===(five?5:4)),id=ids[Math.floor(rnd()*ids.length)],had=owned(id);
  if(had)G.gems+=WISH.dupe;else join(id);return{id,five,had}}

    side.innerHTML='<div style="column-count:2;column-gap:4px">'+WISH_IDS.map(id=>{const C=CHARS[id],R=ROLES[C.role];return`<div class="tiny" style="break-inside:avoid;color:${owned(id)?'#fff':'#7a82a8'}">${C.rar===5?'<span class="gold">★5</span>':'<span class="blue">★4</span>'} <i class="eld" style="background:${ELEMS[C.el].c}"></i>${esc(C.n)} <span style="color:${R.c}">${R.s}</span>${owned(id)?'✓':''}</div>`}).join('')+'</div>'};draw();
  const one=winEl('plain',{x:4,y:32,w:W-176,h:60},root);one.innerHTML='<div class="tiny dim">Defeat enemies for gems. Every 100 gems is a wish. A repeat turns into 50 gems.</div>';
  await menuLoop({el:winEl('roomy r9',{x:4,y:96,w:W-176,h:80},root),rows:[{label:'Wish ×1'},{label:'Wish ×10'},{label:'Best heroes'},{label:'Back'}],vis:4,act:async(row,i)=>{if(i===3)return 'close';if(i===2){await bestHeroes(root);return}

    G.gems-=n*WISH.cost;const res=[];for(let k=0;k<n;k++)res.push(wishPull());draw();setTimeout(checkQuests,600);

      +(dupes?`<div class="small dim">${dupes} repeat${dupes>1?'s':''} → ◆${dupes*WISH.dupe} back</div>`:'')+`<div class="tiny dim" style="text-align:right"><i class="k a">A</i>continue</div>`;
    SND.fx(res.some(r=>r.five)?'limit':'level');
