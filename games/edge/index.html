<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Over the Edge</title>
<style>
/* Over the Edge: a 3D canvas filling the screen, and the menus and HUD as an HTML layer over it.
   The HTML layer is laid out on a 640 x 360 design and scaled to fit, so it looks the same on every screen. */
:root{color-scheme:dark;--ink:#f4f6ff;--dim:#9aa6d8;--gold:#ffcc4a;--red:#ff4a5a;--blue:#4ab0ff;--grn:#5ad87a;--bgA:#0a0f24;--bgB:#141d44;
  --A:#ff4a5a;--B:#ffc23a;--C:#4ab0ff;--D:#5ad87a;--ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
html,body{height:100%;margin:0;background:#05070f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui);color:var(--ink)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:50%;top:50%;width:640px;height:360px;transform-origin:50% 50%;pointer-events:none}
#ui *{box-sizing:border-box}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.pane{background:linear-gradient(180deg,rgba(28,40,92,.92),rgba(10,15,40,.94));border:2px solid rgba(160,190,255,.45);border-radius:10px;box-shadow:0 0 0 2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.5)}
.hdr{font:900 italic 26px/1 var(--ui);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 #0a0f24,0 0 18px rgba(74,176,255,.6)}
.sub{font:700 13px/1.25 var(--ui);color:var(--dim)}
.k{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;border-radius:10px;font:900 12px/1 var(--ui);color:#10142a;vertical-align:middle;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 rgba(0,0,0,.5)}
.k.A{background:var(--A)}.k.B{background:var(--B)}.k.C{background:var(--C)}.k.D{background:var(--D)}.k.S{background:#c8ccdc;border-radius:5px}.k.X{background:#3a4470;color:#c8d2ff}
.st{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#2a3460;color:#e8ecff;font:900 12px/1 var(--ui);vertical-align:middle;box-shadow:inset 0 0 0 2px #5a6aa8}
/* menus */
.menu{position:absolute;display:flex;flex-direction:column;gap:6px}
.item{position:relative;height:34px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;font:900 italic 17px/1 var(--ui);letter-spacing:.03em;text-transform:uppercase;color:#cfd8ff;
  background:linear-gradient(90deg,rgba(40,56,120,.85),rgba(20,28,66,.6));border:2px solid rgba(120,150,230,.35);border-radius:8px;transform:skewX(-8deg)}
.item>*{transform:skewX(8deg)}
.item.sel{color:#10142a;background:linear-gradient(90deg,#ffe07a,#ffb83a);border-color:#fff3c4;box-shadow:0 0 18px rgba(255,204,74,.55)}
.item .val{font:900 15px/1 var(--ui);font-style:normal}
.item.sel .val{color:#3a1a00}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 12px/1 var(--ui);color:var(--dim);text-shadow:0 1px 2px #000}
.hint .k{transform:scale(.9)}
/* character select */
.cards{position:absolute;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.card{position:relative;height:76px;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,#2a3a7a,#121a3c);border:2px solid rgba(140,170,255,.35)}
.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.card b{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font:900 italic 12px/1 var(--ui);letter-spacing:.04em;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0))}
.card.p1{border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 16px rgba(255,74,90,.6)}
.card.p2{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue),0 0 16px rgba(74,176,255,.6)}
.card.p1.p2{box-shadow:0 0 0 2px var(--red),0 0 0 5px var(--blue)}
.tag{position:absolute;top:4px;padding:2px 5px;border-radius:4px;font:900 10px/1 var(--ui);color:#fff}.tag.p1{left:4px;background:var(--red)}.tag.p2{right:4px;background:var(--blue)}
.bars{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center;font:800 10px/1 var(--ui);color:var(--dim);letter-spacing:.06em}
.bar{height:7px;border-radius:4px;background:#1a2450;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ab0ff,#9af0ff);border-radius:4px}
.mv{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;font:800 12px/1.15 var(--ui)}
.mv .in{white-space:nowrap}.mv .nm{color:#fff}.mv .ds{grid-column:2;font:600 10.5px/1.2 var(--ui);color:var(--dim);margin-top:-3px}
/* HUD */
#hud{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:22px}
.pl{position:relative;width:176px;height:58px}
.pl .face{position:absolute;left:0;bottom:2px;width:58px;height:58px;border-radius:10px;overflow:hidden;border:2px solid #fff;background:#1a2450;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pl .face img{width:100%;height:100%;object-fit:cover}
.pl .nm{position:absolute;left:64px;bottom:2px;font:900 italic 12px/1 var(--ui);letter-spacing:.05em;text-shadow:0 1px 2px #000,0 0 6px #000}
.pl .pc{position:absolute;left:62px;bottom:14px;font:900 italic 40px/1 var(--ui);letter-spacing:-.01em;-webkit-text-stroke:2px #10142a;paint-order:stroke fill;text-shadow:0 3px 0 #10142a}
.pl .pc small{font-size:22px}
.pl .stk{position:absolute;left:64px;top:-6px;display:flex;gap:3px}
.pl .stk i{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #000}
.pl .call{position:absolute;left:62px;top:-26px;font:900 italic 11px/1 var(--ui);color:#fff;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.55);opacity:0;transition:opacity .15s;white-space:nowrap}
.pl .call.on{opacity:1}
.pl.p1 .face{border-color:var(--red)}.pl.p2 .face{border-color:var(--blue)}
.ban{position:absolute;left:0;right:0;top:118px;text-align:center;font:900 italic 74px/1 var(--ui);letter-spacing:.02em;color:#fff;-webkit-text-stroke:3px #10142a;paint-order:stroke fill;text-shadow:0 6px 0 #10142a,0 0 30px rgba(255,204,74,.7);opacity:0}
.ban.on{opacity:1;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.combo{position:absolute;top:58px;font:900 italic 20px/1 var(--ui);color:var(--gold);-webkit-text-stroke:2px #10142a;paint-order:stroke fill;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.flash{position:absolute;inset:-200px;background:#fff;opacity:0;pointer-events:none}
.dim{position:absolute;inset:-400px;background:rgba(5,8,20,.62)}
/* standalone touch controls: a stick on the left, four buttons on the right */
#touch{position:fixed;inset:0;display:none;pointer-events:none}
html.touch:not(.zp) #touch{display:block}
#tstick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#tknob{position:absolute;left:39px;top:39px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6)}
.tb{position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid rgba(0,0,0,.4);font:900 20px/1 var(--ui);color:#10142a;pointer-events:auto;touch-action:none;display:grid;place-items:center;opacity:.85}
#tA{right:max(16px,env(safe-area-inset-right,0px));bottom:84px;background:var(--A)}#tB{right:max(74px,calc(env(safe-area-inset-right,0px) + 58px));bottom:30px;background:var(--B)}
#tC{right:max(132px,calc(env(safe-area-inset-right,0px) + 116px));bottom:84px;background:var(--C)}#tD{right:max(74px,calc(env(safe-area-inset-right,0px) + 58px));bottom:138px;background:var(--D)}
#tS{right:max(14px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));width:64px;height:30px;border-radius:15px;background:rgba(255,255,255,.3);font-size:11px;color:#fff}
#err{position:fixed;left:0;right:0;top:40%;text-align:center;font:700 15px/1.4 var(--ui);color:#fff;display:none}
</style>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="touch"><div id="tstick"><div id="tknob"></div></div><div class="tb" id="tD">D</div><div class="tb" id="tC">C</div><div class="tb" id="tA">A</div><div class="tb" id="tB">B</div><div class="tb" id="tS">START</div></div>

<script>
(async()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const $=s=>document.querySelector(s);
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,pick=a=>a[Math.floor(rnd()*a.length)],D2R=Math.PI/180;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const store={get(k,d){try{const v=localStorage.getItem('edge-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('edge-'+k,JSON.stringify(v))}catch(e){}}};
/* the HTML layer is designed at 640 x 360 and scaled to the screen */
let UIS=1;function fitUI(){const w=innerWidth,h=innerHeight;UIS=Math.min(w/640,h/360);const ui=$('#ui');ui.style.transform=`translate(-50%,-50%) scale(${UIS})`}
addEventListener('resize',fitUI);fitUI();

/* ================= input =================
   Raw buttons come from the console (or the keyboard, or the touch controls); the stick also reports where it
   points. Each game frame turns them into a pad: the stick (x right, y up, -1..1), and the game's actions
   (attack, special, jump, shield, grab) held / pressed this frame, using the player's button mapping. */
const BTN=['up','down','left','right','a','b','c','d','start','select'];
const RAW={held:{},tap:{},rel:{},ax:0,ay:0,analogAt:-1e9};
for(const b of BTN){RAW.held[b]=false;RAW.tap[b]=false;RAW.rel[b]=false}
function rawInput(btn,down){if(!BTN.includes(btn))return;if(down){if(!RAW.held[btn])RAW.tap[btn]=true;RAW.held[btn]=true}else{if(RAW.held[btn])RAW.rel[btn]=true;RAW.held[btn]=false}}
function rawStick(x,y){RAW.ax=clamp(+x||0,-1,1);RAW.ay=clamp(+y||0,-1,1);RAW.analogAt=performance.now()}
const ACTIONS=[['attack','ATTACK'],['special','SPECIAL'],['jump','JUMP'],['shield','SHIELD / DODGE'],['grab','GRAB']];
const DEFAULT_MAP={attack:'a',special:'b',jump:'c',shield:'d',grab:'',tapJump:false,smash:true};
let MAP=Object.assign({},DEFAULT_MAP,store.get('map',{}));
function saveMap(){store.set('map',MAP)}
function btnOf(action){return MAP[action]||''}
/* the human's pad, rebuilt every frame */
function makePad(){return{x:0,y:0,px:0,py:0,held:{},pressed:{},released:{},flickX:0,flickY:0,flickAt:-99,neutralAt:0,t:0,menu:{}}}
const HUMAN=makePad();
function readPad(P){P.t++;
  let x=0,y=0;const analog=performance.now()-RAW.analogAt<1500&&(Math.abs(RAW.ax)>.04||Math.abs(RAW.ay)>.04);
  if(analog){x=RAW.ax;y=-RAW.ay}else{x=(RAW.held.right?1:0)-(RAW.held.left?1:0);y=(RAW.held.up?1:0)-(RAW.held.down?1:0);if(x&&y){x*=.7071;y*=.7071}}
  P.px=P.x;P.py=P.y;P.x=x;P.y=y;
  /* a flick: the stick goes from near the middle to near the edge within a few frames (smash attacks, dashes, fast falls) */
  const m=Math.hypot(x,y),pm=Math.hypot(P.px,P.py);if(m<.3)P.neutralAt=P.t;
  P.flickX=0;P.flickY=0;
  if(m>.75&&P.t-P.neutralAt<=4){if(Math.abs(x)>.6&&Math.abs(P.px)<.6)P.flickX=sgn(x);if(Math.abs(y)>.6&&Math.abs(P.py)<.6)P.flickY=sgn(y);if(P.flickX||P.flickY)P.flickAt=P.t}
  for(const[a]of ACTIONS){const b=MAP[a];P.pressed[a]=!!(b&&RAW.tap[b]);P.held[a]=!!(b&&RAW.held[b]);P.released[a]=!!(b&&RAW.rel[b])}
  if(MAP.tapJump&&P.flickY>0)P.pressed.jump=true,P.held.jump=true;
  if(MAP.tapJump&&y>.6)P.held.jump=true;
  /* menus always use the console's own buttons: A to choose, B to go back */
  for(const b of BTN)P.menu[b]=RAW.tap[b];
  P.menu.mx=0;P.menu.my=0}
function clearRaw(){for(const b of BTN){RAW.tap[b]=false;RAW.rel[b]=false}}
/* menu navigation repeats when a direction is held */
const REP={d:'',t:0};
function menuDir(){const P=HUMAN;let d='';if(P.menu.up||RAW.held.up&&!RAW.held.down||P.y>.6)d='up';else if(P.menu.down||RAW.held.down||P.y<-.6)d='down';else if(P.menu.left||RAW.held.left||P.x<-.6)d='left';else if(P.menu.right||RAW.held.right||P.x>.6)d='right';
  if(!d){REP.d='';return''}if(d!==REP.d){REP.d=d;REP.t=0;return d}REP.t++;if(REP.t>18&&REP.t%5===0)return d;return''}
/* the keyboard, when played in a browser outside the ZigaPlay */
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  j:'a',J:'a',z:'a',Z:'a',k:'b',K:'b',x:'b',X:'b',l:'c',L:'c',' ':'c',c:'c',C:'c',i:'d',I:'d',v:'d',V:'d',Enter:'start',Escape:'start',Shift:'select'};
addEventListener('keydown',e=>{const b=KEYMAP[e.key];if(!b)return;e.preventDefault();unlock();if(e.repeat)return;rawInput(b,true)});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)rawInput(b,false)});
addEventListener('blur',()=>{for(const b of BTN)rawInput(b,false);rawStick(0,0)});
/* touch controls outside the console */
(()=>{const st=$('#tstick'),kn=$('#tknob');let id=null;
  const move=e=>{const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
    kn.style.transform=`translate(${dx*39}px,${dy*39}px)`;rawStick(dx,dy)};
  st.addEventListener('pointerdown',e=>{e.preventDefault();unlock();id=e.pointerId;try{st.setPointerCapture(id)}catch(_){}move(e)});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e)});
  const end=e=>{if(e.pointerId!==id)return;id=null;kn.style.transform='';rawStick(0,0)};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  for(const[id2,b]of[['tA','a'],['tB','b'],['tC','c'],['tD','d'],['tS','start']]){const el=$('#'+id2);
    el.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{el.setPointerCapture(e.pointerId)}catch(_){}rawInput(b,true)});
    const up=()=>rawInput(b,false);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}})();

/* ================= sound: synthesised, no files ================= */
let AC=null,master=null,musicBus=null,sfxBus=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.6;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp);comp.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.22;musicBus.connect(master);sfxBus=AC.createGain();sfxBus.gain.value=.9;sfxBus.connect(master)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.12,type='square',v=.2,t0=0,dest=null,a=.005}){const c=AC;if(!c||muted)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest||sfxBus);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.15,v=.2,f=1000,q=1,t0=0,type='bandpass',f2=null,dest=null}){const c=AC;if(!c||muted)return;if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=rnd()*2-1}
  const t=c.currentTime+t0,s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=NB;s.playbackRate.value=.8+rnd()*.4;bp.type=type;bp.frequency.setValueAtTime(f,t);if(f2)bp.frequency.exponentialRampToValueAtTime(f2,t+d);bp.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bp);bp.connect(g);g.connect(dest||sfxBus);s.start(t,rnd()*.5);s.stop(t+d+.02)}
const SFX={
  swing(h){noise({d:.12+h*.05,f:900,f2:2600,q:.9,v:.1+h*.05})},
  slash(){noise({d:.14,f:2400,f2:5200,q:1.4,v:.12});tone({f:1400,f2:700,d:.1,type:'triangle',v:.04})},
  hit(p){/* p: 0 light, 1 medium, 2 heavy */const lo=[170,130,95][p];tone({f:lo,f2:lo*.35,d:.1+p*.07,type:'sine',v:.5});noise({d:.06+p*.06,f:[1800,1300,900][p],q:.8,v:.35+p*.08});if(p===2)noise({d:.35,f:240,q:.5,v:.3,type:'lowpass'})},
  cut(p){tone({f:2200,f2:1400,d:.09,type:'square',v:.07});tone({f:2900,f2:1900,d:.12,type:'square',v:.05,t0:.01});this.hit(p)},
  jump(){noise({d:.12,f:700,f2:1600,q:.7,v:.09})},
  djump(){noise({d:.16,f:500,f2:2000,q:.7,v:.1});tone({f:300,f2:520,d:.12,type:'triangle',v:.05})},
  land(){noise({d:.07,f:260,q:.7,v:.18,type:'lowpass'})},
  dash(){noise({d:.12,f:1400,f2:500,q:.6,v:.12})},
  shield(){tone({f:180,f2:240,d:.18,type:'sine',v:.08})},
  block(){tone({f:520,d:.08,type:'triangle',v:.12});noise({d:.06,f:3000,v:.1})},
  parry(){[1568,2093,2637].forEach((f,i)=>tone({f,d:.25,type:'triangle',v:.12,t0:i*.03}))},
  shatter(){noise({d:.6,f:3000,q:.3,v:.35});[880,660,440].forEach((f,i)=>tone({f,f2:f*.6,d:.4,type:'triangle',v:.1,t0:i*.07}))},
  grab(){noise({d:.08,f:500,v:.2});tone({f:200,d:.08,v:.1})},
  charge(){tone({f:220,f2:660,d:.6,type:'sawtooth',v:.05})},
  shoot(){tone({f:900,f2:260,d:.16,type:'square',v:.08});noise({d:.08,f:2000,v:.08})},
  boom(){noise({d:.45,f:200,q:.4,v:.4,type:'lowpass'});tone({f:90,f2:35,d:.4,v:.3,type:'sine'})},
  ko(){noise({d:1.1,f:160,q:.3,v:.5,type:'lowpass'});tone({f:240,f2:30,d:.9,type:'sawtooth',v:.18});noise({d:.8,f:5000,f2:1200,q:.6,v:.15,t0:.08});this.crowd(1.2)},
  crowd(s=1){noise({d:1.4*s,f:900,q:.4,v:.09,type:'bandpass'});noise({d:1.2*s,f:1800,q:.5,v:.05,t0:.1})},
  move(){tone({f:880,d:.04,type:'triangle',v:.08})},
  pick(){tone({f:660,d:.07,type:'triangle',v:.12});tone({f:990,d:.12,type:'triangle',v:.12,t0:.06})},
  back(){tone({f:440,f2:300,d:.09,type:'triangle',v:.1})},
  beep(){tone({f:660,d:.18,type:'square',v:.1})},

function cyclePose(ph,run,out){const s=Math.sin(ph),c=Math.cos(ph),a=run?1:.55,o=out||new Float32Array(PK.length);o.fill(0);
  const set=(k,v)=>{o[IX[k]]=v};
  set('y',(run?-.06:-.02)-Math.abs(c)*.04*a);set('hips1',s*8*a);set('chest0',run?18:6);set('chest1',-s*10*a);set('head0',run?-12:-4);
  set('legL0',s*38*a);set('legR0',-s*38*a);set('kneeL',(run?26:12)+Math.max(0,-c)*60*a+(s<0?20*a:0));set('kneeR',(run?26:12)+Math.max(0,c)*60*a+(s>0?20*a:0));
  set('footL',s>0?-10:20*a);set('footR',s<0?-10:20*a);
  set('armL0',-s*(run?50:22));set('armR0',s*(run?50:22));set('armL1',10);set('armR1',10);set('elbowL',run?90:30);set('elbowR',run?90:30);
  return o}

function sampleMove(m,out){const d=m.def,a=d.anim||{},f=m.f,s=d.s??6,ac=d.a??3,len=m.len||d.len||(s+ac+(d.r??12));
  const W=POSE[a.wind]||POSE.stance,Hh=POSE[a.hit]||POSE.stance,E=POSE[a.end||a.hit]||Hh,B=POSE.stance;
  if(a.fn)return a.fn(m,out);
  if(f<s){const t=f/Math.max(1,s);return t<.65?mixPose(B,W,ease(t/.65),out):mixPose(W,Hh,ease((t-.65)/.35),out)}
  if(f<s+ac){return mixPose(Hh,E,(f-s)/Math.max(1,ac),out)}
  const t=clamp((f-s-ac)/Math.max(1,len-s-ac),0,1);return mixPose(E,m.air?POSE.fall:B,ease(t),out)}

  if(f.st==='held'||f.st==='hurt'||f.st==='lie')return;
  const off=!f.ground&&(f.x<S.l-.15||f.x>S.r+.15||f.y<S.y-.3);if(off||f.st==='ledge'){aiEmergency(f,o,P,A,AIL(5));return}
  if(d==='shield')P.held.shield=true,f.ground&&!f.st.startsWith('sh')&&press(P,'shield');
  else if(d==='jump'){if(f.ground&&f.st==='stand'&&P.t%50===0)press(P,'jump'),P.held.jump=true}
  else if(d==='walk'){A.wd=A.wd||1;if(f.x>S.r-1.5)A.wd=-1;if(f.x<S.l+1.5)A.wd=1;P.x=A.wd*.6}}

      x=clamp(x,14,626);y=clamp(y,16,296);H.tag.style.left=x+'px';H.tag.style.top=y+'px';H.tag.style.outline=out?'2px solid #fff':''}});
  /* banners */
  const b=G.banner;if(b!==HUDC.lastBan){HUDC.lastBan=b;HUDC.ban.classList.remove('on');if(b){void HUDC.ban.offsetWidth;HUDC.ban.textContent=b.s;HUDC.ban.style.color=b.col||'#fff';HUDC.ban.classList.add('on')}}
  HUDC.ban.style.opacity=b?Math.min(1,b.t/12):'';
  /* combos */
  const cs=G.comboShow;if(cs){HUDC.combo.classList.add('on');const i=G.fighters.indexOf(cs.f);HUDC.combo.textContent=`${cs.n} HIT COMBO!`;HUDC.combo.style.left=i?'':'18px';HUDC.combo.style.right=i?'18px':''}else HUDC.combo.classList.remove('on');
  HUDC.flash.style.opacity=Math.max(0,G.flash||0);
  /* floating words: PARRY!, COUNTER!, TECH! */
  for(const t of G.texts||[]){if(!t.el){t.el=document.createElement('div');t.el.style.cssText=`position:absolute;transform:translate(-50%,-100%);font:900 italic 16px/1 var(--ui);color:${t.col};-webkit-text-stroke:2px #10142a;paint-order:stroke fill;white-space:nowrap`;t.el.textContent=t.s;$('#tags').appendChild(t.el)}
    const[x,y]=toUI(t.f.x,t.f.y+t.f.h+.7+(60-t.t)*.012);t.el.style.left=x+'px';t.el.style.top=y+'px';t.el.style.opacity=Math.min(1,t.t/15)}
  /* training: how much the last combo did */
  if(G.mode==='training'){const T=G.trn,v=G.fighters[1],a=G.fighters[0];const d=v.pct-T.prev;if(d>0){if(a.combo<=1||v.st!=='hurt'&&!T.inC)T.dmg=0;T.dmg+=d;T.n=Math.max(1,a.combo);T.inC=1}if(v.st!=='hurt'&&v.hitlag<=0)T.inC=0;T.prev=v.pct;
    const s=`DUMMY: ${TRAIN.names[TRAIN.dummy]} · COMBO ${T.n} · ${Math.round(T.dmg*10)/10}% · START for options`;if(s!==T.s){T.s=s;HUDC.trn.textContent=s}}else if(HUDC.trn.textContent)HUDC.trn.textContent=''}
function hudStep(){if(G.banner&&--G.banner.t<=0)G.banner=null;if(G.comboShow&&--G.comboShow.t<=0)G.comboShow=null;if(G.flash>0)G.flash=Math.max(0,G.flash-.03);
  if(G.texts){for(const t of G.texts)t.t--;for(const t of G.texts)if(t.t<=0&&t.el)t.el.remove();G.texts=G.texts.filter(t=>t.t>0)}}

/* ================= flow and the main loop ================= */
const SET=Object.assign({stocks:3,level:4,music:true},store.get('set',{}));
const PICK=Object.assign({p1:0,p2:1,stage:0},store.get('pick',{}));
function saveSet(){store.set('set',SET);store.set('pick',PICK)}
const TRAIN={dummy:'stand',names:{stand:'STAND',walk:'WALK',jump:'JUMP',shield:'SHIELD',cpu:'FIGHT BACK'},order:['stand','walk','jump','shield','cpu']};
function dummyCyc(d){const o=TRAIN.order;TRAIN.dummy=o[(o.indexOf(TRAIN.dummy)+d+o.length)%o.length];const f=G.fighters[1];if(f)f.ai.dummy=TRAIN.dummy}
function startMatch(mode){G.mode=mode;G.stocks=mode==='training'?99:SET.stocks;const def=STAGES[PICK.stage];G.stage=buildStage(def);setWorld(def,G.stage);showSet([]);
  Object.assign(G,{proj:[],tboxes:[],texts:[],matchEnd:null,slow:0,shake:0,flash:0,comboShow:null,banner:null,frame:0,trn:{prev:0,dmg:0,n:0}});VIEW.hideF=false;
  for(const k in HUMAN.held)HUMAN.held[k]=false;
  const a=new Fighter(ROSTER[PICK.p1],0,HUMAN,false),b=new Fighter(ROSTER[PICK.p2],1,aiPad(),true);aiInit(b,SET.level,mode==='training'?TRAIN.dummy:null);
  G.fighters=[a,b];placeFighters();for(const f of G.fighters)addFighterView(f);
  hudBuild();show('hud');updateCamera(true);G.state='ready';G.readyT=0;music(SET.music,def.song)}
function placeFighters(){const M=G.stage.main,x=(M.r-M.l)*.3;G.fighters[0].spawnAt(-x,M.y,1);G.fighters[1].spawnAt(x,M.y,-1);for(const f of G.fighters){f.st='stand';f.pct=0}}
function resetTraining(){G.proj.forEach(p=>p.life=0);placeFighters();G.trn={prev:0,dmg:0,n:0}}
/* one 60th of a second of the game */
function step(){readPad(HUMAN);SCR_T++;
  switch(G.state){
  case'menu':if(SCREEN==='title')titleTick();else if(SCREEN==='main'||SCREEN==='settings')menuTick(SCREEN);else if(SCREEN==='select')selectTick();else if(SCREEN==='stages')menuTick('stages');
    else if(SCREEN==='moves')movesTick();else if(SCREEN==='controls')controlsTick();break;
  case'pause':if(SCREEN==='pause')pauseTick();else if(SCREEN==='moves')movesTick();else if(SCREEN==='controls')controlsTick();break;
  case'results':menuTick('results');break;
  case'ready':G.readyT++;for(const f of G.fighters)f.clock++;const t=G.readyT;
    if(t===1)banner('3');else if(t===45)banner('2');else if(t===90)banner('1');else if(t===135){banner('GO!','#ffcc4a');SFX.go();G.state='fight'}
    if(t%45===1&&t<135)SFX.beep();break;
  case'fight':fightStep();break;
  case'game':if(--G.endT<=0)goResults();break}
  hudStep();tickFx();clearRaw()}
function fightStep(){if(HUMAN.menu.start&&!G.matchEnd){SFX.pick();goPause();return}
  if(G.slow>0){G.slow--;if(G.slow%2){for(const f of G.fighters)for(const a of ACTS)if(f.pad.pressed[a])f.buf[a]=f.clock;return}}
  for(const f of G.fighters)if(f.cpu)aiTick(f);
  for(const f of G.fighters)f.update();
  resolveHits();
  for(const p of G.proj)if(p.life>0)updProj(p);
  for(const p of G.proj)if(p.life<=0)projGone(p);G.proj=G.proj.filter(p=>p.life>0);
  G.shake=G.shake>.01?G.shake*.86:0;G.frame++;
  if(G.mode==='training')for(const f of G.fighters)if(f.stocks<50)f.stocks=99;
  if(G.matchEnd){if(!G.matchEnd.said){G.matchEnd.said=1;G.slow=40}if(--G.matchEnd.t<=90&&G.state==='fight'){G.state='game';G.endT=110;banner('GAME!','#ffcc4a');SFX.game();music(false)}}}
function projGone(p){if(!p.views)return;for(const v of p.views){const e=VIEW.fx.find(e=>e.obj===v);if(e)e.life=0}p.views=null}
/* drawing, as often as the screen refreshes */
const MENU_SCR=['title','main','settings','select','stages','moves','controls','results'];
function draw(){const menuView=MENU_SCR.includes(SCREEN)&&(G.state==='menu'||G.state==='results'||SCREEN==='moves');
  VIEW.hideF=G.state==='results'||G.state==='menu'||SCREEN==='moves';
  if(menuView&&CAMMODE){menuCam(CAMMODE);showTick()}else if(G.fighters.length&&G.state!=='menu')updateCamera(false);
  if(SCREEN==='moves'&&G.state==='pause')showTick();
  render3D();hudTick()}
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){requestAnimationFrame(frame);let dt=now-last;last=now;if(dt>200)dt=200;acc+=dt;let n=0;
  while(acc>=STEP&&n<5){acc-=STEP;n++;try{step()}catch(e){console.error(e);showErr(e)}}if(acc>STEP*5)acc=0;
  try{draw()}catch(e){console.error(e);showErr(e)}}
function showErr(e){if(window.EDGE_ERR)return;window.EDGE_ERR=e;const el=$('#err');el.style.display='block';el.style.top='4px';el.style.fontSize='11px';el.textContent='Error: '+(e&&e.message||e)}
/* ---------- the ZigaPlay ---------- */
window.ZPCart={title:'Over the Edge',input(b,d){unlock();rawInput(b,d)},stick(x,y){rawStick(x,y)},
  home(){return['fight','pause','ready','game'].includes(G.state)?'ask':true},snapshot(){return null}};
try{ZP&&ZP.cartReady&&ZP.cartReady(window.ZPCart)}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='fight')goPause()});
addEventListener('pointerdown',unlock);
/* ---------- start ---------- */
fitUI();addEventListener('resize',fitUI);
setMute(muted);goTitle();
/* draw the portraits a little at a time so the menus open instantly */
(()=>{let i=0;const next=()=>{if(i>=ROSTER.length)return;portrait(ROSTER[i++],'face');setTimeout(next,40)};setTimeout(next,300)})();
window.EDGE={G,step,draw,aiPad,aiInit,VIEW,HUMAN,RAW,MAP,startMatch,PICK,SET,TRAIN,goTitle,goMain,goSelect,goMoves,goControls,goStages,show,get screen(){return SCREEN}};
requestAnimationFrame(frame);

})().catch(e=>{console.error(e);const el=document.getElementById('err');if(el){el.style.display='block';el.textContent='Over the Edge could not start: '+(e&&e.message||e)}});
</script>
