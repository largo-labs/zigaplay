<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haymaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
/* Haymaker: one canvas filling the screen, in an Arcade Ink style: the ring, the city and the fighters are drawn
   in ring units scaled to the screen's real pixels; the text and the timing lanes are drawn on top.
   Outside the ZigaPlay, touch screens get a D-pad and A / B buttons over the bottom corners. */
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#07060c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
html.touch:not(.zp) #pad{display:block}
.pb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,18,34,.55);color:#fff;font:700 16px/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:none;padding:0}
.pb.on{background:rgba(255,120,80,.6)}
#dp{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dp i{position:absolute;width:50px;height:50px;border-radius:10px;background:rgba(20,18,34,.55);border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
#dp i.on{background:rgba(255,120,80,.6)}
#bA{right:max(16px,env(safe-area-inset-right,0px));bottom:62px}#bB{right:max(84px,calc(env(safe-area-inset-right,0px) + 68px));bottom:20px}
#bS{right:max(16px,env(safe-area-inset-right,0px));top:12px;width:44px;height:44px;font-size:13px}
</style>
<canvas id="cv"></canvas>
<div id="pad"><div id="dp"><i data-d="up" style="left:50px;top:0"></i><i data-d="left" style="left:0;top:50px"></i><i data-d="right" style="left:100px;top:50px"></i><i data-d="down" style="left:50px;top:100px"></i></div>
<button class="pb" id="bA">A</button><button class="pb" id="bB">B</button><button class="pb" id="bS">II</button></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,pick=a=>a[Math.floor(rnd()*a.length)],TAU=Math.PI*2;
const rr=(a,b)=>a+rnd()*(b-a),ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t),easeOut=t=>t<=0?0:t>=1?1:1-(1-t)*(1-t);
const store={get(k,d){try{const v=localStorage.getItem('haymaker-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('haymaker-'+k,JSON.stringify(v))}catch(e){}}};
/* the view: the screen in CSS pixels, drawn at up to 2x. The ring is drawn into a small buffer (BW x BH, at least
   180 x 250 "ring pixels") and scaled up by PS with sharp pixels. UI sizes follow U. */
let SW=300,SH=430,DPR=1,U=1,PORT=true,PS=2,BW=180,BH=250,R=2;/* R: real pixels per ring unit */
const BUF=document.createElement('canvas'),bx=BUF.getContext('2d');
let G=bx;/* the context the art functions draw into */
function resize(){DPR=Math.min(2,devicePixelRatio||1);SW=innerWidth||300;SH=innerHeight||430;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);PORT=SH>SW*1.05;
  U=PORT?Math.min(SW/300,SH/440):Math.min(SH/290,SW/470);
  PS=Math.max(1,Math.min(SW/180,SH/250));BW=Math.ceil(SW/PS);BH=Math.ceil(SH/PS);R=PS*DPR;BUF.width=Math.round(BW*R);BUF.height=Math.round(BH*R)}
addEventListener('resize',resize);resize();
/* Arcade Ink type: a comic display face for names, banners and menus; the system face for longer reading */
const FONT_D="'Bangers','Avenir Next Condensed','Impact','Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif";
const FONT_B="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
const font=(px,w=600,fam)=>`${fam==='b'?w:Math.max(w,700)} ${Math.max(7,Math.round(px*U*(fam==='b'?1:1.18)))}px ${fam==='b'?FONT_B:FONT_D}`;
function text(s,x,y,px,col,al='left',out=null,w=600,fam){ctx.font=font(px,w,fam);ctx.textAlign=al;ctx.textBaseline='top';if(fam!=='b')s=String(s).toUpperCase();
  if(out){ctx.lineWidth=Math.max(2.2,px*U*(fam==='b'?.22:.32));ctx.strokeStyle=out;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
const textB=(s,x,y,px,col,al='left',out=null,w=600)=>text(s,x,y,px,col,al,out,w,'b');
function tw(s,px,w=600,fam){ctx.font=font(px,w,fam);return ctx.measureText(fam==='b'?s:String(s).toUpperCase()).width}
function wrap(s,maxW,px,w=600,fam='b'){ctx.font=font(px,w,fam);const out=[];for(const para of String(s).split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=word}else line=t}out.push(line)}return out}
function rrect(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
/* an ink panel: a hard drop shadow, a thick black outline and a coloured inner edge */
function panel(x,y,w,h,fill='rgba(14,10,24,.92)',edge='#f2c14e',r=8){const k=Math.max(2,3*U);rrect(x+k,y+k,w,h,r*U);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fill();
  rrect(x,y,w,h,r*U);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=Math.max(2.4,3.2*U);ctx.strokeStyle='#0e0a14';ctx.stroke();rrect(x+k*.7,y+k*.7,w-k*1.4,h-k*1.4,Math.max(1,r*U-k*.7));ctx.lineWidth=Math.max(1.2,1.6*U);ctx.strokeStyle=edge;ctx.stroke()}
const shade=(c,t)=>{const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};
if(document.fonts&&document.fonts.load){document.fonts.load(`20px 'Bangers'`).catch(()=>{})}

/* ================= sound ================= */
let AC=null,master=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.5;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.1,type='square',v=.2,t0=0,a=.006}){const A=AC;if(!A||muted)return;const t=A.currentTime+t0,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.1,v=.2,f=1200,q=1,t0=0,type='bandpass',f2=null}){const A=AC;if(!A||muted)return;if(!NB){NB=A.createBuffer(1,A.sampleRate*.5,A.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=A.currentTime+t0,s=A.createBufferSource(),bp=A.createBiquadFilter(),g=A.createGain();s.buffer=NB;s.loop=true;bp.type=type;bp.frequency.setValueAtTime(f,t);if(f2)bp.frequency.exponentialRampToValueAtTime(f2,t+d);bp.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  jab(){noise({d:.07,f:900,q:.8,v:.32});tone({f:130,f2:55,d:.09,type:'sine',v:.34})},
  cross(){noise({d:.09,f:700,q:.7,v:.38});tone({f:115,f2:45,d:.12,type:'sine',v:.4})},
  hay(){noise({d:.16,f:500,q:.6,v:.45});tone({f:95,f2:32,d:.22,type:'sine',v:.5});noise({d:.3,f:2600,q:.5,v:.07,t0:.03})},
  whoosh(){noise({d:.15,f:900,f2:2600,q:.9,v:.13})},
  block(){noise({d:.06,f:350,q:1,v:.25});tone({f:90,f2:60,d:.06,type:'sine',v:.18})},
  hurt(){noise({d:.12,f:420,q:.6,v:.42});tone({f:80,f2:30,d:.2,type:'sine',v:.45});noise({d:.08,f:3000,q:1,v:.08,t0:.02})},
  bell(n=1){for(let i=0;i<n;i++){tone({f:1318,d:1.1,type:'triangle',v:.16,t0:i*.32});tone({f:1976,d:.8,type:'sine',v:.08,t0:i*.32});tone({f:3120,d:.4,type:'sine',v:.03,t0:i*.32})}},
  crowd(v=.14,d=1.4){noise({d,f:700,q:.35,v,type:'bandpass'});noise({d:d*.8,f:1600,q:.5,v:v*.4})},
  count(){tone({f:520,d:.14,v:.12,type:'square'})},
  perfect(){tone({f:1568,d:.08,type:'triangle',v:.09});tone({f:2093,d:.12,type:'triangle',v:.07,t0:.05})},
  ok(){tone({f:1046,d:.06,type:'triangle',v:.07})},
  miss(){tone({f:180,f2:120,d:.16,type:'square',v:.08})},
  combo(){[784,988,1175,1568].forEach((f,i)=>tone({f,d:.12,type:'triangle',v:.09,t0:i*.05}))},
  ko(){noise({d:.9,f:300,q:.4,v:.4});tone({f:400,f2:40,d:.8,type:'sawtooth',v:.12});tone({f:55,f2:28,d:.8,type:'sine',v:.4})},
  fall(){noise({d:.35,f:200,q:.5,v:.4});tone({f:70,f2:30,d:.3,type:'sine',v:.4})},
  move(){tone({f:700,d:.03,v:.05})},pick(){tone({f:660,d:.05,v:.08});tone({f:990,d:.07,v:.08,t0:.05})},back(){tone({f:400,f2:300,d:.07,v:.07})},
  blip(){tone({f:1200+rnd()*200,d:.02,type:'square',v:.025})},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone({f,d:.28,type:'triangle',v:.12,t0:i*.1}))},
  lose(){[392,349,311,262].forEach((f,i)=>tone({f,d:.35,type:'triangle',v:.1,t0:i*.18}))}};
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.5;if(MUS.bus)MUS.bus.gain.value=m?0:MUS.vol}
/* ================= vibration =================
   Phones with a vibration motor (Android) use navigator.vibrate. iPhones have no vibration API for web pages; a
   page can only get a haptic tick by toggling a hidden switch, and since iOS 18.4 only within about a second of a
   tap (a click). So on iPhone a buzz plays at once when you tapped a button in the last second, or else waits for
   the click that ends the tap you're making (that's every dodge and punch). */
const HAP={on:store.get('vib',true),lab:null,inp:null,last:0,grant:-1e9,queued:0};
const hapWin=()=>{let w=window;try{if(ZP&&window.parent.document)w=window.parent}catch(e){}return w};
const canVibrate=()=>{try{return typeof hapWin().navigator.vibrate==='function'}catch(e){return false}};
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function hapTick(){try{const w=hapWin(),d=w.document,id='zp-haptic';if(!HAP.lab||!HAP.lab.isConnected){let lab=d.getElementById(id+'-l'),inp=d.getElementById(id);
    if(!lab||!inp){inp=d.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id=id;lab=d.createElement('label');lab.id=id+'-l';lab.htmlFor=id;
      for(const e of[inp,lab]){e.setAttribute('aria-hidden','true');e.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none'}d.body.append(inp,lab)}HAP.lab=lab;HAP.inp=inp}
  HAP.lab.click()}catch(e){}}
function haptic(ms){if(!HAP.on)return;const now=performance.now();if(now-HAP.last<40)return;HAP.last=now;
  if(canVibrate()){try{hapWin().navigator.vibrate(ms)}catch(e){}return}
  if(!IOS)return;if(now-HAP.grant<950)hapTick();else HAP.queued=now}
/* a rhythm of buzzes: [on, off, on, ...] in ms; on iPhone each "on" is one tick (those after the first second are lost) */
function buzz(pat){if(!HAP.on)return;if(canVibrate()){try{hapWin().navigator.vibrate(pat)}catch(e){}return}
  if(!IOS)return;let t=0;pat.forEach((ms,i)=>{if(i%2===0){const at=t;if(at===0){HAP.last=0;haptic(ms)}else setTimeout(()=>{if(performance.now()-HAP.grant<950)hapTick()},at)}t+=ms})}
/* every real tap (on the console's buttons, or the touch pad here) opens a second's window, and plays a waiting buzz */
(()=>{const docs=[document];try{if(ZP&&window.parent.document)docs.push(window.parent.document)}catch(e){}
  for(const d of docs)d.addEventListener('click',e=>{if(!e.isTrusted||e.target===HAP.lab||e.target===HAP.inp)return;HAP.grant=performance.now();
    if(HAP.queued&&HAP.grant-HAP.queued<700){HAP.queued=0;hapTick()}},true)})();
const RUMBLE={dodge:()=>haptic(12),perfect:()=>buzz([14,30,10]),jab:()=>haptic(22),cross:()=>haptic(30),hay:()=>buzz([45,35,60]),block:()=>haptic(15),
  hurt:()=>buzz([70,40,40]),combo:()=>buzz([25,45,25,45,70]),odown:()=>buzz([90,60,90,60,140]),pdown:()=>buzz([160,90,80]),ko:()=>buzz([120,70,120,70,260]),
  bell:()=>buzz([30,90,30]),count:()=>haptic(10),mash:()=>haptic(8),up:()=>buzz([40,50,40]),win:()=>buzz([40,60,40,60,40,60,180]),lose:()=>buzz([200])};
/* ================= buttons =================
   D-pad, A, B, START, SELECT. Presses are timestamped so the rhythm lanes judge them to the millisecond. */
const RAW={held:{},tap:{}},PRESSES=[];
function rawInput(btn,down){unlock();if(down){if(!RAW.held[btn]){RAW.tap[btn]=true;PRESSES.push({b:btn,at:performance.now()})}RAW.held[btn]=true}else RAW.held[btn]=false}
function clearTaps(){RAW.tap={};PRESSES.length=0}
const TAP=b=>!!RAW.tap[b];
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  z:'a',Z:'a',j:'a',J:'a',' ':'a',x:'b',X:'b',k:'b',K:'b',Enter:'start',Escape:'start',p:'start',P:'start',Shift:'select'};
addEventListener('keydown',e=>{const b=KEYS[e.key];if(!b)return;e.preventDefault();if(!e.repeat)rawInput(b,true)});
addEventListener('keyup',e=>{const b=KEYS[e.key];if(b)rawInput(b,false)});
addEventListener('blur',()=>{for(const k in RAW.held)RAW.held[k]=false});
/* touch pad (only outside the ZigaPlay) */
(()=>{const dp=document.getElementById('dp');if(!dp)return;const set=(e)=>{const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);
    const want={left:d>18&&x<-Math.abs(y)*.6,right:d>18&&x>Math.abs(y)*.6,up:d>18&&y<-Math.abs(x)*.6,down:d>18&&y>Math.abs(x)*.6};
    for(const k in want){if(want[k]!==!!RAW.held[k])rawInput(k,want[k]);dp.querySelector(`[data-d=${k}]`).classList.toggle('on',want[k])}};
  const end=()=>{for(const k of['left','right','up','down']){if(RAW.held[k])rawInput(k,false);dp.querySelector(`[data-d=${k}]`).classList.remove('on')}};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);set(e)});dp.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')set(e)});
  dp.addEventListener('pointerup',end);dp.addEventListener('pointercancel',end);
  for(const[id,b]of[['bA','a'],['bB','b'],['bS','start']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');rawInput(b,true)});
    const up=()=>{el.classList.remove('on');rawInput(b,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}})();
/* menus: a repeat when a direction is held */
const REP={};function menuDir(){for(const d of['up','down','left','right']){if(RAW.tap[d]){REP[d]=performance.now()+300;return d}
    if(RAW.held[d]&&REP[d]&&performance.now()>REP[d]){REP[d]=performance.now()+95;return d}}return null}

/* ================= saving: every second, on this device and (on the ZigaPlay) to your account =================
   The Claude app can clear this device's storage when it closes; the account copy is what comes back then. */
const SAVE=Object.assign({at:0,step:0,beaten:{},met:{},best:{},timing:1,fight:null,done:false},store.get('save',{}));
const acct=()=>{try{return ZP&&ZP.cloud||null}catch(e){return null}};
let saveHook=null;
function saveNow(flush){if(saveHook)saveHook();SAVE.at=Date.now();store.set('save',SAVE);const c=acct();if(c)try{c.save('haymaker',JSON.stringify(SAVE),{at:SAVE.at},'progress');if(flush)c.flush('haymaker')}catch(e){}}
async function loadAccount(apply){const c=acct();if(!c)return;try{const r=await c.load('haymaker','progress');if(!r||!r.ok||!r.json)return;const d=JSON.parse(r.json);if((d.at||0)>(SAVE.at||0)){Object.assign(SAVE,d);store.set('save',SAVE);apply&&apply()}}catch(e){}}

/* ================= the soundtrack =================
   A small synth band: kick, snare, hats, a filtered bass, warm pads, a plucked arpeggio and a lead with vibrato and
   echo. Each song is a key, a tempo, a chord progression and drum and bass patterns; its melody is a short motif
   written over the chords from the song's seed. Every ring has its own fight song; the menus and story are softer. */
const SONGS={
  title:{bpm:100,root:50,prog:[0,5,3,4],k:'x.......x.x.....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...0.0.5...0...',arp:'A',lead:.7,seed:4,soft:1},
  story:{bpm:84,root:53,prog:[0,3,5,4],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0.......5...0...',arp:'A',lead:.45,seed:9,soft:1},
  corner:{bpm:90,root:57,prog:[0,5,2,6],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0...0...5...0...',arp:'A',lead:.4,seed:51,soft:1},
  gym:{bpm:112,root:45,prog:[0,6,5,6],k:'x..x..x...x..x..',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',bass:'0..0..0.0..5.1..',arp:'B',lead:1,seed:13},
  pier:{bpm:132,root:52,prog:[0,5,2,6],k:'x...x...x...x...',s:'....x.......x...',h:'.x.x.x.x.x.x.x.x',bass:'0.10.10.0.10.150',arp:'B',lead:1,seed:19},
  chapel:{bpm:98,root:55,prog:[0,3,5,4],k:'x.......x..x....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...5...0...1...',arp:'AB',lead:.9,seed:27},
  ice:{bpm:126,root:49,prog:[0,5,6,4],k:'x.....x...x.....',s:'....x.......x...',h:'x.xxx.xxx.xxx.xx',bass:'0.0.0.0.1.1.5.5.',arp:'AB',lead:1,seed:33},
  roof:{bpm:118,root:54,prog:[0,4,5,4],k:'x..x..x.x..x..x.',s:'....x.......x.x.',h:'x.x.x.xxx.x.x.xx',bass:'0..0..0.5..5..1.',arp:'B',lead:1,seed:37},
  dock:{bpm:104,root:43,prog:[0,6,5,4],k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',bass:'00.000.000.0.11.',arp:'B',lead:1,seed:41},

/* ================= Arcade Ink: drawing people =================
   Heavy ink outlines, two-tone cel shading (a hard shadow on the lower right), a bright rim on the upper left and
   heroic proportions: wide shoulders, big forearms, big gloves. Everything is drawn in ring units into G, which is
   scaled up to the screen's real pixels, so lines stay crisp. */
const INK='#0e0a14',OUT=INK;
/* plain shapes (used by the rings and the map too) */
function E(x,y,rx,ry,c,rot=0){G.fillStyle=c;G.beginPath();G.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);G.fill()}
function EO(x,y,rx,ry,c,o=1,rot=0){E(x,y,rx,ry,c,rot);G.lineWidth=o*1.6;G.strokeStyle=INK;G.beginPath();G.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);G.stroke()}
function RC(x,y,w,h,c){G.fillStyle=c;G.fillRect(x,y,w,h)}
function RCO(x,y,w,h,c,lw=1.6){RC(x,y,w,h,c);G.lineWidth=lw;G.strokeStyle=INK;G.strokeRect(x,y,w,h)}
function PL(pts,c){G.fillStyle=c;G.beginPath();G.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i],pts[i+1]);G.closePath();G.fill()}
function PLO(pts,c,lw=1.8){PL(pts,c);G.lineJoin='round';G.strokeStyle=INK;G.lineWidth=lw;G.stroke()}
function LN(x1,y1,x2,y2,w,c,cap='round'){G.strokeStyle=c;G.lineWidth=w;G.lineCap=cap;G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.stroke()}
function LNO(x1,y1,x2,y2,w,c){LN(x1,y1,x2,y2,w+2.4,INK);LN(x1,y1,x2,y2,w,c)}
function ARC(x,y,r,a0,a1,w,c){G.strokeStyle=c;G.lineWidth=w;G.lineCap='round';G.beginPath();G.arc(x,y,Math.max(.1,r),a0,a1);G.stroke()}
/* ---------- cel shading ----------
   pf(ox,oy) adds a shape's path shifted by (ox,oy). The shape is filled with its colour, a rim of light on the upper
   left (outside the shape shifted down-right), a hard shadow on the lower right (outside the shape shifted up-left),
   then outlined in ink. */
function cel(pf,col,o={}){const sx=o.sx??2.4,sy=o.sy??2.2,rw=o.rw??1.1,lw=o.lw??1.8;
  G.save();G.beginPath();pf(0,0);G.clip();G.fillStyle=col;G.fillRect(-1e4,-1e4,2e4,2e4);
  if(o.rim!==false){G.fillStyle=o.rimCol||shade(col,.42);G.beginPath();G.rect(-1e4,-1e4,2e4,2e4);pf(rw,rw);G.fill('evenodd')}

const pP=pts=>(ox,oy)=>{G.moveTo(pts[0]+ox,pts[1]+oy);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i]+ox,pts[i+1]+oy);G.closePath()};
/* a limb: a tapered capsule from a (width wa) to b (width wb) */
const pL=(ax,ay,bx_,by,wa,wb)=>(ox,oy)=>{const n=Math.atan2(by-ay,bx_-ax)+Math.PI/2,c=Math.cos(n),s=Math.sin(n),AX=ax+ox,AY=ay+oy,BX=bx_+ox,BY=by+oy;

function rain(t){G.globalAlpha=.45;G.strokeStyle='#9ad8ff';G.lineWidth=1;G.beginPath();for(let i=0;i<70;i++){const x=(hash(i)*BW*1.3+t*60)%(BW*1.3)-BW*.15,y=(hash(i+9)*BH+t*260)%BH;G.moveTo(x,y);G.lineTo(x-3,y+8)}G.stroke();G.globalAlpha=1}

/* ---------- effects in the ring (ring pixels) ---------- */
const FX=[];
function fx(k,x,y,o={}){FX.push(Object.assign({k,x,y,t:0,life:.5,vx:0,vy:0},o))}
function burst(x,y,n,col,sp=60){for(let i=0;i<n;i++){const a=rnd()*TAU,v=sp*(.4+rnd()*.8);fx('dot',x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,life:.35+rnd()*.3,c:col})}}

function drawFxRing(){for(const f of FX){const k=f.t/f.life;

const PB=document.createElement('canvas');PB.width=PB.height=288;const pbx=PB.getContext('2d');

function drawScene(venue,t,opp,player,o={}){G=bx;bx.setTransform(R,0,0,R,0,0);bx.clearRect(0,0,BW,BH);

/* ================= the fight =================
   The opponent throws a combo: arrows slide along the lane to the ring on the left, and each punch lands as its
   arrow reaches the ring. Press that way on the D-pad to slip it (U leans back, D ducks). Slip the whole combo and he
   is open: your punches (A, B, A+B together) slide in the same way; hit each on the ring. Miss one and he
   recovers and starts his combo again. Get hit and he resets. Three rounds of 90 seconds. */
const ROUND_T=90;
const TIMING=[{n:'EASY',w:1.4,b:1.14},{n:'NORMAL',w:1,b:1},{n:'HARD',w:.8,b:.9}];
const TIM=()=>TIMING[clamp(SAVE.timing|0,0,2)];
const DIRS={left:'L',right:'R',up:'U',down:'D'};
let F=null;
function newFight(oi,o={}){const op=OPP[oi],r=o.resume;FX.length=0;
  F={oi,op,id:op.id,venue:op.venue,story:!!o.story,from:o.from||(o.story?'map':'circuit'),rd:r?r.rd:1,tleft:r?r.tleft:ROUND_T,php:r?r.php:100,ohp:r?r.ohp:100,pkd:r?r.pkd:0,okd:r?r.okd:0,
    clk:0,ph:'intro',p0:0,toks:[],lastPat:'',next:0,until:0,sched:[],
    O:{hitT:-9,side:0,big:false,blockT:-9,sayT:-9,say:'',dazeT:-9},P:{dodge:null,punch:null,hurtT:-9},
    stats:Object.assign({taken:0,takenD:0,dealt:0,perfect:0,combos:0,dodges:0,miss:0,time:0},r?r.stats:{}),
    pops:[],msg:null,shake:0,flash:0,count:0,mash:0,need:0,upAt:0,res:null,tutor:o.story&&op.id==='gus'};
  SAVE.met[op.id]=1;startIntro()}
/* the opponent's numbers now: a mad Sable is faster; every knockdown makes anyone a little quicker */
function eff(){const o=F.op,r=o.rage&&F.okd>=2?o.rage:{},T=TIM(),q=1-.04*F.okd;
  return{beat:(r.beat||o.beat)*T.b*q,win:(r.win||o.win)*T.w,cbeat:(r.cbeat||o.cbeat)*T.b,counters:r.counters||o.counters,freeze:!!(r.freeze||o.freeze),rage:!!r.beat}}
function at(dt,fn){F.sched.push({t:F.clk+dt,fn})}
function pop(s,c='#fff'){F.pops.push({s,c,t:F.clk})}
function banner(s,d=1.2,c='#ffd84a'){F.msg={s,t:F.clk,d,c}}

/* ---------- phases ---------- */
function startIntro(){F.ph='intro';F.p0=F.clk;F.toks=[];banner('ROUND '+F.rd,1.25,'#fff');at(.25,()=>{SFX.bell(1);SFX.crowd(.12,1.6);RUMBLE.bell()});at(1.3,()=>{banner('FIGHT!',.7);SFX.crowd(.16,1)});at(2,()=>startNeutral(true))}
function startNeutral(short){F.ph='neutral';F.p0=F.clk;const[a,b]=F.op.wait;F.next=F.clk+rr(a,b)*(short?.55:1)*TIM().b*(eff().rage?.75:1);
  if(rnd()<.28&&F.clk-F.O.sayT>5){F.O.say=pick(F.op.taunts);F.O.sayT=F.clk}}
function parsePat(str,beat,t0){const out=[];let t=t0,i=0;for(const it of str.split(' ')){if(it==='.'){t+=beat;continue}const fake=it[0]==='*';out.push({k:'d',d:it.replace('*',''),t,fake,st:0,i:i++});t+=beat}return out}
function parseCombo(str,beat,t0){const out=[];let t=t0;for(const it of str.split(' ')){const sub=it.split(',');sub.forEach((s,j)=>out.push({k:'c',b:s==='A+B'?'AB':s,t:t+j*beat/2,st:0}));t+=beat}return out}
function startDefend(quick){const e=eff(),o=F.op;let str;
  if(quick)str=pick(['L','R','D']);
  else{const tier=clamp(F.rd-1+F.okd,0,o.pats.length-1);for(let k=0;k<4;k++){const pool=rnd()<.7||tier===0?o.pats[tier]:o.pats[tier-1];str=pick(pool);if(str!==F.lastPat)break}F.lastPat=str}
  const lead=quick?.8:clamp(e.beat*2.7,1.2,1.75)*TIM().b;F.toks=parsePat(str,e.beat,F.clk+lead);for(const t of F.toks){t.lead=lead;t.frz=e.freeze&&!quick}
  F.ph='defend';F.p0=F.clk;if(quick){pop('TOO GREEDY!','#ff6a5a')}}
function startCounter(){const e=eff();F.toks=parseCombo(pick(e.counters),e.cbeat,F.clk+1.1*TIM().b);for(const t of F.toks)t.lead=1.1*TIM().b;
  F.ph='counter';F.p0=F.clk;F.O.dazeT=F.clk;pop('OPEN!','#7dff9a');SFX.crowd(.08,.8)}
function startRecover(d){F.ph='recover';F.p0=F.clk;F.until=F.clk+d}
function clearToks(){for(const t of F.toks)if(t.st===0)t.st=3}

/* ---------- your presses, judged at the moment they happened ---------- */
function fightPress(btn,tp){const ph=F.ph;
  if(DIRS[btn]){const d=DIRS[btn];if(['neutral','defend','recover','stagger','block','counter'].includes(ph)){F.P.dodge={d,t:tp};SFX.whoosh()}
    if(ph==='defend')judgeDodge(d,tp);return}
  if(btn==='a'||btn==='b'){
    if(ph==='pdown'){F.mash++;SFX.blip();RUMBLE.mash();return}
    if(ph==='counter'){judgePunch(btn.toUpperCase(),tp);return}
    if(ph==='neutral'){F.P.punch={b:btn.toUpperCase(),t:tp,blocked:true};F.O.blockT=tp;SFX.block();RUMBLE.block();if(F.op.punish&&rnd()<.65)startDefend(true)}}}
function judgeDodge(d,tp){const n=F.toks.find(k=>k.k==='d'&&k.st===0);if(!n)return;const e=eff();
  if(n.fake){failD(n,'FAKED!');return}
  if(tp<n.t-e.win){failD(n,'EARLY!');return}
  if(d!==n.d){failD(n,'WRONG WAY');return}
  n.st=1;n.pt=tp;n.perf=Math.abs(tp-n.t)<e.win*.38;F.stats.dodges++;if(n.perf){F.stats.perfect++;pop('PERFECT','#7ae8ff');SFX.perfect();RUMBLE.perfect()}else{RUMBLE.dodge();pop(['SLIP!','SLIP!','DUCK!','LEAN!'][['L','R','D','U'].indexOf(n.d)],'#7dff9a');SFX.ok()}}
function failD(n,why){n.st=2;n.why=why;pop(why,'#ff5a5a');SFX.miss()}
function judgePunch(b,tp){const n=F.toks.find(k=>k.k==='c'&&k.st===0);if(!n)return;const W=.21*TIM().w;
  if(n.half){if(b!==n.half.b&&tp-n.half.t<=.15)landPunch(n,(tp+n.half.t)/2);else failC(n,'TOGETHER!');return}
  if(tp<n.t-W){failC(n,'EARLY!');return}
  if(n.b==='AB'){n.half={b,t:tp};return}
  if(b!==n.b){failC(n,'WRONG!');return}
  landPunch(n,tp)}
function landPunch(n,tp){const o=F.op;n.st=1;const perf=Math.abs(tp-n.t)<.075*TIM().w,dmg={A:5,B:6,AB:11}[n.b]*(perf?1.3:1)*o.def;
  F.ohp-=dmg;F.stats.dealt+=dmg;if(perf)F.stats.perfect++;
  F.P.punch={b:n.b,t:F.clk};F.O.hitT=F.clk;F.O.side=n.b==='A'?1:n.b==='B'?-1:0;F.O.big=n.b==='AB';
  if(n.b==='AB'){SFX.hay();F.shake=5;RUMBLE.hay()}else{(n.b==='A'?SFX.jab:SFX.cross)();(n.b==='A'?RUMBLE.jab:RUMBLE.cross)()}
  const hx=BW/2+(F.O.side*4),hy=BH-OPP_Y-(PEOPLE[F.id].build.h+PEOPLE[F.id].build.r*1.15)*PEOPLE[F.id].build.s*OSC;
  burst(hx,hy,n.b==='AB'?14:7,'#fff',n.b==='AB'?90:60);fx('splash',hx-F.O.side*4,hy,{r:n.b==='AB'?20:12,life:.32,c:n.b==='AB'?'#ffd84a':n.b==='A'?'#3ee8ff':'#ff3ea5',seed:Math.floor(F.clk*10)});
  pop(perf?'PERFECT':n.b==='AB'?'HAYMAKER!':n.b==='A'?'JAB!':'CROSS!',perf?'#7ae8ff':n.b==='AB'?'#ffd84a':'#fff');
  if(F.ohp<=0){startODown();return}
  if(F.toks.every(k=>k.k!=='c'||k.st===1)){const bonus=8*o.def;F.ohp-=bonus;F.stats.dealt+=bonus;F.stats.combos++;banner('COMBO!',.8,'#7dff9a');SFX.combo();setTimeout(RUMBLE.combo,120);SFX.crowd(.16,1.2);
    if(F.ohp<=0){startODown();return}F.ph='stagger';F.p0=F.clk;F.until=F.clk+.9}}
function failC(n,why){n.st=2;n.why=why;clearToks();pop(why,'#ff5a5a');SFX.block();RUMBLE.block();F.O.blockT=F.clk;F.stats.miss++;F.ph='block';F.p0=F.clk;F.until=F.clk+.55}
function playerHit(n){n.landed=true;const o=F.op,dmg=o.dmg*(n.fake?.6:1)*(TIM().w>1?.85:1);
  F.php-=dmg;F.stats.taken++;F.stats.takenD+=dmg;F.P.hurtT=F.clk;F.shake=7;F.flash=1;SFX.hurt();RUMBLE.hurt();
  burst(BW/2,BH-PL_Y-33,10,'#ffe0a0',80);fx('splash',BW/2,BH-PL_Y-46,{r:24,life:.34,c:'#ff3a2a',c2:'#ffd84a',seed:Math.floor(F.clk*10)});clearToks();
  if(F.php<=0){startPDown();return}
  startRecover(.85)}
/* ---------- knockdowns ---------- */
function startODown(){const o=F.op;F.okd++;clearToks();F.ph='odown';F.p0=F.clk;F.count=0;F.ohp=0;banner('DOWN!',1.2,'#ffd84a');SFX.fall();SFX.crowd(.22,2);RUMBLE.odown();
  const final=F.okd>=o.kds;F.upAt=final?99:Math.min(9,Math.floor(rr(o.up[0],o.up[1]+1))+F.okd-1);
  const tick=()=>{if(F.ph!=='odown')return;F.count++;SFX.count();RUMBLE.count();if(F.count>=F.upAt&&F.count<10){F.ph='oup';F.p0=F.clk;at(.9,()=>{F.ohp=[72,52,34][Math.min(2,F.okd-1)];if(eff().rage&&F.okd===2){banner('SABLE IS FURIOUS!',1.4,'#ff5a5a');F.O.say='Enough games!';F.O.sayT=F.clk}startNeutral()});return}
    if(F.count>=10){F.ph='ko';F.p0=F.clk;banner('K.O.!',2.4,'#ff5a5a');SFX.ko();RUMBLE.ko();SFX.crowd(.3,2.5);at(2.4,()=>finishFight(true,'KNOCKOUT'));return}at(.72,tick)};
  at(1.1,tick)}
function startPDown(){F.pkd++;clearToks();F.ph='pdown';F.p0=F.clk;F.count=0;F.php=0;F.mash=0;F.need=10+7*(F.pkd-1);banner('YOU\'RE DOWN!',1.2,'#ff5a5a');SFX.fall();RUMBLE.pdown();
  if(F.pkd>=3){at(1.6,()=>{F.ph='pko';banner('T.K.O.',2,'#ff5a5a');SFX.ko();at(2,()=>finishFight(false,'TKO'))});return}
  const tick=()=>{if(F.ph!=='pdown')return;F.count++;SFX.count();RUMBLE.count();if(F.count>=10){F.ph='pko';banner('K.O.',2,'#ff5a5a');SFX.ko();at(2,()=>finishFight(false,'KNOCKOUT'));return}at(.85,tick)};at(1.1,tick)}
/* ---------- rounds ---------- */
function endRound(){F.ph='bell';F.p0=F.clk;clearToks();SFX.bell(2);RUMBLE.bell();SFX.crowd(.14,1.4);banner(F.rd<3?'END OF ROUND '+F.rd:'FINAL BELL',1.6,'#fff');
  at(1.8,()=>{if(F.rd<3){go('corner')}else decision()})}
function decision(){const you=F.stats.dealt+30*F.okd,them=F.stats.takenD+30*F.pkd,win=you>them;banner('DECISION...',1.2,'#fff');at(1.4,()=>finishFight(win,win?'DECISION':'DECISION LOSS'))}
function nextRound(){F.rd++;F.tleft=ROUND_T;F.php=Math.min(100,F.php+28);F.ohp=Math.min(100,F.ohp+10);startIntro()}
function finishFight(win,how){const st=F.stats,stars=win?(st.taken<=1?3:st.taken<=4?2:1):0;F.res={win,how,stars,time:st.time};
  SAVE.fight=null;if(win){const b=SAVE.best[F.id]||{};SAVE.best[F.id]={stars:Math.max(b.stars||0,stars),time:Math.min(b.time||1e9,st.time),wins:(b.wins||0)+1};SAVE.beaten[F.id]=1;if(F.story)SAVE.step++}
  (win?SFX.win:SFX.lose)();(win?RUMBLE.win:RUMBLE.lose)();saveNow(true);go('result')}

/* ---------- each frame ---------- */
function fightTick(dt){const now=performance.now();F.clk+=dt;
  for(const p of PRESSES)fightPress(p.b,F.clk-(now-p.at)/1000);
  for(let i=0;i<F.sched.length;i++){const s=F.sched[i];if(F.clk>=s.t){F.sched.splice(i--,1);s.fn()}}
  const ph=F.ph,active=['neutral','defend','counter','recover','stagger','block'].includes(ph);
  if(active){F.tleft-=dt;F.stats.time+=dt}
  if(ph==='neutral'&&F.clk>=F.next){if(F.tleft<=0)endRound();else startDefend()}
  else if(ph==='defend'){const e=eff(),g=.07*TIM().w;
    for(const n of F.toks){if(n.k!=='d')continue;
      if(n.st===0&&F.clk>n.t+g){if(n.fake){n.st=1;pop('READ IT!','#7ae8ff')}else failD(n,'MISS')}
      if(n.st===2&&!n.landed&&F.clk>=n.t){playerHit(n);break}}
    if(F.ph==='defend'&&F.toks.length&&F.toks.every(n=>n.st===1)&&F.clk>F.toks[F.toks.length-1].t+.14)startCounter()}
  else if(ph==='counter'){const n=F.toks.find(k=>k.k==='c'&&k.st===0),W=.21*TIM().w;
    if(n){if(n.half&&F.clk-n.half.t>.15)failC(n,'TOGETHER!');else if(!n.half&&F.clk>n.t+W)failC(n,'MISS')}}
  else if(ph==='recover'||ph==='stagger'){if(F.clk>=F.until){if(F.tleft<=0)endRound();else startNeutral(ph==='stagger')}}
  else if(ph==='block'){if(F.clk>=F.until){if(F.tleft<=0)endRound();else startDefend()}}
  else if(ph==='pdown'&&F.mash>=F.need){F.ph='pup';F.p0=F.clk;banner('BACK UP!',.9,'#7dff9a');RUMBLE.up();SFX.crowd(.18,1.2);at(.8,()=>{F.php=[60,40][Math.min(1,F.pkd-1)];startNeutral()})}
  F.toks=F.toks.filter(n=>F.clk<n.t+.6);
  F.pops=F.pops.filter(p=>F.clk-p.t<.7);
  if(F.shake>0)F.shake=Math.max(0,F.shake-dt*30);if(F.flash>0)F.flash=Math.max(0,F.flash-dt*3);
  fxTick(dt)}

/* ---------- poses ---------- */
const mix=(a,b,k)=>({x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),z:lerp(a.z,b.z,k)});
function punchGlove(kind,side,a,W,H,fake){const guard={x:side*W*.5,y:-H+9,z:1},tgt={x:0,y:20,z:2.3};
  const wind=kind==='hook'?{x:side*W*1.02,y:-H+2,z:.95}:kind==='str'?{x:side*W*.55,y:-H-6,z:.9}:{x:side*W*.3,y:-H*.32,z:1};
  if(a<-.34)return guard;if(a<-.12)return mix(guard,wind,ease((a+.34)/.22));
  if(fake)return a<.1?mix(wind,guard,ease((a+.12)/.22)*.4):mix(wind,guard,ease((a-.1)/.2));
  if(a<=0){const k=(a+.12)/.12;if(kind==='hook'){const c={x:side*W*1.25,y:-H*.15,z:1.4},u=1-k;return{x:u*u*wind.x+2*u*k*c.x+k*k*tgt.x,y:u*u*wind.y+2*u*k*c.y+k*k*tgt.y,z:lerp(wind.z,tgt.z,k*k)}}return mix(wind,tgt,k*k)}
  if(a<.26)return mix(tgt,guard,ease(a/.26));return guard}
function oppPose(){const p=PEOPLE[F.id],b=p.build,W=b.w,H=b.h,c=F.clk,ph=F.ph;

  ctx.restore();
  F.pops.forEach((p,i)=>{const k=(F.clk-p.t)/.7;ctx.globalAlpha=1-k*k;text(p.s,L.x+L.w*.42,L.y+L.h+3*U-k*8*U,11,p.c,'center','#0e0a14');ctx.globalAlpha=1})}
function bar(x,y,w,h,v,col,right){rrect(x,y,w,h,3*U);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fill();const f=clamp(v/100,0,1),ww=(w-4*U)*f;if(ww>0){rrect(right?x+w-2*U-ww:x+2*U,y+2*U,ww,h-4*U,2*U);ctx.fillStyle=col;ctx.fill()}rrect(x,y,w,h,3*U);ctx.lineWidth=1.5*U;ctx.strokeStyle='#fff';ctx.stroke()}
const hpCol=v=>v>55?'#5ae06a':v>28?'#f2c14e':'#ff4a4a';
function fightHud(){const w=SW*.36,y=6*U;text('MILO',8*U,y,9,'#fff','left','#000',700);bar(8*U,y+12*U,w,10*U,F.php,hpCol(F.php));
  const nm=PEOPLE[F.id].name.split(' ').slice(-1)[0];text(nm,SW-8*U,y,9,'#fff','right','#000',700);bar(SW-8*U-w,y+12*U,w,10*U,F.ohp,hpCol(F.ohp),true);
  for(let i=0;i<F.pkd;i++)text('✕',8*U+w-8*U-i*9*U,y,8,'#ff5a5a','left','#000');for(let i=0;i<F.okd;i++)text('★',SW-8*U-w+i*9*U,y,8,'#ffd84a','left','#000');
  panel(SW/2-22*U,y,44*U,24*U,'rgba(10,8,20,.85)','#f2c14e',5);text('R'+F.rd,SW/2,y+2*U,8,'#ffd84a','center');text(fmtT(F.tleft),SW/2,y+11*U,10,F.tleft<10?'#ff5a5a':'#fff','center',null,700)}
function fightDraw(){const op=oppPose(),pp=playerPose();drawScene(F.venue,TT,{id:F.id,pose:op},pp);const sh=F.shake;blit(sh?(rnd()-.5)*sh:0,sh?(rnd()-.5)*sh:0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(F.flash>0){const g=ctx.createRadialGradient(SW/2,SH*.6,SH*.15,SW/2,SH*.6,SH*.75);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(255,20,20,${.55*F.flash})`);ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH)}
  if(['pdown','pko'].includes(F.ph)){ctx.fillStyle=`rgba(0,0,0,${Math.min(.45,(F.clk-F.p0)*.5)})`;ctx.fillRect(0,0,SW,SH)}
  fightHud();if(['defend','counter','neutral','recover','stagger','block'].includes(F.ph))drawLane();
  /* the opponent talks */
  if(F.clk-F.O.sayT<1.8&&F.O.say){const b=PEOPLE[F.id].build,hx=BW/2*PS,hy=(BH-OPP_Y-(b.h+b.r*2.2)*b.s*OSC)*PS,w=Math.min(SW*.5,tw(F.O.say,9)+16*U),lines=wrap(F.O.say,w-12*U,9),h=lines.length*12*U+10*U,x=Math.min(SW-w-6*U,hx+18*U),y=Math.max(76*U,hy-h);
    panel(x,y,w,h,'#fff','#120c14',6);lines.forEach((l,i)=>textB(l,x+w/2,y+5*U+i*12*U,9,'#120c14','center',null,700))}
  if(F.msg){const k=(F.clk-F.msg.t)/F.msg.d;if(k<1){const sc=k<.12?.6+k/.12*.4:1;ctx.globalAlpha=k>.8?(1-k)/.2:1;ctx.save();ctx.translate(SW/2,SH*.4);ctx.scale(sc,sc);const big=F.msg.s.length<=10;if(F.msg.s.length<=14)splashUI(0,(big?18:12)*U,(big?52:44)*U+F.msg.s.length*3*U,F.msg.c==='#fff'?'#7a3ab0':F.msg.c==='#ff5a5a'?'#2a0c14':'#c8263a',F.msg.s.length);
    text(F.msg.s,0,0,big?30:20,F.msg.c,'center','#0e0a14');ctx.restore();ctx.globalAlpha=1}}
  if(['odown','pdown'].includes(F.ph)&&F.count>0){text(String(F.count),SW/2,SH*.48,44,'#fff','center','#2a0c0c',700)}
  if(F.ph==='pdown'){const w=SW*.6,x=SW/2-w/2,y=SH*.66;text('MASH A + B TO GET UP!',SW/2,y-18*U,11,'#ffd84a','center','#000',700);bar(x,y,w,12*U,F.mash/F.need*100,'#7dff9a')}
  if(F.tutor&&F.okd===0){const s=F.ph==='defend'?'Press the arrow\'s way as it reaches the ring':F.ph==='counter'?'Press A / B as each reaches the ring (A+B: both at once)':F.ph==='neutral'?'Wait for his combo...':'';if(s){const lines=wrap(s,SW*.8,9);lines.forEach((l,i)=>textB(l,SW/2,LANE().y+LANE().h+14*U+i*12*U,9,'#fff','center','#000',700))}}}

/* ---------- pause ---------- */
function pauseTick(){menuNav(3);if(TAP('start')||TAP('b')){go('fight');return}if(TAP('a')){SFX.pick();if(MSEL===0)go('fight');else if(MSEL===1){BACKTO='pause';HOW=0;go('howto')}else{saveNow(true);F=null;if(HUB==='map')go('map');else go('title')}}}
function pauseDraw(){fightDraw();dimAll(.6);text('PAUSED',SW/2,SH*.26,24,'#fff','center','#0e0a14');drawMenu(['RESUME','HOW TO PLAY','QUIT (SAVES THIS ROUND)'],SW/2,SH*.4,12,22*U);help('A SELECT · START RESUME')}

/* ---------- the corner between rounds ---------- */
function cornerTick(){if(TAP('a')||TAP('start')){SFX.pick();nextRound();go('fight')}}
function cornerDraw(){drawScene(F.venue,TT,null,null,{dim:.55});blit();ctx.setTransform(DPR,0,0,DPR,0,0);
  text('CORNER · AFTER ROUND '+F.rd,SW/2,14*U,11,'#ffd84a','center','#000',700);const ps=Math.min(SW*.5,SH*.32);portrait('dot','neutral',SW/2-ps/2,34*U,ps,'#2a2440');
  const y=34*U+ps+10*U,tip=F.op.tips[Math.min(F.op.tips.length-1,F.rd-1)],lines=wrap('"'+tip+'"',SW*.78,11);panel(SW*.06,y,SW*.88,lines.length*15*U+16*U);lines.forEach((l,i)=>textB(l,SW/2,y+8*U+i*15*U,11,'#fff','center',null,600));
  const y2=y+lines.length*15*U+28*U,st=F.stats;[['YOUR HEALTH',Math.round(Math.min(100,F.php+28))+' (+28)'],['PUNCHES LANDED',Math.round(st.dealt)+' dmg'],['DODGES',st.dodges],['KNOCKDOWNS',F.okd+' – '+F.pkd]].forEach(([a,b],i)=>{text(a,SW*.12,y2+i*14*U,9,'#a8a0c8');text(String(b),SW*.88,y2+i*14*U,9,'#fff','right')});
  help('A NEXT ROUND')}

/* ---------- results ---------- */
function resultTick(){const r=F.res;if(TAP('a')||TAP('start')){SFX.pick();if(r.win){const st=F.story,fr=F.from;F=null;if(st)advanceStory();else if(fr==='map')go('map');else go('circuit')}else{const oi=F.oi,s=F.story,fr=F.from;newFight(oi,{story:s,from:fr});go('fight')}}
  else if(TAP('b')){SFX.back();const fr=F.from;F=null;if(fr==='map'||HUB==='map')go('map');else go('title')}}
function resultDraw(){const r=F.res;drawScene(F.venue,TT,{id:F.id,pose:oppPose()},r.win?playerPose():null,{dim:.5});blit();ctx.setTransform(DPR,0,0,DPR,0,0);
  text(r.win?'YOU WIN!':'YOU LOST',SW/2,SH*.12,30,r.win?'#ffd84a':'#ff5a5a','center','#2a0c0c',700);text(r.how,SW/2,SH*.12+38*U,12,'#fff','center','#000',700);
  if(r.win){text('★'.repeat(r.stars)+'☆'.repeat(3-r.stars),SW/2,SH*.12+58*U,22,'#ffd84a','center','#000')}
  const st=F.stats,y=SH*.42;panel(SW*.1,y,SW*.8,5*15*U+14*U);[['TIME',fmtT(st.time)],['DODGES',st.dodges],['PERFECTS',st.perfect],['COMBOS',st.combos],['HITS TAKEN',st.taken]].forEach(([a,b],i)=>{text(a,SW*.15,y+8*U+i*15*U,10,'#a8a0c8');text(String(b),SW*.85,y+8*U+i*15*U,10,'#fff','right')});
  help(r.win?(F.story?'A continue':F.from==='map'?'A back to the city':'A circuit · B title'):'A try again · B '+(F.from==='map'||HUB==='map'?'back to the city':'title'))}

/* ---------- the circuit: rematches ---------- */
function circuitTick(){const n=OPP.length;menuNav(n+1);if(TAP('b')){SFX.back();backToHub('circ');return}
  if(TAP('a')){if(MSEL===n){SFX.back();backToHub('circ');return}const o=OPP[MSEL];if(!SAVE.met[o.id]&&!SAVE.done){SFX.back();toast('MEET THEM IN THE STORY FIRST');return}SFX.pick();CARD={oi:MSEL,story:false,from:HUB==='map'?'map':'circuit'};go('card')}}
function circuitDraw(){drawScene('gym',TT,null,null,{dim:.6});blit();ctx.setTransform(DPR,0,0,DPR,0,0);text('THE CIRCUIT',SW/2,10*U,16,'#ffd84a','center','#000',700);textB('Rematch anyone you have met',SW/2,30*U,8,'#c8c0e0','center');
  const rh=Math.min(44*U,(SH-90*U)/(OPP.length+1)),y0=44*U;
  OPP.forEach((o,i)=>{const y=y0+i*rh,on=i===MSEL,known=SAVE.met[o.id]||SAVE.done;rrect(10*U,y,SW-20*U,rh-4*U,6*U);ctx.fillStyle=on?'rgba(255,216,74,.2)':'rgba(10,8,20,.7)';ctx.fill();if(on){ctx.lineWidth=2*U;ctx.strokeStyle='#ffd84a';ctx.stroke()}
    const ps=rh-8*U;if(known)portrait(o.p,'guard',14*U,y+2*U,ps,'#2a2440');else{rrect(14*U,y+2*U,ps,ps,4*U);ctx.fillStyle='#1a1424';ctx.fill();text('?',14*U+ps/2,y+ps/2-6*U,12,'#5a4a7a','center')}
    text(known?PEOPLE[o.p].name:'???',20*U+ps,y+4*U,10,known?'#fff':'#5a4a7a','left',null,700);text(known?VENUES[o.venue].name:'',20*U+ps,y+17*U,7,'#a8a0c8');
    const b=SAVE.best[o.id];if(b)text('★'.repeat(b.stars)+'☆'.repeat(3-b.stars),SW-16*U,y+6*U,10,'#ffd84a','right')});
  const by=y0+OPP.length*rh;text((MSEL===OPP.length?'▸ ':'')+'BACK',SW/2,by+2*U,11,MSEL===OPP.length?'#ffd84a':'#e8e2d0','center','#000',700);help('A FIGHT · B BACK')}

/* ---------- how to play ---------- */
let HOW=0;const HOWS=[
  ['DODGE','Your opponent\'s punches slide along the lane at the top as red arrows. Press that way on the D-pad just as each arrow reaches the ring on the left.\n◀ ▶ slip left or right · ▼ duck · ▲ lean back.\nToo early, the wrong way or too late, and you eat the punch.'],
  ['PUNCH','Slip his whole combo and he\'s OPEN. Your punches slide in: A is your left jab, B your right cross, A+B (both together) is the haymaker. Hit each one as it reaches the ring.\nMiss one and he blocks and starts his combo again. Land them all for a COMBO bonus.'],
  ['TRICKS','Hollow blinking arrows are FAKES: don\'t move. Frozen arrows hide halfway: remember the pattern. Don\'t throw punches while he waits; some fighters punish greed.\nKnocked down? Mash A and B to get up. Three rounds of 90 seconds; knock him down enough times and it\'s a K.O.']];
function howtoTick(){const d=menuDir();if(d==='left'&&HOW>0){HOW--;SFX.move()}else if(d==='right'&&HOW<HOWS.length-1){HOW++;SFX.move()}else if(TAP('a')){if(HOW<HOWS.length-1){HOW++;SFX.move()}else{SFX.back();howBack()}}else if(TAP('b')||TAP('start')){SFX.back();howBack()}}
function howBack(){if(BACKTO==='title')go('title',titleIdx('how'));else if(BACKTO==='mappause')go('mappause',MPAUSE.findIndex(x=>x[1]==='how'));else go(BACKTO,1)}
function howtoDraw(){drawScene('gym',TT,null,null,{dim:.62});blit();ctx.setTransform(DPR,0,0,DPR,0,0);const[h,s]=HOWS[HOW];text('HOW TO PLAY · '+(HOW+1)+'/'+HOWS.length,SW/2,12*U,9,'#ffd84a','center','#000');text(h,SW/2,28*U,22,'#fff','center','#2a0c0c',700);
  /* a sample lane */
  const L={x:16*U,y:62*U,w:SW-32*U,h:30*U},cy=L.y+15*U,r=11*U;rrect(L.x,L.y,L.w,L.h,15*U);ctx.fillStyle='rgba(8,6,16,.8)';ctx.fill();ctx.lineWidth=2*U;ctx.strokeStyle=HOW===1?'#7dff9a':'#ff5a5a';ctx.stroke();circ(L.x+22*U,cy,r+3*U,null,'#fff',2);
  const items=HOW===0?['R','R','D','U']:HOW===1?['A','AB','B','B']:['*R','R','?','L'];items.forEach((it,i)=>{const x=L.x+22*U+(i+.6)*(L.w-50*U)/4;
    if(HOW===1){if(it==='AB'){rrect(x-r*1.9,cy-r,r*3.8,r*2,r);ctx.fillStyle='#c8263a';ctx.fill();ctx.lineWidth=4*U;ctx.strokeStyle='#0e0a14';ctx.stroke();text('A+B',x,cy-7*U,11,'#fff','center','#0e0a14')}else{circ(x,cy,r,it==='A'?'#c8263a':'#d8961a','#fff',2);text(it,x,cy-6.5*U,12,'#fff','center',null,700)}}
    else if(it==='?'){circ(x,cy,r,'rgba(190,232,255,.9)','#fff',2);text('?',x,cy-6*U,11,'#5a8ab0','center',null,700)}
    else if(it[0]==='*'){ctx.setLineDash([3*U,3*U]);circ(x,cy,r,null,'#b8b0c8',2);ctx.setLineDash([]);arrowGlyph(x,cy,r,it[1],'#b8b0c8')}else{circ(x,cy,r,'#3a0c14','#ff5a5a',2);arrowGlyph(x,cy,r*1.05,it,'#fff')}});
  const lines=wrap(s,SW-36*U,10);lines.forEach((l,i)=>textB(l,18*U,108*U+i*14*U,10,'#fff','left','#000',600));
  help('◀ ▶ PAGE · B BACK')}

/* ---------- settings ---------- */
function setItems(){return['TIMING  '+TIM().n,'SOUND  '+(muted?'OFF':'ON'),'VIBRATION  '+(HAP.on?'ON':'OFF'),'BACK']}
function settingsTick(){const it=setItems();const d=menuNav(it.length),ch=d==='left'?-1:d==='right'?1:TAP('a')?1:0;
  if(TAP('b')||(TAP('a')&&MSEL===3)){SFX.back();saveNow();backToHub('set');return}
  if(ch&&MSEL===0){SAVE.timing=((SAVE.timing|0)+ch+3)%3;SFX.move()}else if(ch&&MSEL===1){setMute(!muted);if(!muted)SFX.pick()}else if(ch&&MSEL===2){HAP.on=!HAP.on;store.set('vib',HAP.on);buzz([30,60,30]);SFX.move()}}
function settingsDraw(){drawScene('gym',TT,null,null,{dim:.62});blit();ctx.setTransform(DPR,0,0,DPR,0,0);text('SETTINGS',SW/2,SH*.14,20,'#fff','center','#000',700);drawMenu(setItems(),SW/2,SH*.3,12,22*U);
  const notes=['EASY: wider timing, slower punches. HARD: tight timing.','',''];if(MSEL===0)wrap(notes[0],SW*.8,9).forEach((l,i)=>textB(l,SW/2,SH*.3+4*22*U+6*U+i*12*U,9,'#c8c0e0','center'));help('◀ ▶ CHANGE · B BACK')}

/* ================= the loop, saving, the console ================= */
const SCREENS={title:[titleTick,titleDraw],story:[storyTick,storyDraw],card:[cardTick,cardDraw],fight:[fightStep,fightDraw],pause:[pauseTick,pauseDraw],
  corner:[cornerTick,cornerDraw],result:[resultTick,resultDraw],circuit:[circuitTick,circuitDraw],howto:[howtoTick,howtoDraw],settings:[settingsTick,settingsDraw],
  map:[mapTick,mapScreenDraw],mappause:[mapPauseTick,mapPauseDraw],citymap:[cityTick,cityDraw],gymmenu:[gymTick,gymDraw],locker:[lockerTick,lockerDraw]};
/* the right song for the screen */
function songFor(){if(['fight','pause','card'].includes(SCR)||(SCR==='howto'&&BACKTO==='pause'))return VENUES[F?F.venue:OPP[CARD?CARD.oi:0].venue].song;
  if(SCR==='corner'||SCR==='locker')return'corner';if(SCR==='story')return'story';if(SCR==='result')return null;if(SCR==='gymmenu')return'gym';
  if(['map','mappause','citymap'].includes(SCR)||HUB==='map'&&['circuit','settings','howto'].includes(SCR))return'city';return'title'}
function step(dt){TT+=dt;const before=SCR;SCREENS[SCR][0](dt);if(MSG&&(MSG.t-=dt)<=0)MSG=null;
  if(AC&&AC.state==='running'){const want=songFor();if(want===null){if(MUS.on)music(false)}else if(!MUS.on||MUS.song!==want)music(true,want)}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';SCREENS[SCR][1]();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(MSG){const w=tw(MSG.s,10,700)+24*U;panel(SW/2-w/2,SH*.5-12*U,w,24*U,'rgba(10,8,20,.92)','#ffd84a',6);text(MSG.s,SW/2,SH*.5-6*U,10,'#ffd84a','center',null,700)}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;step(dt);clearTaps();draw()}
/* ---------- saving ---------- */
saveHook=()=>{if(F&&!F.res&&['fight','pause','corner'].includes(SCR)||(F&&!F.res&&SCR==='howto'&&BACKTO==='pause')){
    SAVE.fight={oi:F.oi,story:F.story,from:F.from,rd:F.rd,tleft:Math.max(15,F.tleft),php:Math.max(25,F.php),ohp:Math.max(20,F.ohp),pkd:F.pkd,okd:F.okd,stats:F.stats}}
  SAVE.mute=muted;SAVE.vib=HAP.on};
function applySave(){applyLook();if(SAVE.mute!=null&&SAVE.mute!==muted)setMute(SAVE.mute);if(SAVE.vib!=null){HAP.on=SAVE.vib;store.set('vib',HAP.on)}}
applySave();loadAccount(applySave);
setInterval(()=>saveNow(),1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SCR==='fight')go('pause');else if(SCR==='map')go('mappause');saveNow(true)}});
addEventListener('pagehide',()=>saveNow(true));
window.ZPCart={title:'Haymaker',input(b,d){rawInput(b,d)},home(){if(SCR==='fight')go('pause');else if(SCR==='map')go('mappause');saveNow(true);return true}};
requestAnimationFrame(loop);
/* a test hook, only when the address asks for it */
if(/hmtest/.test(location.href))window.HMT={get F(){return F},get SCR(){return SCR},get SAVE(){return SAVE},OPP,STORY,newFight,go,step,draw,eff,startDefend,startCounter,fightPress,enterMap,MP,BLD,RINGS,objective,enterDoor,openLocker,LOOK_OPTS,applyLook,get DLG(){return DLG},
  run(n,dt=1/60){for(let i=0;i<n;i++){step(dt);clearTaps()}},press(b,offset=0){PRESSES.push({b,at:performance.now()-offset*1000});RAW.tap[b]=true},advanceStory};

})();
</script>
