<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haymaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
/* Haymaker: a side-view fighting game on one canvas filling the screen, in an Arcade Ink style: the ring and the
   fighters are drawn in ring units scaled to the screen's real pixels; the health bars and menus are drawn on top.
   Outside the ZigaPlay, touch screens get a D-pad and A / B buttons over the bottom corners. */
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#07060c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
html.touch:not(.zp) #pad{display:block}
.pb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,18,34,.55);color:#fff;font:700 16px/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:none;padding:0}
.pb.on{background:rgba(255,120,80,.6)}
#dp{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dp i{position:absolute;width:50px;height:50px;border-radius:10px;background:rgba(20,18,34,.55);border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
#dp i.on{background:rgba(255,120,80,.6)}
#bA{right:max(16px,env(safe-area-inset-right,0px));bottom:62px}#bB{right:max(84px,calc(env(safe-area-inset-right,0px) + 68px));bottom:20px}
#bS{right:max(16px,env(safe-area-inset-right,0px));top:12px;width:44px;height:44px;font-size:13px}
</style>
<canvas id="cv"></canvas>
<div id="pad"><div id="dp"><i data-d="up" style="left:50px;top:0"></i><i data-d="left" style="left:0;top:50px"></i><i data-d="right" style="left:100px;top:50px"></i><i data-d="down" style="left:50px;top:100px"></i></div>
<button class="pb" id="bA">A</button><button class="pb" id="bB">B</button><button class="pb" id="bS">II</button></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,pick=a=>a[Math.floor(rnd()*a.length)],TAU=Math.PI*2;
const rr=(a,b)=>a+rnd()*(b-a),ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t),easeOut=t=>t<=0?0:t>=1?1:1-(1-t)*(1-t);
const store={get(k,d){try{const v=localStorage.getItem('haymaker-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('haymaker-'+k,JSON.stringify(v))}catch(e){}}};
/* the view: the screen in CSS pixels, drawn at up to 2x. The ring is drawn into a small buffer (BW x BH, at least
   180 x 250 "ring pixels") and scaled up by PS with sharp pixels. UI sizes follow U. */
let SW=300,SH=430,DPR=1,U=1,PORT=true,PS=2,BW=180,BH=250,R=2;/* R: real pixels per ring unit */
const BUF=document.createElement('canvas'),bx=BUF.getContext('2d');
let G=bx;/* the context the art functions draw into */
function resize(){DPR=Math.min(2,devicePixelRatio||1);SW=innerWidth||300;SH=innerHeight||430;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);PORT=SH>SW*1.05;
  U=PORT?Math.min(SW/300,SH/440):Math.min(SH/290,SW/470);
  PS=Math.max(1,Math.min(SW/180,SH/250));BW=Math.ceil(SW/PS);BH=Math.ceil(SH/PS);R=PS*DPR;BUF.width=Math.round(BW*R);BUF.height=Math.round(BH*R)}
addEventListener('resize',resize);resize();
/* Arcade Ink type: a comic display face for names, banners and menus; the system face for longer reading */
const FONT_D="'Bangers','Avenir Next Condensed','Impact','Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif";
const FONT_B="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
const font=(px,w=600,fam)=>`${fam==='b'?w:Math.max(w,700)} ${Math.max(7,Math.round(px*U*(fam==='b'?1:1.18)))}px ${fam==='b'?FONT_B:FONT_D}`;
function text(s,x,y,px,col,al='left',out=null,w=600,fam){ctx.font=font(px,w,fam);ctx.textAlign=al;ctx.textBaseline='top';if(fam!=='b')s=String(s).toUpperCase();
  if(out){ctx.lineWidth=Math.max(2.2,px*U*(fam==='b'?.22:.32));ctx.strokeStyle=out;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
const textB=(s,x,y,px,col,al='left',out=null,w=600)=>text(s,x,y,px,col,al,out,w,'b');
function tw(s,px,w=600,fam){ctx.font=font(px,w,fam);return ctx.measureText(fam==='b'?s:String(s).toUpperCase()).width}
function wrap(s,maxW,px,w=600,fam='b'){ctx.font=font(px,w,fam);const out=[];for(const para of String(s).split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=word}else line=t}out.push(line)}return out}
function rrect(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
/* an ink panel: a hard drop shadow, a thick black outline and a coloured inner edge */
function panel(x,y,w,h,fill='rgba(14,10,24,.92)',edge='#f2c14e',r=8){const k=Math.max(2,3*U);rrect(x+k,y+k,w,h,r*U);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fill();
  rrect(x,y,w,h,r*U);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=Math.max(2.4,3.2*U);ctx.strokeStyle='#0e0a14';ctx.stroke();rrect(x+k*.7,y+k*.7,w-k*1.4,h-k*1.4,Math.max(1,r*U-k*.7));ctx.lineWidth=Math.max(1.2,1.6*U);ctx.strokeStyle=edge;ctx.stroke()}
const shade=(c,t)=>{const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};
if(document.fonts&&document.fonts.load){document.fonts.load(`20px 'Bangers'`).catch(()=>{})}

/* ================= sound ================= */
let AC=null,master=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.5;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.1,type='square',v=.2,t0=0,a=.006}){const A=AC;if(!A||muted)return;const t=A.currentTime+t0,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.1,v=.2,f=1200,q=1,t0=0,type='bandpass',f2=null}){const A=AC;if(!A||muted)return;if(!NB){NB=A.createBuffer(1,A.sampleRate*.5,A.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=A.currentTime+t0,s=A.createBufferSource(),bp=A.createBiquadFilter(),g=A.createGain();s.buffer=NB;s.loop=true;bp.type=type;bp.frequency.setValueAtTime(f,t);if(f2)bp.frequency.exponentialRampToValueAtTime(f2,t+d);bp.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  jab(){noise({d:.07,f:900,q:.8,v:.32});tone({f:130,f2:55,d:.09,type:'sine',v:.34})},
  cross(){noise({d:.09,f:700,q:.7,v:.38});tone({f:115,f2:45,d:.12,type:'sine',v:.4})},
  hay(){noise({d:.16,f:500,q:.6,v:.45});tone({f:95,f2:32,d:.22,type:'sine',v:.5});noise({d:.3,f:2600,q:.5,v:.07,t0:.03})},
  whoosh(){noise({d:.15,f:900,f2:2600,q:.9,v:.13})},
  block(){noise({d:.06,f:350,q:1,v:.25});tone({f:90,f2:60,d:.06,type:'sine',v:.18})},
  hurt(){noise({d:.12,f:420,q:.6,v:.42});tone({f:80,f2:30,d:.2,type:'sine',v:.45});noise({d:.08,f:3000,q:1,v:.08,t0:.02})},
  horn(){[220,277,330,440].forEach((f,i)=>tone({f,f2:f*.98,d:.42,type:'sawtooth',v:.05,t0:i*.012,a:.01}));noise({d:.12,f:900,q:.6,v:.22})},
  swish(){noise({d:.06,f:1700,f2:3400,q:.9,v:.07})},
  crowd(v=.14,d=1.4){noise({d,f:700,q:.35,v,type:'bandpass'});noise({d:d*.8,f:1600,q:.5,v:v*.4})},
  count(){tone({f:520,d:.14,v:.12,type:'square'})},
  perfect(){tone({f:1568,d:.08,type:'triangle',v:.09});tone({f:2093,d:.12,type:'triangle',v:.07,t0:.05})},
  ok(){tone({f:1046,d:.06,type:'triangle',v:.07})},
  miss(){tone({f:180,f2:120,d:.16,type:'square',v:.08})},
  combo(){[784,988,1175,1568].forEach((f,i)=>tone({f,d:.12,type:'triangle',v:.09,t0:i*.05}))},
  ko(){noise({d:.9,f:300,q:.4,v:.4});tone({f:400,f2:40,d:.8,type:'sawtooth',v:.12});tone({f:55,f2:28,d:.8,type:'sine',v:.4})},
  fall(){noise({d:.35,f:200,q:.5,v:.4});tone({f:70,f2:30,d:.3,type:'sine',v:.4})},
  move(){tone({f:700,d:.03,v:.05})},pick(){tone({f:660,d:.05,v:.08});tone({f:990,d:.07,v:.08,t0:.05})},back(){tone({f:400,f2:300,d:.07,v:.07})},
  blip(){tone({f:1200+rnd()*200,d:.02,type:'square',v:.025})},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone({f,d:.28,type:'triangle',v:.12,t0:i*.1}))},
  lose(){[392,349,311,262].forEach((f,i)=>tone({f,d:.35,type:'triangle',v:.1,t0:i*.18}))}};
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.5;if(MUS.bus)MUS.bus.gain.value=m?0:MUS.vol}
/* ================= vibration =================
   Phones with a vibration motor (Android) use navigator.vibrate. iPhones have no vibration API for web pages; a
   page can only get a haptic tick by toggling a hidden switch, and since iOS 18.4 only within about a second of a
   tap (a click). So on iPhone a buzz plays at once when you tapped a button in the last second, or else waits for
   the click that ends the tap you're making (that's every dodge and punch). */
const HAP={on:store.get('vib',true),lab:null,inp:null,last:0,grant:-1e9,queued:0};
const hapWin=()=>{let w=window;try{if(ZP&&window.parent.document)w=window.parent}catch(e){}return w};
const canVibrate=()=>{try{return typeof hapWin().navigator.vibrate==='function'}catch(e){return false}};
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function hapTick(){try{const w=hapWin(),d=w.document,id='zp-haptic';if(!HAP.lab||!HAP.lab.isConnected){let lab=d.getElementById(id+'-l'),inp=d.getElementById(id);
    if(!lab||!inp){inp=d.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id=id;lab=d.createElement('label');lab.id=id+'-l';lab.htmlFor=id;
      for(const e of[inp,lab]){e.setAttribute('aria-hidden','true');e.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none'}d.body.append(inp,lab)}HAP.lab=lab;HAP.inp=inp}
  HAP.lab.click()}catch(e){}}
function haptic(ms){if(!HAP.on)return;const now=performance.now();if(now-HAP.last<40)return;HAP.last=now;
  if(canVibrate()){try{hapWin().navigator.vibrate(ms)}catch(e){}return}
  if(!IOS)return;if(now-HAP.grant<950)hapTick();else HAP.queued=now}
/* a rhythm of buzzes: [on, off, on, ...] in ms; on iPhone each "on" is one tick (those after the first second are lost) */
function buzz(pat){if(!HAP.on)return;if(canVibrate()){try{hapWin().navigator.vibrate(pat)}catch(e){}return}
  if(!IOS)return;let t=0;pat.forEach((ms,i)=>{if(i%2===0){const at=t;if(at===0){HAP.last=0;haptic(ms)}else setTimeout(()=>{if(performance.now()-HAP.grant<950)hapTick()},at)}t+=ms})}
/* every real tap (on the console's buttons, or the touch pad here) opens a second's window, and plays a waiting buzz */
(()=>{const docs=[document];try{if(ZP&&window.parent.document)docs.push(window.parent.document)}catch(e){}
  for(const d of docs)d.addEventListener('click',e=>{if(!e.isTrusted||e.target===HAP.lab||e.target===HAP.inp)return;HAP.grant=performance.now();
    if(HAP.queued&&HAP.grant-HAP.queued<700){HAP.queued=0;hapTick()}},true)})();
const RUMBLE={dodge:()=>haptic(12),perfect:()=>buzz([14,30,10]),jab:()=>haptic(22),cross:()=>haptic(30),hay:()=>buzz([45,35,60]),block:()=>haptic(15),
  hurt:()=>buzz([70,40,40]),combo:()=>buzz([25,45,25,45,70]),odown:()=>buzz([90,60,90,60,140]),pdown:()=>buzz([160,90,80]),ko:()=>buzz([120,70,120,70,260]),
  count:()=>haptic(10),mash:()=>haptic(8),up:()=>buzz([40,50,40]),win:()=>buzz([40,60,40,60,40,60,180]),lose:()=>buzz([200])};
/* ================= buttons =================
   D-pad, A, B, START, SELECT. Presses are timestamped so the rhythm lanes judge them to the millisecond. */
const RAW={held:{},tap:{}},PRESSES=[];
function rawInput(btn,down){unlock();if(down){if(!RAW.held[btn]){RAW.tap[btn]=true;PRESSES.push({b:btn,at:performance.now()})}RAW.held[btn]=true}else RAW.held[btn]=false}
function clearTaps(){RAW.tap={};PRESSES.length=0}
const TAP=b=>!!RAW.tap[b];
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  z:'a',Z:'a',j:'a',J:'a',' ':'a',x:'b',X:'b',k:'b',K:'b',Enter:'start',Escape:'start',p:'start',P:'start',Shift:'select'};
addEventListener('keydown',e=>{const b=KEYS[e.key];if(!b)return;e.preventDefault();if(!e.repeat)rawInput(b,true)});
addEventListener('keyup',e=>{const b=KEYS[e.key];if(b)rawInput(b,false)});
addEventListener('blur',()=>{for(const k in RAW.held)RAW.held[k]=false});
/* touch pad (only outside the ZigaPlay) */
(()=>{const dp=document.getElementById('dp');if(!dp)return;const set=(e)=>{const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);
    const want={left:d>18&&x<-Math.abs(y)*.6,right:d>18&&x>Math.abs(y)*.6,up:d>18&&y<-Math.abs(x)*.6,down:d>18&&y>Math.abs(x)*.6};
    for(const k in want){if(want[k]!==!!RAW.held[k])rawInput(k,want[k]);dp.querySelector(`[data-d=${k}]`).classList.toggle('on',want[k])}};
  const end=()=>{for(const k of['left','right','up','down']){if(RAW.held[k])rawInput(k,false);dp.querySelector(`[data-d=${k}]`).classList.remove('on')}};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);set(e)});dp.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')set(e)});
  dp.addEventListener('pointerup',end);dp.addEventListener('pointercancel',end);
  for(const[id,b]of[['bA','a'],['bB','b'],['bS','start']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');rawInput(b,true)});
    const up=()=>{el.classList.remove('on');rawInput(b,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}})();
/* menus: a repeat when a direction is held */
const REP={};function menuDir(){for(const d of['up','down','left','right']){if(RAW.tap[d]){REP[d]=performance.now()+300;return d}
    if(RAW.held[d]&&REP[d]&&performance.now()>REP[d]){REP[d]=performance.now()+95;return d}}return null}

/* ================= saving: every second, on this device and (on the ZigaPlay) to your account =================
   The Claude app can clear this device's storage when it closes; the account copy is what comes back then. */
const SAVE=Object.assign({at:0,step:0,beaten:{},met:{},best:{},timing:1,fight:null,done:false},store.get('save',{}));
const acct=()=>{try{return ZP&&ZP.cloud||null}catch(e){return null}};
let saveHook=null;
function saveNow(flush){if(saveHook)saveHook();SAVE.at=Date.now();store.set('save',SAVE);const c=acct();if(c)try{c.save('haymaker',JSON.stringify(SAVE),{at:SAVE.at},'progress');if(flush)c.flush('haymaker')}catch(e){}}
async function loadAccount(apply){const c=acct();if(!c)return;try{const r=await c.load('haymaker','progress');if(!r||!r.ok||!r.json)return;const d=JSON.parse(r.json);if((d.at||0)>(SAVE.at||0)){Object.assign(SAVE,d);store.set('save',SAVE);apply&&apply()}}catch(e){}}

/* ================= the soundtrack =================
   A small synth band: kick, snare, hats, a filtered bass, warm pads, a plucked arpeggio and a lead with vibrato and
   echo. Each song is a key, a tempo, a chord progression and drum and bass patterns; its melody is a short motif
   written over the chords from the song's seed. Every ring has its own fight song; the menus and story are softer. */
const SONGS={
  title:{bpm:100,root:50,prog:[0,5,3,4],k:'x.......x.x.....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...0.0.5...0...',arp:'A',lead:.7,seed:4,soft:1},
  story:{bpm:84,root:53,prog:[0,3,5,4],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0.......5...0...',arp:'A',lead:.45,seed:9,soft:1},
  corner:{bpm:90,root:57,prog:[0,5,2,6],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0...0...5...0...',arp:'A',lead:.4,seed:51,soft:1},
  gym:{bpm:112,root:45,prog:[0,6,5,6],k:'x..x..x...x..x..',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',bass:'0..0..0.0..5.1..',arp:'B',lead:1,seed:13},
  pier:{bpm:132,root:52,prog:[0,5,2,6],k:'x...x...x...x...',s:'....x.......x...',h:'.x.x.x.x.x.x.x.x',bass:'0.10.10.0.10.150',arp:'B',lead:1,seed:19},
  chapel:{bpm:98,root:55,prog:[0,3,5,4],k:'x.......x..x....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...5...0...1...',arp:'AB',lead:.9,seed:27},
  ice:{bpm:126,root:49,prog:[0,5,6,4],k:'x.....x...x.....',s:'....x.......x...',h:'x.xxx.xxx.xxx.xx',bass:'0.0.0.0.1.1.5.5.',arp:'AB',lead:1,seed:33},
  roof:{bpm:118,root:54,prog:[0,4,5,4],k:'x..x..x.x..x..x.',s:'....x.......x.x.',h:'x.x.x.xxx.x.x.xx',bass:'0..0..0.5..5..1.',arp:'B',lead:1,seed:37},
  dock:{bpm:104,root:43,prog:[0,6,5,4],k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',bass:'00.000.000.0.11.',arp:'B',lead:1,seed:41},

/* ================= Arcade Ink: drawing people =================
   Heavy ink outlines, two-tone cel shading (a hard shadow on the lower right), a bright rim on the upper left and
   heroic proportions: wide shoulders, big forearms, big gloves. Everything is drawn in ring units into G, which is
   scaled up to the screen's real pixels, so lines stay crisp. */
const INK='#0e0a14',OUT=INK;
/* plain shapes (used by the rings and the map too) */
function E(x,y,rx,ry,c,rot=0){G.fillStyle=c;G.beginPath();G.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);G.fill()}
function EO(x,y,rx,ry,c,o=1,rot=0){E(x,y,rx,ry,c,rot);G.lineWidth=o*1.6;G.strokeStyle=INK;G.beginPath();G.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);G.stroke()}
function RC(x,y,w,h,c){G.fillStyle=c;G.fillRect(x,y,w,h)}
function RCO(x,y,w,h,c,lw=1.6){RC(x,y,w,h,c);G.lineWidth=lw;G.strokeStyle=INK;G.strokeRect(x,y,w,h)}
function PL(pts,c){G.fillStyle=c;G.beginPath();G.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i],pts[i+1]);G.closePath();G.fill()}
function PLO(pts,c,lw=1.8){PL(pts,c);G.lineJoin='round';G.strokeStyle=INK;G.lineWidth=lw;G.stroke()}
function LN(x1,y1,x2,y2,w,c,cap='round'){G.strokeStyle=c;G.lineWidth=w;G.lineCap=cap;G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.stroke()}
function LNO(x1,y1,x2,y2,w,c){LN(x1,y1,x2,y2,w+2.4,INK);LN(x1,y1,x2,y2,w,c)}
function ARC(x,y,r,a0,a1,w,c){G.strokeStyle=c;G.lineWidth=w;G.lineCap='round';G.beginPath();G.arc(x,y,Math.max(.1,r),a0,a1);G.stroke()}
/* ---------- cel shading ----------
   pf(ox,oy) adds a shape's path shifted by (ox,oy). The shape is filled with its colour, a rim of light on the upper
   left (outside the shape shifted down-right), a hard shadow on the lower right (outside the shape shifted up-left),
   then outlined in ink. */
function cel(pf,col,o={}){const sx=o.sx??2.4,sy=o.sy??2.2,rw=o.rw??1.1,lw=o.lw??1.8;
  G.save();G.beginPath();pf(0,0);G.clip();G.fillStyle=col;G.fillRect(-1e4,-1e4,2e4,2e4);
  if(o.rim!==false){G.fillStyle=o.rimCol||shade(col,.42);G.beginPath();G.rect(-1e4,-1e4,2e4,2e4);pf(rw,rw);G.fill('evenodd')}

/* a limb: a tapered capsule from a (width wa) to b (width wb) */

/* ================= the fight: a jab duel =================
   Runs at a fixed 60 steps a second. Each boxer starts on their own side of the ring.
   → throws a jab: you lunge across, and it lands about 0.8 s later (a touch quicker for fast fighters, slower for
     heavy ones). The jab itself can't be punished.
   ← blocks, but only while a jab is coming at you. Press it with no jab coming and you're stunned for 5 seconds.
   A blocked jab sends the jabber home, and they can't jab again for 1 second while the blocker can.
   A jab that lands gives you 1 second to press B. Then you have 1 second to press A four times: each press is a
   punch of a 4-hit combo. About ten full combos knock a fighter out. ▲ and ▼ do nothing yet. */

    rw:o.rw?o.rw.slice():[0,0],rd:o.rd||1,F:[],ph:'intro',t:0,timer:0,msg:null,shake:0,freeze:0,zoom:1,slow:0,res:null,fin:null,roundWinner:-1,

const CAMV={x:0};
function matchStep(){if(!M||M.ph==='done')return;M.t++;
  for(const f of M.F){if(f.cpu)aiTick(f);else humanPad(f)}
  if(M.freeze>0){M.freeze--;fxTick(1/60);return}
  if(M.ph==='intro'){if(M.t===46){say('FIGHT!','#ffd84a',36);SFX.horn();SFX.crowd(.16,1)}if(M.t>=56)M.ph='fight';for(const f of M.F){f.t++;f.P=lerpP(f.P,poseOf(f),.4)}fxTick(1/60);camTick();return}

  if(M.ph==='fight'){/* whoever started their jab first gets to land it first */const[a,b]=M.F;if(b.st==='lunge'&&(a.st!=='lunge'||b.t>a.t)){act(b);act(a)}else{act(a);act(b)}}

/* ================= the CPU =================
   It plays the jab duel through the same taps as you. The level (1-5) sets how often it blocks a jab in time
   (less often against a quick jab),
   how often it blocks too early and gets stunned, how fast it jabs into an opening, and how quickly it presses B
   and the four A punches after a jab lands. */
function aiTick(f){const o=other(f),L=M.lvl,ai=f.ai;f.pad={tap:{}};const p=f.pad.tap;if(M.ph!=='fight')return;
  if(M.tr&&M.tr.dummy!=='cpu'){dummyTick(f);return}
  /* a jab coming: decide once whether (and when) to block it */
  if(o.st==='lunge'){if(ai.seen!==o.jabId+'/'+o.i){ai.seen=o.jabId+'/'+o.i;ai.blockAt=rnd()<clamp(.3+.13*L+(o.W-48)*.006,.1,.97)?Math.round(o.W*(.3+rnd()*(.62-.07*L))):-1}
    if(ai.blockAt>=0&&o.t>=ai.blockAt&&f.st==='idle'){p.block=true;ai.blockAt=-1}}
  /* now and then a nervous block with nothing coming (more at low levels) */
  else if(f.st==='idle'&&o.st==='idle'&&rnd()<.0016*(5-L)/4)p.block=true;
  /* jab: straight away into an opening, otherwise every so often */
  if(f.st==='idle'&&f.cool<=0&&!p.block){
    if(o.stunT>0&&o.st==='stun'||o.cool>0&&o.st==='idle'&&rnd()<.03+.025*L)p.jab=true;
    else if(--ai.t<=0){ai.t=Math.round(36+rnd()*(120-L*14));if(['idle','back','stun'].includes(o.st))p.jab=true}}
  /* a jab landed: B, then the four punches */
  if(f.st==='jabbed'){if(ai.bAt==null)ai.bAt=rnd()<.55+.09*L?Math.round(5+rnd()*(40-L*6)):999;if(f.t>=ai.bAt){p.b=true;ai.bAt=null}}else ai.bAt=null;
  if(f.st==='combo'){const iv=ai.iv||(ai.iv=Math.max(8,Math.round(22-L*2.6+rnd()*4)));if(f.t>=4&&(f.t-4)%iv===0)p.a=true}else ai.iv=0}

  if(D==='jab'){if(f.st==='idle'&&f.cool<=0&&--ai.t<=0){ai.t=80;p.jab=true}if(f.st==='jabbed'&&f.t===14)p.b=true;if(f.st==='combo'&&f.t%13===4)p.a=true}}

const TIER_ROWS=['S','A','B','C','D'];
const tierOf=id=>TIER_DATA.tier[id]||null;
const tierRank=id=>TIER_DATA.rate[id]!=null?TIER_DATA.rate[id]:.5;
let TL={i:0,scroll:0,pos:[]};
function tierList(){return TIER_ROWS.map(t=>({t,ids:ROSTER.map(f=>f.id).filter(id=>(tierOf(id)||'C')===t).sort((a,b)=>tierRank(b)-tierRank(a))}))}
function openTiers(){TL={i:0,scroll:0,pos:[]};go('tiers')}
function tiersTick(){const d=menuDir(),P=TL.pos;if(!P.length)return;const cur=P[TL.i]||P[0];
  if(d==='left'){TL.i=(TL.i+P.length-1)%P.length;SFX.move()}else if(d==='right'){TL.i=(TL.i+1)%P.length;SFX.move()}
  else if(d==='up'||d==='down'){const lines=[...new Set(P.map(p=>p.y))].sort((a,b)=>a-b),li=lines.indexOf(cur.y),ny=lines[clamp(li+(d==='up'?-1:1),0,lines.length-1)];
    let best=TL.i,bd=1e9;P.forEach((p,k)=>{if(p.y===ny&&Math.abs(p.x-cur.x)<bd){bd=Math.abs(p.x-cur.x);best=k}});if(best!==TL.i){TL.i=best;SFX.move()}}
  if(TAP('a')){SFX.pick();openMoves(P[TL.i].id,'tiers')}else if(TAP('b')||TAP('start')){SFX.back();go('title',titleIdx('tiers'))}}
function tiersDraw(){drawStage('crown',[],{dim:.7});blit();ctx.setTransform(DPR,0,0,DPR,0,0);
  text('TIER LIST',SW/2,8*U,18,'#ffd84a','center','#0e0a14',700);
  textB(TIER_DATA.games?'From '+TIER_DATA.games.toLocaleString()+' CPU matches at level 5':'Estimated from stats',SW/2,30*U,8,'#c8c0e0','center');
  const top=44*U,infoH=58*U,bottom=SH-infoH-22*U,lab=24*U,C=PORT?(SW<330?6:7):clamp(Math.floor((SW-lab-24*U)/(44*U)),8,16),ts=Math.min((SW-lab-24*U)/C-3*U,48*U);
  /* lay out every row, then scroll so the cursor shows */
  const P=[];let y=0;const rowsY=[];
  for(const r of tierList()){rowsY.push({t:r.t,y,h:Math.max(1,Math.ceil(r.ids.length/C))*(ts+3*U)});r.ids.forEach((id,k)=>P.push({id,t:r.t,x:16*U+lab+(k%C)*(ts+3*U),y:y+Math.floor(k/C)*(ts+3*U)}));y+=Math.max(1,Math.ceil(r.ids.length/C))*(ts+3*U)+5*U}
  TL.pos=P;TL.i=clamp(TL.i,0,P.length-1);const cur=P[TL.i],viewH=bottom-top;
  if(cur){if(cur.y<TL.scroll)TL.scroll=cur.y;if(cur.y+ts>TL.scroll+viewH)TL.scroll=cur.y+ts-viewH}TL.scroll=clamp(TL.scroll,0,Math.max(0,y-viewH));
  ctx.save();ctx.beginPath();ctx.rect(0,top-2*U,SW,viewH+4*U);ctx.clip();
  for(const r of rowsY){const yy=top+r.y-TL.scroll;rrect(10*U,yy,lab,r.h-3*U,5*U);ctx.fillStyle=TIERC[r.t];ctx.fill();ctx.lineWidth=2*U;ctx.strokeStyle='#0e0a14';ctx.stroke();text(r.t,10*U+lab/2,yy+r.h/2-11*U,16,'#0e0a14','center',null,700)}
  P.forEach((p,k)=>{const yy=top+p.y-TL.scroll;if(yy>bottom||yy+ts<top-2*U)return;rrect(p.x,yy,ts,ts,4*U);ctx.fillStyle='#0e0a14';ctx.fill();
    portraitC(p.id,k===TL.i?'angry':'guard',p.x+1.5*U,yy+1.5*U,ts-3*U,shade(PEOPLE[p.id].gloves,-.35));
    if(k===TL.i){rrect(p.x-1*U,yy-1*U,ts+2*U,ts+2*U,5*U);ctx.lineWidth=3*U;ctx.strokeStyle='#fff';ctx.stroke()}});
  ctx.restore();
  if(cur){const f=ROSTER[RIX[cur.id]],iy=SH-infoH-20*U;panel(8*U,iy,SW-16*U,infoH,'rgba(14,10,24,.92)',TIERC[cur.t],8);
    text(fname(f.id),16*U,iy+7*U,11,'#fff','left','#0e0a14',700);textB('"'+(f.id==='milo'?nick():f.nick)+'" · '+f.style,16*U,iy+22*U,8,'#c8c0e0','left');
    textB('Jab '+(jabTime(f)/60).toFixed(2)+' s · KO in ~'+combosToKO(f)+' combos · combo '+Math.round(comboDmg(f))+' damage',16*U,iy+36*U,7,'#e8e2d0','left');
    const r=TIER_DATA.rate[f.id];if(r!=null)text(Math.round(r*100)+'% WINS',SW-16*U,iy+7*U,10,TIERC[cur.t],'right','#0e0a14',700)}
  help('D-PAD CHOOSE · A MOVES · B BACK')}

/* ================= the loop, saving, the console ================= */
const SCREENS={title:[titleTick,titleDraw],select:[selectTick,selectDraw],ladder:[ladderTick,ladderDraw],vsintro:[vsTick,vsDraw],fight:[fightTick,fightDraw],
  pause:[pauseTick,pauseDraw],result:[resultTick,resultDraw],champ:[champTick,champDraw],moves:[movesTick,movesDraw],settings:[settingsTick,settingsDraw],locker:[lockerTick,lockerDraw],tiers:[tiersTick,tiersDraw]};
/* the right song for the screen: the venue's own in a fight */
function songFor(){if(['fight','pause','vsintro'].includes(SCR)||SCR==='moves'&&MV.back==='pause')return M?VENUES[M.venue].song:'title';
  if(SCR==='result')return null;if(SCR==='champ')return'crown';if(['select','ladder','locker','tiers'].includes(SCR))return'corner';return'title'}
function step(dt){TT+=dt;SCREENS[SCR][0](dt);if(MSG&&(MSG.t-=dt)<=0)MSG=null;
  if(AC&&AC.state==='running'){const want=songFor();if(want===null){if(MUS.on)music(false)}else if(!MUS.on||MUS.song!==want)music(true,want)}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';SCREENS[SCR][1]();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(MSG){const w=tw(MSG.s,10,700)+24*U;panel(SW/2-w/2,SH*.5-12*U,w,24*U,'rgba(10,8,20,.92)','#ffd84a',6);text(MSG.s,SW/2,SH*.5-6*U,10,'#ffd84a','center',null,700)}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;step(dt);clearTaps();draw()}
/* ---------- saving: every second, and on hide, pagehide and the power switch ---------- */
const DEF={cpu:3,rounds:3,time:60,beaten:{},wins:0,losses:0,tower:null,match:null,cleared:{}};
for(const k in DEF)if(SAVE[k]===undefined)SAVE[k]=DEF[k];
delete SAVE.fight;delete SAVE.step;delete SAVE.pos;
const inMatch=()=>M&&!M.train&&!M.res&&M.ph!=='done'&&(['fight','pause','vsintro'].includes(SCR)||SCR==='moves'&&MV.back==='pause');
saveHook=()=>{if(inMatch()){
    SAVE.match={mode:M.mode,p1:M.p1,p2:M.p2,venue:M.venue,lvl:M.lvl,bestOf:M.bestOf,rw:M.rw.slice(),rd:M.rd,hp:M.ph==='fight'?M.F.map(f=>Math.max(f.max*.2,Math.round(f.hp))):null}}
  else if(M&&M.res)SAVE.match=null;
  SAVE.mute=muted;SAVE.vib=HAP.on};
function applySave(){applyLook();PC.clear();for(const k in DEF)if(SAVE[k]===undefined)SAVE[k]=DEF[k];if(SAVE.mute!=null&&SAVE.mute!==muted)setMute(SAVE.mute);if(SAVE.vib!=null){HAP.on=SAVE.vib;store.set('vib',HAP.on)}}
applySave();loadAccount(applySave);
setInterval(()=>saveNow(),1000);
function hold(){if(SCR==='fight')go('pause');saveNow(true)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hold()});
addEventListener('pagehide',()=>saveNow(true));
window.ZPCart={title:'Haymaker',input(b,d){rawInput(b,d)},home(){hold();return true}};
requestAnimationFrame(loop);
/* a test hook, only when the address asks for it */
if(/hmtest/.test(location.href))window.HMT={get M(){return M},get SCR(){return SCR},get SAVE(){return SAVE},get SEL(){return SEL},get RES(){return RES},ROSTER,newMatch,startMatch,go,step,draw,matchStep,
  openSelect,newTower,startTowerFight,openLocker,openMoves,poseOf,RAW,PT,
  run(n,dt=1/60){for(let i=0;i<n;i++){step(dt);clearTaps()}},press(b){rawInput(b,true);rawInput(b,false)},hold(b,d){rawInput(b,d)}};

})();
</script>
