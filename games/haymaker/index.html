<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haymaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Haymaker: one canvas filling the screen. The ring is drawn at a low resolution and scaled up with sharp pixels;
   the text and the timing lanes are drawn on top at full resolution.
   Outside the ZigaPlay, touch screens get a D-pad and A / B buttons over the bottom corners. */
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#07060c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
html.touch:not(.zp) #pad{display:block}
.pb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,18,34,.55);color:#fff;font:700 16px/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:none;padding:0}
.pb.on{background:rgba(255,120,80,.6)}
#dp{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dp i{position:absolute;width:50px;height:50px;border-radius:10px;background:rgba(20,18,34,.55);border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
#dp i.on{background:rgba(255,120,80,.6)}
#bA{right:max(16px,env(safe-area-inset-right,0px));bottom:62px}#bB{right:max(84px,calc(env(safe-area-inset-right,0px) + 68px));bottom:20px}
#bS{right:max(16px,env(safe-area-inset-right,0px));top:12px;width:44px;height:44px;font-size:13px}
</style>
<canvas id="cv"></canvas>
<div id="pad"><div id="dp"><i data-d="up" style="left:50px;top:0"></i><i data-d="left" style="left:0;top:50px"></i><i data-d="right" style="left:100px;top:50px"></i><i data-d="down" style="left:50px;top:100px"></i></div>
<button class="pb" id="bA">A</button><button class="pb" id="bB">B</button><button class="pb" id="bS">II</button></div>
<script>
(()=>{'use strict';
/* ================= setup ================= */
const ZP=(()=>{try{return window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
const RT=document.documentElement;if(ZP)RT.classList.add('zp');
if(!ZP&&(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window))RT.classList.add('touch');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,pick=a=>a[Math.floor(rnd()*a.length)],TAU=Math.PI*2;
const rr=(a,b)=>a+rnd()*(b-a),ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t),easeOut=t=>t<=0?0:t>=1?1:1-(1-t)*(1-t);
const store={get(k,d){try{const v=localStorage.getItem('haymaker-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('haymaker-'+k,JSON.stringify(v))}catch(e){}}};
/* the view: the screen in CSS pixels, drawn at up to 2x. The ring is drawn into a small buffer (BW x BH, at least
   180 x 250 "ring pixels") and scaled up by PS with sharp pixels. UI sizes follow U. */
let SW=300,SH=430,DPR=1,U=1,PORT=true,PS=2,BW=180,BH=250;
const BUF=document.createElement('canvas'),bx=BUF.getContext('2d');
let G=bx;/* the context the art functions draw into */
function resize(){DPR=Math.min(2,devicePixelRatio||1);SW=innerWidth||300;SH=innerHeight||430;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);PORT=SH>SW*1.05;
  U=PORT?Math.min(SW/300,SH/440):Math.min(SH/290,SW/470);
  PS=Math.max(1,Math.min(SW/180,SH/250));BW=Math.ceil(SW/PS);BH=Math.ceil(SH/PS);BUF.width=BW;BUF.height=BH}
addEventListener('resize',resize);resize();
const FONT="'Pixelify Sans','VT323',ui-monospace,Menlo,monospace";
const font=(px,w=600)=>`${w} ${Math.max(7,Math.round(px*U))}px ${FONT}`;
function text(s,x,y,px,col,al='left',out=null,w=600){ctx.font=font(px,w);ctx.textAlign=al;ctx.textBaseline='top';if(out){ctx.lineWidth=Math.max(2,px*U*.24);ctx.strokeStyle=out;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function tw(s,px,w=600){ctx.font=font(px,w);return ctx.measureText(s).width}
function wrap(s,maxW,px,w=600){ctx.font=font(px,w);const out=[];for(const para of String(s).split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=word}else line=t}out.push(line)}return out}
function rrect(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function panel(x,y,w,h,fill='rgba(10,8,20,.86)',edge='#f2c14e',r=8){rrect(x,y,w,h,r*U);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=Math.max(1.5,2*U);ctx.strokeStyle=edge;ctx.stroke()}
const shade=(c,t)=>{const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};
if(document.fonts&&document.fonts.load){document.fonts.load(`20px 'Pixelify Sans'`).catch(()=>{})}

/* ================= sound ================= */
let AC=null,master=null,muted=!!store.get('mute',false);
function audio(){if(AC)return AC;try{const A=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=muted?0:.5;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination)}catch(e){AC=null}return AC}
function unlock(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone({f=440,f2=null,d=.1,type='square',v=.2,t0=0,a=.006}){const A=AC;if(!A||muted)return;const t=A.currentTime+t0,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise({d=.1,v=.2,f=1200,q=1,t0=0,type='bandpass',f2=null}){const A=AC;if(!A||muted)return;if(!NB){NB=A.createBuffer(1,A.sampleRate*.5,A.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}
  const t=A.currentTime+t0,s=A.createBufferSource(),bp=A.createBiquadFilter(),g=A.createGain();s.buffer=NB;s.loop=true;bp.type=type;bp.frequency.setValueAtTime(f,t);if(f2)bp.frequency.exponentialRampToValueAtTime(f2,t+d);bp.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
  jab(){noise({d:.07,f:900,q:.8,v:.32});tone({f:130,f2:55,d:.09,type:'sine',v:.34})},
  cross(){noise({d:.09,f:700,q:.7,v:.38});tone({f:115,f2:45,d:.12,type:'sine',v:.4})},
  hay(){noise({d:.16,f:500,q:.6,v:.45});tone({f:95,f2:32,d:.22,type:'sine',v:.5});noise({d:.3,f:2600,q:.5,v:.07,t0:.03})},
  whoosh(){noise({d:.15,f:900,f2:2600,q:.9,v:.13})},
  block(){noise({d:.06,f:350,q:1,v:.25});tone({f:90,f2:60,d:.06,type:'sine',v:.18})},
  hurt(){noise({d:.12,f:420,q:.6,v:.42});tone({f:80,f2:30,d:.2,type:'sine',v:.45});noise({d:.08,f:3000,q:1,v:.08,t0:.02})},
  bell(n=1){for(let i=0;i<n;i++){tone({f:1318,d:1.1,type:'triangle',v:.16,t0:i*.32});tone({f:1976,d:.8,type:'sine',v:.08,t0:i*.32});tone({f:3120,d:.4,type:'sine',v:.03,t0:i*.32})}},
  crowd(v=.14,d=1.4){noise({d,f:700,q:.35,v,type:'bandpass'});noise({d:d*.8,f:1600,q:.5,v:v*.4})},
  count(){tone({f:520,d:.14,v:.12,type:'square'})},
  perfect(){tone({f:1568,d:.08,type:'triangle',v:.09});tone({f:2093,d:.12,type:'triangle',v:.07,t0:.05})},
  ok(){tone({f:1046,d:.06,type:'triangle',v:.07})},
  miss(){tone({f:180,f2:120,d:.16,type:'square',v:.08})},
  combo(){[784,988,1175,1568].forEach((f,i)=>tone({f,d:.12,type:'triangle',v:.09,t0:i*.05}))},
  ko(){noise({d:.9,f:300,q:.4,v:.4});tone({f:400,f2:40,d:.8,type:'sawtooth',v:.12});tone({f:55,f2:28,d:.8,type:'sine',v:.4})},
  fall(){noise({d:.35,f:200,q:.5,v:.4});tone({f:70,f2:30,d:.3,type:'sine',v:.4})},
  move(){tone({f:700,d:.03,v:.05})},pick(){tone({f:660,d:.05,v:.08});tone({f:990,d:.07,v:.08,t0:.05})},back(){tone({f:400,f2:300,d:.07,v:.07})},
  blip(){tone({f:1200+rnd()*200,d:.02,type:'square',v:.025})},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone({f,d:.28,type:'triangle',v:.12,t0:i*.1}))},
  lose(){[392,349,311,262].forEach((f,i)=>tone({f,d:.35,type:'triangle',v:.1,t0:i*.18}))}};
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:.5;if(MUS.bus)MUS.bus.gain.value=m?0:MUS.vol}
/* a buzz on big hits: vibrate where it exists; on iPhone a hidden switch gives a haptic tick */
const HAP={on:store.get('vib',true),lab:null,last:0};
function haptic(ms){if(!HAP.on)return;const now=performance.now();if(now-HAP.last<45)return;HAP.last=now;let w=window;try{if(ZP)w=window.parent}catch(e){}
  try{if(typeof w.navigator.vibrate==='function'){w.navigator.vibrate(ms);return}}catch(e){}
  try{if(!HAP.lab||!HAP.lab.isConnected){const d=w.document,id='zp-haptic';let lab=d.getElementById(id+'-l');if(!lab){const inp=d.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id=id;lab=d.createElement('label');lab.id=id+'-l';lab.htmlFor=id;
    for(const e of[inp,lab]){e.setAttribute('aria-hidden','true');e.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none'}d.body.append(inp,lab)}HAP.lab=lab}HAP.lab.click()}catch(e){}}

/* ================= buttons =================
   D-pad, A, B, START, SELECT. Presses are timestamped so the rhythm lanes judge them to the millisecond. */
const RAW={held:{},tap:{}},PRESSES=[];
function rawInput(btn,down){unlock();if(down){if(!RAW.held[btn]){RAW.tap[btn]=true;PRESSES.push({b:btn,at:performance.now()})}RAW.held[btn]=true}else RAW.held[btn]=false}
function clearTaps(){RAW.tap={};PRESSES.length=0}
const TAP=b=>!!RAW.tap[b];
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  z:'a',Z:'a',j:'a',J:'a',' ':'a',x:'b',X:'b',k:'b',K:'b',Enter:'start',Escape:'start',p:'start',P:'start',Shift:'select'};
addEventListener('keydown',e=>{const b=KEYS[e.key];if(!b)return;e.preventDefault();if(!e.repeat)rawInput(b,true)});
addEventListener('keyup',e=>{const b=KEYS[e.key];if(b)rawInput(b,false)});
addEventListener('blur',()=>{for(const k in RAW.held)RAW.held[k]=false});
/* touch pad (only outside the ZigaPlay) */
(()=>{const dp=document.getElementById('dp');if(!dp)return;const set=(e)=>{const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);
    const want={left:d>18&&x<-Math.abs(y)*.6,right:d>18&&x>Math.abs(y)*.6,up:d>18&&y<-Math.abs(x)*.6,down:d>18&&y>Math.abs(x)*.6};
    for(const k in want){if(want[k]!==!!RAW.held[k])rawInput(k,want[k]);dp.querySelector(`[data-d=${k}]`).classList.toggle('on',want[k])}};
  const end=()=>{for(const k of['left','right','up','down']){if(RAW.held[k])rawInput(k,false);dp.querySelector(`[data-d=${k}]`).classList.remove('on')}};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);set(e)});dp.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')set(e)});
  dp.addEventListener('pointerup',end);dp.addEventListener('pointercancel',end);
  for(const[id,b]of[['bA','a'],['bB','b'],['bS','start']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');rawInput(b,true)});
    const up=()=>{el.classList.remove('on');rawInput(b,false)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}})();
/* menus: a repeat when a direction is held */
const REP={};function menuDir(){for(const d of['up','down','left','right']){if(RAW.tap[d]){REP[d]=performance.now()+300;return d}
    if(RAW.held[d]&&REP[d]&&performance.now()>REP[d]){REP[d]=performance.now()+95;return d}}return null}

/* ================= saving: every second, on this device and (on the ZigaPlay) to your account =================
   The Claude app can clear this device's storage when it closes; the account copy is what comes back then. */
const SAVE=Object.assign({at:0,step:0,beaten:{},met:{},best:{},timing:1,fight:null,done:false},store.get('save',{}));
const acct=()=>{try{return ZP&&ZP.cloud||null}catch(e){return null}};
let saveHook=null;
function saveNow(flush){if(saveHook)saveHook();SAVE.at=Date.now();store.set('save',SAVE);const c=acct();if(c)try{c.save('haymaker',JSON.stringify(SAVE),{at:SAVE.at},'progress');if(flush)c.flush('haymaker')}catch(e){}}
async function loadAccount(apply){const c=acct();if(!c)return;try{const r=await c.load('haymaker','progress');if(!r||!r.ok||!r.json)return;const d=JSON.parse(r.json);if((d.at||0)>(SAVE.at||0)){Object.assign(SAVE,d);store.set('save',SAVE);apply&&apply()}}catch(e){}}

/* ================= the soundtrack =================
   A small synth band: kick, snare, hats, a filtered bass, warm pads, a plucked arpeggio and a lead with vibrato and
   echo. Each song is a key, a tempo, a chord progression and drum and bass patterns; its melody is a short motif
   written over the chords from the song's seed. Every ring has its own fight song; the menus and story are softer. */
const SONGS={
  title:{bpm:100,root:50,prog:[0,5,3,4],k:'x.......x.x.....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...0.0.5...0...',arp:'A',lead:.7,seed:4,soft:1},
  story:{bpm:84,root:53,prog:[0,3,5,4],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0.......5...0...',arp:'A',lead:.45,seed:9,soft:1},
  corner:{bpm:90,root:57,prog:[0,5,2,6],k:'x.......x.......',s:'........x.......',h:'..x...x...x...x.',bass:'0...0...5...0...',arp:'A',lead:.4,seed:51,soft:1},
  gym:{bpm:112,root:45,prog:[0,6,5,6],k:'x..x..x...x..x..',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',bass:'0..0..0.0..5.1..',arp:'B',lead:1,seed:13},
  pier:{bpm:132,root:52,prog:[0,5,2,6],k:'x...x...x...x...',s:'....x.......x...',h:'.x.x.x.x.x.x.x.x',bass:'0.10.10.0.10.150',arp:'B',lead:1,seed:19},
  chapel:{bpm:98,root:55,prog:[0,3,5,4],k:'x.......x..x....',s:'....x.......x...',h:'..x...x...x...x.',bass:'0...5...0...1...',arp:'AB',lead:.9,seed:27},
  ice:{bpm:126,root:49,prog:[0,5,6,4],k:'x.....x...x.....',s:'....x.......x...',h:'x.xxx.xxx.xxx.xx',bass:'0.0.0.0.1.1.5.5.',arp:'AB',lead:1,seed:33},
  roof:{bpm:118,root:54,prog:[0,4,5,4],k:'x..x..x.x..x..x.',s:'....x.......x.x.',h:'x.x.x.xxx.x.x.xx',bass:'0..0..0.5..5..1.',arp:'B',lead:1,seed:37},
  dock:{bpm:104,root:43,prog:[0,6,5,4],k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',bass:'00.000.000.0.11.',arp:'B',lead:1,seed:41},
  crown:{bpm:146,root:50,prog:[0,5,3,4],k:'x.....x.x.....x.',s:'....x.......x..x',h:'xxx.xxx.xxx.xxx.',bass:'0.0.0.0.5.5.1.1.',arp:'AB',lead:1,seed:47}};
const MINOR=[0,2,3,5,7,8,10],mf=n=>440*Math.pow(2,(n-69)/12);
const MUS={on:false,song:null,step:0,next:0,timer:0,bus:null,vol:.34,dly:null,S:null,mel:null};
function seededR(n){let s=n*1103+12345;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648}}
const deg=(S,d,oct=0)=>{const k=((d%7)+7)%7,o=Math.floor(d/7);return S.root+MINOR[k]+12*(o+oct)};
const chordOf=(S,bar)=>{const d=S.prog[bar%S.prog.length];return[deg(S,d),deg(S,d+2),deg(S,d+4)]};
/* the melody: a two-bar motif (rhythm + shape) laid over each pair of chords, with a different answer in the B section */
function makeMelody(S){const r=seededR(S.seed),R=['x..x..x.x.......','x...x.x...x.x...','..x.x..xx...x...','x.x...x...x.x.x.','x..x..x...x.....','x.....x.x.x.x...'];
  const phrase=()=>{const rh=[R[Math.floor(r()*R.length)],R[Math.floor(r()*R.length)]],shape=[];let p=Math.floor(r()*3);for(let i=0;i<16;i++){p=clamp(p+[-1,0,1,1,2,-2][Math.floor(r()*6)],-1,6);shape.push(p)}return{rh,shape}};
  return{A:phrase(),B:phrase()}}
function musBus(){const a=AC;if(MUS.bus)return;MUS.bus=a.createGain();MUS.bus.gain.value=muted?0:MUS.vol;MUS.bus.connect(master);
  const d=a.createDelay(1),fb=a.createGain(),lp=a.createBiquadFilter();d.delayTime.value=.33;fb.gain.value=.32;lp.type='lowpass';lp.frequency.value=2400;d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(MUS.bus);MUS.dly=d}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0005,t+a+dec)}
function osc(type,f,t,dur,dest,det=0){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=det;o.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
const I={
  kick(t,v=1){const g=AC.createGain();g.connect(MUS.bus);env(g,t,.002,.9*v,.28);const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);o.connect(g);o.start(t);o.stop(t+.35)},
  noiseHit(t,f,q,v,dec,type='bandpass'){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=rnd()*2-1}const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;bp.type=type;bp.frequency.value=f;bp.Q.value=q;env(g,t,.001,v,dec);s.connect(bp);bp.connect(g);g.connect(MUS.bus);s.start(t);s.stop(t+dec+.05)},
  snare(t,v=1){I.noiseHit(t,1900,.7,.32*v,.17);const g=AC.createGain();g.connect(MUS.bus);env(g,t,.001,.18*v,.09);osc('triangle',190,t,.12,g)},
  hat(t,open,v=1){I.noiseHit(t,8000,1,(open?.07:.05)*v,open?.2:.035,'highpass')},

function musStep(t,st){const S=MUS.S,bar=Math.floor(st/16),i=st%16,sec=bar<2?'intro':(Math.floor((bar-2)/8)%2?'B':'A'),inB=sec==='B',last=(bar-2)%8===7;
  const ch=chordOf(S,bar),soft=S.soft;

  if(S.k[i]==='x')I.kick(t,soft?.7:1);
  if(sec!=='intro'||bar===1){if(last&&i>=12&&!soft)I.snare(t,.5+(i-12)*.15);else if(S.s[i]==='x')I.snare(t,soft?.5:1)}
  if(S.h[i]==='x'||(inB&&!soft&&i%2===1))I.hat(t,inB&&i%8===6,soft?.6:1);
  /* bass */
  const b=S.bass[i];if(b&&b!=='.'){const n=ch[0]-12+(b==='1'?12:b==='5'?7:0);let len=1;while(i+len<16&&S.bass[i+len]==='.'&&len<4)len++;I.bass(t,n,len*MUS.spb*.95,soft?.7:1)}
  /* pads on each bar */
  if(i===0)I.pad(t,ch,MUS.spb*16,sec==='intro'?.6:1);
  /* arpeggio */
  if(S.arp.includes(sec==='intro'?'A':sec)&&(soft?i%2===0:true)){const seq=[ch[0],ch[1],ch[2],ch[0]+12,ch[2],ch[1]];I.arp(t,seq[(st>>(soft?1:0))%seq.length]+12,soft?.8:1)}
  /* lead melody */
  if(sec!=='intro'&&MUS.mel){const ph=MUS.mel[sec],half=bar%2,rh=ph.rh[half];if(rh[i]==='x'){let len=1;while(i+len<16&&rh[i+len]==='.'&&len<6)len++;
      const k=ph.shape[(half*8+Math.floor(i/2))%16],d=S.prog[bar%S.prog.length]+[0,2,4,7,9,11,14,16][clamp(k,0,7)]-(k<0?2:0);
      I.lead(t,deg(S,d,1),len*MUS.spb*.9,S.lead)}}}

  if(!AC)return;id=id||'title';if(MUS.on&&MUS.song===id)return;if(MUS.on)music(false);
  musBus();const S=SONGS[id]||SONGS.title;MUS.S=S;MUS.song=id;MUS.spb=60/S.bpm/4;MUS.step=0;MUS.mel=makeMelody(S);MUS.on=true;MUS.next=AC.currentTime+.08;
  MUS.bus.gain.value=muted?0:MUS.vol;if(!MUS.timer)MUS.timer=setInterval(musTick,25)}

/* ================= the fight =================
   The opponent throws a combo: arrows slide along the lane to the ring on the left, and each punch lands as its
   arrow reaches the ring. Press that way on the D-pad to slip it (U leans back, D ducks). Slip the whole combo and he
   is open: your punches (A, B, A+B together) slide in the same way; hit each on the ring. Miss one and he
   recovers and starts his combo again. Get hit and he resets. Three rounds of 90 seconds. */
const ROUND_T=90;
const TIMING=[{n:'EASY',w:1.4,b:1.14},{n:'NORMAL',w:1,b:1},{n:'HARD',w:.8,b:.9}];
const TIM=()=>TIMING[clamp(SAVE.timing|0,0,2)];
const DIRS={left:'L',right:'R',up:'U',down:'D'};
let F=null;
function newFight(oi,o={}){const op=OPP[oi],r=o.resume;FX.length=0;
  F={oi,op,id:op.id,venue:op.venue,story:!!o.story,rd:r?r.rd:1,tleft:r?r.tleft:ROUND_T,php:r?r.php:100,ohp:r?r.ohp:100,pkd:r?r.pkd:0,okd:r?r.okd:0,
    clk:0,ph:'intro',p0:0,toks:[],lastPat:'',next:0,until:0,sched:[],
    O:{hitT:-9,side:0,big:false,blockT:-9,sayT:-9,say:'',dazeT:-9},P:{dodge:null,punch:null,hurtT:-9},
    stats:Object.assign({taken:0,takenD:0,dealt:0,perfect:0,combos:0,dodges:0,miss:0,time:0},r?r.stats:{}),
    pops:[],msg:null,shake:0,flash:0,count:0,mash:0,need:0,upAt:0,res:null,tutor:o.story&&op.id==='gus'};
  SAVE.met[op.id]=1;startIntro()}
/* the opponent's numbers now: a mad Sable is faster; every knockdown makes anyone a little quicker */
function eff(){const o=F.op,r=o.rage&&F.okd>=2?o.rage:{},T=TIM(),q=1-.04*F.okd;
  return{beat:(r.beat||o.beat)*T.b*q,win:(r.win||o.win)*T.w,cbeat:(r.cbeat||o.cbeat)*T.b,counters:r.counters||o.counters,freeze:!!(r.freeze||o.freeze),rage:!!r.beat}}
function at(dt,fn){F.sched.push({t:F.clk+dt,fn})}
function pop(s,c='#fff'){F.pops.push({s,c,t:F.clk})}
function banner(s,d=1.2,c='#ffd84a'){F.msg={s,t:F.clk,d,c}}

/* ---------- phases ---------- */
function startIntro(){F.ph='intro';F.p0=F.clk;F.toks=[];banner('ROUND '+F.rd,1.25,'#fff');at(.25,()=>{SFX.bell(1);SFX.crowd(.12,1.6)});at(1.3,()=>{banner('FIGHT!',.7);SFX.crowd(.16,1)});at(2,()=>startNeutral(true))}
function startNeutral(short){F.ph='neutral';F.p0=F.clk;const[a,b]=F.op.wait;F.next=F.clk+rr(a,b)*(short?.55:1)*TIM().b*(eff().rage?.75:1);
  if(rnd()<.28&&F.clk-F.O.sayT>5){F.O.say=pick(F.op.taunts);F.O.sayT=F.clk}}
function parsePat(str,beat,t0){const out=[];let t=t0,i=0;for(const it of str.split(' ')){if(it==='.'){t+=beat;continue}const fake=it[0]==='*';out.push({k:'d',d:it.replace('*',''),t,fake,st:0,i:i++});t+=beat}return out}
function parseCombo(str,beat,t0){const out=[];let t=t0;for(const it of str.split(' ')){const sub=it.split(',');sub.forEach((s,j)=>out.push({k:'c',b:s==='A+B'?'AB':s,t:t+j*beat/2,st:0}));t+=beat}return out}
function startDefend(quick){const e=eff(),o=F.op;let str;
  if(quick)str=pick(['L','R','D']);
  else{const tier=clamp(F.rd-1+F.okd,0,o.pats.length-1);for(let k=0;k<4;k++){const pool=rnd()<.7||tier===0?o.pats[tier]:o.pats[tier-1];str=pick(pool);if(str!==F.lastPat)break}F.lastPat=str}
  const lead=quick?.8:clamp(e.beat*2.7,1.2,1.75)*TIM().b;F.toks=parsePat(str,e.beat,F.clk+lead);for(const t of F.toks){t.lead=lead;t.frz=e.freeze&&!quick}
  F.ph='defend';F.p0=F.clk;if(quick){pop('TOO GREEDY!','#ff6a5a')}}
function startCounter(){const e=eff();F.toks=parseCombo(pick(e.counters),e.cbeat,F.clk+1.1*TIM().b);for(const t of F.toks)t.lead=1.1*TIM().b;
  F.ph='counter';F.p0=F.clk;F.O.dazeT=F.clk;pop('OPEN!','#7dff9a');SFX.crowd(.08,.8)}
function startRecover(d){F.ph='recover';F.p0=F.clk;F.until=F.clk+d}
function clearToks(){for(const t of F.toks)if(t.st===0)t.st=3}

/* ---------- your presses, judged at the moment they happened ---------- */
function fightPress(btn,tp){const ph=F.ph;
  if(DIRS[btn]){const d=DIRS[btn];if(['neutral','defend','recover','stagger','block','counter'].includes(ph)){F.P.dodge={d,t:tp};SFX.whoosh()}
    if(ph==='defend')judgeDodge(d,tp);return}
  if(btn==='a'||btn==='b'){
    if(ph==='pdown'){F.mash++;SFX.blip();return}
    if(ph==='counter'){judgePunch(btn.toUpperCase(),tp);return}
    if(ph==='neutral'){F.P.punch={b:btn.toUpperCase(),t:tp,blocked:true};F.O.blockT=tp;SFX.block();if(F.op.punish&&rnd()<.65)startDefend(true)}}}
function judgeDodge(d,tp){const n=F.toks.find(k=>k.k==='d'&&k.st===0);if(!n)return;const e=eff();
  if(n.fake){failD(n,'FAKED!');return}
  if(tp<n.t-e.win){failD(n,'EARLY!');return}
  if(d!==n.d){failD(n,'WRONG WAY');return}
  n.st=1;n.pt=tp;n.perf=Math.abs(tp-n.t)<e.win*.38;F.stats.dodges++;if(n.perf){F.stats.perfect++;pop('PERFECT','#7ae8ff');SFX.perfect()}else{pop(['SLIP!','SLIP!','DUCK!','LEAN!'][['L','R','D','U'].indexOf(n.d)],'#7dff9a');SFX.ok()}}
function failD(n,why){n.st=2;n.why=why;pop(why,'#ff5a5a');SFX.miss()}
function judgePunch(b,tp){const n=F.toks.find(k=>k.k==='c'&&k.st===0);if(!n)return;const W=.21*TIM().w;
  if(n.half){if(b!==n.half.b&&tp-n.half.t<=.15)landPunch(n,(tp+n.half.t)/2);else failC(n,'TOGETHER!');return}
  if(tp<n.t-W){failC(n,'EARLY!');return}
  if(n.b==='AB'){n.half={b,t:tp};return}
  if(b!==n.b){failC(n,'WRONG!');return}
  landPunch(n,tp)}
function landPunch(n,tp){const o=F.op;n.st=1;const perf=Math.abs(tp-n.t)<.075*TIM().w,dmg={A:5,B:6,AB:11}[n.b]*(perf?1.3:1)*o.def;
  F.ohp-=dmg;F.stats.dealt+=dmg;if(perf)F.stats.perfect++;
  F.P.punch={b:n.b,t:F.clk};F.O.hitT=F.clk;F.O.side=n.b==='A'?1:n.b==='B'?-1:0;F.O.big=n.b==='AB';
  if(n.b==='AB'){SFX.hay();F.shake=5;haptic(30)}else(n.b==='A'?SFX.jab:SFX.cross)();
  const hx=BW/2+(F.O.side*4),hy=BH-OPP_Y-(PEOPLE[F.id].build.h+PEOPLE[F.id].build.r*1.15)*PEOPLE[F.id].build.s*OSC;
  burst(hx,hy,n.b==='AB'?14:7,'#fff',n.b==='AB'?90:60);fx('star',hx,hy,{r:n.b==='AB'?20:12,life:.25,c:n.b==='AB'?'#ffd84a':'#fff'});
  pop(perf?'PERFECT':n.b==='AB'?'HAYMAKER!':n.b==='A'?'JAB!':'CROSS!',perf?'#7ae8ff':n.b==='AB'?'#ffd84a':'#fff');
  if(F.ohp<=0){startODown();return}
  if(F.toks.every(k=>k.k!=='c'||k.st===1)){const bonus=8*o.def;F.ohp-=bonus;F.stats.dealt+=bonus;F.stats.combos++;banner('COMBO!',.8,'#7dff9a');SFX.combo();SFX.crowd(.16,1.2);
    if(F.ohp<=0){startODown();return}F.ph='stagger';F.p0=F.clk;F.until=F.clk+.9}}
function failC(n,why){n.st=2;n.why=why;clearToks();pop(why,'#ff5a5a');SFX.block();F.O.blockT=F.clk;F.stats.miss++;F.ph='block';F.p0=F.clk;F.until=F.clk+.55}
function playerHit(n){n.landed=true;const o=F.op,dmg=o.dmg*(n.fake?.6:1)*(TIM().w>1?.85:1);
  F.php-=dmg;F.stats.taken++;F.stats.takenD+=dmg;F.P.hurtT=F.clk;F.shake=7;F.flash=1;SFX.hurt();haptic(40);
  burst(BW/2,BH-PL_Y-33,10,'#ffe0a0',80);fx('star',BW/2,BH-PL_Y-40,{r:22,life:.25,c:'#ff6a4a'});clearToks();
  if(F.php<=0){startPDown();return}
  startRecover(.85)}
/* ---------- knockdowns ---------- */
function startODown(){const o=F.op;F.okd++;clearToks();F.ph='odown';F.p0=F.clk;F.count=0;F.ohp=0;banner('DOWN!',1.2,'#ffd84a');SFX.fall();SFX.crowd(.22,2);haptic(60);
  const final=F.okd>=o.kds;F.upAt=final?99:Math.min(9,Math.floor(rr(o.up[0],o.up[1]+1))+F.okd-1);
  const tick=()=>{if(F.ph!=='odown')return;F.count++;SFX.count();if(F.count>=F.upAt&&F.count<10){F.ph='oup';F.p0=F.clk;at(.9,()=>{F.ohp=[72,52,34][Math.min(2,F.okd-1)];if(eff().rage&&F.okd===2){banner('SABLE IS FURIOUS!',1.4,'#ff5a5a');F.O.say='Enough games!';F.O.sayT=F.clk}startNeutral()});return}
    if(F.count>=10){F.ph='ko';F.p0=F.clk;banner('K.O.!',2.4,'#ff5a5a');SFX.ko();SFX.crowd(.3,2.5);at(2.4,()=>finishFight(true,'KNOCKOUT'));return}at(.72,tick)};
  at(1.1,tick)}
function startPDown(){F.pkd++;clearToks();F.ph='pdown';F.p0=F.clk;F.count=0;F.php=0;F.mash=0;F.need=10+7*(F.pkd-1);banner('YOU\'RE DOWN!',1.2,'#ff5a5a');SFX.fall();haptic(80);
  if(F.pkd>=3){at(1.6,()=>{F.ph='pko';banner('T.K.O.',2,'#ff5a5a');SFX.ko();at(2,()=>finishFight(false,'TKO'))});return}
  const tick=()=>{if(F.ph!=='pdown')return;F.count++;SFX.count();if(F.count>=10){F.ph='pko';banner('K.O.',2,'#ff5a5a');SFX.ko();at(2,()=>finishFight(false,'KNOCKOUT'));return}at(.85,tick)};at(1.1,tick)}
/* ---------- rounds ---------- */
function endRound(){F.ph='bell';F.p0=F.clk;clearToks();SFX.bell(2);SFX.crowd(.14,1.4);banner(F.rd<3?'END OF ROUND '+F.rd:'FINAL BELL',1.6,'#fff');
  at(1.8,()=>{if(F.rd<3){go('corner')}else decision()})}
function decision(){const you=F.stats.dealt+30*F.okd,them=F.stats.takenD+30*F.pkd,win=you>them;banner('DECISION...',1.2,'#fff');at(1.4,()=>finishFight(win,win?'DECISION':'DECISION LOSS'))}
function nextRound(){F.rd++;F.tleft=ROUND_T;F.php=Math.min(100,F.php+28);F.ohp=Math.min(100,F.ohp+10);startIntro()}
function finishFight(win,how){const st=F.stats,stars=win?(st.taken<=1?3:st.taken<=4?2:1):0;F.res={win,how,stars,time:st.time};
  SAVE.fight=null;if(win){const b=SAVE.best[F.id]||{};SAVE.best[F.id]={stars:Math.max(b.stars||0,stars),time:Math.min(b.time||1e9,st.time),wins:(b.wins||0)+1};SAVE.beaten[F.id]=1;if(F.story)SAVE.step++}
  (win?SFX.win:SFX.lose)();saveNow(true);go('result')}

/* ---------- each frame ---------- */
function fightTick(dt){const now=performance.now();F.clk+=dt;
  for(const p of PRESSES)fightPress(p.b,F.clk-(now-p.at)/1000);
  for(let i=0;i<F.sched.length;i++){const s=F.sched[i];if(F.clk>=s.t){F.sched.splice(i--,1);s.fn()}}
  const ph=F.ph,active=['neutral','defend','counter','recover','stagger','block'].includes(ph);
  if(active){F.tleft-=dt;F.stats.time+=dt}
  if(ph==='neutral'&&F.clk>=F.next){if(F.tleft<=0)endRound();else startDefend()}
  else if(ph==='defend'){const e=eff(),g=.07*TIM().w;
    for(const n of F.toks){if(n.k!=='d')continue;
      if(n.st===0&&F.clk>n.t+g){if(n.fake){n.st=1;pop('READ IT!','#7ae8ff')}else failD(n,'MISS')}
      if(n.st===2&&!n.landed&&F.clk>=n.t){playerHit(n);break}}
    if(F.ph==='defend'&&F.toks.length&&F.toks.every(n=>n.st===1)&&F.clk>F.toks[F.toks.length-1].t+.14)startCounter()}
  else if(ph==='counter'){const n=F.toks.find(k=>k.k==='c'&&k.st===0),W=.21*TIM().w;
    if(n){if(n.half&&F.clk-n.half.t>.15)failC(n,'TOGETHER!');else if(!n.half&&F.clk>n.t+W)failC(n,'MISS')}}
  else if(ph==='recover'||ph==='stagger'){if(F.clk>=F.until){if(F.tleft<=0)endRound();else startNeutral(ph==='stagger')}}
  else if(ph==='block'){if(F.clk>=F.until){if(F.tleft<=0)endRound();else startDefend()}}
  else if(ph==='pdown'&&F.mash>=F.need){F.ph='pup';F.p0=F.clk;banner('BACK UP!',.9,'#7dff9a');SFX.crowd(.18,1.2);at(.8,()=>{F.php=[60,40][Math.min(1,F.pkd-1)];startNeutral()})}
  F.toks=F.toks.filter(n=>F.clk<n.t+.6);
  F.pops=F.pops.filter(p=>F.clk-p.t<.7);
  if(F.shake>0)F.shake=Math.max(0,F.shake-dt*30);if(F.flash>0)F.flash=Math.max(0,F.flash-dt*3);
  fxTick(dt)}

/* ---------- poses ---------- */
const mix=(a,b,k)=>({x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),z:lerp(a.z,b.z,k)});
function punchGlove(kind,side,a,W,H,fake){const guard={x:side*W*.46,y:-H+4,z:1},tgt={x:0,y:20,z:2.3};
  const wind=kind==='hook'?{x:side*W*1.02,y:-H+2,z:.95}:kind==='str'?{x:side*W*.55,y:-H-6,z:.9}:{x:side*W*.3,y:-H*.32,z:1};
  if(a<-.34)return guard;if(a<-.12)return mix(guard,wind,ease((a+.34)/.22));
  if(fake)return a<.1?mix(wind,guard,ease((a+.12)/.22)*.4):mix(wind,guard,ease((a-.1)/.2));
  if(a<=0){const k=(a+.12)/.12;if(kind==='hook'){const c={x:side*W*1.25,y:-H*.15,z:1.4},u=1-k;return{x:u*u*wind.x+2*u*k*c.x+k*k*tgt.x,y:u*u*wind.y+2*u*k*c.y+k*k*tgt.y,z:lerp(wind.z,tgt.z,k*k)}}return mix(wind,tgt,k*k)}
  if(a<.26)return mix(tgt,guard,ease(a/.26));return guard}
function oppPose(){const p=PEOPLE[F.id],b=p.build,W=b.w,H=b.h,c=F.clk,ph=F.ph;
  const P={x:Math.sin(c*2.3)*2.5,y:Math.sin(c*4.6)*1.2,lean:0,fall:0,head:{x:0,y:-H-b.r*1.15,ex:'guard',turn:0},gl:{x:-W*.46,y:-H+4,z:1},gr:{x:W*.46,y:-H+4,z:1}};
  if(ph==='defend'){let best=null,bd=9;for(const n of F.toks){if(n.k!=='d')continue;const a=c-n.t;if(a>-.36&&a<.3&&Math.abs(a)<bd){bd=Math.abs(a);best=n}}
    if(best){const a=c-best.t,kind=best.d==='D'?'str':best.d==='U'?'up':'hook',side=best.d==='R'?-1:best.d==='L'?1:best.d==='U'?1:(best.i%2?1:-1);
      const g=punchGlove(kind,side,a,W,H,best.fake&&best.st!==2);if(side<0)P.gl=g;else P.gr=g;P.lean=a<0&&a>-.34?side*.07*ease((a+.34)/.22):0;P.head.ex=best.fake&&a>-.1?'smug':'angry';P.head.x=-side*2}}
  else if(ph==='counter'||ph==='stagger'){const k=c-F.O.hitT;P.x=Math.sin(c*3)*5;P.head.ex='daze';P.gl={x:-W*.62,y:-H*.45,z:1};P.gr={x:W*.62,y:-H*.45,z:1};P.lean=Math.sin(c*3)*.05;
    if(k<.3){const e=1-k/.3;P.head.ex='hurt';P.head.x+=F.O.side*7*e;P.head.turn=F.O.side*.9*e;P.lean+=F.O.side*.12*e;if(F.O.big){P.head.y-=7*e;P.y+=4*e}}}
  else if(ph==='block'||c-F.O.blockT<.3&&ph==='neutral'){P.gl={x:-W*.2,y:-H-b.r*.8,z:1.05};P.gr={x:W*.2,y:-H-b.r*.8,z:1.05};P.head.ex='smug'}
  else if(ph==='recover'){P.head.ex='grin';P.y+=Math.abs(Math.sin(c*9))*-2}
  else if(ph==='odown'||ph==='ko'){const k=ease((c-F.p0)/.7);P.fall=k;P.y+=12*k;P.head.ex='daze';P.gl={x:-W*.8,y:-H*.3,z:1};P.gr={x:W*.8,y:-H*.3,z:1};P.x=0}
  else if(ph==='oup'){const k=1-ease((c-F.p0)/.85);P.fall=k;P.y+=12*k;P.head.ex='hurt'}
  else if(ph==='pdown'||ph==='pko'){P.head.ex='grin';P.gl={x:-W*.7,y:-H-b.r*2,z:1};P.gr={x:W*.7,y:-H-b.r*2,z:1}}
  else if(ph==='bell'||ph==='intro'){P.head.ex=F.okd?'angry':'guard'}
  if(c-F.O.sayT<1.6&&ph==='neutral')P.head.ex='grin';
  return P}
function playerPose(){const c=F.clk,P={x:0,y:Math.sin(c*4.6+1)*1,rot:0,s:1,gl:{x:-28,y:-50,r:13},gr:{x:28,y:-50,r:13},hurt:0},ph=F.ph;
  const dg=F.P.dodge;if(dg){const a=c-dg.t;if(a>=0&&a<.42){const k=a<.06?a/.06:a<.3?1:1-(a-.3)/.12;
    if(dg.d==='L'){P.x=-36*k;P.rot=-.17*k}else if(dg.d==='R'){P.x=36*k;P.rot=.17*k}else if(dg.d==='D'){P.y+=28*k;P.gl.y+=6*k;P.gr.y+=6*k}else{P.y+=12*k;P.s=1+.08*k;P.gl.y+=10*k;P.gr.y+=10*k}}}
  const pu=F.P.punch;if(pu){const a=c-pu.t;if(a>=0&&a<.3){const b=PEOPLE[F.id].build;
      const k=a<.08?a/.08:1-(a-.08)/.22,reach=pu.blocked?.6:1,tgt={x:0,y:-(OPP_Y-PL_Y)-(b.h+b.r*.6)*b.s*OSC};
      const go=(g,side)=>{g.x=lerp(g.x,tgt.x+side*5,k*reach);g.y=lerp(g.y,tgt.y,k*reach);g.r=lerp(13,8,k*reach);g.front=true};
      if(pu.b==='A')go(P.gl,-1);else if(pu.b==='B')go(P.gr,1);else{go(P.gr,1);P.gr.y-=14*Math.sin(k*Math.PI);P.gr.r+=3*(1-k);P.rot=-.06*k}
      P.rot+=(pu.b==='A'?.04:-.04)*k}}
  const hk=c-F.P.hurtT;if(hk<.4){const e=1-hk/.4;P.x+=Math.sin(c*70)*3*e;P.y+=7*e;P.hurt=e;P.gl.x-=6*e;P.gr.x+=6*e}
  if(ph==='pdown'||ph==='pko'){const k=ease((c-F.p0)/.8);P.y+=130*k;P.rot=.25*k}
  else if(ph==='pup'){const k=1-ease((c-F.p0)/.8);P.y+=130*k;P.rot=.25*k}
  else if(ph==='ko'||ph==='bell'&&F.okd>F.pkd){P.gl.y-=14*Math.abs(Math.sin(c*3));P.gr.y-=14*Math.abs(Math.sin(c*3+1))}
  return P}

/* ================= screens ================= */
let SCR='title',MSEL=0,TT=0,BACKTO='title',MSG=null;
function go(s,sel=0){SCR=s;MSEL=sel;SFX.move()}
function toast(s){MSG={s,t:2}}
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function menuNav(n){const d=menuDir();if(d==='up'){MSEL=(MSEL+n-1)%n;SFX.move()}else if(d==='down'){MSEL=(MSEL+1)%n;SFX.move()}return d}
function drawMenu(items,x,y,px,gap,al='center'){items.forEach((s,i)=>{const on=i===MSEL,yy=y+i*gap;if(on){const w=tw(s,px,700)+26*U;rrect(al==='center'?x-w/2:x-10*U,yy-3*U,w,px*U+7*U,6*U);ctx.fillStyle='rgba(255,216,74,.18)';ctx.fill()}

function help(s){text(s,SW/2,SH-16*U,9,'rgba(255,255,255,.75)','center','#000',600)}
function dimAll(a){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=`rgba(6,4,14,${a})`;ctx.fillRect(0,0,SW,SH)}

/* ---------- title ---------- */
function titleItems(){const it=[];if(SAVE.fight||(SAVE.step>0&&!SAVE.done))it.push(['CONTINUE','cont']);it.push([SAVE.step>0||SAVE.done?'NEW STORY':'START STORY','new'],['CIRCUIT','circ'],['HOW TO PLAY','how'],['SETTINGS','set']);return it}
let CONFIRM=null;const titleIdx=k=>Math.max(0,titleItems().findIndex(x=>x[1]===k));

function titleDraw(){drawScene('crown',TT,null,null,{dim:.35});blit();ctx.setTransform(DPR,0,0,DPR,0,0);

    if(HOW===1){if(it==='AB'){rrect(x-r*1.9,cy-r,r*3.8,r*2,r);ctx.fillStyle='#c8263a';ctx.fill();text('A+B',x,cy-6*U,11,'#fff','center',null,700)}else{circ(x,cy,r,it==='A'?'#c8263a':'#d8961a','#fff',2);text(it,x,cy-6.5*U,12,'#fff','center',null,700)}}
    else if(it==='?'){circ(x,cy,r,'rgba(190,232,255,.9)','#fff',2);text('?',x,cy-6*U,11,'#5a8ab0','center',null,700)}
    else if(it[0]==='*'){ctx.setLineDash([3*U,3*U]);circ(x,cy,r,null,'#b8b0c8',2);ctx.setLineDash([]);arrowGlyph(x,cy,r,it[1],'#b8b0c8')}else{circ(x,cy,r,'#3a0c14','#ff5a5a',2);arrowGlyph(x,cy,r*1.05,it,'#fff')}});
  const lines=wrap(s,SW-36*U,10);lines.forEach((l,i)=>text(l,18*U,108*U+i*14*U,10,'#fff','left','#000'));
  help('◀ ▶ PAGE · B BACK')}

/* ---------- settings ---------- */
function setItems(){return['TIMING  '+TIM().n,'SOUND  '+(muted?'OFF':'ON'),'VIBRATION  '+(HAP.on?'ON':'OFF'),'BACK']}
function settingsTick(){const it=setItems();const d=menuNav(it.length),ch=d==='left'?-1:d==='right'?1:TAP('a')?1:0;
  if(TAP('b')||(TAP('a')&&MSEL===3)){SFX.back();saveNow();go('title',titleIdx('set'));return}
  if(ch&&MSEL===0){SAVE.timing=((SAVE.timing|0)+ch+3)%3;SFX.move()}else if(ch&&MSEL===1){setMute(!muted);if(!muted)SFX.pick()}else if(ch&&MSEL===2){HAP.on=!HAP.on;store.set('vib',HAP.on);haptic(20);SFX.move()}}
function settingsDraw(){drawScene('gym',TT,null,null,{dim:.62});blit();ctx.setTransform(DPR,0,0,DPR,0,0);text('SETTINGS',SW/2,SH*.14,20,'#fff','center','#000',700);drawMenu(setItems(),SW/2,SH*.3,12,22*U);
  const notes=['EASY: wider timing, slower punches. HARD: tight timing.','',''];if(MSEL===0)wrap(notes[0],SW*.8,9).forEach((l,i)=>text(l,SW/2,SH*.3+4*22*U+6*U+i*12*U,9,'#c8c0e0','center'));help('◀ ▶ CHANGE · B BACK')}

/* ================= the loop, saving, the console ================= */
const SCREENS={title:[titleTick,titleDraw],story:[storyTick,storyDraw],card:[cardTick,cardDraw],fight:[fightStep,fightDraw],pause:[pauseTick,pauseDraw],
  corner:[cornerTick,cornerDraw],result:[resultTick,resultDraw],circuit:[circuitTick,circuitDraw],howto:[howtoTick,howtoDraw],settings:[settingsTick,settingsDraw]};
/* the right song for the screen */
function songFor(){if(['fight','pause','card'].includes(SCR)||(SCR==='howto'&&BACKTO==='pause'))return VENUES[F?F.venue:OPP[CARD?CARD.oi:0].venue].song;
  if(SCR==='corner')return'corner';if(SCR==='story')return'story';if(SCR==='result')return null;return'title'}
function step(dt){TT+=dt;const before=SCR;SCREENS[SCR][0](dt);if(MSG&&(MSG.t-=dt)<=0)MSG=null;
  if(AC&&AC.state==='running'){const want=songFor();if(want===null){if(MUS.on)music(false)}else if(!MUS.on||MUS.song!==want)music(true,want)}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';SCREENS[SCR][1]();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(MSG){const w=tw(MSG.s,10,700)+24*U;panel(SW/2-w/2,SH*.5-12*U,w,24*U,'rgba(10,8,20,.92)','#ffd84a',6);text(MSG.s,SW/2,SH*.5-6*U,10,'#ffd84a','center',null,700)}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;step(dt);clearTaps();draw()}
/* ---------- saving ---------- */
saveHook=()=>{if(F&&!F.res&&['fight','pause','corner'].includes(SCR)||(F&&!F.res&&SCR==='howto'&&BACKTO==='pause')){
    SAVE.fight={oi:F.oi,story:F.story,rd:F.rd,tleft:Math.max(15,F.tleft),php:Math.max(25,F.php),ohp:Math.max(20,F.ohp),pkd:F.pkd,okd:F.okd,stats:F.stats}}
  SAVE.mute=muted;SAVE.vib=HAP.on};
function applySave(){if(SAVE.mute!=null&&SAVE.mute!==muted)setMute(SAVE.mute);if(SAVE.vib!=null){HAP.on=SAVE.vib;store.set('vib',HAP.on)}}
applySave();loadAccount(applySave);
setInterval(()=>saveNow(),1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SCR==='fight')go('pause');saveNow(true)}});
addEventListener('pagehide',()=>saveNow(true));
window.ZPCart={title:'Haymaker',input(b,d){rawInput(b,d)},home(){if(SCR==='fight')go('pause');saveNow(true);return true}};
requestAnimationFrame(loop);
/* a test hook, only when the address asks for it */
if(/hmtest/.test(location.href))window.HMT={get F(){return F},get SCR(){return SCR},get SAVE(){return SAVE},OPP,STORY,newFight,go,step,draw,eff,startDefend,startCounter,fightPress,
  run(n,dt=1/60){for(let i=0;i<n;i++){step(dt);clearTaps()}},press(b,offset=0){PRESSES.push({b,at:performance.now()-offset*1000});RAW.tap[b]=true},advanceStory};

})();
</script>
