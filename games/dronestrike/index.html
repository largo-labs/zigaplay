<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drone Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Drone Strike: a drone-unit strategy game for the ZigaPlay.
   Everything looks like a rugged military tablet: olive panels, amber text, thin rules and corner brackets.
   Battles draw a tactical map on a canvas, with a small thermal drone feed for the strikes. */
:root{color-scheme:dark;
  --bg:#060a06;--panel:#0d140c;--panel2:#121d10;--line:#2b3f25;--line2:#46653a;
  --amber:#ffb627;--amber2:#b9821a;--text:#eadfbd;--dim:#8d9878;--green:#93e46c;--cyan:#5fd8ff;--red:#ff5545;--orange:#ff8a3a;
  --ui:'VT323',ui-monospace,monospace;--head:'Pixelify Sans','VT323',ui-monospace,monospace}
*,::before,::after{box-sizing:border-box}
html{font-size:clamp(12px,5vw,20px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;line-height:1.05}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#132313 0%,#070b07 70%)}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:.35rem .4rem;gap:.3rem}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem;border-bottom:1px solid var(--line2);padding:0 .1rem .2rem;color:var(--amber);font-size:.95rem;letter-spacing:.06em;flex:0 0 auto}
.bar b{font-family:var(--head);font-weight:500;font-size:.8rem;letter-spacing:.12em}
.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:.35rem .45rem}
.panel::before,.panel::after{content:'';position:absolute;width:.45rem;height:.45rem;border:2px solid var(--amber2);pointer-events:none}
.panel::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.panel::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.panel h3{margin:0 0 .2rem;font-family:var(--head);font-weight:500;font-size:.72rem;letter-spacing:.14em;color:var(--amber)}
.grow{flex:1 1 auto;min-height:0;overflow:hidden}
.list{display:flex;flex-direction:column;gap:.12rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.4rem;padding:.12rem .35rem;border:1px solid transparent;font-size:1rem;min-height:1.35rem}
.row .r{color:var(--dim);white-space:nowrap}
.row.off{color:#5c6450}
.row.focus{background:var(--amber);color:#120c00;border-color:var(--amber)}
.row.focus .r,.row.focus .dim{color:#3a2a00}
.row.btn{justify-content:center;border-color:var(--line2);letter-spacing:.12em;font-size:1.05rem}
.row.btn.focus{border-color:var(--amber)}
.row.big{font-size:1.2rem;min-height:1.8rem}
.dim{color:var(--dim)}.amb{color:var(--amber)}.grn{color:var(--green)}.red{color:var(--red)}.cyn{color:var(--cyan)}
.small{font-size:.85rem}
.qty{display:inline-flex;align-items:center;gap:.25rem}
.qty i{font-style:normal;opacity:.7}
.qty b{min-width:1.6rem;text-align:center;font-weight:400}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:.42rem;height:.65rem;border:1px solid var(--line2);display:block}
.meter i.on{background:var(--amber);border-color:var(--amber)}
.meter i.red{background:var(--red);border-color:var(--red)}
.meter i.grn{background:var(--green);border-color:var(--green)}
.front{display:flex;gap:2px;align-items:center}
.front i{flex:1;height:.55rem;border:1px solid var(--line2);display:block}
.front i.us{background:var(--cyan);border-color:var(--cyan)}.front i.them{background:var(--red);border-color:var(--red)}
.desc{font-size:.9rem;color:#cfc6a4;min-height:2.6em}
.tag{display:inline-block;padding:0 .25rem;border:1px solid currentColor;font-size:.8rem;line-height:1.1;margin-left:.2rem}
.stamp{font-family:var(--head);font-size:1.6rem;letter-spacing:.14em;text-align:center;padding:.2rem;border:3px solid currentColor;transform:rotate(-4deg);margin:.4rem auto;width:max-content}
.hint{font-size:.78rem;color:var(--dim);text-align:center;flex:0 0 auto}
.scroll{overflow:hidden;position:relative}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(2,5,2,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:.6rem}
.ov .panel{width:100%;max-width:22rem}
.msg{font-size:1.05rem;line-height:1.15;white-space:pre-line}
.msg .who{color:var(--amber);letter-spacing:.08em;display:block;margin-bottom:.15rem}
.more{text-align:right;color:var(--amber);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.toast{position:absolute;left:50%;top:.5rem;transform:translateX(-50%);z-index:40;background:var(--amber);color:#120c00;padding:.1rem .5rem;font-size:1rem;white-space:nowrap;animation:fadeout 1.8s forwards}
@keyframes fadeout{0%,75%{opacity:1}100%{opacity:0}}
/* title */
#title h1{margin:0;font-family:var(--head);font-weight:700;font-size:2.6rem;letter-spacing:.08em;color:var(--amber);text-align:center;line-height:.95;text-shadow:0 0 10px rgba(255,182,39,.45)}
#title .sub{color:var(--green);text-align:center;letter-spacing:.3em;font-size:.9rem}
/* battle */
.mapbox{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line2);background:#081108}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.feed{position:absolute;right:.3rem;top:.3rem;width:42%;aspect-ratio:3/2;border:1px solid var(--green);background:#000;display:none}
.feed canvas{width:100%;height:100%}
.feed span{position:absolute;left:.2rem;top:.05rem;font-size:.7rem;color:var(--green);text-shadow:0 0 2px #000}
.feed.on{display:block}
.log{font-size:.88rem;line-height:1.1;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.log div{white-space:normal}
/* portraits */
.port{width:3.4rem;height:4.2rem;border:1px solid var(--line2);background:#0a120a;flex:0 0 auto}
/* touch controls when played on its own */
body.touch{display:flex;flex-direction:column}
body.touch #app{height:auto;flex:1;min-height:0}
#pad{display:none}
body.touch #pad{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:34vh;max-height:290px;padding:.5rem 1.2rem calc(.6rem + env(safe-area-inset-bottom,0px));background:#0b120b;border-top:1px solid var(--line2);position:relative}
#pad .dp{position:relative;width:9.5rem;height:9.5rem;justify-self:center}
#pad b{font-weight:400}
#pad .dp b{position:absolute;width:3.2rem;height:3.2rem;background:#1a2a17;border:1px solid var(--line2)}
#pad b.on{background:#3b5a2c!important}
#pad .dp .u{left:3.15rem;top:0}#pad .dp .d{left:3.15rem;bottom:0}#pad .dp .l{left:0;top:3.15rem}#pad .dp .r{right:0;top:3.15rem}
#pad .ab{position:relative;width:9rem;height:7rem;justify-self:center}
#pad .ab b{position:absolute;width:3.8rem;height:3.8rem;border-radius:50%;background:#3a2a08;border:1px solid var(--amber2);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
#pad .ab .a{right:0;top:0}#pad .ab .b{left:0;bottom:0}
#pad .ss{position:absolute;left:50%;bottom:calc(.4rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:1rem}
#pad .ss b{padding:.15rem .8rem;background:#1a2a17;border:1px solid var(--line2);font-size:.8rem;color:var(--dim);letter-spacing:.1em}
</style>
</head>
<body>
<div id="app"></div>
<div id="pad"><div class="dp"><b class="u" data-b="up"></b><b class="d" data-b="down"></b><b class="l" data-b="left"></b><b class="r" data-b="right"></b></div>
<div class="ab"><b class="a" data-b="a">A</b><b class="b" data-b="b">B</b></div><div class="ss"><b data-b="select">SELECT</b><b data-b="start">START</b></div></div>
<script>
(()=>{'use strict';
/* ===================== AUDIO: synth effects and a small music sequencer ===================== */
const AU=(()=>{
  const ZP=(()=>{try{return window.parent&&window.parent!==window&&window.parent.ZIGAPLAY||null}catch(e){return null}})();
  const AC=(ZP&&ZP.AudioContext)||window.AudioContext||window.webkitAudioContext;
  let ctx=null,master,musicBus,sfxBus,noiseBuf,musicOn=true,sfxOn=true,pending='',gestured=false;
  function init(){if(ctx||!AC)return;try{ctx=new AC()}catch(e){return}
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    musicBus=ctx.createGain();musicBus.gain.value=.5;musicBus.connect(master);sfxBus=ctx.createGain();sfxBus.gain.value=.75;sfxBus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  function unlock(){gestured=true;init();if(ctx&&ctx.state!=='running')ctx.resume().then(()=>{if(pending&&!cur){const n=pending;curName='';music(n)}}).catch(()=>{})}
  const now=()=>ctx?ctx.currentTime+.005:0;
  function tone(type,f,t,len,vol,bus,o={}){if(!ctx)return;const os=ctx.createOscillator(),g=ctx.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
    if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+len);if(o.det)os.detune.value=o.det;
    let node=os;if(o.lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.lp,t);if(o.lp2)fl.frequency.exponentialRampToValueAtTime(o.lp2,t+len);fl.Q.value=o.q||1;os.connect(fl);node=fl}
    const a=o.a||.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);
    if(o.decay)g.gain.exponentialRampToValueAtTime(Math.max(.0004,vol*o.decay),t+len);else g.gain.setValueAtTime(vol,t+Math.max(a,len-(o.r||.05)));
    g.gain.linearRampToValueAtTime(0,t+len+(o.tail||0));node.connect(g);g.connect(bus||sfxBus);os.start(t);os.stop(t+len+(o.tail||0)+.05)}
  function noise(t,len,vol,bus,o={}){if(!ctx)return;const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();s.buffer=noiseBuf;
    f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+len);f.Q.value=o.q||.7;
    g.gain.setValueAtTime(o.a?0:vol,t);if(o.a)g.gain.linearRampToValueAtTime(vol,t+o.a);g.gain.exponentialRampToValueAtTime(.0005,t+len);
    s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,Math.random());s.stop(t+len+.05)}
  const SFX={
    tick(){tone('square',1200,now(),.025,.03)},
    ok(){const t=now();tone('square',880,t,.04,.04);tone('square',1320,t+.045,.06,.04)},
    back(){const t=now();tone('square',660,t,.04,.035);tone('square',440,t+.045,.06,.035)},
    buzz(){tone('sawtooth',120,now(),.15,.04)},
    radio(){const t=now();noise(t,.12,.08,null,{type:'bandpass',f:1800,q:2});tone('sine',1400,t+.1,.06,.05);tone('sine',1900,t+.17,.08,.05)},
    type(){noise(now(),.02,.03,null,{type:'highpass',f:3000})},
    launch(){const t=now();noise(t,.7,.12,null,{type:'bandpass',f:400,f2:2600,q:3,a:.1});tone('sawtooth',90,t,.7,.03,null,{slide:220,lp:600})},
    buzzfly(){const t=now();for(let i=0;i<3;i++)tone('sawtooth',170+i*23,t+i*.02,1.2,.012,null,{lp:900,det:i*12})},
    boom(){const t=now();noise(t,.9,.35,null,{f:900,f2:60});tone('sine',70,t,.6,.3,null,{slide:30,decay:.01})},
    smallboom(){const t=now();noise(t,.35,.2,null,{f:1600,f2:120});tone('sine',110,t,.25,.15,null,{slide:50,decay:.02})},
    aa(){const t=now();for(let i=0;i<6;i++)noise(t+i*.07,.05,.12,null,{type:'bandpass',f:900,q:1.5})},
    jam(){const t=now();noise(t,.6,.12,null,{type:'bandpass',f:2400,f2:600,q:4});tone('square',220,t,.5,.02,null,{slide:3000})},
    zap(){const t=now();tone('sawtooth',1800,t,.15,.04,null,{slide:300})},
    stamp(){const t=now();noise(t,.18,.3,null,{f:500});tone('square',196,t,.25,.05,null,{decay:.05})},
    cash(){const t=now();[1047,1319,1568,2093].forEach((f,i)=>tone('square',f,t+i*.05,.09,.035))},
    research(){const t=now();[523,659,784,1047,1568].forEach((f,i)=>tone('triangle',f,t+i*.07,.18,.07,null,{decay:.1}))},
    alarm(){const t=now();for(let i=0;i<3;i++){tone('square',880,t+i*.3,.14,.04);tone('square',660,t+i*.3+.15,.14,.04)}},
    static(){noise(now(),.4,.1,null,{type:'highpass',f:2000})},
    win(){const t=now();[392,523,659,784].forEach((f,i)=>tone('sawtooth',f,t+i*.12,.5,.035,null,{lp:2400,decay:.2}))},
    lose(){const t=now();[392,349,311,262].forEach((f,i)=>tone('sawtooth',f,t+i*.2,.5,.035,null,{lp:1400,decay:.2}))},
  };
  function play(n){if(!sfxOn)return;unlock();if(ctx&&ctx.state==='running'&&SFX[n])try{SFX[n]()}catch(e){}}
  /* ---------- music: notes are "A2:4" (length in sixteenths); a chord is "A2+C3+E3:16" ---------- */
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const fq=n=>{const m=/^([A-G])([#b]?)(-?\d)$/.exec(n);if(!m)return 0;const s=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(s-69)/12)};
  const parse=str=>{let len=4;return str.trim().split(/\s+/).map(tok=>{const [n,l]=tok.split(':');if(l)len=+l;return[n==='-'?null:n==='x'||n==='k'||n==='s'?n:n.split('+').map(fq),len]})};
  const rep=(s,n)=>Array(n).fill(s).join(' ');
  const SONGS={
    title:{bpm:70,ch:[
      {w:'pad',v:.045,n:'A2+E3+A3:32 F2+C3+A3:32 D2+A2+F3:32 E2+B2+G#3:32'},
      {w:'bass',v:.12,n:rep('A1:4 -:4 A1:2 -:6',4)+' '+rep('F1:4 -:4 F1:2 -:6',4)+' '+rep('D1:4 -:4 D1:2 -:6',4)+' '+rep('E1:4 -:4 E1:2 -:6',4)},
      {w:'lead',v:.03,n:'-:16 E4:8 C4:8 -:16 A3:16 -:16 D4:8 F4:8 E4:32'}]},
    hq:{bpm:84,ch:[
      {w:'pad',v:.035,n:'D3+F3+A3:32 Bb2+D3+F3:32 C3+E3+G3:32 A2+C#3+E3:32'},
      {w:'bass',v:.1,n:rep('D2:2 -:2',8)+' '+rep('Bb1:2 -:2',8)+' '+rep('C2:2 -:2',8)+' '+rep('A1:2 -:2',8)},
      {w:'blip',v:.02,n:'-:12 A5:1 -:3 -:16 -:12 F5:1 -:3 -:16 -:12 G5:1 -:3 -:16 -:12 E5:1 -:3 -:16'}]},
    battle:{bpm:132,ch:[
      {w:'bass',v:.12,n:rep('E1:1 E1:1 E2:1 E1:1',8)+' '+rep('C1:1 C1:1 C2:1 C1:1',4)+' '+rep('D1:1 D1:1 D2:1 D1:1',4)},
      {w:'pad',v:.03,n:'E2+B2+G3:32 C2+G2+E3:16 D2+A2+F#3:16'},
      {w:'lead',v:.028,n:'-:8 B3:2 C4:2 B3:4 -:16 G3:4 A3:4 -:8 B3:2 C4:2 D4:4 E4:8 -:4 D4:4 C4:8 B3:8'},
      {w:'drum',v:.05,n:rep('k:4 x:2 x:2 s:4 x:2 x:2',8)}]},
    debrief:{bpm:76,ch:[
      {w:'pad',v:.04,n:'C3+E3+G3:32 A2+C3+E3:32 F2+A2+C3:32 G2+B2+D3:32'},
      {w:'lead',v:.03,n:'E4:8 G4:8 C5:16 -:8 A4:8 E4:16 F4:8 A4:8 C5:16 B4:16 G4:16'}]},
    tension:{bpm:60,ch:[{w:'pad',v:.04,n:'C2+G2+Eb3:32 Db2+Ab2+F3:32'},{w:'bass',v:.1,n:rep('C1:8 -:8',2)+' '+rep('Db1:8 -:8',2)}]},
  };
  let cur=null,curName='',timer=null;
  function voice(c,f,t,len){
    if(c.w==='pad'){for(const x of f)for(const d of[-7,7])tone('sawtooth',x,t,len,c.v/f.length,cur.g,{lp:700,q:2,a:len*.25,r:len*.3,det:d})}
    else if(c.w==='bass'){for(const x of f)tone('sawtooth',x,t,len*.9,c.v,cur.g,{lp:420,lp2:160,q:5})}
    else if(c.w==='lead'){for(const x of f)tone('square',x,t,len*.95,c.v,cur.g,{lp:1800,a:.02})}
    else if(c.w==='blip'){for(const x of f)tone('sine',x,t,.08,c.v*2,cur.g,{decay:.05})}}
  function music(name){pending=name;if(!gestured&&!ctx)return;if(name===curName)return;stop();curName=name;if(!name||!SONGS[name]||!ctx||ctx.state!=='running')return;
    const s=SONGS[name],sp=60/s.bpm/4,t0=ctx.currentTime+.1;const g=ctx.createGain();g.gain.value=musicOn?1:0;g.connect(musicBus);
    cur={g,sp,chs:s.ch.map(c=>({...c,ev:parse(c.n),i:0,t:t0}))};timer=setInterval(pump,40);pump()}
  function pump(){if(!cur||!ctx)return;const ahead=ctx.currentTime+.25;
    for(const c of cur.chs){let n=0;while(c.t<ahead&&n++<64){const [f,l]=c.ev[c.i],len=l*cur.sp;
      if(f){if(c.w==='drum'){if(f==='k')tone('sine',120,c.t,.15,.25,cur.g,{slide:40,decay:.02});else if(f==='s')noise(c.t,.12,c.v*2,cur.g,{type:'bandpass',f:1500});else noise(c.t,.03,c.v,cur.g,{type:'highpass',f:6000})}else voice(c,f,c.t,len)}
      c.t+=len;c.i=(c.i+1)%c.ev.length}}}
  function stop(){if(timer)clearInterval(timer);timer=null;if(cur&&ctx){const g=cur.g;try{g.gain.setTargetAtTime(0,ctx.currentTime,.08);setTimeout(()=>g.disconnect(),600)}catch(e){}}cur=null;curName=''}
  return{unlock,play,music,stop,setMusic(o){musicOn=o;if(cur)cur.g.gain.value=o?1:0},setSfx(o){sfxOn=o},get musicOn(){return musicOn},get sfxOn(){return sfxOn}};
})();

/* ===================== DATA ===================== */
// target categories: inf armor arty logi struct aa ew naval
const CATS={inf:'Infantry',armor:'Armor',arty:'Artillery',logi:'Logistics',struct:'Structures',aa:'Air defense',ew:'Jammers',naval:'Naval'};
// range: 0 front line only, 1 also the near rear, 2 anywhere. eva: chance to dodge a shot. jr: jamming resistance (1 = immune)
// exp: expendable (used up when it strikes). Reusable drones strike every wave they survive and come home after.
const DRONES={
  fpv:{name:'FPV Kamikaze',short:'FPV',cost:2,slots:1,range:1,eva:.15,jr:0,exp:1,
    atk:{inf:6,armor:5,arty:6,logi:6,struct:1,aa:3,ew:5,naval:1},desc:'Cheap, fast and one-way. Strong on troops and trucks. Jamming knocks it out of the sky.'},
  recon:{name:'Recon Wing',short:'RCN',cost:6,slots:1,range:2,eva:.4,jr:.25,exp:0,recon:1,atk:{},
    desc:'Finds hidden targets and guides every strike in its wave: +10% accuracy each, up to +30%. Comes home.'},
  decoy:{name:'Decoy Swarm',short:'DCY',cost:1,slots:1,range:2,eva:0,jr:1,exp:1,decoy:1,atk:{},
    desc:'Foam wings and a radar reflector. Air defense wastes its shots on decoys first.'},
  hexa:{name:'Hexa Bomber',short:'HEX',cost:7,slots:1,range:0,eva:.05,jr:.15,exp:0,
    atk:{inf:6,armor:2,arty:4,logi:3,struct:2,aa:2,ew:3},desc:'Drops grenades, flies home, does it again next wave. Slow and loud: easy prey for guns.'},
  loiter:{name:'Loitering Munition',short:'LM',cost:12,slots:1,range:2,eva:.25,jr:.3,exp:1,
    atk:{armor:15,arty:14,logi:8,aa:9,ew:9,inf:3,struct:6,naval:7},desc:'Circles until it finds armor, then dives. The tank killer.'},
  intercept:{name:'Interceptor',short:'INT',cost:5,slots:1,range:2,eva:.3,jr:.3,exp:0,interceptor:1,atk:{},
    desc:'Hunts enemy drones before they reach your wave. Useless against ground targets.'},
  hunter:{name:'Radar Hunter',short:'RH',cost:14,slots:1,range:2,eva:.35,jr:.6,exp:1,hunter:1,

const COL={ground:'#0b150b',grid:'rgba(120,170,90,.10)',contour:'rgba(140,190,100,.16)',river:'#13394a',riverHi:'#1f5a70',road:'rgba(190,170,110,.28)',forest:'rgba(70,130,60,.35)',

/* ---------- the terrain under a mission, drawn once per mission and size ---------- */
const terrCache=new Map();
function terrain(m,W,H){const k=m.seed+'|'+W+'x'+H;let c=terrCache.get(k);if(c)return c;c=mk(W,H);const g=c.getContext('2d');const r=srng(m.seed);
  g.fillStyle=COL.ground;g.fillRect(0,0,W,H);
  // contour rings around a few hills
  g.strokeStyle=COL.contour;g.lineWidth=1;
  for(let h=0;h<5;h++){const cx=r()*W,cy=r()*H*.85,rad=(.12+r()*.18)*W;for(let i=1;i<=4;i++){g.beginPath();for(let a=0;a<=Math.PI*2+.01;a+=.2){const wob=1+Math.sin(a*3+h)*.12+Math.sin(a*5+i)*.06;const x=cx+Math.cos(a)*rad*i/4*wob,y=cy+Math.sin(a)*rad*i/4*wob*.7;a?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
  // forests
  g.fillStyle=COL.forest;for(let f=0;f<6;f++){const cx=r()*W,cy=r()*H*.85;for(let i=0;i<40;i++){const a=r()*6.28,d=r()*W*.07;g.fillRect(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.7,2,2)}}
  // sea down the right edge
  if(m.sea){g.fillStyle=COL.sea;g.beginPath();g.moveTo(W,0);for(let y=0;y<=H;y+=8)g.lineTo(W*(.6+Math.sin(y/37)*.03+Math.sin(y/11)*.008),y);g.lineTo(W,H);g.fill();
    g.strokeStyle=COL.seaHi;g.beginPath();for(let y=0;y<=H;y+=8)g.lineTo(W*(.6+Math.sin(y/37)*.03+Math.sin(y/11)*.008),y);g.stroke();
    g.strokeStyle='rgba(95,216,255,.08)';for(let y=10;y<H;y+=14){g.beginPath();g.moveTo(W*.68,y);g.lineTo(W*.95,y+3);g.stroke()}}
  // a river winding across
  else{g.strokeStyle=COL.river;g.lineWidth=Math.max(4,W*.022);g.beginPath();const y0=H*(.22+r()*.3);g.moveTo(-10,y0);g.bezierCurveTo(W*.3,y0+H*(r()-.5)*.4,W*.7,y0+H*(r()-.5)*.4,W+10,y0+(r()-.5)*H*.2);g.stroke();
    g.strokeStyle=COL.riverHi;g.lineWidth=1;g.stroke()}
  // roads
  g.strokeStyle=COL.road;g.lineWidth=1.5;g.setLineDash([]);for(let i=0;i<3;i++){g.beginPath();const x=W*(.15+r()*.7);g.moveTo(x,H);g.bezierCurveTo(x+(r()-.5)*W*.5,H*.6,x+(r()-.5)*W*.5,H*.3,W*(.1+r()*.8),0);g.stroke()}
  // towns
  g.fillStyle=COL.town;for(let t=0;t<4;t++){const cx=r()*W*(m.sea?.55:1),cy=H*(.08+r()*.75);for(let i=0;i<7;i++)g.fillRect(cx+(r()-.5)*W*.06,cy+(r()-.5)*W*.05,3+r()*3,3+r()*3)}
  // grid
  g.strokeStyle=COL.grid;g.lineWidth=1;for(let i=1;i<8;i++){g.beginPath();g.moveTo(W*i/8,0);g.lineTo(W*i/8,H);g.stroke()}for(let i=1;i<10;i++){g.beginPath();g.moveTo(0,H*i/10);g.lineTo(W,H*i/10);g.stroke()}
  g.fillStyle='rgba(150,190,110,.35)';g.font=`${Math.round(W*.03)}px VT323, monospace`;for(let i=0;i<8;i++)g.fillText(String.fromCharCode(65+i),W*i/8+3,W*.035);
  terrCache.set(k,c);return c}

/* ---------- hostile unit symbol: a diamond with a sign for its kind ---------- */
function unitSymbol(g,u,x,y,s,{focus=false,flash=0,t=0}={}){
  g.save();g.translate(x,y);
  if(u.hidden){g.strokeStyle='rgba(255,85,69,.7)';g.setLineDash([3,3]);g.lineWidth=1.5;g.beginPath();g.moveTo(0,-s);g.lineTo(s,0);g.lineTo(0,s);g.lineTo(-s,0);g.closePath();g.stroke();g.setLineDash([]);
    g.fillStyle='rgba(255,85,69,.8)';g.font=`${Math.round(s*1.2)}px VT323, monospace`;g.textAlign='center';g.textBaseline='middle';g.fillText('?',0,1);g.restore();return}
  const col=u.dead?COL.dead:flash>0?'#ffffff':COL.enemy;
  g.fillStyle=u.dead?'rgba(60,60,50,.6)':'rgba(255,85,69,.16)';g.strokeStyle=col;g.lineWidth=u.prim?2:1.3;
  g.beginPath();g.moveTo(0,-s);g.lineTo(s,0);g.lineTo(0,s);g.lineTo(-s,0);g.closePath();g.fill();g.stroke();
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.2;const q=s*.42;
  switch(u.cat){
    case'inf':g.beginPath();g.moveTo(-q,-q);g.lineTo(q,q);g.moveTo(q,-q);g.lineTo(-q,q);g.stroke();break;
    case'armor':g.beginPath();g.ellipse(0,0,q*1.2,q*.6,0,0,7);g.stroke();break;
    case'arty':g.beginPath();g.arc(0,0,q*.45,0,7);g.fill();break;
    case'logi':g.beginPath();g.moveTo(-q,q*.2);g.lineTo(q,q*.2);g.stroke();g.beginPath();g.arc(-q*.6,q*.55,q*.3,0,7);g.arc(q*.6,q*.55,q*.3,0,7);g.fill();break;
    case'struct':g.strokeRect(-q*.8,-q*.6,q*1.6,q*1.2);g.beginPath();g.moveTo(-q*.8,-q*.6);g.lineTo(0,-q*1.1);g.lineTo(q*.8,-q*.6);g.stroke();break;
    case'aa':g.beginPath();g.arc(0,q*.4,q*.9,Math.PI,0);g.stroke();g.beginPath();g.moveTo(0,q*.4);g.lineTo(q*.5,-q*.6);g.stroke();break;
    case'ew':g.beginPath();g.moveTo(-q,q*.5);g.lineTo(-q*.3,-q*.5);g.lineTo(q*.3,q*.5);g.lineTo(q,-q*.5);g.stroke();break;
    case'naval':g.beginPath();g.moveTo(-q,-q*.1);g.lineTo(q,-q*.1);g.lineTo(q*.6,q*.5);g.lineTo(-q*.6,q*.5);g.closePath();g.stroke();break}
  if(u.dead){g.strokeStyle='#8d9878';g.lineWidth=1.5;g.beginPath();g.moveTo(-s*.8,-s*.8);g.lineTo(s*.8,s*.8);g.moveTo(s*.8,-s*.8);g.lineTo(-s*.8,s*.8);g.stroke()}
  else{const w=s*1.8,f=Math.max(0,u.hp/u.max);g.fillStyle='rgba(0,0,0,.6)';g.fillRect(-w/2,s+3,w,3);g.fillStyle=f>.5?'#93e46c':f>.25?'#ffb627':'#ff5545';g.fillRect(-w/2,s+3,w*f,3)}
  if(u.prim&&!u.dead){g.fillStyle=COL.amber;g.font=`${Math.round(s*.9)}px VT323, monospace`;g.textAlign='center';g.fillText('★',s*.95,-s*.55)}
  if(focus){const b=s*1.45+Math.sin(t/5)*1.5;g.strokeStyle=COL.amber;g.lineWidth=2;for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){g.beginPath();g.moveTo(sx*b,sy*b*.55);g.lineTo(sx*b,sy*b);g.lineTo(sx*b*.55,sy*b);g.stroke()}}
  g.restore()}

function droneIcon(d,s=16){const c=mk(s,s),g=c.getContext('2d');g.strokeStyle='#5fd8ff';g.fillStyle='#5fd8ff';g.lineWidth=1;const m=s/2;

/* ===================== SIMULATION: the campaign, missions and strikes ===================== */
let S=null;
const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[rnd()*a.length|0];
function newState(unit){return{v:1,unit,funds:90,prestige:0,research:{},stock:{fpv:14,recon:2},camp:0,battle:0,front:0,results:[],
  usage:{},usageAll:{},stats:{sorties:0,strikes:0,kills:0,lost:0,spent:0,battles:0,wins:0},mission:null,checkpoint:null,seen:{},time:0}}
const has=id=>!!(S&&S.research[id]);
const unlocked=d=>d==='fpv'||d==='recon'||RESEARCH.some(r=>r.unlock===d&&has(r.id));
function rankIdx(p=S.prestige){let r=0;RANKS.forEach(([,need],i)=>{if(p>=need)r=i});return r}
const rankName=()=>RANKS[rankIdx()][0];
function slots(){return 10+(has('crew1')?2:0)+(has('crew2')?2:0)+(has('crew3')?3:0)}
function costOf(d){return Math.max(1,Math.round(DRONES[d].cost*(has('workshop')?.8:1)))}
function jamRes(d){const b=DRONES[d].jr;return b>=1?1:Math.min(.95,b+(has('hop')?.25:0)+(has('auto')?.25:0))}
function dmgMult(){return 1+(has('pay1')?.15:0)+(has('pay2')?.15:0)+(has('pay3')?.2:0)}
function baseAcc(){return .72+(has('thermal')?.1:0)}
const general=()=>GENERALS[S.camp];

/* ---------- missions ---------- */
function shares(u){const tot=Object.values(u).reduce((a,b)=>a+b,0)||1;const s={};for(const k in u)s[k]=u[k]/tot;return{s,tot}}
function adaptation(){const g=general();const src=g.adaptive?S.usageAll:S.usage;const {s,tot}=shares(src);const out={ew:0,aagun:0,sam:0,decoy:1,hide:0,notes:[]};
  if(tot<12||(S.battle===0&&!g.adaptive))return out;const k=g.adaptive?.75:1,m=g.adaptive?2:1;
  if((s.fpv||0)+(s.hexa||0)>.45*k){out.ew+=m;out.notes.push('They have brought in jammers to stop your FPVs.')}
  if((s.hexa||0)>.2*k){out.aagun+=m;out.notes.push('More anti-aircraft guns: your slow bombers have been noticed.')}
  if((s.longr||0)+(s.hunter||0)+(s.loiter||0)+(s.ucav||0)>.4*k){out.sam+=1;out.notes.push('A new SAM site is covering their rear.')}
  if((s.decoy||0)>.22*k){out.decoy=.5;out.notes.push('Their gunners have learned to tell decoys from real drones.')}
  if((s.recon||0)>.15*k){out.hide=.15;out.notes.push('They are camouflaging more of their units.')}
  return out}
function genMission(){const g=general(),key=g.missions[S.battle],R=MISSIONS[key];const c=S.camp,b=S.battle;
  const ad=adaptation();const hpk=1+c*.12+b*.03;const units=[];
  const add=(type,prim,dep)=>{const U=UNITS[type];units.push({type,name:U.name,cat:U.cat,depth:dep!=null?dep:U.depth,max:Math.round(U.hp*hpk),hp:0,val:U.val,prim,shots:U.shots||0,acc:U.acc||0,jam:U.jam||0,spawn:U.spawn||0,hidden:false,dead:false})};
  const extra=Math.floor((c+b)/4);
  R.prim.forEach(([t,n,dep],i)=>{const e=i===0?Math.floor(extra/2):i===1&&n>1?Math.ceil(extra/2):0;for(let k=0;k<n+e;k++)add(t,1,dep)});
  R.esc.forEach(([t,n])=>{for(let k=0;k<n;k++)add(t,0)});
  const sea=['naval','coastal','finalsea'].includes(key);
  for(let i=0;i<g.aa-1+(c>=2&&b>=2?1:0);i++)add(c>=2&&i%2===0?'sam':'aagun',0);
  for(let i=0;i<g.ew;i++)if(i===0||b>=2)add('ew',0);
  if(g.dr&&b>=1)add('hive',0);
  for(let i=0;i<ad.ew;i++)add('ew',0);for(let i=0;i<ad.aagun;i++)add('aagun',0);for(let i=0;i<ad.sam;i++)add('sam',0);
  if(!sea&&b>=1&&rnd()<.6)add(pick(['squad','truck','apc']),0);
  units.forEach(u=>{u.hp=u.max;u.hidden=!has('intel')&&rnd()<(g.hide+ad.hide)*(u.prim?.5:1)});
  // positions: depth rows from the front line (low) to the deep rear (high); the sea runs down the right edge
  const rows=[[],[],[]];units.forEach(u=>rows[u.depth].push(u));
  rows.forEach((r,d)=>r.forEach((u,i)=>{const n=r.length;const x0=sea&&u.cat==='naval'?.62:.1,x1=sea?(u.cat==='naval'?.92:.58):.9;
    u.x=x0+(x1-x0)*((i+.5)/n)+(rnd()-.5)*.05;u.y=[.6,.4,.18][d]+(rnd()-.5)*.08}));
  return{key,name:R.name,brief:R.brief,final:!!R.final,sea,units,reward:R.reward+c*8,notes:ad.notes,seed:(rnd()*1e9)|0,decoyEff:ad.decoy,genDr:g.dr,genEw:g.ew}}
function threat(m){const live=m.units.filter(u=>!u.dead&&!u.hidden);
  const aa=live.reduce((s,u)=>s+u.shots*u.acc,0),ew=live.reduce((s,u)=>s+u.jam,0)+m.genEw*.05,dr=live.reduce((s,u)=>s+u.spawn,0)+m.genDr*1.5;
  return{aa,ew,dr,aaL:aa<=0?0:aa<1?1:aa<2.2?2:3,ewL:ew<=.06?0:ew<.3?1:ew<.6?2:3,drL:dr<=0?0:dr<3?1:dr<5?2:3}}

/* ---------- how good a drone is against this mission (0-3 bars) ---------- */
function fit(d,m){const D=DRONES[d];if(D.recon)return m.units.some(u=>u.hidden)?3:1;if(D.decoy)return threat(m).aaL>=2?3:threat(m).aaL?2:0;
  if(D.interceptor)return threat(m).drL>=2?3:threat(m).drL?2:0;
  let bp=0,be=0;for(const u of m.units){if(u.dead||u.depth>D.range)continue;const a=D.atk[u.cat]||0;if(!a)continue;if(u.prim)bp=Math.max(bp,a/u.max);else be=Math.max(be,a/u.max)}
  const t=threat(m);let v=Math.max(bp>=.9?3:bp>=.45?2:bp>0?1:0,Math.min(be>=.6?2:be>0?1:0,D.hunter?2:1));if(v&&!D.exp&&t.aaL>=3&&D.eva<.3)v--;if(v&&jamRes(d)<.3&&t.ewL>=2)v--;return v}

/* ---------- one wave ---------- */
function resolveWave(B,launch,focus){
  const m=B.m,ev=[];const ds=[];let id=0;
  for(const [t,n] of Object.entries(launch))for(let i=0;i<n;i++)ds.push({t,D:DRONES[t],id:id++,fate:null,target:null});
  const live=()=>ds.filter(d=>!d.fate);const L=u=>!u.dead;
  // 1. jamming
  const jam=Math.min(.7,m.units.filter(L).reduce((s,u)=>s+u.jam,0)+m.genEw*.05);
  if(jam>0)for(const d of ds){if(d.D.decoy)continue;if(rnd()<jam*(1-jamRes(d.t))){d.fate='jam';ev.push({k:'jam',d})}}
  // 2. drone fights
  let E=Math.round(m.units.filter(L).reduce((s,u)=>s+u.spawn,0)+m.genDr*1.5+(m.genDr?rnd()*1.5:0));B.enemyDr=E;
  for(const d of live().filter(d=>d.D.interceptor)){for(let k=0;k<2&&E>0;k++)if(rnd()<.8){E--;ev.push({k:'intercept',d})}}
  for(let i=0;i<E;i++){const pool=live().filter(d=>!d.D.interceptor);const v=pool.length?pick(pool):pick(live()||[]);if(!v)break;if(rnd()<.45*(1-v.D.eva*.5)){v.fate='drone';ev.push({k:'dronekill',d:v})}}
  const accB=baseAcc(),mult=dmgMult();
  const strike=(d,u)=>{const a=(d.D.atk[u.cat]||0)*mult*(.85+rnd()*.3);const hit=rnd()<accB+B.recon;const dmg=Math.max(1,Math.round(a*(hit?1:.3)));
    u.hp-=dmg;d.target=u;S.stats.strikes++;const kill=u.hp<=0&&!u.dead;if(kill){u.dead=true;u.hp=0;S.stats.kills++}ev.push({k:'strike',d,u,dmg,kill,hit});if(d.D.exp)d.fate='spent'};
  const pickTarget=(d,list)=>{let best=null,bs=0;for(const u of list){if(u.dead||u.hidden||u.depth>d.D.range)continue;const a=d.D.atk[u.cat]||0;if(!a)continue;
      const left=u.hp-(u.pend||0);let s=a*(u.prim?1.4:1)*(u===focus?4:1)*(left>0?1:.08)*(d.D.hunter&&(u.cat==='aa'||u.cat==='ew')?5:1);if(s>bs){bs=s;best=u}}return best};
  // 3. recon reveals before anything is aimed
  const rc=live().filter(d=>d.D.recon).length;B.recon=Math.min(.3,rc*.1);
  if(rc&&m.units.some(u=>u.hidden&&!u.dead)){m.units.forEach(u=>{if(u.hidden){u.hidden=false;ev.push({k:'reveal',u})}})}
  // 4. radar hunters strike the air defense before it fires
  m.units.forEach(u=>u.pend=0);
  for(const d of live().filter(d=>d.D.hunter)){const u=pickTarget(d,m.units.filter(u=>u.cat==='aa'||u.cat==='ew'));if(u){u.pend+=d.D.atk[u.cat]*mult;strike(d,u)}}
  // 5. air defense fires
  for(const u of m.units.filter(u=>L(u)&&u.shots&&!u.hidden)){const acc=u.acc*(1+B.alert*.15);for(let s=0;s<u.shots;s++){const pool=live();if(!pool.length)break;
      const w=pool.map(d=>d.D.decoy?4*m.decoyEff:1),tot=w.reduce((a,b)=>a+b,0);let r=rnd()*tot,v=pool[0];for(let i=0;i<pool.length;i++){if((r-=w[i])<0){v=pool[i];break}}
      if(v.D.decoy){if(rnd()<.9){v.fate='decoy';ev.push({k:'decoy',d:v,u})}else ev.push({k:'miss',u,d:v})}
      else if(rnd()<acc*(1-v.D.eva)){v.fate='aa';ev.push({k:'aa',d:v,u})}else ev.push({k:'miss',u,d:v})}}
  // hidden air defense also fires, once found or not
  for(const u of m.units.filter(u=>L(u)&&u.shots&&u.hidden)){for(let s=0;s<u.shots;s++){const pool=live().filter(d=>!d.D.decoy);if(!pool.length)break;const v=pick(pool);if(rnd()<u.acc*(1-v.D.eva)){v.fate='aa';ev.push({k:'aa',d:v,u})}}}
  // 6. the strike
  m.units.forEach(u=>u.pend=0);
  const strikers=live().filter(d=>!d.D.recon&&!d.D.decoy&&!d.D.interceptor&&!(d.D.hunter&&d.fate));
  strikers.sort((a,b)=>(b.D.atk.armor||0)-(a.D.atk.armor||0));
  for(const d of strikers){const u=pickTarget(d,m.units);if(!u){d.idle=true;continue}u.pend+=(d.D.atk[u.cat]||0)*mult*.9;strike(d,u)}
  // decoys that were not shot are spent anyway
  for(const d of ds)if(d.D.decoy&&!d.fate)d.fate='spent';
  // bookkeeping
  for(const d of ds){S.usage[d.t]=(S.usage[d.t]||0)+1;S.usageAll[d.t]=(S.usageAll[d.t]||0)+1;B.avail[d.t]-=1;
    if(!d.fate){B.avail[d.t]+=1}
    else if(d.fate==='spent'){B.spent[d.t]=(B.spent[d.t]||0)+1;S.stats.spent++}
    else{B.lost[d.t]=(B.lost[d.t]||0)+1;S.stats.lost++}}
  S.stats.sorties++;B.alert++;B.wave++;
  return{ds,ev,jam}}
function score(m){const p=m.units.filter(u=>u.prim);const tot=p.reduce((s,u)=>s+u.max,0);const done=p.reduce((s,u)=>s+(u.max-Math.max(0,u.hp)),0);return tot?done/tot:0}
function tierOf(sc){return sc>=.9?0:sc>=.6?1:sc>=.3?2:3}
const TIERS=[{name:'DECISIVE',col:'grn',funds:1.3,pres:10,front:2},{name:'SUCCESS',col:'amb',funds:1,pres:6,front:1},{name:'PARTIAL',col:'amb',funds:.6,pres:3,front:0},{name:'FAILED',col:'red',funds:.45,pres:0,front:-1}];
function finishBattle(B){const m=B.m,sc=score(m),ti=tierOf(sc),T=TIERS[ti];
  // everything still in the sortie goes home
  for(const [t,n] of Object.entries(B.avail))S.stock[t]=(S.stock[t]||0)+n;
  let recovered=0;if(has('recovery'))for(const [t,n] of Object.entries(B.lost)){if(DRONES[t].exp)continue;const r=Math.round(n*.4);if(r){recovered+=r;S.stock[t]=(S.stock[t]||0)+r}}
  const sec=m.units.filter(u=>!u.prim&&u.dead).reduce((s,u)=>s+u.val,0);
  const valDone=m.units.filter(u=>u.dead).reduce((s,u)=>s+u.val,0);
  const cost=[...Object.entries(B.lost),...Object.entries(B.spent)].reduce((s,[t,n])=>s+costOf(t)*n,0);
  const aid=rankIdx()*6,budget=25+S.camp*8;const funds=Math.round(m.reward*T.funds+sec+aid+budget);
  const eff=ti<=1&&cost<=valDone*2.5?2:0;const pres=T.pres+eff+(m.final&&ti<=1?5:0);
  S.funds+=funds;S.prestige+=pres;S.front+=T.front;S.stats.battles++;if(ti<=1)S.stats.wins++;
  S.results.push(ti);
  return{sc,ti,funds,aid,budget,pres,eff,recovered,cost,valDone,sec}}
function campaignOver(){return S.battle>=GENERALS[S.camp].missions.length}

  const touch='ontouchstart' in window||matchMedia('(pointer:coarse)').matches;if(inConsole||!touch)return;

  const hit=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.dataset&&e.dataset.b?e:null};

let SCR=null;
function screen(id,opts={}){const s={id,el:el('div','scr '+(opts.cls||'')),items:[],i:0,...opts};s.key=(b,rep)=>navKey(s,b,rep);return s}
function row(s,parent,html,h={}){const e=el('div','row'+(h.cls?' '+h.cls:''),html);parent.appendChild(e);const it={el:e,...h};s.items.push(it);if(h.off)e.classList.add('off');return it}
function show(s,{keep=false}={}){const prev=SCR;if(prev&&prev.el.parentNode)prev.el.remove();if(prev&&prev.leave)prev.leave();SCR=s;APP.appendChild(s.el);
  let i=keep&&prev&&prev.id===s.id?prev.i:(s.start0||0);i=Math.max(0,Math.min(s.items.length-1,i));setFocus(s,i,true);if(s.enter)s.enter()}
function setFocus(s,i,quiet){if(!s.items.length)return;s.items.forEach(it=>it.el.classList.remove('focus'));s.i=i;const it=s.items[i];it.el.classList.add('focus');
  const sc=it.el.closest('.scroll');if(sc){const top=it.el.offsetTop-sc.offsetTop,bot=top+it.el.offsetHeight;if(top<sc.scrollTop)sc.scrollTop=top-4;else if(bot>sc.scrollTop+sc.clientHeight)sc.scrollTop=bot-sc.clientHeight+4}
  if(s.onFocus)s.onFocus(it);if(!quiet)AU.play('tick')}
function navKey(s,b,rep){if(s.busy)return;const it=s.items[s.i];
  if(b==='up'||b==='down'){if(!s.items.length)return;let j=s.i;const n=s.items.length;for(let k=0;k<n;k++){j=(j+(b==='up'?-1:1)+n)%n;if(!s.items[j].skip)break}if(rep&&((b==='down'&&j<s.i)||(b==='up'&&j>s.i)))return;setFocus(s,j);return}
  if(rep)return void((b==='left'&&it&&it.l)?it.l():(b==='right'&&it&&it.r)?it.r():0);
  if(b==='a'){if(!it)return;if(it.off){AU.play('buzz');if(it.offMsg)toast(it.offMsg);return}if(it.a){AU.play('ok');it.a()}}
  else if(b==='left'&&it&&it.l)it.l();else if(b==='right'&&it&&it.r)it.r();
  else if(b==='b'&&s.back){AU.play('back');s.back()}else if(b==='start'&&s.start)s.start();else if(b==='select'&&s.select)s.select()}

function loadout(){const m=S.mission;const s=screen('loadout');const bar=el('div','bar','');s.el.appendChild(bar);
  const box=el('div','panel grow scroll');box.innerHTML='<h3>DRONE · FIT · TAKE</h3>';const list=el('div','list');box.appendChild(list);s.el.appendChild(box);const desc=el('div','panel desc');s.el.appendChild(desc);
  const types=DRONE_ORDER.filter(d=>unlocked(d)&&(S.stock[d]||0)>0);const take={};const used=()=>Object.entries(take).reduce((a,[d,n])=>a+n*DRONES[d].slots,0);
  const prev=S.lastLoad||{};types.forEach(d=>{take[d]=0});
  const apply=src=>{types.forEach(d=>take[d]=0);for(const d of types){let n=Math.min(src[d]||0,S.stock[d]||0);while(n>0&&used()+DRONES[d].slots>slots())n--;take[d]=n}};
  if(Object.keys(prev).length)apply(prev);else apply(suggest(m,types));
  const rows=types.map(d=>{const it=row(s,list,'',{d,l:()=>{if(take[d]>0){take[d]--;upd();AU.play('tick')}},r:()=>{if(take[d]>=S.stock[d]||used()+DRONES[d].slots>slots()){AU.play('buzz');return}take[d]++;upd();AU.play('tick')}});return it});
  const go1=row(s,list,'LAUNCH ▶',{cls:'btn',a:()=>{if(!used()){toast('Choose at least one drone');return}S.lastLoad={...take};const ld={};for(const d in take)if(take[d])ld[d]=take[d];for(const d in ld)S.stock[d]-=ld[d];S.loadout=ld;save();go(startBattle)}});
  row(s,list,'SUGGEST A LOADOUT',{a:()=>{apply(suggest(m,types));upd();toast('Suggested by your staff')}});
  row(s,list,'BACK',{cls:'btn',a:()=>go(briefing)});
  const upd=()=>{bar.innerHTML=`<b>LOADOUT</b><span>SLOTS ${used()}/${slots()}</span>`;rows.forEach(it=>{const d=it.d;it.el.innerHTML='';it.el.appendChild(droneIcon(d,14));
      it.el.insertAdjacentHTML('beforeend',`<span style="flex:1">${DRONES[d].short} <span class="dim small">${DRONES[d].name}</span></span>${fitBars(fit(d,m))}<span class="qty"><i>◀</i><b>${take[d]}</b><i>▶</i></span><span class="r small">/${S.stock[d]}</span>`)})};upd();
  s.onFocus=it=>{desc.innerHTML=it.d?droneInfo(it.d):'Green bars: how well a drone fits this mission, from what intel can see.'};
  s.select=()=>{apply(suggest(m,types));upd();toast('Suggested by your staff')};
  s.back=()=>go(briefing);show(s)}
function suggest(m,types,stock=S.stock){const out={};let left=slots();const t=threat(m);const want=(d,n)=>{n=Math.min(n,stock[d]||0);while(n>0&&n*DRONES[d].slots>left)n--;if(n>0){out[d]=(out[d]||0)+n;left-=n*DRONES[d].slots}};
  if(types.includes('recon'))want('recon',m.units.some(u=>u.hidden)?2:1);
  if(t.aaL>=2&&types.includes('hunter'))want('hunter',2);if(t.aaL>=1&&types.includes('decoy'))want('decoy',t.aaL+1);
  if(t.drL>=1&&types.includes('intercept'))want('intercept',t.drL+1);
  const strikers=types.filter(d=>!DRONES[d].recon&&!DRONES[d].decoy&&!DRONES[d].interceptor&&!DRONES[d].hunter).sort((a,b)=>fit(b,m)-fit(a,m)||(DRONES[b].atk.armor||0)-(DRONES[a].atk.armor||0));
  for(let pass=0;pass<6&&left>0;pass++)for(const d of strikers){if(fit(d,m)<2&&pass<2)continue;if(fit(d,m)<1)continue;want(d,Math.max(1,Math.ceil(left/2)))}
  return out}

/* ===================== BATTLE: plan a wave, watch it fly ===================== */
let B=null,bRaf=0;
function startBattle(){const m=S.mission;B={m,wave:1,maxWave:3,alert:0,avail:{...S.loadout},lost:{},spent:{},recon:0,focus:null,anim:null,log:[],plan:{}};
  battleScreen();AU.music('battle');AU.play('radio')}
function battleScreen(){const s=screen('battle');const m=B.m;
  const bar=el('div','bar','');s.el.appendChild(bar);
  const mb=el('div','mapbox');const cv=el('canvas');mb.appendChild(cv);const feed=el('div','feed');const fc=mk(FW,FH);fc.className='px';feed.appendChild(fc);const fl=el('span','','');feed.appendChild(fl);mb.appendChild(feed);s.el.appendChild(mb);
  const panel=el('div','panel');panel.style.cssText='flex:0 0 auto;height:11.2rem;overflow:hidden';s.el.appendChild(panel);
  B.ui={bar,cv,feed,fc,fl,panel,s};
  s.leave=()=>cancelAnimationFrame(bRaf);
  s.back=()=>{};
  show(s);planWave();
  const loop=t=>{if(SCR!==s)return;drawBattle(t);bRaf=requestAnimationFrame(loop)};bRaf=requestAnimationFrame(loop)}
const availTot=()=>Object.values(B.avail).reduce((a,b)=>a+b,0);
function targetsList(){return B.m.units.filter(u=>!u.dead&&!u.hidden)}
function defaultPlan(){const wl=B.maxWave-B.wave+1;const p={};for(const [d,n] of Object.entries(B.avail)){if(!n)continue;const D=DRONES[d];
    p[d]=(D.recon||D.hunter||D.interceptor)?n:wl<=1?n:Math.ceil(n/wl)}return p}
function planWave(){const {s,panel,bar}=B.ui;s.items=[];panel.innerHTML='';s.busy=false;
  bar.innerHTML=`<b>${esc(B.m.name.toUpperCase())}</b><span>WAVE ${B.wave}/${B.maxWave}${B.alert?` · <span class="red">ALERT ${B.alert}</span>`:''}</span>`;
  B.plan=defaultPlan();const t=threat(B.m);
  panel.appendChild(el('div','small',`<span class="dim">AA</span> ${meter(t.aaL,3,'red')} <span class="dim">JAM</span> ${meter(t.ewL,3,'red')} <span class="dim">DRONES</span> ${meter(t.drL,3,'red')} <span class="dim">· obj ${Math.round(score(B.m)*100)}%</span>`));
  const box=el('div','scroll');box.style.cssText='height:5.1rem;margin:.15rem 0';const list=el('div','list');box.appendChild(list);panel.appendChild(box);const list2=el('div','list');panel.appendChild(list2);
  const types=DRONE_ORDER.filter(d=>B.avail[d]>0);
  const rows=types.map(d=>row(s,list,'',{d,l:()=>{if(B.plan[d]>0){B.plan[d]--;upd();AU.play('tick')}},r:()=>{if(B.plan[d]<B.avail[d]){B.plan[d]++;upd();AU.play('tick')}else AU.play('buzz')}}));
  const tg=row(s,list2,'',{l:()=>cycleFocus(-1),r:()=>cycleFocus(1),a:()=>cycleFocus(1)});
  const launch=row(s,list2,'',{cls:'btn',a:()=>launchWave()});
  row(s,list2,'END MISSION · BRING DRONES HOME',{cls:'btn',a:async()=>{const c=await choose('End the mission now? Drones still in the air come home, and you are scored on what has been hit so far.',['End mission','Keep fighting'],{cancel:1});if(c===0)endBattle()}});
  function cycleFocus(dir){const L=targetsList();const opts=[null,...L];let i=opts.indexOf(B.focus);i=(i+dir+opts.length)%opts.length;B.focus=opts[i];upd();AU.play('tick')}
  const upd=()=>{rows.forEach(it=>{const d=it.d;it.el.innerHTML='';it.el.appendChild(droneIcon(d,13));it.el.insertAdjacentHTML('beforeend',`<span style="flex:1">${DRONES[d].short} <span class="dim small">${DRONES[d].exp?'one-way':'returns'}</span></span><span class="qty"><i>◀</i><b>${B.plan[d]}</b><i>▶</i></span><span class="r small">/${B.avail[d]}</span>`)});
    tg.el.innerHTML=`<span>TARGET</span><span class="qty"><i>◀</i><b style="min-width:auto">${B.focus&&!B.focus.dead?esc(B.focus.name):'Best available'}</b><i>▶</i></span>`;
    const n=Object.values(B.plan).reduce((a,b)=>a+b,0);launch.el.innerHTML=`LAUNCH WAVE ${B.wave} · ${n} DRONES`};
  if(B.focus&&B.focus.dead)B.focus=null;upd();setFocus(s,Math.max(0,rows.length?0:0),true);
  s.start=()=>launchWave();
  if(B.wave===1&&!S.seen.battleTip){S.seen.battleTip=1;setTimeout(()=>msg('Each mission is three waves. Choose how many of each drone fly in this wave with ◀ ▶. Recon and decoys work best early. Anything you hold back can fly later, and a wave that wins early saves drones.',{who:STORY.co,port:portrait(CO_LOOK)}),300)}}
async function launchWave(){const s=B.ui.s;const n=Object.values(B.plan).reduce((a,b)=>a+b,0);if(!n){toast('Choose drones for this wave');return}if(s.busy)return;s.busy=true;
  const launch={};for(const [d,c] of Object.entries(B.plan))if(c)launch[d]=c;
  const focus=B.focus&&!B.focus.dead?B.focus:null;
  // snapshot positions before the wave changes anything
  const res=resolveWave(B,launch,focus);
  B.ui.panel.innerHTML='';const log=el('div','log');B.ui.panel.appendChild(log);B.ui.log=log;
  AU.play('launch');setTimeout(()=>AU.play('buzzfly'),250);
  await animateWave(res);
  // wave summary
  const c=k=>res.ev.filter(e=>e.k===k).length;const strikes=res.ev.filter(e=>e.k==='strike');
  addLog(`<span class="amb">WAVE ${B.wave-1}:</span> ${res.ds.length} up · ${c('jam')} jammed · ${c('aa')+c('dronekill')} shot down · ${strikes.length} hits · <span class="grn">${strikes.filter(e=>e.kill).length} destroyed</span>`);
  await sleep(900);
  const allPrim=B.m.units.filter(u=>u.prim).every(u=>u.dead);
  if(allPrim){addLog('<span class="grn">All objectives destroyed.</span>');await sleep(800);return endBattle()}
  if(B.wave>B.maxWave||!availTot()){addLog(B.wave>B.maxWave?'The enemy has dispersed. Time to come home.':'No drones left to send.');await sleep(900);return endBattle()}
  planWave()}
function addLog(h){if(!B.ui.log)return;B.ui.log.appendChild(el('div','',h));while(B.ui.log.children.length>7)B.ui.log.firstChild.remove()}
function endBattle(){const R=finishBattle(B);S.battle++;S.mission=null;S.loadout=null;save();const b=B;go(()=>debrief(b,R))}

/* ---------- the wave, animated ---------- */
function animateWave(res){return new Promise(done=>{const ds=res.ds;const T0=performance.now();const dur=3600;
  const base=[.5,.93];const sprites=ds.map((d,i)=>{const n=ds.length;const sx=.5+(i-(n-1)/2)*Math.min(.04,.6/n);
    let dest=d.target?[d.target.x,d.target.y]:d.D.recon?[.2+Math.random()*.6,.25+Math.random()*.3]:d.D.interceptor?[.3+Math.random()*.4,.62]:[.3+Math.random()*.4,.45];
    const t0=i/n*.35;let end=null;const f=d.fate;
    if(f==='jam')end={t:.55+Math.random()*.4,p:.25+Math.random()*.2,how:'jam'};
    else if(f==='drone')end={t:.9+Math.random()*.3,p:.45+Math.random()*.15,how:'drone'};
    else if(f==='aa'||f==='decoy')end={t:1.25+Math.random()*.4,p:.7+Math.random()*.15,how:'aa'};
    else if(f==='spent')end={t:1.55+i/n*.5,p:1,how:'hit'};
    return{d,sx,dest,t0,end,ret:!f||f===null}});
  B.anim={sprites,T0,dur,res,fx:[],shots:[],done:false};
  // events with times
  const timeline=[];
  for(const sp of sprites){const e=sp.end;if(!e)continue;
    if(e.how==='jam')timeline.push([e.t,()=>{AU.play('jam');addLog(`<span class="red">${sp.d.D.short} lost to jamming</span>`)}]);
    if(e.how==='drone')timeline.push([e.t,()=>{AU.play('zap');addLog(`<span class="red">${sp.d.D.short} downed by enemy drone</span>`)}]);
    if(e.how==='aa')timeline.push([e.t-.25,()=>AU.play('aa')]);}
