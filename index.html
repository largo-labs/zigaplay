<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ZigaPlay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one handheld console standing upright in the middle of a dark desk. The screen fills the top half,
   the controls the bottom. Everything on the screen while no game is in uses the four greens of an old LCD. */
:root{
  color-scheme:dark;
  --desk:#0d1222;--desk-2:#18203c;--desk-glow:#243066;
  --lcd0:#0f380f;--lcd1:#306230;--lcd2:#8bac0f;--lcd3:#9bbc0f;
  --pix:'Pixelify Sans','VT323',ui-monospace,monospace;
  --num:'VT323',ui-monospace,monospace;
  --ui:system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,var(--desk-glow) 0%,var(--desk-2) 38%,var(--desk) 100%);color:#e8ecff;font-family:var(--ui);
  margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffd36a;outline-offset:2px}

#zp{height:100%;width:min(100%,460px);display:flex;flex-direction:column;padding-block:10px 12px}

/* ---------- the console body; every shell colour is a set of tokens ---------- */
.console{
  --b1:#e2ded4;--b2:#d2cec3;--b3:#c4c0b4;--edge:#1d1b26;--print:#2c3a8a;--print2:#4a5794;
  --ab1:#de6a98;--ab2:#a8265e;--ab3:#7d1640;--abedge:#3a0f22;--abshadow:#4c0e29;
  --groove1:#b7b3a7;--groove2:#c8c4b8;--pill1:#a8a6af;--pill2:#77757f;--pilledge:#4c4a54;--grille:#a29e93;
  --bez1:#6a6e80;--bez2:#55586a;--bezink:#c9cbe0;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;position:relative;
  background:linear-gradient(172deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);border:2px solid var(--edge);border-radius:14px 14px 52px 14px;
  padding:8px 14px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.14),inset 3px 0 0 rgba(255,255,255,.22),0 16px 34px rgba(0,0,0,.6);
  transition:background .4s}
.console[data-shell=berry]{--b1:#f0627f;--b2:#d9405f;--b3:#c22e4f;--print:#fff1f4;--print2:#ffd2dc;--ab1:#9c86f0;--ab2:#5d3fc0;--ab3:#3a2390;--abedge:#1e1050;--abshadow:#2a1666;
  --groove1:#b02a48;--groove2:#c8395a;--pill1:#8c2440;--pill2:#6a1530;--pilledge:#4a0c20;--grille:#a52646;--bez1:#3f3f52;--bez2:#2f2f40}
.console[data-shell=teal]{--b1:#5cc8c0;--b2:#36aea6;--b3:#22968f;--print:#0a2c33;--print2:#14454e;--ab1:#ffe07a;--ab2:#f0b82a;--ab3:#c48a10;--abedge:#5a3a04;--abshadow:#7a5206;
  --groove1:#1f8a84;--groove2:#2c9f98;--pill1:#2a6a68;--pill2:#164a48;--pilledge:#0c3230;--grille:#1f8780;--bez1:#3a4250;--bez2:#2a3140}
.console[data-shell=grape]{--b1:#9a7ee4;--b2:#7e60cc;--b3:#6a4cb6;--print:#f6f0ff;--print2:#dcd0ff;--ab1:#ff8ab4;--ab2:#e04a82;--ab3:#a82a5c;--abedge:#4a0c28;--abshadow:#6a1238;
  --groove1:#5d40a4;--groove2:#6c50b6;--pill1:#4c3490;--pill2:#36226e;--pilledge:#22144a;--grille:#5c42a2;--bez1:#3e3a52;--bez2:#2e2a42}
.console[data-shell=kiwi]{--b1:#bfe06a;--b2:#a4ca48;--b3:#8fb434;--print:#1d3a0e;--print2:#2e5218;--ab1:#ff8a7a;--ab2:#e0483a;--ab3:#a82a20;--abedge:#4a0e08;--abshadow:#6a160c;
  --groove1:#86aa30;--groove2:#97bc3c;--pill1:#5e7c26;--pill2:#445c18;--pilledge:#2c3e0c;--grille:#80a42c;--bez1:#4a5048;--bez2:#383e36}
.console[data-shell=dandelion]{--b1:#fbe073;--b2:#f2ca3e;--b3:#e2b42a;--print:#4a3108;--print2:#6a4810;--ab1:#7ab8ff;--ab2:#2f6fd8;--ab3:#1c4aa0;--abedge:#0a1e4a;--abshadow:#10296a;
  --groove1:#d6a82a;--groove2:#e8bc38;--pill1:#a07a18;--pill2:#7a5a0c;--pilledge:#4e3806;--grille:#d0a024;--bez1:#504a40;--bez2:#3c3830}
.console[data-shell=midnight]{--b1:#3e4566;--b2:#30365a;--b3:#262b48;--print:#c8d2f4;--print2:#97a3d6;--ab1:#ffa48a;--ab2:#ff6a4a;--ab3:#c44428;--abedge:#4a1408;--abshadow:#6a1e0c;
  --groove1:#22263e;--groove2:#2a2f4c;--pill1:#55597a;--pill2:#3c4060;--pilledge:#1c1f34;--grille:#22263e;--bez1:#1c1f30;--bez2:#14161f;--bezink:#8f97c4}

/* top edge: the power switch */
.topedge{display:flex;align-items:center;justify-content:space-between;height:22px;padding-inline:2px}
.power{display:flex;align-items:center;gap:7px;background:none;border:0;padding:4px 6px 4px 0;font-size:9px;font-weight:800;font-style:italic;letter-spacing:.14em;color:var(--print)}
.power .sw{position:relative;width:34px;height:12px;border-radius:7px;background:rgba(0,0,0,.22);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.power .sw::after{content:"";position:absolute;top:1px;left:19px;width:14px;height:10px;border-radius:5px;background:linear-gradient(180deg,var(--pill1),var(--pill2));box-shadow:0 1px 0 var(--pilledge);transition:left .18s}
.console.off .power .sw::after{left:1px}
.model{font-family:var(--num);font-size:13px;letter-spacing:.12em;color:var(--print2)}

/* the bezel and the screen */
.bezel{flex:1 1 auto;min-height:0;position:relative;display:flex;background:linear-gradient(180deg,var(--bez1),var(--bez2));border-radius:10px 10px 38px 10px;
  padding:18px 14px 22px 28px;box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.5)}
.bezel .stripes{position:absolute;left:12px;right:12px;top:7px;height:5px;border-radius:1px;background:linear-gradient(180deg,#a02c5c 0 2px,transparent 2px 3px,#33449a 3px 5px)}
.bezel .led{position:absolute;left:9px;top:40%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7a3a3a,#3a1416 70%);transition:background .2s,box-shadow .2s}
.console:not(.off) .bezel .led{background:radial-gradient(circle at 35% 35%,#ffb0b0,#ec2630 58%,#8a0f15);box-shadow:0 0 7px 1px rgba(255,46,46,.75)}
.bezel .ledlbl{position:absolute;left:2px;top:calc(40% + 13px);width:24px;text-align:center;font-size:6px;font-weight:700;letter-spacing:.04em;color:var(--bezink)}
.screen{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;border:3px solid #17161f;border-radius:4px;background:#05060a}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0a1026}

/* ---------- the LCD: library, boot logo, messages ---------- */
.lcd{position:absolute;inset:0;background:var(--lcd3);color:var(--lcd0);font-family:var(--pix);display:flex;flex-direction:column}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(15,56,15,.06) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(15,56,15,.05) 0 1px,transparent 1px 3px)}
.lcd-top{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 6px;border-bottom:3px solid var(--lcd1)}
.lcd-top b{font-size:17px;letter-spacing:.16em;font-style:italic}
.lcd-top span{font-family:var(--num);font-size:17px;letter-spacing:.06em;color:var(--lcd1)}
.shelf{flex:1 1 auto;min-height:96px;position:relative;overflow:hidden}
.cart{position:absolute;left:50%;top:50%;width:118px;height:134px;margin:-67px 0 0 -59px;border:0;padding:0;background:none;
  transition:transform .28s cubic-bezier(.3,1.3,.5,1),opacity .28s,filter .28s}
.cart .shell{position:absolute;inset:0;background:linear-gradient(180deg,#b6b3ac,#9d9a93);clip-path:polygon(0 0,86% 0,100% 10%,100% 100%,0 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.cart .ridges{position:absolute;left:10px;right:22px;top:6px;height:10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 5px)}
.cart .label{position:absolute;left:9px;right:9px;top:22px;height:84px;border-radius:5px;background:var(--lb,#1a2550);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.cart .label img{display:block;width:100%;height:60px;object-fit:cover;image-rendering:pixelated}
.cart .label b{display:block;text-align:center;font-family:var(--pix);font-size:14px;letter-spacing:.12em;color:var(--lf,#ffd36a);padding-top:3px;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.cart .arrow{position:absolute;left:50%;bottom:7px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid rgba(0,0,0,.25)}
.cart.ghost .shell{background:transparent;box-shadow:none;outline:0}
.cart.ghost .ghostbox{position:absolute;inset:4px;border:3px dashed var(--lcd1);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--lcd1)}
.cart.ghost .ghostbox b{font-size:40px;line-height:1}
.cart.ghost .ghostbox span{font-size:12px;letter-spacing:.12em}
.cart.inserting{transition:transform .38s ease-in,opacity .38s;transform:translate(0,-170px) scale(.9)!important;opacity:0}
.cart.sel::before{content:"";position:absolute;left:50%;bottom:-16px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:8px solid var(--lcd0);animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.info{padding:10px 14px 6px;border-top:3px solid var(--lcd1);display:flex;flex-direction:column;gap:4px;flex:0 1 auto;overflow:hidden}
.info h2{margin:0;font-size:20px;letter-spacing:.08em;font-weight:700;text-wrap:balance}
.info p{margin:0;font-family:var(--num);font-size:18px;line-height:1.05;color:var(--lcd1);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.info small{font-family:var(--num);font-size:15px;color:var(--lcd1);opacity:.85}
.lcd-help{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 10px 9px;font-family:var(--num);font-size:15px;letter-spacing:.04em;background:var(--lcd2);color:var(--lcd0)}
.lcd-help i{font-style:normal;background:var(--lcd0);color:var(--lcd3);border-radius:3px;padding:0 4px}

#boot{align-items:center;justify-content:center}
#boot .logo{font-size:30px;font-weight:700;font-style:italic;letter-spacing:.14em;transform:translateY(-60vh);animation:drop 1.5s steps(26,end) forwards}
#boot .logo small{display:block;text-align:center;font-family:var(--num);font-style:normal;font-size:15px;letter-spacing:.3em;color:var(--lcd1)}
@keyframes drop{to{transform:translateY(0)}}
#loading{align-items:center;justify-content:center;gap:8px}
#loading b{font-size:20px;letter-spacing:.2em}
#loading span{font-family:var(--num);font-size:18px;color:var(--lcd1)}
#loading .dots::after{content:"";animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.blackout{position:absolute;inset:0;background:#05060a;pointer-events:none;opacity:0;transition:opacity .25s}
.console.off .blackout,.blackout.on{opacity:1;pointer-events:auto}

/* message box on the LCD: power-off questions and notes */
.ask{position:absolute;left:10px;right:10px;bottom:12px;z-index:5;background:var(--lcd3);color:var(--lcd0);border:3px solid var(--lcd0);border-radius:6px;box-shadow:0 0 0 3px var(--lcd3),0 4px 0 6px rgba(15,56,15,.35);
  padding:12px 12px 10px;font-family:var(--pix);display:flex;flex-direction:column;gap:8px}
.ask p{margin:0;font-family:var(--num);font-size:19px;line-height:1.05}
.ask .opts{display:flex;flex-direction:column;gap:5px}
.ask button{text-align:left;background:transparent;border:0;padding:4px 8px 4px 24px;font-family:var(--pix);font-size:15px;letter-spacing:.06em;color:var(--lcd0);border-radius:4px;position:relative}
.ask button[aria-selected=true]{background:var(--lcd0);color:var(--lcd3)}
.ask button[aria-selected=true]::before{content:"▶";position:absolute;left:7px;font-size:11px;top:6px}
.toast{position:absolute;left:50%;top:10px;z-index:6;transform:translate(-50%,-200%);opacity:0;transition:transform .25s,opacity .25s;background:var(--lcd0);color:var(--lcd3);font-family:var(--pix);font-size:13px;letter-spacing:.08em;
  padding:5px 10px;border-radius:4px;white-space:nowrap;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* printed brand under the screen */
.brand{display:flex;align-items:baseline;justify-content:center;gap:8px;color:var(--print);line-height:1;flex:0 0 auto;padding-top:2px}
.brand b{font-family:var(--pix);font-size:21px;font-weight:700;font-style:italic;letter-spacing:.16em;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.brand small{font-size:9px;font-weight:700;font-style:italic;letter-spacing:.18em;color:var(--print2)}

/* ---------- controls ---------- */
.controls{position:relative;height:206px;flex:0 0 auto;touch-action:none}
.dpad{position:absolute;left:2px;top:14px;width:138px;height:138px;touch-action:none;filter:drop-shadow(0 3px 0 #23222a) drop-shadow(0 5px 5px rgba(0,0,0,.25))}
.dpad i{position:absolute;background:linear-gradient(180deg,#403f48,#2a2930)}
.dpad .v{left:46px;top:0;width:46px;height:138px;border-radius:6px}
.dpad .h{left:0;top:46px;width:138px;height:46px;border-radius:6px}
.dpad .hub{left:46px;top:46px;width:46px;height:46px;background:radial-gradient(circle,#24232a 0 8px,#2e2d34 9px 10px,#36353d 11px)}
.dpad .ar{width:0;height:0;background:none;border:7px solid transparent}
.dpad .ar.u{left:62px;top:10px;border-bottom:10px solid #5c5b66;border-top:0}
.dpad .ar.d{left:62px;bottom:10px;border-top:10px solid #5c5b66;border-bottom:0}
.dpad .ar.l{top:62px;left:10px;border-right:10px solid #5c5b66;border-left:0}
.dpad .ar.r{top:62px;right:10px;border-left:10px solid #5c5b66;border-right:0}
.dpad .ar.u.on{border-bottom-color:#9a99a6}.dpad .ar.d.on{border-top-color:#9a99a6}.dpad .ar.l.on{border-right-color:#9a99a6}.dpad .ar.r.on{border-left-color:#9a99a6}
.dpad .sh{left:46px;top:46px;width:46px;height:46px;background:rgba(0,0,0,.22);opacity:0;border-radius:4px}
.dpad[data-d=up] .sh{opacity:1;top:0}.dpad[data-d=down] .sh{opacity:1;top:92px}.dpad[data-d=left] .sh{opacity:1;left:0}.dpad[data-d=right] .sh{opacity:1;left:92px}

.ab{position:absolute;right:0;top:4px;width:156px;height:124px}
.ab::before{content:"";position:absolute;left:4px;right:4px;top:31px;height:64px;border-radius:999px;background:linear-gradient(180deg,var(--groove1),var(--groove2));
  box-shadow:inset 0 3px 5px rgba(0,0,0,.24),0 1px 0 rgba(255,255,255,.4);transform:rotate(-25deg)}
.btn-ab{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid var(--abedge);padding:0;touch-action:none;
  background:radial-gradient(circle at 36% 30%,var(--ab1) 0,var(--ab2) 40%,var(--ab3) 100%);box-shadow:0 4px 0 var(--abshadow),0 7px 8px rgba(0,0,0,.25)}
.btn-ab.a{right:8px;top:14px}
.btn-ab.b{left:10px;top:52px}
.btn-ab span{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);font-size:15px;line-height:1;font-weight:800;font-style:italic;letter-spacing:.04em;color:var(--print)}
.btn-ab.on{transform:translateY(3px);box-shadow:0 1px 0 var(--abshadow)}
.pills{position:absolute;left:50%;bottom:6px;transform:translateX(-62%);display:flex;gap:10px}
.pill{position:relative;width:64px;height:44px;background:none;border:0;padding:26px 0 0;font-size:10px;font-weight:800;font-style:italic;letter-spacing:.12em;color:var(--print);line-height:1;touch-action:none}
.pill::before{content:"";position:absolute;left:11px;right:11px;top:8px;height:13px;border-radius:999px;transform:rotate(-24deg);
  background:linear-gradient(180deg,var(--pill1),var(--pill2));box-shadow:0 2px 0 var(--pilledge),inset 0 1px 0 rgba(255,255,255,.35)}
.pill.on::before{top:10px;box-shadow:0 0 0 var(--pilledge),inset 0 1px 0 rgba(255,255,255,.25)}
.grille{position:absolute;right:26px;bottom:14px;display:flex;gap:5px;transform:rotate(-28deg);transform-origin:100% 100%;pointer-events:none}
.grille i{display:block;width:5px;height:30px;border-radius:3px;background:var(--grille);box-shadow:inset 0 2px 2px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.35)}

@media (max-height:720px){.controls{height:188px}.dpad{top:6px}.ab{top:-4px}.brand{display:none}.lcd-top{padding:6px 10px 4px}.info{padding:6px 12px 4px}.info h2{font-size:17px}.info p{font-size:16px;-webkit-line-clamp:3}.info small{display:none}.lcd-help{padding:4px 8px 6px;font-size:14px}}
@media (max-width:430px){body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}}
@media (max-width:360px){.dpad{transform:scale(.86);transform-origin:0 0}.ab{transform:scale(.88);transform-origin:100% 0}.grille{display:none}}
@media (min-height:860px){.controls{height:222px}.dpad{top:18px}}
/* the control stick: a round thumb pad that replaces the D-pad for games that move freely (stick:true).
   Push it left or right to move; push it up or down for the game's up and down (in the fighting games: jump, guard). */
.stick{display:none;position:absolute;left:2px;top:14px;width:138px;height:138px;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 50%,#1b1a21 0 44%,#26252d 45% 62%,#2f2e37 63% 100%);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,255,255,.08),0 3px 0 #23222a,0 6px 10px rgba(0,0,0,.25)}
.stick::before{content:"";position:absolute;inset:-22px;border-radius:50%}
.stick .notch{position:absolute;width:0;height:0;border:6px solid transparent;pointer-events:none;opacity:.55;transition:opacity .08s}
.stick .notch.u{left:63px;top:7px;border-bottom:8px solid #8a8996;border-top:0}.stick .notch.d{left:63px;bottom:7px;border-top:8px solid #8a8996;border-bottom:0}
.stick .notch.l{top:63px;left:7px;border-right:8px solid #8a8996;border-left:0}.stick .notch.r{top:63px;right:7px;border-left:8px solid #8a8996;border-right:0}
.stick .notch.on{opacity:1;filter:brightness(1.6)}
.stick .knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 38% 32%,#6e6d7a 0,#4a4955 38%,#33323b 72%,#2a2930 100%);
  box-shadow:0 5px 0 #18171d,0 8px 12px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.18)}
.stick .knob::after{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,#3c3b45 0 55%,#45444f 56%);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.stick .knob.back{transition:transform .11s cubic-bezier(.3,1.6,.5,1)}
.console.stickmode .stick{display:block}
.console.stickmode .dpad{display:none}
/* bigger touch targets for A and B than the buttons you see */
.btn-ab::after{content:"";position:absolute;inset:-14px;border-radius:50%}

/* sideways: a wide handheld, D-pad on the left, buttons on the right, the screen between. Used when the phone is
   turned (landscape and short), whenever a wide game is in on a landscape screen, and, for a wide game with the
   phone upright, by turning the whole console a quarter turn so the game gets the long side of the screen. */
html.wide body{align-items:center;padding-left:max(6px,calc(env(safe-area-inset-left,0px) - 26px));padding-right:max(6px,calc(env(safe-area-inset-right,0px) - 26px))}
html.wide #zp{width:min(100%,1000px);height:min(100%,calc(min(100vw,1000px) * .47));padding-block:max(5px,env(safe-area-inset-top,0px)) max(6px,calc(env(safe-area-inset-bottom,0px) - 8px))}
html.turned body{padding:0}
html.turned #zp{position:fixed;left:50%;top:50%;width:var(--zw,100vh);height:var(--zh,100vw);max-width:none;transform:translate(-50%,-50%) rotate(90deg);
  padding:5px max(6px,calc(env(safe-area-inset-bottom,0px) - 8px)) 6px max(6px,calc(env(safe-area-inset-top,0px) - 20px))}
html.wide .console{display:grid;grid-template-columns:calc(var(--cz,1) * 142px) minmax(0,1fr) calc(var(--cz,1) * 152px);grid-template-rows:auto minmax(0,1fr) auto;column-gap:8px;row-gap:2px;padding:4px 10px 8px;border-radius:14px 14px 40px 14px}
html.wide .topedge{grid-column:1 / -1;grid-row:1;height:20px}
html.wide .bezel{grid-column:2;grid-row:2 / 4;padding:12px 10px 12px 28px;border-radius:8px 8px 26px 8px}
html.wide .bezel .stripes{top:4px}
html.wide .brand{display:none}
html.wide .controls{display:contents}
html.wide .dpad,html.wide .stick{position:relative;left:auto;top:auto;transform:none;grid-column:1;grid-row:2;align-self:center;justify-self:center}
html.wide .ab{position:relative;right:auto;top:auto;transform:none;grid-column:3;grid-row:2;align-self:center;justify-self:center;width:150px}
html.wide .btn-ab.a{right:4px}html.wide .btn-ab.b{left:4px}
html.wide .pills{position:relative;left:auto;bottom:auto;transform:none;grid-column:1;grid-row:3;justify-self:center;gap:4px}
html.wide .grille{display:flex;position:relative;right:auto;bottom:auto;grid-column:3;grid-row:3;justify-self:center;align-self:end;margin-bottom:8px;transform:rotate(-28deg)}

html.wide .lcd-top{padding:5px 10px 3px}html.wide .lcd-top b{font-size:15px}html.wide .lcd-top span{font-size:15px}
html.wide .info{padding:4px 12px 3px}html.wide .info h2{font-size:16px}html.wide .info p{font-size:15px;-webkit-line-clamp:2}html.wide .info small{font-size:13px}
html.wide .lcd-help{padding:3px 8px 4px;font-size:13px}
html.wide .ask{bottom:8px;padding:8px 10px}html.wide .ask p{font-size:16px}
/* a wide game gets as much screen as the console can give: a thin bezel, slimmer controls, and the power switch
   tucked above the D-pad so the screen runs the full height */
html.wide .console.widegame{column-gap:6px;padding:4px 8px 6px}
html.wide .console.widegame .topedge{grid-column:1;grid-row:1;justify-content:flex-start}
html.wide .console.widegame .model{display:none}
html.wide .console.widegame .bezel{grid-row:1 / 4;padding:6px 6px 7px 20px;border-radius:8px 8px 22px 8px}
html.wide .console.widegame .bezel .stripes{display:none}
html.wide .console.widegame .bezel .ledlbl{display:none}
html.wide .console.widegame .bezel .led{left:6px}
html.wide .dpad,html.wide .stick,html.wide .ab,html.wide .pills{zoom:var(--cz,1)}
html.wide .console.widegame .grille{display:none}
@media (prefers-reduced-motion:reduce){#boot .logo{animation:none;transform:none}.cart{transition:none}.cart.sel::before{animation:none}}
</style>

<script>
(()=>{
'use strict';
/* =====================================================================================================
   ZIGAPLAY: a pocket console that plays the games made here as cartridges.

   CARTRIDGES
   Every game is a full HTML document published next to this page at games/<id>/index.html, with its
   art at games/<id>/cart.png (288x192 or any 3:2 picture). It is listed in CARTS below. The console fetches
   the file and runs it inside the screen (an iframe on this same origin), so the game sees a normal page
   the size of the screen.

   CONTROLS
   The console has a D-pad, A, B, SELECT and START, and a power switch. A cart with `stick:true` gets a round
   control stick in place of the D-pad while it runs; it sends the same four directions (two at once on a diagonal).
   - A game can take the buttons directly by defining   window.ZPCart = { input(btn, isDown) {...} }
     where btn is 'up' 'down' 'left' 'right' 'a' 'b' 'start' 'select'. The call happens inside the player's
     own press, so a game may start sound from it.
   - A widescreen game sets `wide:true`: while it runs, the console takes its sideways shape (D-pad left,
     screen middle, buttons right), and with the phone upright it turns itself a quarter turn so the game
     gets the long side of the screen.
   - A game without ZPCart gets keyboard events instead (keydown and keyup on its document). The keys
     come from the cart's `keys` entry, or by default: arrows, A = z, B = x, START = Enter, SELECT = Shift.
   - Optional ZPCart.home(): called when the player flips the power switch (or holds START + SELECT).
     Return true to turn off now, false to keep playing, or 'ask' to let the console ask first.
     Without it, the console asks whether to turn the game off.
   - Optional ZPCart.snapshot(): state to hand back after this page is updated while the game runs;
     the game reads it back with ZIGAPLAY.takeRestore('<id>').

   WHAT THE CONSOLE OFFERS A GAME   (window.parent.ZIGAPLAY, same origin)
   - claude        this page's window.claude (through a bridge that rebuilds the game's objects as this
                   page's own), so a game can keep cloud saves in this artifact's database.
                   Each game keeps its saves in its own folder: data/users/<user id>/<game id>/saves
   - AudioContext  use it (the console also sets it as the game's window.AudioContext before the game
                   runs) so presses on the console's own buttons can start the game's sound
   - takeRestore(id), cartReady(api)
   Browser storage is shared by every game on the console, so each game prefixes its keys with its id.
   ===================================================================================================== */
const CARTS=[
  {id:'lynties',title:'Lynties',file:'games/lynties/index.html',art:'games/lynties/cart.png',label:'#1a2550',ink:'#ffd36a',
   blurb:'Explore the Long Road, beat eight Wardens and bond with 146 Lynties, eight of them legends.',
   note:'Saves to this ZigaPlay · START menu · SELECT map'},
  {id:'chipcity',title:'Chip City',file:'games/chipcity/index.html',art:'games/chipcity/cart.png',label:'#3d1046',ink:'#ffd36a',
   blurb:'Blackjack, roulette, slots, video poker and hi-lo. Play chips only.',
   note:'A press · START deal or spin · B back'},
  {id:'gearfist',title:'Gearfist',file:'games/gearfist/index.html',art:'games/gearfist/cart.png',label:'#6a2a14',ink:'#ffd36a',stick:true,
   blurb:'Punch through a junkyard city of robots, beat four bosses and buy new fighters with the bolts you win.',
   note:'A light · B heavy · ▲ jump · ▼ guard · SELECT burst'},
  {id:'drownedmoon',title:'Drowned Moon',file:'games/drownedmoon/index.html',art:'games/drownedmoon/cart.png',label:'#0d1a44',ink:'#cfe4ff',
   blurb:'The moon fell into the sea. Call the tide in and out to sail, walk the seabed and find out who is dragging it down.',
   note:'A talk · B back · START menu · SELECT turn the tide'},
  {id:'pitchfork',title:'Pitchfork Rising',file:'games/pitchfork/index.html',art:'games/pitchfork/cart.png',label:'#4a1e10',ink:'#ffd05a',stick:true,wide:true,
   blurb:'Lead a peasant revolt from the village barn to the king\'s throne: arm your folk, set traps, and fight on the field yourself.',
   note:'A strike · B roll · SELECT orders · START pause'},
];
const GHOST={id:'+',ghost:true,title:'Add a game',blurb:'Made another game here with Claude? Say “add this to the ZigaPlay” and its cartridge will appear on this shelf.',note:''};
const SHELLS=[['classic','Classic grey'],['berry','Berry'],['teal','Teal'],['grape','Grape'],['kiwi','Kiwi'],['dandelion','Dandelion'],['midnight','Midnight']];
const DEFKEYS={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',a:'z',b:'x',start:'Enter',select:'Shift'};
const KEYINFO={ArrowUp:['ArrowUp',38],ArrowDown:['ArrowDown',40],ArrowLeft:['ArrowLeft',37],ArrowRight:['ArrowRight',39],Enter:['Enter',13],Shift:['ShiftLeft',16],' ':['Space',32],Escape:['Escape',27],Backspace:['Backspace',8],Tab:['Tab',9]};
const keyInfo=k=>KEYINFO[k]?{key:k,code:KEYINFO[k][0],keyCode:KEYINFO[k][1]}:{key:k,code:/^[a-z]$/i.test(k)?'Key'+k.toUpperCase():/^\d$/.test(k)?'Digit'+k:k,keyCode:k.length===1?k.toUpperCase().charCodeAt(0):0};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* The offline edition carries everything inside this one page: each game as base64 in
   <script type="text/plain" id="cart-<id>">, extra <head> markup for every game (its fonts) in #zp-game-head,
   and starting saves in #zp-seeds. Online, none of these exist and games load from their files. */
const GAME_HEAD=(document.getElementById('zp-game-head')||{}).textContent||'';
function inlineCart(c){const e=document.getElementById('cart-'+c.id);if(!e)return null;const b=atob(e.textContent.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
(()=>{const e=document.getElementById('zp-seeds');if(!e)return;let seeds=[];try{seeds=JSON.parse(e.textContent)}catch(_){return}
  try{for(const sd of seeds){const flag='zigaplay-seeded-'+sd.prefix;if(localStorage.getItem(flag))continue;
    let has=false;for(let i=0;i<localStorage.length;i++)if((localStorage.key(i)||'').startsWith(sd.prefix)){has=true;break}
    if(!has)for(const[k,v]of sd.items)localStorage.setItem(k,v);localStorage.setItem(flag,'1')}}catch(_){}})();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem('zigaplay-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zigaplay-'+k,JSON.stringify(v))}catch(e){}}};
const consoleEl=$('#console'),screenEl=$('#screen');

/* ---------- sound: the console's own small chimes, plus an AudioContext the games share ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
const gameContexts=new Set();
class ZPAudioContext extends AC{constructor(o){super(o);gameContexts.add(this)}}
let sfxCtx=null;
function sfxUnlock(){if(!AC)return;try{if(!sfxCtx)sfxCtx=new AC();if(sfxCtx.state!=='running')sfxCtx.resume().catch(()=>{})}catch(e){}}
function beep(notes,type='square',vol=.045){if(!sfxCtx||sfxCtx.state!=='running')return;const t0=sfxCtx.currentTime+.01;
  for(const[f,at,len]of notes){const o=sfxCtx.createOscillator(),g=sfxCtx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(vol,t0+at+.005);g.gain.exponentialRampToValueAtTime(.0005,t0+at+len);o.connect(g);g.connect(sfxCtx.destination);o.start(t0+at);o.stop(t0+at+len+.02)}}
const SFX={tick:()=>beep([[1568,0,.04]],'square',.03),pick:()=>beep([[1047,0,.06],[1568,.06,.12]]),chime:()=>beep([[1976,0,.09],[2637,.09,.55]],'square',.05),
  click:()=>beep([[220,0,.05]],'triangle',.08),buzz:()=>beep([[130,0,.16]],'sawtooth',.03),eject:()=>beep([[523,0,.06],[392,.06,.1]],'triangle',.07)};

/* ---------- console state ---------- */
let state='off',sel=Math.min(store.get('sel',0),CARTS.length),cur=null,frame=null,restore={};
const items=()=>[...CARTS,GHOST];
const cartWin=()=>{try{return frame&&frame.contentWindow}catch(e){return null}};
function setShell(name){consoleEl.dataset.shell=name;store.set('shell',name)}
setShell(store.get('shell','classic'));
let toastT=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1600)}
function show(id){for(const x of['home','boot','loading'])$('#'+x).hidden=x!==id}

/* ---------- the library shelf ---------- */
function renderShelf(){const sh=$('#shelf');sh.innerHTML='';
  items().forEach((c,i)=>{const b=document.createElement('button');b.className='cart'+(c.ghost?' ghost':'');b.dataset.i=i;b.setAttribute('role','option');b.tabIndex=-1;
    b.innerHTML=c.ghost?'<span class="shell"></span><span class="ghostbox"><b>+</b><span>ADD A GAME</span></span>'
      :`<span class="shell"></span><span class="ridges"></span><span class="label" style="--lb:${c.label};--lf:${c.ink}"><img src="${c.art}" alt=""><b></b></span><span class="arrow"></span>`;
    if(!c.ghost)b.querySelector('.label b').textContent=c.title.toUpperCase();
    b.setAttribute('aria-label',c.title);
    b.addEventListener('click',()=>{sfxUnlock();if(state!=='home')return;if(i===sel)activate();else{sel=i;layoutShelf();SFX.tick()}});
    sh.append(b)});
  $('#count').textContent=`${CARTS.length} GAME${CARTS.length===1?'':'S'}`;requestAnimationFrame(layoutShelf)}
/* the console's shape: upright, or sideways (see the CSS); a wide game turns it sideways */
function applyLayout(){const de=document.documentElement,vv=window.visualViewport,W=Math.round(vv?vv.width:innerWidth),H=Math.round(vv?vv.height:innerHeight),land=W>H,wideGame=!!(cur&&cur.wide);
  const turned=wideGame&&!land,wide=turned||(land&&(H<=600||wideGame));
  de.classList.toggle('wide',wide);de.classList.toggle('turned',turned);
  /* the console's own width and height (a turned console is the screen's height wide), and how big its controls can be:
     the columns must hold the D-pad (or stick) and A and B */
  const cw=turned?H:W,chh=turned?W:Math.min(H,Math.min(W,1000)*.47);
  de.style.setProperty('--zw',cw+'px');de.style.setProperty('--zh',(turned?W:H)+'px');
  const cz=wide?Math.max(.5,Math.min(wideGame?.94:1,(chh-34)/200,wideGame?cw/820:1)):1;
  de.style.setProperty('--cz',cz.toFixed(3));
  consoleEl.classList.toggle('stickmode',!!(cur&&cur.stick));consoleEl.classList.toggle('widegame',wideGame);
  if(!$('#home').hidden)requestAnimationFrame(layoutShelf)}
addEventListener('resize',applyLayout);addEventListener('orientationchange',()=>setTimeout(applyLayout,250));if(window.visualViewport)visualViewport.addEventListener('resize',applyLayout);
function layoutShelf(){const list=$$('#shelf .cart'),sh=$('#shelf'),k=Math.max(.55,Math.min(1.15,(sh.clientHeight-30)/134));
  list.forEach((b,i)=>{const d=i-sel,ad=Math.abs(d);b.classList.toggle('sel',d===0);b.setAttribute('aria-selected',String(d===0));
    b.style.transform=`translateX(${d*132*k}px) scale(${k*(d===0?1:.82)})`;b.style.opacity=ad>1?0:d===0?1:.55;b.style.zIndex=10-ad});
  const c=items()[sel];$('#gTitle').textContent=c.title;$('#gBlurb').textContent=c.blurb;$('#gNote').textContent=c.note||'';store.set('sel',sel)}
function moveSel(d){const n=items().length,ns=Math.max(0,Math.min(n-1,sel+d));if(ns===sel){SFX.buzz();return}sel=ns;layoutShelf();SFX.tick()}
function activate(){const c=items()[sel];if(c.ghost){SFX.pick();ask(GHOST.blurb+' Each game keeps its own saves on this console.',[['Got it',()=>{}]]);return}launch(c)}

/* ---------- power: boot, games in and out ---------- */
async function boot(fast){state='boot';consoleEl.classList.remove('off');$('#blackout').classList.remove('on');
  if(!fast){show('boot');const lg=$('#boot .logo');lg.style.animation='none';void lg.offsetWidth;lg.style.animation='';
    let skip=false;const sk=()=>{skip=true};screenEl.addEventListener('pointerdown',sk,{once:true});
    for(let t=0;t<1500&&!skip;t+=50)await sleep(50);SFX.chime();for(let t=0;t<700&&!skip;t+=50)await sleep(50);screenEl.removeEventListener('pointerdown',sk)}
  show('home');renderShelf();state='home'}
async function powerOff(){state='off';consoleEl.classList.add('off');SFX.click()}
async function launch(c,opts={}){if(state!=='home'&&!opts.instant)return;state='loading';SFX.pick();
  const card=$$('#shelf .cart')[items().indexOf(c)];if(card&&!opts.instant){card.classList.add('inserting');await sleep(380)}
  $('#loadName').textContent=c.title.toUpperCase();show('loading');cur=c;applyLayout();
  frame=document.createElement('iframe');frame.title=c.title;frame.setAttribute('allow','autoplay; fullscreen');frame.style.visibility='hidden';screenEl.insertBefore(frame,$('#ask'));
  const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));
  const inl=inlineCart(c);
  if(inl!=null)frame.srcdoc=prepare(inl,c,true);
  else try{const res=await fetch(c.file,{cache:'no-cache'});if(!res.ok)throw new Error(res.status);frame.srcdoc=prepare(await res.text(),c)}
  catch(e){frame.src=c.file}
  await Promise.race([loaded,sleep(8000)]);await sleep(120);
  if(cur!==c)return;
  frame.style.visibility='';$('#loading').hidden=true;state='game';
  if(!matchMedia('(pointer:coarse)').matches)try{frame.focus({preventScroll:true})}catch(e){}}
/* the console's sound and the game's own folder go in before the game's first script */
function prepare(html,c,inline){const dir=new URL(c.file.replace(/[^/]*$/,''),document.baseURI).href;
  const boot=`${inline?'':`<base href="${dir}">`}${GAME_HEAD}<script>try{var Z=parent.ZIGAPLAY;if(Z){window.AudioContext=Z.AudioContext;window.webkitAudioContext=Z.AudioContext}}catch(e){}<\/script>`;
  const m=/<head[^>]*>/i.exec(html);return m?html.slice(0,m.index+m[0].length)+boot+html.slice(m.index+m[0].length):boot+html}
async function eject(){if(state!=='game')return;state='ejecting';SFX.eject();$('#blackout').classList.add('on');await sleep(260);
  for(const ac of gameContexts){try{ac.close()}catch(e){}}gameContexts.clear();
  if(frame){try{frame.srcdoc='';frame.removeAttribute('src')}catch(e){}frame.remove();frame=null}cur=null;held.clear();stickDirs.clear();stickId=null;knob.style.transform='';applyLayout();
  show('home');renderShelf();$('#blackout').classList.remove('on');state='home'}
/* the power switch: in a game it turns the game off (asking first when the game wants to), in the library it turns the console off */
let powering=false;
async function powerSwitch(){if(powering)return;powering=true;try{
  if(state==='off'){SFX.click();await boot(false);return}
  if(state==='home'){await powerOff();return}
  if(state!=='game')return;
  releaseAll();const w=cartWin();let r='ask';
  try{if(w&&w.ZPCart&&typeof w.ZPCart.home==='function')r=await w.ZPCart.home()}catch(e){r='ask'}
  if(r===false)return;
  if(r!==true){const ok=await askAsync('Turn this game off and go back to the library? Anything you have not saved will be lost.',['Turn off','Keep playing']);if(ok!==0)return}
  await eject()}finally{powering=false}}

/* ---------- questions on the LCD ---------- */
let askState=null;
function ask(text,opts){const box=$('#ask'),o=$('#askOpts');$('#askText').textContent=text;o.innerHTML='';
  opts.forEach(([t,fn],i)=>{const b=document.createElement('button');b.textContent=t;b.tabIndex=-1;b.addEventListener('click',()=>pickAsk(i));o.append(b)});
  askState={opts,i:0,prev:state};state='ask';box.hidden=false;markAsk()}
function markAsk(){$$('#askOpts button').forEach((b,i)=>b.setAttribute('aria-selected',String(i===askState.i)))}
function pickAsk(i){const a=askState;if(!a)return;$('#ask').hidden=true;askState=null;state=a.prev;SFX.pick();a.opts[i][1]()}
function askAsync(text,labels){return new Promise(res=>ask(text,labels.map((l,i)=>[l,()=>res(i)])))}
function askInput(b){const a=askState;if(!a)return;if(b==='up'||b==='left'){a.i=Math.max(0,a.i-1);markAsk();SFX.tick()}else if(b==='down'||b==='right'){a.i=Math.min(a.opts.length-1,a.i+1);markAsk();SFX.tick()}
  else if(b==='a'||b==='start')pickAsk(a.i);else if(b==='b')pickAsk(a.opts.length-1)}

/* ---------- buttons ---------- */
const held=new Set();let repT=0,comboT=0;
function pressBtn(b){sfxUnlock();try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}
  if(held.has(b))return;held.add(b);
  if(held.has('start')&&held.has('select')&&state==='game'){clearTimeout(comboT);comboT=setTimeout(()=>{if(held.has('start')&&held.has('select'))powerSwitch()},800)}
  switch(state){
    case 'game':toCart(b,true);break;
    case 'ask':askInput(b);break;
    case 'home':
      if(b==='left'||b==='up')moveSel(-1);else if(b==='right'||b==='down')moveSel(1);
      else if(b==='a'||b==='start')activate();
      else if(b==='select'){const i=SHELLS.findIndex(s=>s[0]===consoleEl.dataset.shell),n=SHELLS[(i+1)%SHELLS.length];setShell(n[0]);toast('SHELL: '+n[1].toUpperCase());SFX.tick()}
      if(/up|down|left|right/.test(b)){clearTimeout(repT);const d=b;repT=setTimeout(function again(){if(held.has(d)&&state==='home'){moveSel(d==='left'||d==='up'?-1:1);repT=setTimeout(again,150)}},420)}
      break;
    case 'off':if(b==='start'||b==='a')powerSwitch();break}}
function releaseBtn(b){if(!held.has(b))return;held.delete(b);if(state==='game')toCart(b,false)}
function releaseAll(){for(const b of[...held])releaseBtn(b);setDpad(null);stickDirs.clear();stickId=null;knob.classList.add('back');knob.style.transform='translate3d(0,0,0)';stick.querySelectorAll('.notch').forEach(n=>n.classList.remove('on'))}
function toCart(b,down){const w=cartWin();if(!w)return;
  try{if(w.ZPCart&&typeof w.ZPCart.input==='function'){w.ZPCart.input(b,down);return}}catch(e){console.warn('ZigaPlay cartridge input failed',e);return}
  const k=((cur&&cur.keys)||DEFKEYS)[b];if(!k)return;const info=keyInfo(k);
  try{const ev=new w.KeyboardEvent(down?'keydown':'keyup',{key:info.key,code:info.code,bubbles:true,cancelable:true,shiftKey:k==='Shift'&&down});
    Object.defineProperty(ev,'keyCode',{get:()=>info.keyCode});Object.defineProperty(ev,'which',{get:()=>info.keyCode});
    const d=w.document;(d.activeElement&&d.activeElement!==d.body?d.activeElement:d.body||d).dispatchEvent(ev)}catch(e){}}

/* D-pad: one pad you can roll your thumb across */
const dpad=$('#dpad');let dpadDir=null;
function setDpad(d){if(d===dpadDir)return;if(dpadDir)releaseBtn(dpadDir);dpadDir=d;
  dpad.dataset.d=d||'';for(const k of['u','d','l','r'])dpad.querySelector('.ar.'+k).classList.toggle('on',d&&d[0]===k);if(d)pressBtn(d)}
function dpadAt(e){const r=dpad.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(document.documentElement.classList.contains('turned'))[dx,dy]=[dy,-dx];
  if(Math.hypot(dx,dy)<9)return dpadDir;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();try{dpad.setPointerCapture(e.pointerId)}catch(_){}setDpad(dpadAt(e))});
dpad.addEventListener('pointermove',e=>{if(dpad.hasPointerCapture&&dpad.hasPointerCapture(e.pointerId))setDpad(dpadAt(e))});
for(const t of['pointerup','pointercancel','lostpointercapture'])dpad.addEventListener(t,()=>setDpad(null));
dpad.addEventListener('contextmenu',e=>e.preventDefault());
/* the control stick: the knob follows the thumb inside its ring and springs back when let go. Directions switch on
   past 35% of the way out sideways and 50% up or down, and off again a little closer in, so they never flicker */
const stick=$('#stick'),knob=stick.querySelector('.knob'),STICK_R=40;let stickId=null;const stickDirs=new Set();
function stickSet(nx,ny){const on=d=>stickDirs.has(d),want=new Set();
  if(nx>(on('right')?.24:.35))want.add('right');else if(nx<-(on('left')?.24:.35))want.add('left');
  if(ny<-(on('up')?.36:.5))want.add('up');else if(ny>(on('down')?.36:.5))want.add('down');
  for(const d of[...stickDirs])if(!want.has(d)){stickDirs.delete(d);releaseBtn(d)}
  for(const d of want)if(!stickDirs.has(d)){stickDirs.add(d);pressBtn(d)}
  for(const k of['u','d','l','r'])stick.querySelector('.notch.'+k).classList.toggle('on',[...stickDirs].some(d=>d[0]===k))}
function stickAt(e){const r=stick.getBoundingClientRect(),z=r.width/138||1;let dx=(e.clientX-(r.left+r.width/2))/z,dy=(e.clientY-(r.top+r.height/2))/z;
  if(document.documentElement.classList.contains('turned'))[dx,dy]=[dy,-dx];
  const d=Math.hypot(dx,dy),k=d>STICK_R?STICK_R/d:1;dx*=k;dy*=k;
  knob.style.transform=`translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0)`;stickSet(dx/STICK_R,dy/STICK_R)}
function stickEnd(e){if(e&&e.pointerId!==stickId)return;stickId=null;knob.classList.add('back');knob.style.transform='translate3d(0,0,0)';stickSet(0,0)}
stick.addEventListener('pointerdown',e=>{e.preventDefault();sfxUnlock();stickId=e.pointerId;try{stick.setPointerCapture(e.pointerId)}catch(_){}knob.classList.remove('back');stickAt(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickAt(e)});
for(const t of['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(t,stickEnd);
stick.addEventListener('contextmenu',e=>e.preventDefault());
for(const el of $$('[data-btn]')){const b=el.dataset.btn;
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');if(held.has(b))releaseBtn(b);pressBtn(b)});
  const off=()=>{el.classList.remove('on');releaseBtn(b)};
  for(const t of['pointerup','pointercancel','lostpointercapture'])el.addEventListener(t,off);
  el.addEventListener('contextmenu',e=>e.preventDefault())}
$('#power').addEventListener('click',()=>{sfxUnlock();powerSwitch()});
/* keyboard, for when the console itself has focus (a game that has focus reads the keys itself) */
const KB={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',Z:'a',' ':'a',x:'b',X:'b',Escape:'b',Backspace:'b',Enter:'start',Shift:'select'};
addEventListener('keydown',e=>{const b=KB[e.key];if(!b||e.metaKey||e.ctrlKey||e.altKey)return;e.preventDefault();if(e.repeat)return;pressBtn(b)});
addEventListener('keyup',e=>{const b=KB[e.key];if(b)releaseBtn(b)});
addEventListener('blur',()=>{if(state!=='game')releaseAll()});
for(const ev of['pointerdown','keydown'])addEventListener(ev,sfxUnlock,{capture:true,passive:true});

/* ---------- what the games can reach ---------- */
/* ---------- cloud saves for the games ----------
   A game runs in its own frame, so the objects it hands to window.claude (a save's body, query options)
   were made in that frame, and the platform can turn those down as not being plain objects. Every call a
   game makes goes through this bridge instead: arguments are rebuilt as this page's own objects (functions,
   such as snapshot listeners, pass through as they are), and what comes back (namespaces, document and
   collection refs, queries, snapshots, promises) is wrapped the same way, so every later call is covered. */
const ownCopy=x=>{if(x===null||typeof x!=='object')return x;if(Array.isArray(x))return x.map(ownCopy);
  if(Object.prototype.toString.call(x)!=='[object Object]')return x;
  const o={};for(const k of Object.keys(x))o[k]=ownCopy(x[k]);return o};
const hasMethods=v=>{for(let o=v;o&&Object.getPrototypeOf(o)!==null;o=Object.getPrototypeOf(o))for(const k of Object.getOwnPropertyNames(o)){if(k==='constructor')continue;try{if(typeof v[k]==='function')return true}catch(e){}}return false};
const bridged=new WeakMap();
const bridge=v=>{
  if(v===null||(typeof v!=='object'&&typeof v!=='function'))return v;
  if(typeof v==='object'&&typeof v.then==='function')return v.then(bridge);
  if(Array.isArray(v)||(typeof v==='object'&&!hasMethods(v)))return v;
  if(bridged.has(v))return bridged.get(v);
  const call=(f,self,a)=>bridge(f.apply(self,a.map(ownCopy)));
  const p=new Proxy(typeof v==='function'?function(){}:{},{
    get:(_,k)=>{const x=v[k];return typeof x==='function'?(...a)=>call(x,v,a):x},
    has:(_,k)=>k in v,
    apply:(_,self,a)=>call(v,undefined,a)});
  bridged.set(v,p);return p};
let claudeBridge=null;
const gameClaude=()=>{const c=window.claude;if(!c||typeof c.use!=='function')return null;
  return claudeBridge||(claudeBridge=Object.freeze({use:name=>Promise.resolve(c.use(name)).then(bridge)}))};

window.ZIGAPLAY=Object.freeze({
  version:1,
  get claude(){return gameClaude()},
  AudioContext:ZPAudioContext,
  takeRestore(id){const r=restore[id];delete restore[id];return r||null},
  cartReady(api){},
  get cart(){return cur&&cur.id},
});

/* ---------- start, and come back to the same game after this page is updated ---------- */
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>{const w=cartWin();let s=null;try{s=w&&w.ZPCart&&w.ZPCart.snapshot&&w.ZPCart.snapshot()}catch(e){}return{cart:state==='game'&&cur?cur.id:null,state:s,shell:consoleEl.dataset.shell,sel}});
const start=data=>{applyLayout();data=data||{};if(typeof data.sel==='number')sel=Math.min(data.sel,CARTS.length);
  const c=data.cart&&CARTS.find(x=>x.id===data.cart);
  if(c){if(data.state)restore[c.id]=data.state;consoleEl.classList.remove('off');show('home');renderShelf();state='home';launch(c,{instant:true})}
  else boot(false)};
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
window.__zp={test:{launch:c=>launch(c),restore:(id,v)=>{restore[id]=v}},get state(){return state},get cur(){return cur},get frame(){return frame},pressBtn,releaseBtn,powerSwitch,launch:id=>launch(CARTS.find(c=>c.id===id)),eject,CARTS,gameContexts,get sel(){return sel}};
})();
